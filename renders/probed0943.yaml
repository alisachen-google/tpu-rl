---
# Source: pathways-tpu-jobset-workload/templates/workload-config-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: "probed0943-config"
  namespace: default
data:
  workload-configuration: |-
    # Minimal workload config; the launcher passes every knob on the command line
    # (MAXTEXT_CONFIG_PATH is resolved inside the launcher to maxtext/configs/post_train/rl.yml).
    base_config: "maxtext/configs/post_train/rl.yml"
---
# Source: pathways-tpu-jobset-workload/templates/workload-launcher-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: "probed0943-launcher"
  namespace: default
data:
  launch-workload.sh: |-
    #!/bin/bash
    # Dump the image's tunix RL sources (for porting chunked-logps support). No TPU work.
    T=$(python3 -c "import importlib.util as u;print(list(u.find_spec('tunix').submodule_search_locations)[0])")
    ls $T/.. | grep -i tunix; cat $T/__init__.py 2>/dev/null | grep -i version
    for f in rl/reward_manager.py rl/utils.py rl/inference/inference_worker.py; do
      echo "=====FILE $f ($(wc -l < $T/$f) lines)"; cat $T/$f; echo "=====END $f"
    done
    echo "PROBE: done"
    sleep 900
---
# Source: pathways-tpu-jobset-workload/templates/pathways-jobset.yaml
# yamllint disable







apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: "probed0943"
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: "default"
spec:
  coordinator:
    replicatedJob: pathways-head
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  failurePolicy:
    # restartStrategy: Recreate not supported by this cluster's JobSet CRD
    # (older controller than the v6e cluster); leoch convention:
    maxRestarts: 0
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - pathways-head
  replicatedJobs:
# ----------------------------------------------------
# 1. Pathways-Head Replicated Job
# ----------------------------------------------------
  - name: pathways-head
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              kueue.x-k8s.io/podset: pathways-head
            annotations:
              kubectl.kubernetes.io/default-container: jax-tpu
              gke-gcsfuse/volumes: "true"
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-nodepool: "cpu-np"
            tolerations:
            - key: cloud.google.com/gke-nodepool
              operator: Exists
              effect: NoSchedule
            containers:
            - name: jax-tpu
              image: "gcr.io/supercomputer-testing/maxtext-rl-ironwood:head-612fcd2e-gemma4c-perf"
              command:
              - bash
              - -c
              - |
                echo Pathways Helm Start: $(date);
                _sigterm() (kill -SIGTERM $! 2>/dev/null;);
                trap _sigterm SIGTERM;

                echo "Executing payload from /workload/launcher/launch-workload.sh..."
                ( bash /workload/launcher/launch-workload.sh ) & PID=$!;

                while kill -0 $PID 2>/dev/null;
                    do sleep 5;
                done;
                wait $PID;
                EXIT_CODE=$?;

                echo Pathways Helm End: $(date);
                echo EXIT_CODE=$EXIT_CODE;
                exit $EXIT_CODE
              env:
              - name: JAX_PLATFORMS
                value: proxy
              - name: PATHWAYS_HEAD
                value: "probed0943-pathways-head-0-0.probed0943"
              - name: JAX_BACKEND_TARGET
                value: grpc://probed0943-pathways-head-0-0.probed0943:29050
              - name: JOB_IDENTIFIER
                value: "probed0943"
              - name: ARTIFACT_DIR
                value: "gs://ubench-logs/alisachen-tpu7x/runs"
              - name: SKIP_JAX_PRECOMPILE
                value: "1"
              resources:
                limits:
                  cpu: 4
                  memory: 16G
                requests:
                  cpu: 2
                  memory: 8G
              securityContext:
                privileged: true

              volumeMounts:
              - name: workload-launcher
                mountPath: /workload/launcher
              - name: shared-tmp
                mountPath: /tmp
              - name: workload-configuration
                mountPath: /workload/configs
            initContainers:
            # Native Sidecar Pattern: restartPolicy Always prevents pod hangs
            - name: pathways-rm
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: HOST_ADDRESS
                value: "probed0943-pathways-head-0-0.probed0943"
              args:
              - --server_port=29051
              - --node_type=resource_manager
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-2x2x1/a1ddb8ce-9f26-48b8-8dce-b181d5393736
              - --instance_count=1
              - --instance_type=tpu7x:2x2x1
              resources:
                requests:
                  cpu: "2"
                  memory: 8G
                limits:
                  cpu: "4"
                  memory: 16G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            - name: pathways-proxy
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: PATHWAYS_HEAD
                value: "probed0943-pathways-head-0-0.probed0943"
              args:
              - --server_port=29050
              - --resource_manager_address=probed0943-pathways-head-0-0.probed0943:29051
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-2x2x1/a1ddb8ce-9f26-48b8-8dce-b181d5393736
              resources:
                requests:
                  cpu: "8"
                  memory: 32G
                limits:
                  cpu: "16"
                  memory: 64G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            volumes:
            - name: shared-tmp
              emptyDir: {}   # was hostPath /tmp — leaked pathways state across pods on reused nodes
            - name: workload-launcher
              configMap:
                name: "probed0943-launcher"
            - name: workload-configuration
              configMap:
                name: "probed0943-config"
                items:
                - key: workload-configuration
                  path: workload-config.yaml

# ----------------------------------------------------
# 2. Worker Replicated Job
# ----------------------------------------------------
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 32
        completionMode: Indexed
        template:
          metadata:
            annotations:
              alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
            labels:
              kueue.x-k8s.io/podset: worker
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            tolerations:
            - key: google.com/tpu
              operator: Exists
            nodeSelector:
              cloud.google.com/gke-tpu-topology: "2x2x1"
              cloud.google.com/gke-tpu-accelerator: tpu7x
            containers:
            - name: pathways-worker
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              env:
              - name: PATHWAYS_HEAD
                value: "probed0943-pathways-head-0-0.probed0943"
              - name: MEGASCALE_SLICE_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              - name: MEGASCALE_NUM_SLICES
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-replicas']
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              - name: MEGASCALE_COORDINATOR_ADDRESS
                value: "probed0943-pathways-head-0-0.probed0943"
              args:
              - --server_port=29055
              - --resource_manager_address=probed0943-pathways-head-0-0.probed0943:29051
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-2x2x1/a1ddb8ce-9f26-48b8-8dce-b181d5393736
              - --enable_metrics_collection=true
              - --xla_tpu_use_enhanced_launch_barrier=true
              ports:
              - containerPort: 29055
                protocol: TCP
              - containerPort: 29056
                protocol: TCP
              - containerPort: 8471
                protocol: TCP
              - containerPort: 8080
                protocol: TCP
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  google.com/tpu: "4"
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            initContainers:
            volumes:
            - name: shared-tmp
              emptyDir: {}   # was hostPath /tmp — leaked pathways state across pods on reused nodes
