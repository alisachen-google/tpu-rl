---
# Source: pathways-tpu-jobset-workload/templates/patches-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: "g4r1s0807-patches"
  namespace: default
data:
  patch_cd_proper.py: |-
    """Apply the PROPER continue-decode fix (PR #3374) to the installed tpu_inference.
    
    Mirrors https://github.com/vllm-project/tpu-inference/pull/3374 exactly:
    
      (a) models/common/model_loader.py -- build an options-free twin of run_model and
          expose it as `step_fn_no_options` on the model object, mirroring the torchax
          path in models/vllm/vllm_model_wrapper.py.
      (b) runner/decode_loop.py -- build the fused-decode loop jit lazily from
          get_step_fn_compiler_options() instead of a hardcoded 3-entry literal, so the
          fused program keeps all 5 options (incl. the SparseCore offload thresholds).
    
    Every edit asserts its anchor and re-verifies after writing. Prints exactly one of:
        CD-PROPER PATCH: APPLIED
        CD-PROPER PATCH: FAILED <reason>
    A FAILED line means the run proves nothing -- check it before reading any result.
    """
    
    import ast
    import os
    import sys
    
    SITE = os.environ.get("PATCH_ROOT", "/usr/local/lib/python3.12/site-packages")
    ROOT = os.path.join(SITE, "tpu_inference")
    ML = os.path.join(ROOT, "models/common/model_loader.py")
    DL = os.path.join(ROOT, "runner/decode_loop.py")
    
    
    def fail(msg):
        print(f"CD-PROPER PATCH: FAILED {msg}")
        sys.exit(0)  # non-fatal: let the run start so the failure is visible in logs
    
    
    def sub(text, old, new, what):
        if text.count(old) != 1:
            fail(f"[{what}] anchor found {text.count(old)} times, expected 1")
        return text.replace(old, new)
    
    
    # ---------------------------------------------------------------- (a) model_loader
    if not os.path.exists(ML):
        fail(f"{ML} not found")
    ml = open(ML, encoding="utf-8").read()
    
    if "step_fn_no_options" in ml and "run_model_no_options" in ml:
        print("CD-PROPER PATCH: model_loader already patched")
    else:
        if "\nimport functools\n" not in ml:
            ml = sub(ml, "from typing import Any, Optional\n",
                     "import functools\nfrom typing import Any, Optional\n",
                     "ml-import")
    
        ml = sub(
            ml,
            """    @jax.jit(
            out_shardings=(
                kv_cache_sharding,
                hidden_states_sharding,
                hidden_states_sharding,  # aux hidden states
                None,  # expert ids
            ),
            donate_argnums=1,  # 0 is state_leaves, 1 is kv_cache
            static_argnums=(
                6, 9, 10
            ),  # 6 is layer_name_to_kvcache_index, 9 is is_first_rank, 10 is is_last_rank
            compiler_options=get_step_fn_compiler_options(),
        )
        def run_model(state_leaves, *args):
            state = jax.tree_util.tree_unflatten(_state_treedef, state_leaves)
            model = nnx.merge(graphdef, state)
            return model(*args)
    """,
            """    def run_model_impl(state_leaves, *args):
            state = jax.tree_util.tree_unflatten(_state_treedef, state_leaves)
            model = nnx.merge(graphdef, state)
            return model(*args)
    
        run_model_jit = functools.partial(
            jax.jit,
            out_shardings=(
                kv_cache_sharding,
                hidden_states_sharding,
                hidden_states_sharding,  # aux hidden states
                None,  # expert ids
            ),
            donate_argnums=1,  # 0 is state_leaves, 1 is kv_cache
            static_argnums=(
                6, 9, 10
            ),  # 6 is layer_name_to_kvcache_index, 9 is is_first_rank, 10 is is_last_rank
        )
    
        run_model_no_options = run_model_jit(run_model_impl)
    
        run_model = run_model_jit(
            run_model_impl,
            compiler_options=get_step_fn_compiler_options(),
        )
    """,
            "ml-run_model")
    
        ml = sub(
            ml,
            """    def wrapped_model_fn(*args, **kwargs):
            if not model_supports_spec_step:
                kwargs.pop("spec_step_idx", None)
            kwargs.pop("shared_attention_metadata", None)
            return jitted_model_fn(*args, **kwargs)
    """,
            """    def wrapped_model_fn(*args, **kwargs):
            if not model_supports_spec_step:
                kwargs.pop("spec_step_idx", None)
            kwargs.pop("shared_attention_metadata", None)
            return jitted_model_fn(*args, **kwargs)
    
        jitted_model_fn_no_options = (run_draft_model
                                      if is_draft_model else run_model_no_options)
    
        def wrapped_model_fn_no_options(*args, **kwargs):
            if not model_supports_spec_step:
                kwargs.pop("spec_step_idx", None)
            kwargs.pop("shared_attention_metadata", None)
            return jitted_model_fn_no_options(*args, **kwargs)
    """,
            "ml-wrapper")
    
        ml = sub(
            ml,
            """    return ModelInterface(
            model_fn=wrapped_model_fn,""",
            """    jit_model.step_fn_no_options = wrapped_model_fn_no_options
    
        return ModelInterface(
            model_fn=wrapped_model_fn,""",
            "ml-attach")
    
        try:
            ast.parse(ml)
        except SyntaxError as e:
            fail(f"[model_loader] patched source does not parse: {e}")
        open(ML, "w", encoding="utf-8").write(ml)
    
    # ---------------------------------------------------------------- (b) decode_loop
    if not os.path.exists(DL):
        fail(f"{DL} not found")
    dl = open(DL, encoding="utf-8").read()
    
    if "_get_decode_core" in dl:
        print("CD-PROPER PATCH: decode_loop already patched")
    else:
        dl = sub(
            dl,
            """from tpu_inference.layers.common.attention_metadata import (
        AttentionMetadata, SharedAttentionMetadata)""",
            """from tpu_inference.layers.common.attention_metadata import (
        AttentionMetadata, SharedAttentionMetadata)
    from tpu_inference.models.common.compiler_options import \\
        get_step_fn_compiler_options""",
            "dl-import")
    
        STATIC = """    static_argnames=(
            "model_fn",
            "compute_logits_fn",
            "sample_fn",
            "mesh",
            "static_max_decode_steps",
            "eos_token_id",
            "padding_token_id",
            "dp_size",
            "pad_len",
            "has_experts",
            "expert_shape",
            "expert_dtype",
            "layer_name_to_kvcache_index",
            "is_first_rank",
            "is_last_rank",
            "max_logprobs",
            "logprobs_mode",
            "continue_decode_eos_check_interval",
        ),
        donate_argnames=("kv_caches", ),"""
    
        old_dec = ("@functools.partial(\n    jax.jit,\n" + STATIC + """
        # Hoisted here from the model's step_fun: JAX forbids compiler_options on
        # a nested jit, so they must live on this top-level loop jit instead.
        compiler_options={
            "xla_tpu_all_gather_collective_matmul_mode": "post_spmd_conservative",
            "xla_tpu_reduce_scatter_collective_matmul_mode":
            "post_spmd_conservative",
            "xla_tpu_use_minor_sharding_for_major_trivial_input": "true"
        },
    )
    def _decode_core(
    """)
        dl = sub(dl, old_dec, "def _decode_core_impl(\n", "dl-decorator")
    
        factory = ("@functools.lru_cache(maxsize=1)\ndef _get_decode_core():\n"
                   "    return functools.partial(\n        jax.jit,\n"
                   + STATIC.replace("    static_argnames", "        static_argnames")
                   .replace('        "model_fn"', '            "model_fn"')
                   + "\n        compiler_options=get_step_fn_compiler_options(),\n"
                   "    )(_decode_core_impl)\n\n\n")
        # rebuild the static block with consistent 8-space indent instead of string surgery
        inner = "\n".join(("    " + ln) if ln.strip() else ln
                          for ln in STATIC.split("\n"))
        factory = ("@functools.lru_cache(maxsize=1)\n"
                   "def _get_decode_core():\n"
                   "    # Built lazily (the \"auto\" SparseCore threshold needs live devices) and\n"
                   "    # cached so the jit is constructed once, not per decode step.\n"
                   "    return functools.partial(\n"
                   "        jax.jit,\n"
                   + inner + "\n"
                   "        compiler_options=get_step_fn_compiler_options(),\n"
                   "    )(_decode_core_impl)\n\n\n")
        dl = sub(dl, "def continue_decode(\n", factory + "def continue_decode(\n",
                 "dl-factory")
    
        dl = sub(dl, "lp_ranks_buffer) = _decode_core(",
                 "lp_ranks_buffer) = _get_decode_core()(", "dl-callsite")
    
        try:
            ast.parse(dl)
        except SyntaxError as e:
            fail(f"[decode_loop] patched source does not parse: {e}")
        open(DL, "w", encoding="utf-8").write(dl)
    
    # ---------------------------------------------------------------- verify
    ml2 = open(ML, encoding="utf-8").read()
    dl2 = open(DL, encoding="utf-8").read()
    problems = []
    if "jit_model.step_fn_no_options = wrapped_model_fn_no_options" not in ml2:
        problems.append("step_fn_no_options not attached")
    if "run_model_no_options = run_model_jit(run_model_impl)" not in ml2:
        problems.append("options-free twin missing")
    if "_get_decode_core()(" not in dl2:
        problems.append("decode_loop call site not rewired")
    if "compiler_options=get_step_fn_compiler_options()," not in dl2:
        problems.append("decode_loop still not sourcing options from the function")
    if '"xla_tpu_use_minor_sharding_for_major_trivial_input": "true"' in dl2:
        problems.append("decode_loop hardcoded literal still present")
    
    if problems:
        fail("; ".join(problems))
    print("CD-PROPER PATCH: APPLIED")
  patch_lendist.py: |-
    """Record per-step ISL / OSL / truncation distributions from the GRPO rollout.
    
    WHY. Tunix logs only completions/{mean,max,min}_length -- three scalars. We have never
    seen the length DISTRIBUTION, and `max_length` is 8192 (the OSL cap) in every single
    step, so we know something is truncated but not whether it is 1 sequence or 40%. That
    number gates the tuning plan: holding the OSL cap fixed is only safe if truncation is
    rare.
    
    WHAT IT COSTS. Nothing measurable. Every array read here is ALREADY host-side numpy at
    this point in the function:
        rollout_output.tokens                 list[np.ndarray], UNPADDED  -> OSL = len()
        rollout_output.left_padded_prompt_tokens  np.ndarray              -> ISL
        pad_value / eos_value                 plain ints (rollout.pad_id()/eos_id())
        rollout_config.max_tokens_to_generate  the cap
    No device->host sync is introduced, so step timing is unaffected. ~30 KB/step.
    
    Using rollout_output.tokens directly (rather than inferring from completion_mask) makes
    OSL exact: len() cannot be fooled by a pad token appearing mid-sequence.
    
    FAIL-OPEN. This patches a file on the live training path. Any anchor mismatch prints
    FAILED and exits 0 without modifying anything -- it must never crash a run. The injected
    code is itself wrapped in try/except so a logging bug cannot take down training.
    
    Prints exactly one of:
        LENDIST PATCH: APPLIED
        LENDIST PATCH: FAILED <reason>
    """
    
    import ast
    import os
    import sys
    
    SITE = os.environ.get("PATCH_ROOT", "/usr/local/lib/python3.12/site-packages")
    ROOT = os.path.join(SITE, "tunix")
    GL = os.path.join(ROOT, "rl/grpo/grpo_learner.py")
    
    
    def fail(msg):
        print(f"LENDIST PATCH: FAILED {msg}")
        sys.exit(0)
    
    
    if not os.path.exists(GL):
        fail(f"{GL} not found")
    src = open(GL, encoding="utf-8").read()
    
    if "_LENDIST_DUMP" in src:
        print("LENDIST PATCH: already patched")
        sys.exit(0)
    
    ANCHOR = "    # Log completion lengths.\n    agg_completion_mask = completion_mask.sum(axis=-1)\n"
    if src.count(ANCHOR) != 1:
        fail(f"anchor found {src.count(ANCHOR)} times, expected 1")
    
    # Verify the names we rely on are actually in scope in this function.
    for name in ("rollout_output", "rollout_config", "pad_value", "eos_value"):
        if name not in src:
            fail(f"expected local '{name}' not present in grpo_learner.py")
    
    INJECT = '''    # --- _LENDIST_DUMP: per-step ISL/OSL/truncation distributions -------------
        # All inputs are already host-side numpy here; no device sync is added.
        try:
          import json as _json, os as _os, numpy as _np
          _cap = int(getattr(rollout_config, "max_tokens_to_generate", 0) or 0)
          _osl, _trunc, _eos_end = [], 0, 0
          for _t in rollout_output.tokens:
            _n = int(len(_t))
            _osl.append(_n)
            if _cap and _n >= _cap:
              # Distinguish "ran into the wall" from "happened to finish exactly there".
              if _n > 0 and int(_t[-1]) == int(eos_value):
                _eos_end += 1
              else:
                _trunc += 1
          _p = _np.asarray(rollout_output.left_padded_prompt_tokens)
          _isl = (_p != pad_value).sum(axis=-1).astype(int).tolist()
          _rec = {
              "step": int(self.rl_cluster.global_steps),
              "mode": str(mode),
              "cap": _cap,
              "n": len(_osl),
              "osl": _osl,
              "isl": _isl,
              "truncated_at_cap": _trunc,
              "eos_exactly_at_cap": _eos_end,
          }
          _run = _os.environ.get("JOB_IDENTIFIER", "unknown-run")
          _art = _os.environ.get("ARTIFACT_DIR", "")
          _line = _json.dumps(_rec)
          print("LENDIST step=%d n=%d cap=%d truncated=%d (%.2f%%) eos_at_cap=%d "
                "osl_mean=%.1f isl_mean=%.1f"
                % (_rec["step"], _rec["n"], _cap, _trunc,
                   100.0 * _trunc / max(1, len(_osl)), _eos_end,
                   sum(_osl) / max(1, len(_osl)), sum(_isl) / max(1, len(_isl))),
                flush=True)
          if _art.startswith("gs://"):
            from google.cloud import storage as _st
            _b, _, _pre = _art[5:].partition("/")
            _key = "%s/%s/lendist/step_%06d.json" % (_pre.rstrip("/"), _run, _rec["step"])
            _st.Client().bucket(_b).blob(_key.lstrip("/")).upload_from_string(
                _line, content_type="application/json")
        except Exception as _e:  # never take down training for a logging bug
          print("LENDIST ERROR: %r" % (_e,), flush=True)
        # --- end _LENDIST_DUMP ----------------------------------------------------
    
    '''
    
    src = src.replace(ANCHOR, INJECT + ANCHOR, 1)
    
    try:
        ast.parse(src)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")
    
    open(GL, "w", encoding="utf-8").write(src)
    
    v = open(GL, encoding="utf-8").read()
    problems = []
    if "_LENDIST_DUMP" not in v:
        problems.append("marker missing")
    if "truncated_at_cap" not in v:
        problems.append("truncation logic missing")
    if v.count("agg_completion_mask = completion_mask.sum(axis=-1)") != 1:
        problems.append("original metric line disturbed")
    try:
        ast.parse(v)
    except SyntaxError as e:
        problems.append(f"reparse failed: {e}")
    if problems:
        fail("; ".join(problems))
    print("LENDIST PATCH: APPLIED")
  patch_phasetime.py: |-
    """Phasetime v2 -- split the `other` residual INTO its components.
    
    V1 (runs 10/10b) plus TensorBoard arithmetic already proved the ~30 s `other`
    residual is exactly `generate_and_compute_advantage - vllm_rollout`, i.e. the
    reward + advantage + data-marshaling stage between the vLLM generate call and
    the train loop (verified to +-0.5 s on three matched steps). V2 answers the
    next question: WHICH of those dominates. It keeps all four v1 timers and adds:
    
        engine_generate    RLCluster.generate wall -- the vLLM call INCLUDING
                           tunix-side detokenization; against TensorBoard's
                           rollout_time this locates where detokenize lands
        compute_rewards    RLLearner._compute_rewards wall -- the Python reward
                           functions (match_format_*, check_numbers) over 2048
                           completions
    
    Derived offline, no extra timers needed:
        marshal+advantage  = generate_and_advantage - engine_generate
                             - compute_rewards
        (contains the 2048 x 8192 pad-and-stack ~67 MB numpy build, jnp
        conversions, advantage estimator, device_put)
    
    Same mechanics as v1: append-and-monkeypatch on the class objects, six
    perf_counter pairs per global step, no device sync, JSON per step to
    <ARTIFACT_DIR>/<run>/phasetime/step_NNNNNN.json plus a PHASETIME stdout line.
    
    CIRCULAR-IMPORT NOTE. rl_learner imports rl_cluster at module load, so the
    block appended to rl_cluster.py must import rl_learner LAZILY inside the
    wrapper body, never at module level.
    
    FAIL-OPEN. Any missing class/method prints FAILED and exits 0 without
    writing. Prints exactly one of:
        PHASETIME2 PATCH: APPLIED
        PHASETIME2 PATCH: FAILED <reason>
    """
    
    import ast
    import os
    import sys
    
    SITE = os.environ.get("PATCH_ROOT", "/usr/local/lib/python3.12/site-packages")
    ROOT = os.path.join(SITE, "tunix")
    RL = os.path.join(ROOT, "rl/rl_learner.py")
    GL = os.path.join(ROOT, "rl/grpo/grpo_learner.py")
    RC = os.path.join(ROOT, "rl/rl_cluster.py")
    
    
    def fail(msg):
        print(f"PHASETIME2 PATCH: FAILED {msg}")
        sys.exit(0)
    
    
    for p in (RL, GL, RC):
        if not os.path.exists(p):
            fail(f"{p} not found")
    
    rl_src = open(RL, encoding="utf-8").read()
    gl_src = open(GL, encoding="utf-8").read()
    rc_src = open(RC, encoding="utf-8").read()
    
    if any("_PHASETIME" in s for s in (rl_src, gl_src, rc_src)):
        print("PHASETIME2 PATCH: already patched")
        sys.exit(0)
    
    for needle, where in (("class RLLearner", "rl_learner.py"),
                          ("def _run_global_step", "rl_learner.py"),
                          ("def _prepare_data", "rl_learner.py"),
                          ("def _run_all_micro_batch_steps", "rl_learner.py"),
                          ("def _compute_rewards", "rl_learner.py")):
        if needle not in rl_src:
            fail(f"'{needle}' not present in {where}")
    for needle in ("class GRPOLearner", "def _generate_and_compute_advantage"):
        if needle not in gl_src:
            fail(f"'{needle}' not present in grpo_learner.py")
    for needle in ("class RLCluster", "def generate"):
        if needle not in rc_src:
            fail(f"'{needle}' not present in rl_cluster.py")
    
    RL_APPEND = '''
    
    # --- _PHASETIME v2: break out the `other` residual --------------------------------
    # Appended by patch_phasetime2.py. Six perf_counter pairs per global step; no
    # device sync. Wrappers are installed on the class objects only.
    try:
      import time as _pt_time
      import json as _pt_json
      import os as _pt_os
    
      _PHASETIME = {}
    
      def _pt_add(_name, _dt):
        _PHASETIME[_name] = _PHASETIME.get(_name, 0.0) + float(_dt)
    
      def _pt_wrap(_cls, _meth, _label):
        _orig = getattr(_cls, _meth)
    
        def _w(self, *a, **k):
          _t0 = _pt_time.perf_counter()
          try:
            return _orig(self, *a, **k)
          finally:
            _pt_add(_label, _pt_time.perf_counter() - _t0)
    
        _w.__name__ = getattr(_orig, "__name__", _meth)
        setattr(_cls, _meth, _w)
    
      def _pt_flush(self):
        try:
          _step = -1
          try:
            _step = int(self.rl_cluster.global_steps)
          except Exception:
            pass
          _rec = dict(_PHASETIME)
          _rec["step"] = _step
          print("PHASETIME step=%d " % _step
                + " ".join("%s=%.2f" % (_k, _v) for _k, _v in sorted(_rec.items())
                           if _k != "step"), flush=True)
          _run = _pt_os.environ.get("JOB_IDENTIFIER", "unknown-run")
          _art = _pt_os.environ.get("ARTIFACT_DIR", "")
          if _art.startswith("gs://"):
            from google.cloud import storage as _st
            _b, _, _pre = _art[5:].partition("/")
            _key = "%s/%s/phasetime/step_%06d.json" % (_pre.rstrip("/"), _run, _step)
            _st.Client().bucket(_b).blob(_key.lstrip("/")).upload_from_string(
                _pt_json.dumps(_rec), content_type="application/json")
        except Exception as _e:
          print("PHASETIME ERROR: %r" % (_e,), flush=True)
        finally:
          _PHASETIME.clear()
    
      _pt_wrap(RLLearner, "_prepare_data", "prepare_data")
      _pt_wrap(RLLearner, "_run_all_micro_batch_steps", "micro_batch_steps")
      _pt_wrap(RLLearner, "_compute_rewards", "compute_rewards")
    
      _pt_orig_gs = RLLearner._run_global_step
    
      def _pt_global_step(self, *a, **k):
        _t0 = _pt_time.perf_counter()
        try:
          return _pt_orig_gs(self, *a, **k)
        finally:
          _pt_add("run_global_step", _pt_time.perf_counter() - _t0)
          _pt_flush(self)
    
      RLLearner._run_global_step = _pt_global_step
    except Exception as _e:
      print("PHASETIME ERROR (install): %r" % (_e,), flush=True)
    # --- end _PHASETIME ---------------------------------------------------------------
    '''
    
    GL_APPEND = '''
    
    # --- _PHASETIME v2: time the GRPO payload inside prepare_data ---------------------
    try:
      import time as _pt2_time
      from tunix.rl import rl_learner as _pt2_rl
    
      _pt2_orig = GRPOLearner._generate_and_compute_advantage
    
      def _pt2_w(self, *a, **k):
        _t0 = _pt2_time.perf_counter()
        try:
          return _pt2_orig(self, *a, **k)
        finally:
          try:
            _pt2_rl._pt_add("generate_and_advantage", _pt2_time.perf_counter() - _t0)
          except Exception:
            pass
    
      GRPOLearner._generate_and_compute_advantage = _pt2_w
    except Exception as _e:
      print("PHASETIME ERROR (grpo install): %r" % (_e,), flush=True)
    # --- end _PHASETIME ---------------------------------------------------------------
    '''
    
    RC_APPEND = '''
    
    # --- _PHASETIME v2: time the engine generate call (vLLM + detokenize) -------------
    # NOTE: rl_learner imports THIS module at load time, so rl_learner must be
    # imported lazily inside the wrapper to avoid a circular import.
    try:
      import time as _pt3_time
    
      _pt3_orig = RLCluster.generate
    
      def _pt3_w(self, *a, **k):
        _t0 = _pt3_time.perf_counter()
        try:
          return _pt3_orig(self, *a, **k)
        finally:
          try:
            from tunix.rl import rl_learner as _pt3_rl
            _pt3_rl._pt_add("engine_generate", _pt3_time.perf_counter() - _t0)
          except Exception:
            pass
    
      _pt3_w.__name__ = "generate"
      RLCluster.generate = _pt3_w
    except Exception as _e:
      print("PHASETIME ERROR (cluster install): %r" % (_e,), flush=True)
    # --- end _PHASETIME ---------------------------------------------------------------
    '''
    
    new_rl = rl_src + RL_APPEND
    new_gl = gl_src + GL_APPEND
    new_rc = rc_src + RC_APPEND
    for name, s in (("rl_learner.py", new_rl), ("grpo_learner.py", new_gl),
                    ("rl_cluster.py", new_rc)):
        try:
            ast.parse(s)
        except SyntaxError as e:
            fail(f"patched {name} does not parse: {e}")
    
    open(RL, "w", encoding="utf-8").write(new_rl)
    open(GL, "w", encoding="utf-8").write(new_gl)
    open(RC, "w", encoding="utf-8").write(new_rc)
    
    problems = []
    v_rl = open(RL, encoding="utf-8").read()
    v_gl = open(GL, encoding="utf-8").read()
    v_rc = open(RC, encoding="utf-8").read()
    if "_pt_flush" not in v_rl or 'compute_rewards"' not in v_rl:
        problems.append("rl_learner wrappers missing")
    if "_pt2_w" not in v_gl:
        problems.append("grpo_learner wrapper missing")
    if "_pt3_w" not in v_rc:
        problems.append("rl_cluster wrapper missing")
    if v_rl.count("def _run_global_step") != 1:
        problems.append("rl_learner._run_global_step disturbed")
    for name, s in (("rl_learner.py", v_rl), ("grpo_learner.py", v_gl),
                    ("rl_cluster.py", v_rc)):
        try:
            ast.parse(s)
        except SyntaxError as e:
            problems.append(f"reparse {name}: {e}")
    if problems:
        fail("; ".join(problems))
    print("PHASETIME2 PATCH: APPLIED")
  patch_sharded_sampling.py: |-
    """Vocab-sharded sampling + logprobs for the fused decode window.
    
    WHY. sampling.py force-replicates the logits over the vocab dim every decode
    iteration ("Unshard the logits explicitly...", with an upstream TODO asking
    for exactly this change): a (batch, 151936) f32 all-gather (~78 MB per DP
    rank per iteration), followed by topk_mask/topp_mask -- 32-33 full vocab-axis
    reduction sweeps each (the ~800us/call while-loops in every profile) -- and a
    full-vocab categorical, all computed redundantly on every TP device. The
    logprobs path (gather_logprobs) repeats full-vocab log_softmax + top-N + a
    rank reduction on the same replicated array.
    
    WHAT. Rebinds `sample` and `compute_and_gather_logprobs` with vocab-sharded
    implementations under jax.shard_map:
      - per TP shard: one lax.top_k over vocab/8, all-gather only the top-64
        candidate (value, index) pairs (~0.4 MB vs ~78 MB);
      - exact top-k cutoff, top-p cutoff, and categorical on the merged
        candidates. EXACTNESS: temperature scaling is monotone (order preserved);
        the union of per-shard top-64 contains the global top-k for k <= 64; the
        cutoff mask keeps values >= cutoff exactly like topk_mask (ties
        included); masked/non-candidate entries underflow to exactly zero
        probability in f32 softmax, so top-p mass sums and the categorical
        distribution equal the full-vocab computation. Verified on CPU with an
        8-device mesh: kept sets identical on adversarial ties, greedy exact,
        draw distribution within statistical noise, logprob top-N ids exact,
        values within 1e-6, ranks exact (scratchpad/shard_proto.py).
      - logprobs: log_softmax via pmax/psum, top-N from the same candidates
        (log_softmax is monotone in logits), token logprob + rank via psum.
    
    WHAT CHANGES NUMERICALLY. The categorical RNG stream differs (noise drawn
    over candidates, not the full vocab), so sampled tokens are not bitwise equal
    to the old path -- distribution-equal only. Logprob VALUES shift ~1e-6 from
    reduction order. Validity gates for the run: LENDIST truncation band and
    reward band, not bitwise reward equality.
    
    GUARDS.
      - lax.cond falls back to the ORIGINAL implementation for the whole batch
        if any row has top_k <= 0 or top_k > 64 (e.g. eval "liberal" top_k=2000)
        or top_p <= 0; both branches are compiled, only the taken one runs.
      - compute_and_gather_logprobs falls back statically if max_logprobs > 48.
      - env SHARDED_SAMPLING=0 disables the rebinding entirely at patch time...
        is checked at RUNTIME by the wrappers, so the kill-switch works from the
        manifest without re-patching.
      - `sample`'s ret_logits in the sharded path is the RAW (still-sharded)
        logits: valid for logprobs_mode="raw" (our config). A processed_logprobs
        deployment must disable this patch.
    
    FAIL-OPEN. Any missing anchor prints FAILED and exits 0.
    Prints exactly one of:
        SHARDED-SAMPLING PATCH: APPLIED
        SHARDED-SAMPLING PATCH: FAILED <reason>
    """
    
    import ast
    import os
    import sys
    
    SITE = os.environ.get("PATCH_ROOT", "/usr/local/lib/python3.12/site-packages")
    ROOT = os.path.join(SITE, "tpu_inference")
    SP = os.path.join(ROOT, "layers/jax/sample/sampling.py")
    
    
    def fail(msg):
        print(f"SHARDED-SAMPLING PATCH: FAILED {msg}")
        sys.exit(0)
    
    
    if not os.path.exists(SP):
        fail(f"{SP} not found")
    src = open(SP, encoding="utf-8").read()
    
    if "_SHARDED_SAMPLING" in src:
        print("SHARDED-SAMPLING PATCH: already patched")
        sys.exit(0)
    
    for needle in ("def sample(", "def compute_and_gather_logprobs(",
                   "def gather_logprobs(", "def _apply_sampling_transforms(",
                   "ShardingAxisName"):
        if needle not in src:
            fail(f"anchor '{needle}' not present in sampling.py")
    
    APPEND = '''
    
    # --- _SHARDED_SAMPLING -------------------------------------------------------
    # Appended by patch_sharded_sampling.py (see its docstring). Rebinds `sample`
    # and `compute_and_gather_logprobs` below; originals are kept as fallbacks.
    try:
      import os as _ss_os
      from jax import lax as _ss_lax
      try:
        from jax import shard_map as _ss_shard_map          # jax >= 0.8
      except ImportError:
        from jax.experimental.shard_map import shard_map as _ss_shard_map
    
      _SS_CAND = 64
      _SS_NEG = -1e12
    
      _ss_orig_sample = sample
      _ss_orig_cgl = compute_and_gather_logprobs
    
      def _ss_axes(mesh):
        """(batch_axes, vocab_axis) restricted to axes present in the mesh."""
        def present(name):
          if name is None:
            return ()
          if isinstance(name, (tuple, list)):
            return tuple(a for a in name if a in mesh.axis_names)
          return (name,) if name in mesh.axis_names else ()
        batch = present(ShardingAxisName.ATTN_DATA)
        vocab = present(ShardingAxisName.MODEL)
        return batch, (vocab[0] if vocab else None)
    
      def _ss_merged_candidates(x_blk, vocab_axis):
        v_shard = x_blk.shape[-1]
        midx = _ss_lax.axis_index(vocab_axis)
        vals, idx = _ss_lax.top_k(x_blk, _SS_CAND)
        gidx = idx + midx * v_shard
        av = _ss_lax.all_gather(vals, vocab_axis)
        ai = _ss_lax.all_gather(gidx, vocab_axis)
        n = av.shape[0]
        av = jnp.transpose(av, (1, 0, 2)).reshape(-1, n * _SS_CAND)
        ai = jnp.transpose(ai, (1, 0, 2)).reshape(-1, n * _SS_CAND)
        return av, ai
    
      def _ss_greedy(cv, ci):
        m = jnp.max(cv, axis=-1, keepdims=True)
        big = jnp.iinfo(jnp.int32).max
        return jnp.min(jnp.where(cv >= m, ci, big), axis=-1)
    
      def _ss_kth(cv, k):
        sv = -jnp.sort(-cv, axis=-1)
        kk = jnp.clip(k, 1, cv.shape[-1]) - 1
        return jnp.take_along_axis(sv, kk[:, None], axis=-1)
    
      def _ss_topp_cutoff(probs, p):
        sp = -jnp.sort(-probs, axis=-1)
        cum = jnp.cumsum(sp, axis=-1)
        jstar = jnp.argmax(cum >= p[:, None], axis=-1)
        return jnp.take_along_axis(sp, jstar[:, None], axis=-1)
    
      def _ss_sample_block(vocab_axis, batch_axes, rng, x, temperature, top_k,
                           top_p, do_argmax_only):
        # x: (b_local, v_shard) f32
        didx = 0
        for i, a in enumerate(batch_axes):
          didx = didx * _ss_lax.axis_size(a) + _ss_lax.axis_index(a)
        xt = x / temperature[:, None]
        cv, ci = _ss_merged_candidates(xt, vocab_axis)
        greedy = _ss_greedy(cv, ci)
        if do_argmax_only:
          return _ss_lax.pmax(greedy, vocab_axis)
        kth = _ss_kth(cv, top_k)
        mk = jnp.where((top_k > 0)[:, None] & ~(cv >= kth), _SS_NEG, cv)
        probs = jax.nn.softmax(mk, axis=-1)
        pcut = _ss_topp_cutoff(probs, top_p)
        mp = jnp.where((top_p < 1.0)[:, None] & ~(probs >= pcut), _SS_NEG, mk)
        r = jax.random.fold_in(rng, didx)
        choice = jax.random.categorical(r, mp)
        sampled = jnp.take_along_axis(ci, choice[:, None], axis=-1)[:, 0]
        out = jnp.where(temperature < _SAMPLING_EPS, greedy, sampled)
        # Values are identical on every vocab shard (built from all-gathered
        # candidates); the pmax is an identity that makes that replication
        # provable to shard_map's output check on every jax version.
        return _ss_lax.pmax(out, vocab_axis)
    
      def _ss_sample(rng, mesh, logits, meta):
        batch_axes, vocab_axis = _ss_axes(mesh)
        bspec = P(batch_axes if batch_axes else None)
        lspec = P(batch_axes if batch_axes else None, vocab_axis)
        logits = jax.lax.with_sharding_constraint(logits,
                                                  NamedSharding(mesh, lspec))
    
        def blk(rng, x, t, k, p):
          return _ss_sample_block(vocab_axis, batch_axes, rng, x, t, k, p,
                                  do_argmax_only=not meta.do_sampling)
    
        tokens = _ss_shard_map(blk, mesh=mesh,
                               in_specs=(P(), lspec, bspec, bspec, bspec),
                               out_specs=bspec)(
                                   rng, logits, meta.temperature.astype(
                                       jnp.float32), meta.top_k, meta.top_p)
        tokens = jax.lax.with_sharding_constraint(tokens, NamedSharding(mesh, P()))
        return tokens, logits
    
      def sample(rng, mesh, logits, tpu_sampling_metadata):
        if _ss_os.environ.get("SHARDED_SAMPLING", "1") == "0":
          return _ss_orig_sample(rng, mesh, logits, tpu_sampling_metadata)
        meta = tpu_sampling_metadata
        if meta._cache_collision_dummy is not None:
          logits = logits + 0 * jnp.sum(meta._cache_collision_dummy)
        _, vocab_axis = _ss_axes(mesh)
        if vocab_axis is None:
          return _ss_orig_sample(rng, mesh, logits, meta)
        logits = logits.astype(jnp.float32)
        if not meta.do_sampling:
          return _ss_sample(rng, mesh, logits, meta)
        safe = jnp.all((meta.top_k > 0) & (meta.top_k <= _SS_CAND)
                       & (meta.top_p > 0.0))
        return _ss_cond_sample(safe, rng, mesh, logits, meta)
    
      def _ss_cond_sample(safe, rng, mesh, logits, meta):
        # mesh/meta are closed over rather than passed as lax.cond operands
        # (Mesh is not a valid JAX type). Both branches constrain ret_logits to
        # the SHARDED spec so cond-output unification cannot reintroduce the
        # vocab all-gather on the hot path (the fallback branch has already paid
        # its own gather internally; re-constraining its output is cheap).
        batch_axes, vocab_axis = _ss_axes(mesh)
        lspec = P(batch_axes if batch_axes else None, vocab_axis)
    
        def tru(op):
          r, lg = op
          return _ss_sample(r, mesh, lg, meta)
    
        def fls(op):
          r, lg = op
          toks, ret = _ss_orig_sample(r, mesh, lg, meta)
          ret = jax.lax.with_sharding_constraint(ret, NamedSharding(mesh, lspec))
          return toks, ret
    
        return jax.lax.cond(safe, tru, fls, (rng, logits))
    
      def compute_and_gather_logprobs(logits, next_tokens, max_logprobs):
        if (_ss_os.environ.get("SHARDED_SAMPLING", "1") == "0"
            or max_logprobs > 48):
          return _ss_orig_cgl(logits, next_tokens, max_logprobs)
        # Mesh is implicit here (no arg); derive from the array sharding if
        # available, else fall back.
        sh = getattr(logits, "sharding", None)
        mesh = getattr(sh, "mesh", None)
        if mesh is None or getattr(mesh, "empty", False):
          return _ss_orig_cgl(logits, next_tokens, max_logprobs)
        batch_axes, vocab_axis = _ss_axes(mesh)
        if vocab_axis is None:
          return _ss_orig_cgl(logits, next_tokens, max_logprobs)
        bspec = P(batch_axes if batch_axes else None)
        lspec = P(batch_axes if batch_axes else None, vocab_axis)
        logits = jax.lax.with_sharding_constraint(
            logits, NamedSharding(mesh, lspec))
    
        def blk(x, toks):
          v_shard = x.shape[-1]
          midx = _ss_lax.axis_index(vocab_axis)
          gmax = _ss_lax.pmax(jnp.max(x, axis=-1), vocab_axis)
          se = _ss_lax.psum(jnp.sum(jnp.exp(x - gmax[:, None]), axis=-1),
                            vocab_axis)
          lse = gmax + jnp.log(se)
          rv, ri = _ss_merged_candidates(x, vocab_axis)
          nv, ni = _ss_lax.top_k(rv, max_logprobs)
          top_ids = jnp.take_along_axis(ri, ni, axis=-1)
          top_lps = nv - lse[:, None]
          owner = (toks >= midx * v_shard) & (toks < (midx + 1) * v_shard)
          col = jnp.clip(toks - midx * v_shard, 0, v_shard - 1)
          lval = jnp.take_along_axis(x, col[:, None], axis=-1)[:, 0]
          tok_logit = _ss_lax.psum(jnp.where(owner, lval, 0.0), vocab_axis)
          tok_lp = tok_logit - lse
          rank = _ss_lax.psum(jnp.sum(x >= tok_logit[:, None], axis=-1),
                              vocab_axis)
          idx = jnp.concatenate((toks[:, None], top_ids), axis=1).astype(jnp.int32)
          lps = jnp.concatenate((tok_lp[:, None], top_lps), axis=1)
          # identity pmax: values already replicated across vocab shards; makes
          # the replication provable to shard_map's output check.
          return (_ss_lax.pmax(idx, vocab_axis), _ss_lax.pmax(lps, vocab_axis),
                  _ss_lax.pmax(rank, vocab_axis))
    
        idx, lps, rank = _ss_shard_map(
            blk, mesh=mesh,
            in_specs=(lspec, bspec),
            out_specs=(P(batch_axes if batch_axes else None, None),
                       P(batch_axes if batch_axes else None, None), bspec),
            )(logits.astype(jnp.float32), next_tokens)
        return LogprobsTensors(idx, lps, rank)
    except Exception as _e:
      print("SHARDED-SAMPLING ERROR (install): %r" % (_e,), flush=True)
    # --- end _SHARDED_SAMPLING ---------------------------------------------------
    '''
    
    new = src + APPEND
    try:
        ast.parse(new)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")
    
    open(SP, "w", encoding="utf-8").write(new)
    
    v = open(SP, encoding="utf-8").read()
    problems = []
    if "_ss_sample_block" not in v or "_ss_orig_cgl" not in v:
        problems.append("appended block incomplete")
    if v.count("def sample(") != 2:
        problems.append("expected original + rebound sample definitions")
    try:
        ast.parse(v)
    except SyntaxError as e:
        problems.append(f"reparse failed: {e}")
    if problems:
        fail("; ".join(problems))
    print("SHARDED-SAMPLING PATCH: APPLIED")
  patch_vllm_sampler.py: |-
    """Hotfix for pathwaysutils profiling + tpu_runner req_id_kwargs nanobind limit.
    
    Adapted for image head-612fcd2e-gemma4c-perf. Two of the four original
    sub-fixes are already merged upstream in this image and are DETECTED, not
    re-applied:
      - profiling.py executable.call(out_avals=..., out_shardings=...): the image
        passes them conditionally (xprofTraceOptions branch) -- already fixed.
      - profiling.py advanced_config int -> {"int64Value": v}: already present.
    Still applied here:
      - profiling.py start_trace / start_trace_patch: max_num_hosts default 1 ->
        None, resolved to 16 inside start_trace.
      - tpu_runner.py: cap **req_id_kwargs at 100 entries (nanobind kwargs limit).
    
    Fail-open: prints exactly one of
        VLLM-SAMPLER PATCH: APPLIED
        VLLM-SAMPLER PATCH: already patched
        VLLM-SAMPLER PATCH: FAILED <reason>
    """
    
    import os
    import sys
    
    SITE = os.environ.get("PATCH_ROOT", "/usr/local/lib/python3.12/site-packages")
    PROF = os.path.join(SITE, "pathwaysutils/profiling.py")
    TR = os.path.join(SITE, "tpu_inference/runner/tpu_runner.py")
    
    
    def fail(msg):
        print(f"VLLM-SAMPLER PATCH: FAILED {msg}")
        sys.exit(0)  # non-fatal: let the run start so the failure is visible
    
    
    problems = []
    applied_any = False
    already_all = True
    
    # --- pathwaysutils/profiling.py ---------------------------------------------
    if not os.path.exists(PROF):
        fail(f"{PROF} not found")
    with open(PROF, "r", encoding="utf-8") as f:
        c4 = f.read()
    modified4 = False
    
    # (1) executable.call out_avals/out_shardings -- merged upstream in this image
    # (conditional xprofTraceOptions branch). Detect either form.
    target4 = "      _, result_future = _profile_state.executable.call()"
    if target4 in c4:
        c4 = c4.replace(target4, (
            "      import jax\n"
            "      import jax.numpy as jnp\n"
            "      out_avals = ()\n"
            "      out_shardings = ()\n"
            "      _, result_future = _profile_state.executable.call(\n"
            "          out_avals=out_avals, out_shardings=out_shardings\n"
            "      )"
        ))
        modified4 = True
    elif "out_avals=out_avals, out_shardings=out_shardings" not in c4:
        problems.append("profiling.py: executable.call anchor missing and "
                        "out_avals fix not present")
    
    # (2) int -> int64Value -- merged upstream in this image.
    target4_int = ("      elif isinstance(v, int):\n"
                   '        advanced_config[k] = {"intValue": v}')
    if target4_int in c4:
        c4 = c4.replace(target4_int,
                        "      elif isinstance(v, int):\n"
                        '        advanced_config[k] = {"int64Value": v}')
        modified4 = True
    elif '{"int64Value": v}' not in c4:
        problems.append("profiling.py: intValue anchor missing and int64Value "
                        "fix not present")
    
    # traceSessionName is enabled now; no replacement needed (as in original).
    
    # (3) start_trace: max_num_hosts default 1 -> None (resolved to 16).
    target4_start = (
        "def start_trace(\n"
        "    log_dir: os.PathLike[str] | str,\n"
        "    *,\n"
        "    create_perfetto_link: bool = False,\n"
        "    create_perfetto_trace: bool = False,\n"
        "    profiler_options: jax.profiler.ProfileOptions | None = None,\n"
        "    max_num_hosts: int = 1,\n"
        ") -> None:"
    )
    replacement4_start = (
        "def start_trace(\n"
        "    log_dir: os.PathLike[str] | str,\n"
        "    *,\n"
        "    create_perfetto_link: bool = False,\n"
        "    create_perfetto_trace: bool = False,\n"
        "    profiler_options: jax.profiler.ProfileOptions | None = None,\n"
        "    max_num_hosts: int | None = None,\n"
        ") -> None:\n"
        "  if max_num_hosts is None:\n"
        "    max_num_hosts = 16"
    )
    if target4_start in c4:
        c4 = c4.replace(target4_start, replacement4_start)
        modified4 = True
        already_all = False
    elif "  if max_num_hosts is None:\n    max_num_hosts = 16" not in c4:
        problems.append("profiling.py: start_trace signature anchor missing and "
                        "max_num_hosts fix not present")
    
    # (4) start_trace_patch: same default change on the monkeypatch wrapper.
    target4_monkey = (
        "  def start_trace_patch(\n"
        "      log_dir,\n"
        "      create_perfetto_link: bool = False,\n"
        "      create_perfetto_trace: bool = False,\n"
        "      profiler_options: jax.profiler.ProfileOptions | None = None,\n"
        "      max_num_hosts: int = 1,\n"
        "  ) -> None:"
    )
    replacement4_monkey = (
        "  def start_trace_patch(\n"
        "      log_dir,\n"
        "      create_perfetto_link: bool = False,\n"
        "      create_perfetto_trace: bool = False,\n"
        "      profiler_options: jax.profiler.ProfileOptions | None = None,\n"
        "      max_num_hosts: int | None = None,\n"
        "  ) -> None:"
    )
    if target4_monkey in c4:
        c4 = c4.replace(target4_monkey, replacement4_monkey)
        modified4 = True
        already_all = False
    elif ("  def start_trace_patch(\n"
          "      log_dir,\n"
          "      create_perfetto_link: bool = False,\n"
          "      create_perfetto_trace: bool = False,\n"
          "      profiler_options: jax.profiler.ProfileOptions | None = None,\n"
          "      max_num_hosts: int | None = None,\n") not in c4:
        problems.append("profiling.py: start_trace_patch anchor missing and "
                        "None-default fix not present")
    
    if problems:
        fail("; ".join(problems))
    
    if modified4:
        with open(PROF, "w", encoding="utf-8") as f:
            f.write(c4)
        applied_any = True
    
    # --- tpu_inference/runner/tpu_runner.py --------------------------------------
    if not os.path.exists(TR):
