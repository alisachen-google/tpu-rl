      def _pt_wrap(_cls, _meth, _label):
        _orig = getattr(_cls, _meth)
    
        def _w(self, *a, **k):
          _t0 = _pt_time.perf_counter()
          try:
            return _orig(self, *a, **k)
          finally:
            _pt_add(_label, _pt_time.perf_counter() - _t0)
    
