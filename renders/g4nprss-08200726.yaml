apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: "g4nprss-08200726"
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: "multislice-queue"
spec:
  coordinator:
    replicatedJob: pathways-head
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  failurePolicy:
    # restartStrategy: Recreate not supported by this cluster's JobSet CRD
    # (older controller than the v6e cluster); leoch convention:
    maxRestarts: 0
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - pathways-head
  replicatedJobs:
# ----------------------------------------------------
# 1. Pathways-Head Replicated Job
# ----------------------------------------------------
  - name: pathways-head
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              kueue.x-k8s.io/podset: pathways-head
            annotations:
              kubectl.kubernetes.io/default-container: jax-tpu
              gke-gcsfuse/volumes: "true"
              # optimize-utilization autoscaler drains under-packed cpu-np nodes; without this the
              # head gets SIGTERMed mid-run (two 143 kills during train compile, 2026-08-20).
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-nodepool: "cpu-np"
            tolerations:
            - key: cloud.google.com/gke-nodepool
              operator: Exists
              effect: NoSchedule
            containers:
            - name: jax-tpu
              image: "gcr.io/supercomputer-testing/maxtext-rl-ironwood:head-612fcd2e-gemma4c-perf"
              command:
              - bash
              - -c
              - |
                echo Pathways Helm Start: $(date);
                _sigterm() (kill -SIGTERM $! 2>/dev/null;);
                trap _sigterm SIGTERM;

                echo "Executing payload from /workload/launcher/launch-workload.sh..."
                ( bash /workload/launcher/launch-workload.sh ) & PID=$!;

                while kill -0 $PID 2>/dev/null;
                    do sleep 5;
                done;
                wait $PID;
                EXIT_CODE=$?;

                echo Pathways Helm End: $(date);
                echo EXIT_CODE=$EXIT_CODE;
                exit $EXIT_CODE
              env:
              - name: JAX_PLATFORMS
                value: proxy
              - name: PATHWAYS_HEAD
                value: "g4nprss-08200726-pathways-head-0-0.g4nprss-08200726"
              - name: JAX_BACKEND_TARGET
                value: grpc://g4nprss-08200726-pathways-head-0-0.g4nprss-08200726:29100
              - name: JOB_IDENTIFIER
                value: "g4nprss-08200726"
              - name: ARTIFACT_DIR
                value: "gs://ubench-logs/alisachen-tpu7x/runs"
              - name: SKIP_JAX_PRECOMPILE
                value: "1"
              - name: R1_STEPS
                value: "2"
              - name: R1_BATCH
                value: "8"
              - name: R1_TP
                value: "4"
              - name: SHARDED_SAMPLING
                value: "1"
              resources:
                limits:
                  cpu: "44"
                  memory: 170G
                requests:
                  cpu: "28"
                  memory: 130G
              securityContext:
                privileged: true

              volumeMounts:
              - name: workload-launcher
                mountPath: /workload/launcher
              - name: shared-tmp
                mountPath: /tmp
              - name: workload-patches
                mountPath: /workload/patches
              - name: workload-configuration
                mountPath: /workload/configs
            initContainers:
            # Native Sidecar Pattern: restartPolicy Always prevents pod hangs
            - name: pathways-rm
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: HOST_ADDRESS
                value: "g4nprss-08200726-pathways-head-0-0.g4nprss-08200726"
              args:
              - --server_port=29101
              - --node_type=resource_manager
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-2x2x1/5f5711e1-13d9-45a3-bdf3-96b61ba471c8
              - --instance_count=1
              - --instance_type=tpu7x:2x2x1
              resources:
                requests:
                  cpu: "2"
                  memory: 8G
                limits:
                  cpu: "4"
                  memory: 16G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            - name: pathways-proxy
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: PATHWAYS_HEAD
                value: "g4nprss-08200726-pathways-head-0-0.g4nprss-08200726"
              args:
              - --server_port=29100
              - --resource_manager_address=g4nprss-08200726-pathways-head-0-0.g4nprss-08200726:29101
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-2x2x1/5f5711e1-13d9-45a3-bdf3-96b61ba471c8
              resources:
                requests:
                  cpu: "8"
                  memory: 32G
                limits:
                  cpu: "16"
                  memory: 64G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            volumes:
            - name: shared-tmp
              emptyDir: {}   # was hostPath /tmp — leaked pathways state across pods on reused nodes
            - name: workload-launcher
              configMap:
                name: "g4nprss-08200726-launcher"
            - name: workload-patches
              configMap:
                name: "g4nprss-08200726-patches"
                items:
                - key: gemma4_prs.diff
                  path: gemma4_prs.diff
                - key: patch_cd_proper.py
                  path: patch_cd_proper
                - key: patch_engine_kwargs.py
                  path: patch_engine_kwargs
                - key: patch_gemma4_prs.py
                  path: patch_gemma4_prs
                - key: patch_gemma4_tp_fusion.py
                  path: patch_gemma4_tp_fusion
                - key: patch_lendist.py
                  path: patch_lendist
                - key: patch_phasetime.py
                  path: patch_phasetime
                - key: patch_pr4409.py
                  path: patch_pr4409
                - key: patch_sharded_sampling.py
                  path: patch_sharded_sampling
                - key: patch_tunix_chunked_logps.py
                  path: patch_tunix_chunked_logps
                - key: patch_vllm_sampler.py
                  path: patch_vllm_sampler
                - key: pr4409_chunked_logps.diff
                  path: pr4409_chunked_logps.diff
            - name: workload-configuration
              configMap:
                name: "g4nprss-08200726-config"
                items:
                - key: workload-configuration
                  path: workload-config.yaml

