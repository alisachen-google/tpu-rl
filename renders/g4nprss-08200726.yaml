    +              "attention and PLE image-row substitution across segment boundaries. Set packing=False."
    +          )
           valid_mm_models = (
               "gemma3-4b",
               "gemma3-12b",
               "gemma3-27b",
               "gemma4-26b",
               "gemma4-31b",
    +          "gemma4-e2b",
