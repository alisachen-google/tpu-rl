    +            "run Gemma-4 E2B/E4B multimodal."
    +        )
           per_layer_inputs = gemma4_small.PLEToLinen(
               config=cfg,
               mesh=mesh,
    diff --git a/src/maxtext/layers/encoders.py b/src/maxtext/layers/encoders.py
