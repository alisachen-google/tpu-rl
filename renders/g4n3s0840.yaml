apiVersion: v1
kind: ConfigMap
metadata:
  name: "g4n3s0840-config"
  namespace: default
data:
  workload-configuration: |-
    # Minimal workload config; the launcher passes every knob on the command line
    # (MAXTEXT_CONFIG_PATH is resolved inside the launcher to maxtext/configs/post_train/rl.yml).
    base_config: "maxtext/configs/post_train/rl.yml"
---
# Source: pathways-tpu-jobset-workload/templates/workload-launcher-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: "g4n3s0840-launcher"
  namespace: default
data:
  launch-workload.sh: |-
    #!/bin/bash
    # Exit immediately if a command exits with a non-zero status.
    set -e
    
    # --- Graceful Shutdown Logic ---
    _sigterm() {
      echo "Caught SIGTERM signal, sending to child process..."
      kill -SIGTERM "$PID" 2>/dev/null
    }
    trap _sigterm SIGTERM
    
    MAXTEXT_CONFIG_PATH="maxtext/configs/post_train/rl.yml"
    # Ironwood bring-up fixes (from smoke ladder):
    
    # --- g4r1-native-pr: + maxtext PR #4409 chunked actor log-probs (R1_LOGPS_CHUNK>0 enables; lets tmbs>1 at 262k vocab). NATIVE tpu_inference Gemma4ForCausalLM sampler (weight_mapping/gemma4.py, maxtext fork 840ffd361) + full tianyu-rl-14 stack (5 patches, CD-64, sharded logprobs, async off) ---
    # --- runtime patches (self-verifying, fail-open) ---
    export PYTHONPATH=/app/src:/deps/src:${PYTHONPATH:-}   # patch_engine_kwargs locates maxtext via importlib
    for P in patch_vllm_sampler patch_cd_proper patch_lendist patch_phasetime patch_sharded_sampling patch_pr4409 patch_engine_kwargs; do
      if [ -f /workload/patches/$P ]; then
        python3 /workload/patches/$P
      fi
    done
    
    export JAX_PLATFORMS="proxy,cpu"
    export CONTINUE_DECODE_EOS_CHECK_INTERVAL=0
    if [ -n "${R1_RPA:-}" ]; then export RPA_V3_DECODE_BLOCK_SIZES="$R1_RPA"; fi
    # aysu rollout-side tuning (ubench aysu-ubench-8terxbx7, gemma4-e2b serving on tpu7x):
    #   USE_BATCHED_RPA_KERNEL=1 (experimental batched RPA kernel; env read by tpu_inference)
    #   RL_VLLM_ENGINE_KWARGS='{"block_size": 256}' (forwarded by patch_engine_kwargs; kv_cache_dtype fp8 = optional non-bf16 rung)
    # Both are opt-in via the chart envs so control runs stay flag-free.
    export VLLM_ENGINE_READY_TIMEOUT_S="${VLLM_ENGINE_READY_TIMEOUT_S:-60000}"
    [ -n "${USE_BATCHED_RPA_KERNEL:-}" ] && echo "TUNING: USE_BATCHED_RPA_KERNEL=$USE_BATCHED_RPA_KERNEL"
    [ -n "${RL_VLLM_ENGINE_KWARGS:-}" ] && echo "TUNING: RL_VLLM_ENGINE_KWARGS=$RL_VLLM_ENGINE_KWARGS"   # e.g. 1,8704,1,2176 (g4p3-validated)
    export PHASED_PROFILING_DIR="${ARTIFACT_DIR}/${JOB_IDENTIFIER}/phased_profile"
    export JAX_COMPILATION_CACHE_DIR="gs://ubench-logs/alisachen-tpu7x/compilation_cache/gemma4-e2b-r1np"            # newer tpu_inference stages on cpu backend
    export VLLM_ENABLE_V1_MULTIPROCESSING=0     # required under Pathways
    XLA_FLAGS=""
    
    # Fallback check to support different image structures
    if [ ! -f "${MAXTEXT_CONFIG_PATH}" ] && [ -f "src/${MAXTEXT_CONFIG_PATH}" ]; then
      echo "MAXTEXT_CONFIG_PATH not found at ${MAXTEXT_CONFIG_PATH}, falling back to src/${MAXTEXT_CONFIG_PATH}"
      MAXTEXT_CONFIG_PATH="src/${MAXTEXT_CONFIG_PATH}"
    fi
    
    # --- TPU Worker Hostnames & ID ---
    if [ ! -z "${NNODES}" ] && [ ! -z "${JOBSET_NAME}" ] && [ ! -z "${SUBDOMAIN}" ]; then
      HOSTS=""
      for i in $(seq 0 $((NNODES - 1))); do
        # JobSet pod naming: ${JOBSET_NAME}-workload-0-${i}.${SUBDOMAIN}
        HOSTS="${HOSTS}${JOBSET_NAME}-workload-0-${i}.${SUBDOMAIN},"
      done
      export TPU_WORKER_HOSTNAMES=${HOSTS%,}
      echo "Computed TPU_WORKER_HOSTNAMES: ${TPU_WORKER_HOSTNAMES}"
    fi
    
    # --- Log for Debugging ---
    echo "MaxText config overrides from command line:"
    echo "  g4r1-native-pr decode-heavy run; args as in command below. base_output_directory=${ARTIFACT_DIR}"
    
    # --- RL Sampler Patches & Env Setup ---
    if [ "maxtext.trainers.post_train.rl.train_rl" = "maxtext.trainers.post_train.rl.train_rl" ]; then
      export HF_HUB_ENABLE_HF_TRANSFER=0
      export HF_HUB_DISABLE_XET=1
      export PYTHONPATH=/app/src:$PYTHONPATH
      export NUM_PRECOMPILE_WORKERS=1
      export NEW_MODEL_DESIGN=1
      export JAX_BACKEND_TARGET="${JAX_BACKEND_TARGET:-grpc://127.0.0.1:29000}"
    fi
    
    # --- Main Execution ---
    # The python process is run in the background (&)
    (
      # Set up the environment
      export ENABLE_PATHWAYS_PERSISTENCE='1'
      export JAX_PLATFORMS="${JAX_PLATFORMS:-tpu,cpu}"
      export ENABLE_PJRT_COMPATIBILITY='true'
      if [ ! -z "${XLA_FLAGS}" ]; then
        export LIBTPU_INIT_ARGS="${XLA_FLAGS}"
      fi
    
      # Execute the training script, passing the config file AND the command-line overrides
      python3 -m maxtext.trainers.post_train.rl.train_rl "${MAXTEXT_CONFIG_PATH}" model_name='gemma4-e2b' data_template_path=maxtext/examples/chat_templates/openmathinstruct2_rl.json chat_template_path=maxtext/examples/chat_templates/gemma-3-27b-chat_template.json tokenizer_path='google/gemma-4-E2B-it' dataset_name='nvidia/OpenMathInstruct-2' hf_train_files='hf://datasets/nvidia/OpenMathInstruct-2/data/train_1M-*.parquet' train_split='train_1M' rl.num_generations=8 rl.grpo_beta=0.0 rl.epsilon_high=0.28 rl.grpo_epsilon=0.2 enable_checkpointing=True checkpoint_storage_use_ocdbt=False checkpoint_storage_use_zarr3=False checkpoint_period=10 async_scheduling=False chips_per_vm=4 num_batches=${R1_STEPS:-30} num_test_batches=0 gradient_clipping_threshold=1.0 decode_sampling_temperature=0.8 decode_sampling_top_k=50 decode_sampling_nucleus_p=0.95 max_target_length=8192 max_prefill_predict_length=4096 learning_rate=1e-6 batch_size=${R1_BATCH:-256} train_micro_batch_size=${R1_TMBS:-1} rollout_micro_batch_size=${R1_BATCH:-256} rollout_data_parallelism=-1 rollout_tensor_parallelism=${R1_TP:-8} enable_dp_attention=False hbm_utilization_vllm=0.6 max_num_seqs=256 max_num_batched_tokens=8448 math_verify_num_procs=32 rl_compute_logps_chunk_size=${R1_LOGPS_CHUNK:-0} scan_layers=False vllm_hf_overrides='{architectures: ["Gemma4ForCausalLM"]}' vllm_additional_config='{"enable_continue_decode": true, "max_decode_steps": 64}' allow_split_physical_axes=True enable_tunix_perf_metrics=True load_parameters_path='gs://ubench-logs/alisachen-tpu7x/ckpt/gemma4-e2b-raw/0/items' skip_jax_distributed_system=True log_period=1 base_output_directory=${ARTIFACT_DIR} run_name=${JOB_IDENTIFIER}
    ) & PID=$!
    
    # Wait for the python process to finish
    EXIT_CODE=0
    wait $PID || EXIT_CODE=$?   # tolerate failure so the debug-hold below can run (set -e)
    
    echo "MaxText Job Ended at: $(date) with exit code $EXIT_CODE"
    if [ "$EXIT_CODE" -ne 0 ]; then
      echo "DEBUG-HOLD: failure detected, keeping pod alive 20 min for log capture"
      sleep 1200
    fi
    exit $EXIT_CODE
---
# Source: pathways-tpu-jobset-workload/templates/pathways-jobset.yaml
# yamllint disable







apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: "g4n3s0840"
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: "default"
spec:
  coordinator:
    replicatedJob: pathways-head
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  failurePolicy:
    # restartStrategy: Recreate not supported by this cluster's JobSet CRD
    # (older controller than the v6e cluster); leoch convention:
    maxRestarts: 0
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - pathways-head
  replicatedJobs:
# ----------------------------------------------------
# 1. Pathways-Head Replicated Job
# ----------------------------------------------------
  - name: pathways-head
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              kueue.x-k8s.io/podset: pathways-head
            annotations:
              kubectl.kubernetes.io/default-container: jax-tpu
              gke-gcsfuse/volumes: "true"
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-nodepool: "cpu-np"
            tolerations:
            - key: cloud.google.com/gke-nodepool
              operator: Exists
              effect: NoSchedule
            containers:
            - name: jax-tpu
              image: "gcr.io/supercomputer-testing/maxtext-rl-ironwood:head-612fcd2e-gemma4c-perf"
              command:
              - bash
              - -c
              - |
                echo Pathways Helm Start: $(date);
                _sigterm() (kill -SIGTERM $! 2>/dev/null;);
                trap _sigterm SIGTERM;

                echo "Executing payload from /workload/launcher/launch-workload.sh..."
                ( bash /workload/launcher/launch-workload.sh ) & PID=$!;

                while kill -0 $PID 2>/dev/null;
                    do sleep 5;
                done;
                wait $PID;
                EXIT_CODE=$?;

                echo Pathways Helm End: $(date);
                echo EXIT_CODE=$EXIT_CODE;
                exit $EXIT_CODE
              env:
              - name: JAX_PLATFORMS
                value: proxy
              - name: PATHWAYS_HEAD
                value: "g4n3s0840-pathways-head-0-0.g4n3s0840"
              - name: JAX_BACKEND_TARGET
                value: grpc://g4n3s0840-pathways-head-0-0.g4n3s0840:29020
              - name: JOB_IDENTIFIER
                value: "g4n3s0840"
              - name: ARTIFACT_DIR
                value: "gs://ubench-logs/alisachen-tpu7x/runs"
              - name: SKIP_JAX_PRECOMPILE
                value: "1"
              - name: R1_STEPS
                value: "2"
              - name: R1_BATCH
                value: "8"
              - name: R1_TP
                value: "4"
              - name: R1_TMBS
                value: "4"
              - name: R1_LOGPS_CHUNK
                value: "1024"
              resources:
                limits:
                  cpu: "44"
                  memory: 170G
                requests:
                  cpu: "28"
                  memory: 130G
              securityContext:
                privileged: true

              volumeMounts:
              - name: workload-launcher
                mountPath: /workload/launcher
              - name: shared-tmp
                mountPath: /tmp
              - name: workload-patches
                mountPath: /workload/patches
              - name: workload-configuration
                mountPath: /workload/configs
            initContainers:
            # Native Sidecar Pattern: restartPolicy Always prevents pod hangs
            - name: pathways-rm
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: HOST_ADDRESS
                value: "g4n3s0840-pathways-head-0-0.g4n3s0840"
              args:
              - --server_port=29021
              - --node_type=resource_manager
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-2x2x1/624db419-501e-4fc1-a346-2ef84104a213
              - --instance_count=1
              - --instance_type=tpu7x:2x2x1
              resources:
                requests:
                  cpu: "2"
                  memory: 8G
                limits:
                  cpu: "4"
                  memory: 16G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            - name: pathways-proxy
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: PATHWAYS_HEAD
                value: "g4n3s0840-pathways-head-0-0.g4n3s0840"
              args:
              - --server_port=29020
              - --resource_manager_address=g4n3s0840-pathways-head-0-0.g4n3s0840:29021
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-2x2x1/624db419-501e-4fc1-a346-2ef84104a213
              resources:
                requests:
                  cpu: "8"
                  memory: 32G
                limits:
                  cpu: "16"
                  memory: 64G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            volumes:
            - name: shared-tmp
              emptyDir: {}   # was hostPath /tmp — leaked pathways state across pods on reused nodes
            - name: workload-launcher
              configMap:
                name: "g4n3s0840-launcher"
            - name: workload-patches
              configMap:
                name: "g4n3s0840-patches"
                items:
                - key: patch_cd_proper.py
                  path: patch_cd_proper
                - key: patch_engine_kwargs.py
                  path: patch_engine_kwargs
                - key: patch_lendist.py
                  path: patch_lendist
                - key: patch_phasetime.py
                  path: patch_phasetime
                - key: patch_pr4409.py
                  path: patch_pr4409
                - key: patch_sharded_sampling.py
                  path: patch_sharded_sampling
                - key: patch_vllm_sampler.py
                  path: patch_vllm_sampler
                - key: pr4409_chunked_logps.diff
                  path: pr4409_chunked_logps.diff
            - name: workload-configuration
              configMap:
                name: "g4n3s0840-config"
                items:
                - key: workload-configuration
                  path: workload-config.yaml

# ----------------------------------------------------
# 2. Worker Replicated Job
# ----------------------------------------------------
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 32
        completionMode: Indexed
        template:
          metadata:
            annotations:
              alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
            labels:
              kueue.x-k8s.io/podset: worker
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            tolerations:
            - key: google.com/tpu
              operator: Exists
            nodeSelector:
              cloud.google.com/gke-tpu-topology: "2x2x1"
              cloud.google.com/gke-tpu-accelerator: tpu7x
            containers:
            - name: pathways-worker
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              env:
              - name: PATHWAYS_HEAD
                value: "g4n3s0840-pathways-head-0-0.g4n3s0840"
              - name: MEGASCALE_SLICE_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              - name: MEGASCALE_NUM_SLICES
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-replicas']
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              - name: MEGASCALE_COORDINATOR_ADDRESS
                value: "g4n3s0840-pathways-head-0-0.g4n3s0840"
              args:
              - --server_port=29025
              - --resource_manager_address=g4n3s0840-pathways-head-0-0.g4n3s0840:29021
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-2x2x1/624db419-501e-4fc1-a346-2ef84104a213
              - --enable_metrics_collection=true
              - --xla_tpu_use_enhanced_launch_barrier=true
              ports:
              - containerPort: 29025
                protocol: TCP
              - containerPort: 29026
                protocol: TCP
              - containerPort: 8471
                protocol: TCP
              - containerPort: 8080
                protocol: TCP
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  google.com/tpu: "4"
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            initContainers:
            volumes:
            - name: shared-tmp
              emptyDir: {}   # was hostPath /tmp — leaked pathways state across pods on reused nodes
