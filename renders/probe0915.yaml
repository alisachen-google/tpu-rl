---
# Source: pathways-tpu-jobset-workload/templates/workload-config-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: "probe0915-config"
  namespace: default
data:
  workload-configuration: |-
    # Minimal workload config; the launcher passes every knob on the command line
    # (MAXTEXT_CONFIG_PATH is resolved inside the launcher to maxtext/configs/post_train/rl.yml).
    base_config: "maxtext/configs/post_train/rl.yml"
---
# Source: pathways-tpu-jobset-workload/templates/workload-launcher-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: "probe0915-launcher"
  namespace: default
data:
  launch-workload.sh: |-
    #!/bin/bash
    # Image probe: print package versions + feature greps, then exit 0. No TPU work.
    echo "PROBE: image contents"
    python3 - <<'PY'
    import importlib.metadata as md, importlib.util, os, re, subprocess
    for p in ["tunix","tpu-inference","tpu_inference","vllm","jax","jaxlib","libtpu","maxtext","pathwaysutils","flax","orbax-checkpoint","transformers"]:
        try: print(f"PKG {p}=={md.version(p)}")
        except Exception as e: pass
    def loc(m):
        s=importlib.util.find_spec(m); return list(s.submodule_search_locations)[0] if s and s.submodule_search_locations else None
    for m in ["tunix","tpu_inference","vllm","maxtext"]:
        print("LOC",m,loc(m))
    t=loc("tunix")
    if t:
        for f,pat in [("rl/rl_cluster.py","compute_logps_chunk_size|chunk_size|offload_to_cpu"),("rl/common.py","chunk_size|skip_lm_head|compute_final_logits|def compute_per_token_logps"),("rl/rl_learner.py","chunk"),("generate/vllm_sampler.py","engine_kwargs|Direct Weight|additional_config"),("rl/rollout/base_rollout.py","rollout_vllm_kwargs|compute_logps_chunk_size")]:
            p=os.path.join(t,f)
            if os.path.exists(p):
                hits=[l.strip()[:140] for l in open(p) if re.search(pat,l)]
                print(f"GREP {f}: {len(hits)} hits"); [print("   ",h) for h in hits[:12]]
            else: print("GREP",f,"MISSING")
        try:
            d=os.path.join(t,"..", "tunix-"+md.version("tunix")+".dist-info"); print("DISTINFO", os.path.exists(d))
        except Exception: pass
        print("TUNIX git:", subprocess.run(["git","-C",t,"log","-1","--format=%H %cd"],capture_output=True,text=True).stdout.strip() or "n/a")
    for b in ["patch","git"]:
        print("BIN",b, subprocess.run(["which",b],capture_output=True,text=True).stdout.strip() or "missing")
    PY
    echo "PROBE: done"
    exit 0
---
# Source: pathways-tpu-jobset-workload/templates/pathways-jobset.yaml
# yamllint disable







apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: "probe0915"
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: "default"
spec:
  coordinator:
    replicatedJob: pathways-head
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  failurePolicy:
    # restartStrategy: Recreate not supported by this cluster's JobSet CRD
    # (older controller than the v6e cluster); leoch convention:
    maxRestarts: 0
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - pathways-head
  replicatedJobs:
# ----------------------------------------------------
# 1. Pathways-Head Replicated Job
# ----------------------------------------------------
  - name: pathways-head
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              kueue.x-k8s.io/podset: pathways-head
            annotations:
              kubectl.kubernetes.io/default-container: jax-tpu
              gke-gcsfuse/volumes: "true"
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-nodepool: "cpu-np"
            tolerations:
            - key: cloud.google.com/gke-nodepool
              operator: Exists
              effect: NoSchedule
            containers:
            - name: jax-tpu
              image: "gcr.io/supercomputer-testing/maxtext-rl-ironwood:head-612fcd2e-gemma4c-perf"
              command:
              - bash
              - -c
              - |
                echo Pathways Helm Start: $(date);
                _sigterm() (kill -SIGTERM $! 2>/dev/null;);
                trap _sigterm SIGTERM;

                echo "Executing payload from /workload/launcher/launch-workload.sh..."
                ( bash /workload/launcher/launch-workload.sh ) & PID=$!;

                while kill -0 $PID 2>/dev/null;
                    do sleep 5;
                done;
                wait $PID;
                EXIT_CODE=$?;

                echo Pathways Helm End: $(date);
                echo EXIT_CODE=$EXIT_CODE;
                exit $EXIT_CODE
              env:
              - name: JAX_PLATFORMS
                value: proxy
              - name: PATHWAYS_HEAD
                value: "probe0915-pathways-head-0-0.probe0915"
              - name: JAX_BACKEND_TARGET
                value: grpc://probe0915-pathways-head-0-0.probe0915:29050
              - name: JOB_IDENTIFIER
                value: "probe0915"
              - name: ARTIFACT_DIR
                value: "gs://ubench-logs/alisachen-tpu7x/runs"
              - name: SKIP_JAX_PRECOMPILE
                value: "1"
              resources:
                limits:
                  cpu: "44"
                  memory: 170G
                requests:
                  cpu: "28"
                  memory: 130G
              securityContext:
                privileged: true

              volumeMounts:
              - name: workload-launcher
                mountPath: /workload/launcher
              - name: shared-tmp
                mountPath: /tmp
              - name: workload-configuration
                mountPath: /workload/configs
            initContainers:
            # Native Sidecar Pattern: restartPolicy Always prevents pod hangs
            - name: pathways-rm
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: HOST_ADDRESS
                value: "probe0915-pathways-head-0-0.probe0915"
              args:
              - --server_port=29051
              - --node_type=resource_manager
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-2x2x1/49d3bc12-b261-42a7-89b0-2b1aa0c46f5c
              - --instance_count=1
              - --instance_type=tpu7x:2x2x1
              resources:
                requests:
                  cpu: "2"
                  memory: 8G
                limits:
                  cpu: "4"
                  memory: 16G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            - name: pathways-proxy
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: PATHWAYS_HEAD
                value: "probe0915-pathways-head-0-0.probe0915"
              args:
              - --server_port=29050
              - --resource_manager_address=probe0915-pathways-head-0-0.probe0915:29051
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-2x2x1/49d3bc12-b261-42a7-89b0-2b1aa0c46f5c
              resources:
                requests:
                  cpu: "8"
                  memory: 32G
                limits:
                  cpu: "16"
                  memory: 64G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            volumes:
            - name: shared-tmp
              emptyDir: {}   # was hostPath /tmp — leaked pathways state across pods on reused nodes
            - name: workload-launcher
              configMap:
                name: "probe0915-launcher"
            - name: workload-configuration
              configMap:
                name: "probe0915-config"
                items:
                - key: workload-configuration
                  path: workload-config.yaml

# ----------------------------------------------------
# 2. Worker Replicated Job
# ----------------------------------------------------
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 32
        completionMode: Indexed
        template:
          metadata:
            annotations:
              alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
            labels:
              kueue.x-k8s.io/podset: worker
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            tolerations:
            - key: google.com/tpu
              operator: Exists
            nodeSelector:
              cloud.google.com/gke-tpu-topology: "2x2x1"
              cloud.google.com/gke-tpu-accelerator: tpu7x
            containers:
            - name: pathways-worker
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              env:
              - name: PATHWAYS_HEAD
                value: "probe0915-pathways-head-0-0.probe0915"
              - name: MEGASCALE_SLICE_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              - name: MEGASCALE_NUM_SLICES
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-replicas']
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              - name: MEGASCALE_COORDINATOR_ADDRESS
                value: "probe0915-pathways-head-0-0.probe0915"
              args:
              - --server_port=29055
              - --resource_manager_address=probe0915-pathways-head-0-0.probe0915:29051
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-2x2x1/49d3bc12-b261-42a7-89b0-2b1aa0c46f5c
              - --enable_metrics_collection=true
              - --xla_tpu_use_enhanced_launch_barrier=true
              ports:
              - containerPort: 29055
                protocol: TCP
              - containerPort: 29056
                protocol: TCP
              - containerPort: 8471
                protocol: TCP
              - containerPort: 8080
                protocol: TCP
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  google.com/tpu: "4"
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            initContainers:
            volumes:
            - name: shared-tmp
              emptyDir: {}   # was hostPath /tmp — leaked pathways state across pods on reused nodes
