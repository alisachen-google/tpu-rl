<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Gemma4-E2B TP2 DP32 versus TP4 roofline</title>
  <desc id="desc">A log-log TPU v7x roofline. The measured TP2 DP32 point is at arithmetic intensity 55.23 FLOP per byte and 12.46 TFLOP per second. The TP4 proxy, measured at DP16 because TP4 DP32 has not run, is at 39.84 FLOP per byte and 12.76 TFLOP per second. Both lie far below the HBM roof.</desc>
  <rect width="1120" height="700" fill="#ffffff"/>
  <text x="72" y="42" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">Gemma4-E2B decode roofline — TPU v7x</text>
  <text x="72" y="68" font-family="sans-serif" font-size="14" fill="#475569">TP2×DP32 measured (g4r11); TP4 point is a TP4×DP16 device proxy (g4r4). TP4×DP32/g4r12 has not run.</text>

  <rect x="90" y="90" width="630" height="500" fill="#f8fafc" stroke="#cbd5e1"/>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="90" y1="90" x2="90" y2="590"/>
    <line x1="300" y1="90" x2="300" y2="590"/>
    <line x1="510" y1="90" x2="510" y2="590"/>
    <line x1="720" y1="90" x2="720" y2="590"/>
    <line x1="90" y1="580" x2="720" y2="580"/>
    <line x1="90" y1="464" x2="720" y2="464"/>
    <line x1="90" y1="348" x2="720" y2="348"/>
    <line x1="90" y1="231" x2="720" y2="231"/>
    <line x1="90" y1="115" x2="720" y2="115"/>
  </g>

  <g font-family="sans-serif" font-size="12" fill="#334155">
    <text x="90" y="610" text-anchor="middle">1</text>
    <text x="300" y="610" text-anchor="middle">10</text>
    <text x="510" y="610" text-anchor="middle">100</text>
    <text x="720" y="610" text-anchor="middle">1,000</text>
    <text x="78" y="584" text-anchor="end">0.1</text>
    <text x="78" y="468" text-anchor="end">1</text>
    <text x="78" y="352" text-anchor="end">10</text>
    <text x="78" y="235" text-anchor="end">100</text>
    <text x="78" y="119" text-anchor="end">1,000</text>
  </g>

  <path d="M 90 398 L 604 113 L 720 113" fill="none" stroke="#111827" stroke-width="3"/>
  <line x1="604" y1="90" x2="604" y2="590" stroke="#111827" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.55"/>
  <text x="611" y="105" font-family="sans-serif" font-size="12" fill="#111827">ridge = 279.1 FLOP/B</text>
  <text x="145" y="350" font-family="sans-serif" font-size="12" fill="#111827" transform="rotate(-29 145 350)">HBM roof = 3.686 TB/s</text>
  <text x="710" y="104" text-anchor="end" font-family="sans-serif" font-size="12" fill="#111827">compute roof = 1,028.75 TFLOP/s</text>

  <line x1="456" y1="336" x2="456" y2="195" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>
  <circle cx="456" cy="195" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="456" cy="336" r="10" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
  <text x="468" y="328" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">TP2×DP32 measured</text>
  <text x="468" y="346" font-family="sans-serif" font-size="12" fill="#1e40af">AI 55.23 · 12.46 TF/s · 6.12% of HBM roof</text>
  <text x="468" y="188" font-family="sans-serif" font-size="11" fill="#1e40af">modeled roof 203.59 TF/s</text>

  <line x1="426" y1="335" x2="426" y2="212" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 5" opacity="0.7"/>
  <rect x="418" y="327" width="16" height="16" fill="#ea580c" stroke="#7c2d12" stroke-width="2" transform="rotate(45 426 335)"/>
  <circle cx="426" cy="212" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="250" y="365" font-family="sans-serif" font-size="13" font-weight="700" fill="#9a3412">TP4 device proxy</text>
  <text x="250" y="383" font-family="sans-serif" font-size="12" fill="#9a3412">AI 39.84 · 12.76 TF/s · 8.68% of HBM roof</text>
  <text x="280" y="205" font-family="sans-serif" font-size="11" fill="#9a3412">modeled roof 146.87 TF/s</text>

  <text x="405" y="655" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#0f172a">HBM arithmetic intensity (FLOP/byte, log scale)</text>
  <text x="24" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#0f172a" transform="rotate(-90 24 340)">Achieved compute (TFLOP/s, log scale)</text>

  <rect x="755" y="90" width="325" height="500" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="780" y="126" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a">What the plot says</text>
  <text x="780" y="160" font-family="sans-serif" font-size="13" fill="#334155">Both points are on the HBM side,</text>
  <text x="780" y="180" font-family="sans-serif" font-size="13" fill="#334155">but neither saturates HBM or MXU.</text>
  <text x="780" y="216" font-family="sans-serif" font-size="13" fill="#334155">TP2 device program: 22.89 ms/core</text>
  <text x="780" y="238" font-family="sans-serif" font-size="13" fill="#334155">TP4 proxy program: 22.28 ms/core</text>
  <text x="780" y="274" font-family="sans-serif" font-size="13" fill="#334155">Host windows: 924 ms and 1,012 ms.</text>
  <text x="780" y="296" font-family="sans-serif" font-size="13" fill="#334155">Device coverage is only 2.48% / 2.20%.</text>
  <text x="780" y="332" font-family="sans-serif" font-size="13" fill="#334155">About 51–53% of device time is in</text>
  <text x="780" y="352" font-family="sans-serif" font-size="13" fill="#334155">counter-opaque custom calls; about</text>
  <text x="780" y="372" font-family="sans-serif" font-size="13" fill="#334155">24% is all-reduce latency.</text>
  <text x="780" y="416" font-family="sans-serif" font-size="14" font-weight="700" fill="#b45309">Important limitation</text>
  <text x="780" y="442" font-family="sans-serif" font-size="13" fill="#334155">The orange point is not TP4×DP32.</text>
  <text x="780" y="462" font-family="sans-serif" font-size="13" fill="#334155">It is the only available Gemma4 TP4</text>
  <text x="780" y="482" font-family="sans-serif" font-size="13" fill="#334155">device capture and ran DP16.</text>
  <text x="780" y="522" font-family="sans-serif" font-size="13" font-weight="700" fill="#166534">g4r12 must run before making a</text>
  <text x="780" y="542" font-family="sans-serif" font-size="13" font-weight="700" fill="#166534">measured TP4×DP32 claim.</text>
</svg>
