{{- if .Values.patches.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-patches"
  namespace: {{ .Values.namespace | default "default" }}
data:
{{- range $path, $_ := .Files.Glob "patches/*" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
