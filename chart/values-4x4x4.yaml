# Overlay for the real 4x4x4 run (64 chips / 128 core-devices).
# Usage: helm install <run> recipe-tpu7x/ -f recipe-tpu7x/values.yaml -f recipe-tpu7x/values-4x4x4.yaml ...
# Requires the admin-provisioned multi-host tpu7x pool (RUNBOOK Fix #13 — NAP only
# auto-provisions single-host 2x2x1).
workload:
  tpus: 64
  instanceType: tpu7x:4x4x4
  gcsLocation: gs://ubench-logs/alisachen-tpu7x/pathways-4x4x4
