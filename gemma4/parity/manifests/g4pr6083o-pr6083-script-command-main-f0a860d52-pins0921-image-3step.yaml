apiVersion: v1
data:
  gemma_data.py: "\"\"\"gemma4 line: custom process_data v2 (dataset_processor_path hook). EMPIRICAL findings driving this design:\n(1) the checkpoint outputs garbage under the canonical gemma-4 <|turn> markers (ids 105/106 are effectively untrained for it),\n(2) it answers math correctly under gemma-3-STYLE textual markers (<start_of_turn>... \u2014 7 BPE pieces each, NOT special tokens\nin this tokenizer; teammate's 39/39-verified smoke used exactly that), so this builder renders the gemma-3-style prompt\nMANUALLY (single wrap, no apply_chat_template; no literal <bos> \u2014 tunix's tokenize() lets the tokenizer add bos).\nConsequence: there is no single-token turn terminator; sequences stop only at <eos> (id 1) or the cap \u2014 truncation is part of\nthe gemma contract (cap chosen from the measured OSL distribution).\"\"\"\nimport json\n\nSYSTEM_PROMPT = (\"You are given a problem. Think about the problem and provide your reasoning. Place it between \"\n                 \"<reasoning> and </reasoning>. Then, provide the final answer (i.e., just one numerical value) \"\n                 \"between <answer> and </answer>.\")\n_PRINTED = [False]\n\ndef _s(v):\n    return v.decode(\"utf-8\") if isinstance(v, bytes) else str(v)\n\ndef process_data(dataset_name, model_tokenizer, template_config, tmvp_config, x):\n    from maxtext.trainers.post_train.rl import utils_rl\n    for key in (\"problem\", \"prompt\", \"question\"):\n        if key in x:\n            question = _s(x[key]); break\n    for key in (\"answer\", \"solution\", \"expected_answer\"):\n        if key in x:\n            answer = _s(x[key]); break\n    qt = _s(x[\"question_type\"]) if \"question_type\" in x else \"default\"\n    processed_answer = utils_rl.process_answer(question, answer, qt)\n    prompt = f\"<start_of_turn>user\\n{SYSTEM_PROMPT}\\n\\n{question}<end_of_turn>\\n<start_of_turn>model\\n\"\n    if not _PRINTED[0]:\n        print(\"GEMMA-PROMPT %r\" % prompt[:300], flush=True)\n        _PRINTED[0] = True\n    return {\"prompts\": prompt, \"question\": question, \"answer\": json.dumps(processed_answer)}"
  patch_newimg_fix.py: "\"\"\"KV-SCATTER-PR: apply the MaxText PR change (scatter_layer_kv_caches skips unchanged alias entries) for validation.\"\"\"\nimport sys\nP=\"/deps/src/maxtext/integration/vllm/hybrid_cache_utils.py\"\nOLD='  updated = list(kv_caches)\\n  for lyr, idx in enumerate(physical_indices):\\n    updated[idx] = layer_kv_caches[lyr]\\n  return updated'\nNEW=\"  updated = list(kv_caches)\\n  for lyr, idx in enumerate(physical_indices):\\n    if layer_kv_caches[lyr] is kv_caches[idx]:\\n      # Unchanged view of the physical cache: nothing to write back, and doing\\n      # so could clobber another (donor) layer's update of the same cache.\\n      continue\\n    updated[idx] = layer_kv_caches[lyr]\\n  return updated\"\ns=open(P).read()\nif \"Unchanged view of the physical cache\" in s:\n    print(\"KV-SCATTER-PR: already applied\"); sys.exit(0)\nif s.count(OLD)!=1:\n    print(\"KV-SCATTER-PR: FAILED anchor count\", s.count(OLD)); sys.exit(1)\ns=s.replace(OLD,NEW); compile(s,P,\"exec\"); open(P,\"w\").write(s); print(\"KV-SCATTER-PR: APPLIED\")\n"
kind: ConfigMap
metadata:
  name: g4pr6083o-patches
  namespace: ubench-regression-tests
---
apiVersion: v1
data:
  launch-workload.sh: "\n#!/bin/bash\nset -e\n\n_sigterm() {\n  echo \"Caught SIGTERM signal, sending to child process...\"\n  kill -SIGTERM \"$PID\" 2>/dev/null\n}\ntrap _sigterm SIGTERM\n\nMAXTEXT_CONFIG_PATH=\"maxtext/configs/post_train/rl.yml\"\n\n# Fallback check to support different image structures\nif [ ! -f \"${MAXTEXT_CONFIG_PATH}\" ] && [ -f \"src/${MAXTEXT_CONFIG_PATH}\" ]; then\n  echo \"MAXTEXT_CONFIG_PATH not found at ${MAXTEXT_CONFIG_PATH}, falling back to src/${MAXTEXT_CONFIG_PATH}\"\n  MAXTEXT_CONFIG_PATH=\"src/${MAXTEXT_CONFIG_PATH}\"\nfi\n\n# --- pathwaysutils profiling hotfix (upstream scripts/patch_vllm_sampler.py) ---\n# Non-fatal: if the target strings are absent the patch is a no-op.\nif [ -f /workload/patches/patch_vllm_sampler.py ]; then\n  echo \"Applying pathwaysutils profiling hotfix...\"\n  : # patch_vllm_sampler removed (no-op on the latest image)\nfi\n\n# --- PROPER continue-decode fix (mirrors PR #3374) ---\n# Adds step_fn_no_options on the flax_nnx path AND makes decode_loop source its\n# compiler options from get_step_fn_compiler_options() instead of a 3-entry literal.\n# Self-verifying: prints CD-PROPER PATCH: APPLIED or ... FAILED <reason>.\nif [ -f /workload/patches/patch_cd_proper.py ]; then\n  : # patch_cd_proper removed (no-op on the latest image)\nfi\n\n# --- ISL/OSL/truncation instrumentation ---\n# max_prefill_predict_length drops 16384 -> 8192 in this run, so prompt truncation\n# stops being a curiosity and becomes a CORRECTNESS dependency: if any prompt\n# exceeds 8192 we silently change the RL problem and the comparison against Magellan's\n# 299 s is void. This dumps the per-step ISL/OSL distribution + truncation counts.\n# Fail-open and free (all inputs are already host-side numpy; no device sync).\n# Prints LENDIST PATCH: APPLIED or ... FAILED <reason>.\npip list 2>/dev/null | grep -iE '^(vllm|tpu.inference|google.tunix|jax|jaxlib|libtpu) ' | sed 's/^/MAINIMG-CHECK /' || true\nif [ -f /workload/patches/patch_lendist.py ]; then\n  : # patch_lendist removed (no-op on the latest image)\nfi\n\n# --- RPA v3 block-size forwarding (THE POINT OF RUN 06) ---\n# PR #3102's env override is wired into layers/jax/attention/attention.py only;\n# MaxText's forward_serve_vllm enters through layers/common/attention_interface.py,\n# which never forwards it -- so RPA_V3_DECODE_BLOCK_SIZES has been INERT in every\n# run to date, including the 274.9 s one. Proven from run 05's decode_only trace:\n# the only kernel executed was RPAd-p_64-bq_1_1-bkv_16384_16384 (the default),\n# 138.4 ms = 74.7% of leaf decode time, despite the env var being set.\n# Self-verifying: prints RPA-BLOCKS PATCH: APPLIED or ... FAILED <reason>.\nif [ -f /workload/patches/patch_rpa_blocks.py ]; then\n  : # patch_rpa_blocks removed (no-op on the latest image)\nfi\n\n# --- CONTINUOUS-BATCHING DECODE WINDOW: the two halves must BOTH apply ---\n# (1) stop cond_fn ending the window on any EOS; (2) make the host read each\n# sequence's last NON-PADDING row. Run 10 applied only (1) and was VOID --\n# reward 0.146 -> 0.053 -- because the host read the window's last row, saw\n# padding for every sequence that finished mid-window, never retired it, and\n# re-seeded it from a padding token. Termination became a lottery.\n# If CD-REPORT reports FAILED while CD-MASK reports APPLIED, KILL THE RUN.\nif [ -f /workload/patches/patch_cd_masking.py ]; then\n  : # patch_cd_masking removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_cd_report.py ]; then\n  : # patch_cd_report removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_phasetime.py ]; then\n  : # patch_phasetime removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_reward_parallel.py ]; then\n  : # patch_reward_parallel removed (no-op on the latest image)\n  : # patch_length_shape removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_sharded_sampling.py ]; then\n  : # patch_sharded_sampling removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_profiler_fix.py ]; then\n  : # patch_profiler_fix removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_gc_sync.py ]; then\n  : # patch_gc_sync removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_packing_knob.py ]; then\n  : # patch_packing_knob removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_packer_fast.py ]; then\n  : # patch_packer_fast removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_block_size.py ]; then\n  : # patch_block_size removed (no-op on the latest image)\n  : # patch_approx_topk removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_async_detok.py ]; then\n  : # patch_async_detok removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_async_logprobs.py ]; then\n  : # patch_async_logprobs removed (no-op on the latest image)\nfi\n# patch_gemma4_prs SKIPPED for now: its diff adds a `packing:` key to the gemma4 model ymls that the image RLConfig (extra=forbid) rejects; PR-parity pending\nif [ -f /workload/patches/patch_dp_rr_routing.py ]; then\n  : # patch_dp_rr_routing removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_stop_tokens.py ]; then\n  : # patch_stop_tokens removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_runner_eos.py ]; then\n  : # patch_runner_eos removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_fast_extract.py ]; then\n  : # patch_fast_extract removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_g4_format_guard.py ]; then\n  : # patch_g4_format_guard removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_async_reward.py ]; then\n  : # patch_async_reward removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_flash_sa.py ]; then\n  : # patch_flash_sa removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_jit_unroll.py ]; then\n  : # patch_jit_unroll removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_sync_keepkv.py ]; then\n  : # patch_sync_keepkv removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_host_extract.py ]; then\n  : # patch_host_extract removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_cd_noglobal.py ]; then\n  : # patch_cd_noglobal removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_padding_bucket.py ]; then\n  : # patch_padding_bucket removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_log_stats.py ]; then\n  : # patch_log_stats removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_textual_stop.py ]; then\n  : # patch_textual_stop removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_verify_timeout.py ]; then\n  : # patch_verify_timeout removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_reward_dump.py ]; then\n  : # patch_reward_dump removed (no-op on the latest image)\nfi\n\n\n# --- ROLLOUT PROFILING (the whole point of this run) ---\n# profiler=xplane captures ONLY the trainer mesh -- verified by grepping a 111 MB\n# xplane from the 2026-08-13 run: jit__train_step x31, jit_compute_per_token_logps\n# x16, and ZERO step_fn / ragged_paged_attention / continue_decode / jit__generate.\n# So rollout (~70% of the step, 100% of its variance) has never been profiled.\n# PHASED_PROFILING_DIR is tpu_inference's own profiler (envs.py:23,\n# tpu_runner._init_phased_profiling) and DOES capture the decode path.\n#\n# THE PATH MUST BE gs://, NOT LOCAL. Attempt 1 of this run used /tmp and crashed on\n# the FIRST rollout, 14 times:\n#   tpu_runner._prepare_inputs:2816 -> phase_based_profiler.step()\n#     -> utils.py:699 _start_profiling -> jax.profiler.start_trace\n#       -> pathwaysutils/profiling.py:269\n#          ValueError: log_dir must be a GCS bucket path, got /tmp/phased_profile/...\n# Under Pathways the trace writer requires GCS. (The accompanying\n# \"AttributeError: 'Qwen3ForCausalLM' object has no attribute 'modules'\" is an\n# atexit/weakref cleanup firing during the shutdown that follows -- a symptom, not\n# a second bug.)\n#\n# _start_profiling ALSO does os.makedirs() on this path and _resolve_canonical_dst_ts\n# opens a marker file under it with a plain open(). With a gs:// value those create a\n# junk LOCAL tree ./gs:/... and succeed (POSIX collapses the double slash), while\n# start_trace gets the GCS path it needs. Side effect: the small\n# batch_composition_stats files land in that junk local tree and are lost. The traces\n# -- the actual objective -- go straight to GCS, so no syncer is needed.\n# padding fix now in-tree via patch_padding_bucket.py (PR #3466); gap env no longer needed\nexport DP_SCHED_ROUTING=round_robin   # FIX: the real knob. Default is least_loaded, which\n                                      # probes all 128 ranks x4 per request (2048 reqs) for zero\n                                      # benefit here (equal ~150-tok prompts, prefix-caching off).\nexport DP_SCHED_ROUTING=round_robin               # ROUND 4: score during rollout; every 8th item cross-checked\nexport PHASED_PROFILING_DIR=\"\"\n# ROOT CAUSE of prior empty captures: the phased profiler needs\n# NUM_STEPS_TO_PROFILE_FOR (default 15) execute_model calls of one phase\n# before stop_trace() writes the xplane. With continue-decode max_decode_steps=512\n# each execute advances ~512 tokens but counts as ONE profiler step, so at OSL~1420\n# the decode phase drains (EOS) after ~3 calls, never reaching 15 -> no flush.\n# Set to 2 so the window closes (and writes) after ~2 execute calls (~1024 decode\n# steps captured), guaranteeing a flush inside a single rollout step.\nexport PHASED_PROFILER_NUM_STEPS_TO_PROFILE_FOR=2\necho \"PHASED_PROFILING_DIR=$PHASED_PROFILING_DIR NUM_STEPS=$PHASED_PROFILER_NUM_STEPS_TO_PROFILE_FOR\"\n\n# --- Magellan's two decode-kernel env levers (rungs 3 and 4 of their ladder) ---\n# NOTE: their launch.sh exports GRR_RPA_DECODE_BLOCKS / GRR_CD_EOS_CHECK_INTERVAL.\n# Those names exist in NO version of tpu-inference (checked all 346 open PRs, the\n# fork at their PR head, and both images) -- an internal prefix that leaked into\n# the published script. These are the names the code actually reads:\n#   RPA_V3_DECODE_BLOCK_SIZES        -- PR #3102, bq_sz,bkv_sz,bq_csz,bkv_csz\n#   CONTINUE_DECODE_EOS_CHECK_INTERVAL -- PR #3174, default 1\n# WARNING on the second one: at OUR old config (batch 480, max_decode_steps=10)\n# interval 8 measured 719 -> ~2157 s. Their claim is 327 -> 299 s. The regimes\n# differ (compute-bound vs dispatch-bound), so it is included here for a faithful\n# reproduction -- but if this run lands far above 299 s, THIS IS SUSPECT #1 and the\n# follow-up is to drop it and target their 327 s rung instead.\n# RPA tile envs unset for gemma4 (head_dim differs from qwen; kernel defaults)\nexport CONTINUE_DECODE_EOS_CHECK_INTERVAL=\"0\"\n\n# --- RL Sampler Patches & Env Setup ---\nexport HF_TOKEN=''\nexport HF_HUB_ENABLE_HF_TRANSFER=0\nexport HF_HUB_DISABLE_XET=1\nexport NUM_PRECOMPILE_WORKERS=1\nexport NEW_MODEL_DESIGN=1\nexport TPU_MIN_LOG_LEVEL=0\nexport TF_CPP_MIN_LOG_LEVEL=0\nexport TPU_STDERR_LOG_LEVEL=0\nexport JAX_BACKEND_TARGET=grpc://127.0.0.1:29140\n\n# Multimodal-default shims carried over from the ubench recipe (harmless if unused)\ncat << 'EOF' >> /deps/src/maxtext/configs/types.py\n\n# --- Auto-patch RLConfig with Multimodal defaults ---\nif 'RLConfig' in globals():\n  if not hasattr(RLConfig, 'use_mrope'):\n    RLConfig.use_mrope = False\n  if not hasattr(RLConfig, 'mrope_section'):\n    RLConfig.mrope_section = [24, 20, 20]\n  if not hasattr(RLConfig, 'position_id_per_seconds'):\n    RLConfig.position_id_per_seconds = 25\nEOF\n: # qwen3 mrope sed removed (not used by gemma4)\n\n# --- Main Execution ---\n(\n  export ENABLE_PATHWAYS_PERSISTENCE='1'\n  export JAX_PLATFORMS=\"${JAX_PLATFORMS:-proxy,cpu}\"\n  export ENABLE_PJRT_COMPATIBILITY='true'\n  # NOTE: XLA flags are NOT set here. Under JAX_PLATFORMS=proxy the client owns\n  # no TPU, so LIBTPU_INIT_ARGS would be inert. They are passed as argv to the\n  # pathways-proxy container instead (upstream: --custom-pathways-proxy-server-args).\n\n  # continue-decode is ENABLED with max_decode_steps=128 (Magellan's value; every prior\n  # CD run of ours silently used DEFAULT_MAX_DECODE_STEPS = 10). This depends on\n  # patch_cd_proper.py (PR #3374) having applied -- without it the fused loop raises\n  # \"compiler_options can only be passed to top-level jax.jit\" on this image.\n  # PR 6083 run_gemma4_e2b_rl.sh MAXTEXT_COMMAND, verbatim (only the proxy port is cluster-specific: 29000 -> 29140)\n  VLLM_ENABLE_V1_MULTIPROCESSING=0 NEW_MODEL_DESIGN=1 TF_CPP_MIN_LOG_LEVEL=0 ENABLE_PJRT_COMPATIBILITY=true ENABLE_PATHWAYS_PERSISTENCE=1 TPU_BACKEND_TYPE=jax VLLM_LOGGING_LEVEL=WARNING JAX_PLATFORMS=proxy,cpu JAX_BACKEND_TARGET=grpc://127.0.0.1:29140 NUM_SLICES=1 VLLM_ENGINE_READY_TIMEOUT_S=7200 TOKENIZERS_PARALLELISM=False CONTINUE_DECODE_EOS_CHECK_INTERVAL=0 DP_SCHED_ROUTING=round_robin python3 -m maxtext.trainers.post_train.rl.train_rl model_name=gemma4-e2b tokenizer_type=huggingface tokenizer_path=google/gemma-4-E2B-it hf_access_token= run_name=g4pr6083o base_output_directory=gs://ubench-logs load_parameters_path=gs://ubench-logs/alisachen-tpu7x/ckpt/gemma4-e2b-it-fresh/0/items chips_per_vm=8 async_scheduling=False data_template_path=maxtext/examples/chat_templates/openmathinstruct2_rl.json hf_name=default dataset_name=nvidia/OpenMathInstruct-2 hf_train_files=hf://datasets/nvidia/OpenMathInstruct-2/data/train_1M-*.parquet train_split=train_1M num_batches=3 num_test_batches=0 batch_size=256 train_micro_batch_size=8 rollout_micro_batch_size=256 rl.num_generations=8 rl.grpo_beta=0.0 rl.grpo_epsilon=0.2 rl.epsilon_high=0.28 learning_rate=1e-6 gradient_clipping_threshold=1.0 decode_sampling_temperature=0.8 decode_sampling_top_k=50 decode_sampling_nucleus_p=0.95 max_prefill_predict_length=4096 max_target_length=12288 kv_cache_buffer=12288 max_seq_token_per_tpu=12288 attention=flash local_sa_block_q=512 local_sa_block_kv=512 local_sa_block_kv_compute=512 local_sa_block_q_dkv=512 local_sa_block_kv_dkv=512 local_sa_block_kv_dkv_compute=512 local_sa_block_q_dq=512 local_sa_block_kv_dq=512 eval_local_sa_block_q=512 eval_local_sa_block_kv=512 eval_local_sa_block_kv_compute=512 local_sa_q_layout=HEAD_DIM_MINOR local_sa_k_layout=HEAD_DIM_MINOR local_sa_v_layout=HEAD_DIM_MINOR eval_local_sa_q_layout=HEAD_DIM_MINOR eval_local_sa_k_layout=HEAD_DIM_MINOR eval_local_sa_v_layout=HEAD_DIM_MINOR local_sa_use_fused_bwd_kernel=false local_sa_fuse_reciprocal=true local_sa_use_base2_exp=true scan_layers=False allow_split_physical_axes=True trainer_devices_fraction=1.0 sampler_devices_fraction=1.0 rollout_data_parallelism=128 rollout_tensor_parallelism=1 enable_dp_attention=False hbm_utilization_vllm=0.3 max_num_seqs=256 max_num_batched_tokens=33280 vllm_block_size=128 free_kv_cache_during_weight_sync=False math_verify_num_procs=64 enable_tunix_perf_metrics=True enable_checkpointing=True checkpoint_period=100 vllm_hf_overrides='{architectures: [\"MaxTextForCausalLM\"]}' vllm_additional_config='{\"enable_continue_decode\": true, \"max_decode_steps\": 1024, \"maxtext_config\": {\"model_name\": \"gemma4-e2b\", \"model_call_mode\": \"inference\", \"log_config\": false, \"weight_dtype\": \"bfloat16\", \"allow_split_physical_axes\": true}}'\n) & PID=$!\n\nwait $PID\nEXIT_CODE=$?\n\necho \"MaxText Job Ended at: $(date) with exit code $EXIT_CODE\"\nexit $EXIT_CODE"
  patch_newimg_fix.py: "\"\"\"KV-SCATTER-PR: apply the MaxText PR change (scatter_layer_kv_caches skips unchanged alias entries) for validation.\"\"\"\nimport sys\nP=\"/deps/src/maxtext/integration/vllm/hybrid_cache_utils.py\"\nOLD='  updated = list(kv_caches)\\n  for lyr, idx in enumerate(physical_indices):\\n    updated[idx] = layer_kv_caches[lyr]\\n  return updated'\nNEW=\"  updated = list(kv_caches)\\n  for lyr, idx in enumerate(physical_indices):\\n    if layer_kv_caches[lyr] is kv_caches[idx]:\\n      # Unchanged view of the physical cache: nothing to write back, and doing\\n      # so could clobber another (donor) layer's update of the same cache.\\n      continue\\n    updated[idx] = layer_kv_caches[lyr]\\n  return updated\"\ns=open(P).read()\nif \"Unchanged view of the physical cache\" in s:\n    print(\"KV-SCATTER-PR: already applied\"); sys.exit(0)\nif s.count(OLD)!=1:\n    print(\"KV-SCATTER-PR: FAILED anchor count\", s.count(OLD)); sys.exit(1)\ns=s.replace(OLD,NEW); compile(s,P,\"exec\"); open(P,\"w\").write(s); print(\"KV-SCATTER-PR: APPLIED\")\n"
kind: ConfigMap
metadata:
  name: g4pr6083o-launcher
  namespace: ubench-regression-tests
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: g4pr6083o
  namespace: ubench-regression-tests
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  failurePolicy:
    maxRestarts: 3
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - pathways-head
  replicatedJobs:
  - name: pathways-head
    replicas: 1
    template:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: multislice-queue
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              kueue.x-k8s.io/podset: pathways-head
              kueue.x-k8s.io/queue-name: multislice-queue
            annotations:
              kubectl.kubernetes.io/default-container: jax-tpu
              gke-gcsfuse/volumes: 'true'
          spec:
            restartPolicy: OnFailure
            priorityClassName: medium
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-nodepool: cpu-np
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/replicatedjob-name
                        operator: In
                        values:
                        - pathways-head
            containers:
            - name: jax-tpu
              image: gcr.io/supercomputer-testing/maxtext-rl-ironwood@sha256:cbb7dd8dabe5cdaa524c5970948a272ced3ccb213757ea1000f5352dd0220740
              command:
              - bash
              - -c
              - "echo Pathways Helm Start: $(date);\n_sigterm() (kill -SIGTERM $! 2>/dev/null;);\ntrap _sigterm SIGTERM;\necho \"Executing payload from /workload/launcher/launch-workload.sh...\"\n( bash /workload/launcher/launch-workload.sh ) & PID=$!;\nwhile kill -0 $PID 2>/dev/null;\n    do sleep 5;\ndone;\nwait $PID;\nEXIT_CODE=$?;\necho Pathways Helm End: $(date);\necho EXIT_CODE=$EXIT_CODE;\nexit $EXIT_CODE\n"
              env:
              - name: JAX_PLATFORMS
                value: proxy,cpu
              - name: PATHWAYS_HEAD
                value: g4pr6083o-pathways-head-0-0.g4pr6083o
              - name: JAX_BACKEND_TARGET
                value: grpc://g4pr6083o-pathways-head-0-0.g4pr6083o:29140
              - name: JOB_IDENTIFIER
                value: g4pr6083o
              - name: ARTIFACT_DIR
                value: gs://ubench-logs
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://ubench-logs/compilation_cache/qwen3-0.6b/rl_repro_jax_tpu7x_20260730
              - name: SKIP_JAX_PRECOMPILE
                value: '1'
              resources:
                requests:
                  cpu: '28'
                  memory: 130G
                limits:
                  cpu: '44'
                  memory: 170G
              securityContext:
