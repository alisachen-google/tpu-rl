unds are checkpoint-resident, immutable state and must\n+  # NEVER receive optimizer updates, weight decay, or momentum/variance slots. Freeze them via a leaf-PATH\n+  # mask (robust to the nnx->linen bridge's type erasure). This composes with any trainable_parameters_mask:\n+  # a parameter is \"trainable\" only if it is trainable under the whitelist AND is not a clip bound.\n+  freeze_clip_bounds = bool(getattr(config, \"use_clipped_linears_for_vit\", False))\n+\n+  if freeze_mask_fn is not None or freeze_clip_bounds:\n+    def _partition(params):\n+      # trainable_mask: True where trainable under the whitelist (all-True if no whitelist).\n+      if freeze_mask_fn is not None:\n+        trainable_mask = freeze_mask_fn(params)\n+      else:\n+        trainable_mask = jax.tree_util.tree_map(lambda _: True, params)\n+      if freeze_clip_bounds:\n+        # clip_optimizer_freeze_mask returns True for trainable leaves, False for clip bounds.\n+        from maxtext.models import gemma4_vision  # pylint: disable=import-outside-toplevel\n+        clip_trainable = gemma4_vision.clip_optimizer_freeze_mask(params)\n+        trainable_mask = jax.tree_util.tree_map(lambda a, b: bool(a) and bool(b), trainable_mask, clip_trainable)\n+      return jax.tree_util.tree_map(lambda x: \"trainable\" if x else \"frozen\", trainable_mask)\n+\n+    # Use optax.multi_transform so frozen (and clip-bound) params map to a stateless set_to_zero() optimizer\n+    # and never allocate momentum/variance slots.\n     return optax.multi_transform(\n         {\"trainable\": base_opt, \"frozen\": optax.set_to_zero()},\n-        lambda params: jax.tree_util.tree_map(lambda x: \"frozen\" if x else \"trainable\", freeze_mask_fn(params)),\n+        _partition,\n     )\n\n   return base_opt\ndiff --git a/src/maxtext/trainers/pre_train/train.py b/src/maxtext/trainers/pre_train/train.py\nindex 138bfe1..0ab638c 100644\n--- a/src/maxtext/trainers/pre_train/train.py\n+++ b/src/maxtext/trainers/pre_train/train.py\n@@ -143,6 +143,14 @@ def loss_fn(model, config, data, dropout_rng, params, sparsity_state=None, is_tr\n         decoder_segment_ids=data[\"inputs_segmentation\"],\n         encoder_images=data[\"images\"] if config.use_multimodal else None,\n         encoder_image_masks=data[\"image_masks\"] if config.use_multimodal and \"image_masks\" in data else None,\n+        # Gemma-4 padded-patch (Option-S) contract: when the data pipeline produces per-patch image\n+        # position ids (native-resolution / pan-and-scan processors), thread them to the vision encoder\n+        # so pad patches are masked and pooled by real coordinates. The stock fixed-grid Gemma-4 processor\n+        # produces all-valid patches and does NOT emit this key, so the legacy all-valid path is used\n+        # (correct for its contract). See gemma4_vision.Gemma4VisionEncoderLayer for the fail-closed guard.\n+        encoder_image_position_ids=(\n+            data[\"image_position_ids\"] if config.use_multimodal and \"image_position_ids\" in data else None\n+        ),\n         enable_dropout=config.enable_dropout if is_train else False,\n         rngs={\"dropout\": rng1, \"params\": aqt_rng},  # pyrefly: ignore[bad-argument-type]\n         mutable=mutable_collections,\n@@ -192,6 +200,11 @@ def loss_fn(model, config, data, dropout_rng, params, sparsity_state=None, is_tr\n         decoder_segment_ids=data[\"inputs_segmentation\"],\n         encoder_images=data[\"images\"] if config.use_multimodal else None,\n         encoder_image_masks=data[\"image_masks\"] if config.use_multimodal and \"image_masks\" in data else None,\n+        # See the Linen branch above: thread per-patch image position ids when the data pipeline emits\n+        # them (Gemma-4 Option-S padded-patch contract); None for the stock fixed-grid all-valid processor.\n+        encoder_image_position_ids=(\n+            data[\"image_position_ids\"] if config.use_multimodal and \"image_position_ids\" in data else None\n+        ),\n         enable_dropout=config.enable_dropout if is_train else False,\n         decoder_target_tokens=data[\"targets\"],\n         decoder_target_mask=data[\"targets_segmentation\"],\ndiff --git a/src/maxtext/utils/model_creation_utils.py b/src/maxtext/utils/model_creation_utils.py\nindex 2326bff..dc52fb1 100644\n--- a/src/maxtext/utils/model_creation_utils.py\n+++ b/src/maxtext/utils/model_creation_utils.py\n@@ -1210,6 +1210,14 @@ def from_pretrained(\n             \"Please ensure the checkpoint format matches the scan_layers setting.\"\n         )\n\n+    # Gemma-4 vision clipped-linears: fail-closed post-load validation BEFORE the first JIT forward/train.\n+    # Asserts exactly 112 clip-state modules / 448 finite, correctly-ordered scalar bounds. A missing/NaN/\n+    # unordered bound or wrong module count raises here rather than silently degrading to an identity clamp.\n+    if bool(getattr(config, \"use_clipped_linears_for_vit\", False)) and bool(getattr(config, \"use_multimodal\", False)):\n+      from maxtext.models import gemma4_vision  # pylint: disable=import-outside-toplevel\n+      n_proj, n_bounds = gemma4_vision.validate_all_vision_clip_bounds(model)\n+      max_logging.log(f\"Gemma-4 vision clip validation OK: {n_proj} clip-state modules, {n_bounds} scalar bounds.\")\n+\n     if wrap_with_tunix_adapter:\n       with mesh:\n         use_no_op_mappings = \"maxtext_config\" in config.vllm_additional_config"
  gemma_data.py: "\"\"\"gemma4 line: custom process_data v2 (dataset_processor_path hook). EMPIRICAL findings driving this design:\n(1) the checkpoint outputs garbage under the canonical gemma-4 <|turn> markers (ids 105/106 are effectively untrained for it),\n(2) it answers math correctly under gemma-3-STYLE textual markers (<start_of_turn>... \u2014 7 BPE pieces each, NOT special tokens\nin this tokenizer; teammate's 39/39-verified smoke used exactly that), so this builder renders the gemma-3-style prompt\nMANUALLY (single wrap, no apply_chat_template; no literal <bos> \u2014 tunix's tokenize() lets the tokenizer add bos).\nConsequence: there is no single-token turn terminator; sequences stop only at <eos> (id 1) or the cap \u2014 truncation is part of\nthe gemma contract (cap chosen from the measured OSL distribution).\"\"\"\nimport json\n\nSYSTEM_PROMPT = (\"You are given a problem. Think about the problem and provide your reasoning. Place it between \"\n                 \"<reasoning> and </reasoning>. Then, provide the final answer (i.e., just one numerical value) \"\n                 \"between <answer> and </answer>.\")\n_PRINTED = [False]\n\ndef _s(v):\n    return v.decode(\"utf-8\") if isinstance(v, bytes) else str(v)\n\ndef process_data(dataset_name, model_tokenizer, template_config, tmvp_config, x):\n    from maxtext.trainers.post_train.rl import utils_rl\n    for key in (\"problem\", \"prompt\", \"question\"):\n        if key in x:\n            question = _s(x[key]); break\n    for key in (\"answer\", \"solution\", \"expected_answer\"):\n        if key in x:\n            answer = _s(x[key]); break\n    qt = _s(x[\"question_type\"]) if \"question_type\" in x else \"default\"\n    processed_answer = utils_rl.process_answer(question, answer, qt)\n    prompt = f\"<start_of_turn>user\\n{SYSTEM_PROMPT}\\n\\n{question}<end_of_turn>\\n<start_of_turn>model\\n\"\n    if not _PRINTED[0]:\n        print(\"GEMMA-PROMPT %r\" % prompt[:300], flush=True)\n        _PRINTED[0] = True\n    return {\"prompts\": prompt, \"question\": question, \"answer\": json.dumps(processed_answer)}"
  patch_async_detok.py: "\"\"\"ROUND 3: overlap detokenization with the rollout tail. Wrap vllm LLMEngine.step: each finished RequestOutput\nis decoded in a thread pool while decode continues; tunix VllmSampler.detokenize uses the precomputed text\n(falls back to synchronous decode; prints ASYNC-DETOK hits/misses). Prints ASYNC-DETOK PATCH: APPLIED | FAILED.\"\"\"\nimport sys\nE = \"/usr/local/lib/python3.12/site-packages/vllm/v1/engine/llm_engine.py\"\nT = \"/usr/local/lib/python3.12/site-packages/tunix/generate/vllm_sampler.py\"\ne = open(E).read(); t = open(T).read()\nif \"_ASYNC_DETOK\" in e: print(\"ASYNC-DETOK PATCH: already applied\", flush=True); sys.exit(0)\na = (\"        decoded_outputs[idx].append(\\n\"\n     \"            self.tokenizer.decode(single_output.token_ids)\\n\"\n     \"        )\\n\")\nb = (\"        _ad_pre = _AD_LOOKUP(multi_sampling_output.request_id, idx)  # _ASYNC_DETOK\\n\"\n     \"        if _ad_pre is None:\\n\"\n     \"          decoded_outputs[idx].append(self.tokenizer.decode(single_output.token_ids))\\n\"\n     \"        else:\\n\"\n     \"          decoded_outputs[idx].append(_ad_pre)\\n\")\nif t.count(a) != 1: print(\"ASYNC-DETOK PATCH: FAILED tunix anchor %d\" % t.count(a), flush=True); sys.exit(0)\ne = e + \"\\n\\n# --- _ASYNC_DETOK: decode finished requests in the background --------------------\\nimport concurrent.futures as _ad_cf\\n_AD_POOL = _ad_cf.ThreadPoolExecutor(max_workers=4)\\n_AD_TEXT = {}\\n_ad_orig_step = LLMEngine.step\\ndef _ad_decode(tok, ids):\\n    if hasattr(tok, 'batch_decode'):\\n        return tok.batch_decode(ids)\\n    return [tok.decode(i) for i in ids]\\ndef _ad_step(self, *a, **k):\\n    outs = _ad_orig_step(self, *a, **k)\\n    tok = getattr(self, 'tokenizer', None)\\n    if tok is not None:\\n        for o in outs:\\n            if getattr(o, 'finished', False):\\n                ids = [list(c.token_ids) for c in o.outputs]\\n                _AD_TEXT[o.request_id] = _AD_POOL.submit(_ad_decode, tok, ids)\\n    return outs\\nLLMEngine.step = _ad_step\\n\"\nt = t.replace(a, b) + \"\\n\\n# --- _ASYNC_DETOK lookup ---------------------------------------------------------\\n_AD_STATS = {'hit': 0, 'miss': 0}\\ndef _AD_LOOKUP(request_id, idx):\\n    try:\\n        from vllm.v1.engine import llm_engine as _le\\n        fut = _le._AD_TEXT.get(request_id)\\n        if fut is None:\\n            _AD_STATS['miss'] += 1; return None\\n        texts = fut.result(); _AD_STATS['hit'] += 1\\n        if (_AD_STATS['hit'] + _AD_STATS['miss']) % 2048 == 0:\\n            print('ASYNC-DETOK hits=%d misses=%d' % (_AD_STATS['hit'], _AD_STATS['miss']), flush=True)\\n        return texts[idx]\\n    except Exception:\\n        _AD_STATS['miss'] += 1; return None\\n\"\ncompile(e, E, \"exec\"); compile(t, T, \"exec\"); open(E, \"w\").write(e); open(T, \"w\").write(t)\nprint(\"ASYNC-DETOK PATCH: APPLIED\", flush=True)"
  patch_async_logprobs.py: "\"\"\"ROUND 4: extract per-token logprobs in the background. tunix VllmSampler.detokenize runs\nget_logprobs_from_vllm_output per completion after generation: a pure-Python loop over ~9M (token, dict) pairs per\nstep (~3 s, sequential). This wraps LLMEngine.step (after patch_async_detok) to extract the logprobs of each FINISHED\nrequest in the shared thread pool while decode continues, with a faster list-comprehension (same values: the\nselected token's logprob; a missing token raises exactly like the original). detokenize reads the precomputed list;\nASYNC_LOGPROBS=verify8 (default) recomputes every 8th completion synchronously and compares. Banners:\nASYNC-LOGPROBS PATCH: APPLIED|FAILED; ASYNC-LOGPROBS hits= misses= checked= mismatch= per 2048 lookups.\"\"\"\nimport sys\nE = \"/usr/local/lib/python3.12/site-packages/vllm/v1/engine/llm_engine.py\"\nT = \"/usr/local/lib/python3.12/site-packages/tunix/generate/vllm_sampler.py\"\ne = open(E).read(); t = open(T).read()\nif \"_ASYNC_LOGPROBS\" in t: print(\"ASYNC-LOGPROBS PATCH: already applied\", flush=True); sys.exit(0)\na = (\"        logprobs = utils.get_logprobs_from_vllm_output(\\n\"\n     \"            list(single_output.token_ids), single_output.logprobs\\n\"\n     \"        )\\n\")\nb = (\"        logprobs = _AL_LOOKUP(multi_sampling_output.request_id, idx, single_output)  # _ASYNC_LOGPROBS\\n\")\nif t.count(a) != 1 or \"_AD_POOL\" not in e: print(\"ASYNC-LOGPROBS PATCH: FAILED anchor tunix=%d engine_pool=%s\" % (t.count(a), \"_AD_POOL\" in e), flush=True); sys.exit(0)\ne += r'''\n\n# --- _ASYNC_LOGPROBS -------------------------------------------------------------\n_AL = {}\ndef _al_extract_one(ids, lps):\n    if not lps or lps[0] is None:\n        return []\n    if len(lps) != len(ids):\n        raise AssertionError(\"log probs has %d number of items != %d token ids\" % (len(lps), len(ids)))\n    return [lp[t].logprob for t, lp in zip(ids, lps)]\ndef _al_extract(o):\n    return [_al_extract_one(list(c.token_ids), c.logprobs) for c in o.outputs]\n_al_orig_step = LLMEngine.step\ndef _al_step(self, *a, **k):\n    outs = _al_orig_step(self, *a, **k)\n    for o in outs:\n        if getattr(o, \"finished\", False):\n            _AL[o.request_id] = _AD_POOL.submit(_al_extract, o)\n    return outs\nLLMEngine.step = _al_step\n'''\nt = t.replace(a, b) + r'''\n\n# --- _ASYNC_LOGPROBS lookup ------------------------------------------------------\nimport os as _al_os\n_AL_MODE = _al_os.environ.get(\"ASYNC_LOGPROBS\", \"verify8\")\n_AL_STATS = {\"hit\": 0, \"miss\": 0, \"checked\": 0, \"mismatch\": 0}\ndef _AL_LOOKUP(request_id, idx, single_output):\n    res = None\n    try:\n        from vllm.v1.engine import llm_engine as _le\n        fut = _le._AL.get(request_id)\n        if fut is not None:\n            res = fut.result()[idx]\n    except Exception:\n        res = None\n    if res is None:\n        _AL_STATS[\"miss\"] += 1\n        res = utils.get_logprobs_from_vllm_output(list(single_output.token_ids), single_output.logprobs)\n    else:\n        _AL_STATS[\"hit\"] += 1\n        if _AL_MODE == \"verify8\" and (_AL_STATS[\"hit\"] % 8) == 0:\n            ref = utils.get_logprobs_from_vllm_output(list(single_output.token_ids), single_output.logprobs)\n            _AL_STATS[\"checked\"] += 1\n            if list(ref) != list(res):\n                _AL_STATS[\"mismatch\"] += 1\n                if _AL_STATS[\"mismatch\"] <= 3:\n                    print(\"ASYNC-LOGPROBS MISMATCH rid=%s idx=%d len %d vs %d\" % (request_id, idx, len(ref), len(res)), flush=True)\n                res = ref\n    if (_AL_STATS[\"hit\"] + _AL_STATS[\"miss\"]) % 2048 == 0:\n        print(\"ASYNC-LOGPROBS hits=%d misses=%d checked=%d mismatch=%d\" % (_AL_STATS[\"hit\"], _AL_STATS[\"miss\"], _AL_STATS[\"checked\"], _AL_STATS[\"mismatch\"]), flush=True)\n    return res\n'''\ncompile(e, E, \"exec\"); compile(t, T, \"exec\"); open(E, \"w\").write(e); open(T, \"w\").write(t)\nprint(\"ASYNC-LOGPROBS PATCH: APPLIED\", flush=True)"
  patch_async_reward.py: "\"\"\"ROUND 4 v4 (dedicated 8-proc niced spawn pool; v3 used the 64-proc math_verify pool and starved the DPScheduler rank processes: +2.4 s rollout): score completions DURING the rollout in the math_verify spawn workers (no GIL contention with the engine thread: v2 threads cost ~1.5 s of rollout). After run 112 the reward phase is ~2 s of sequential host work\n(check_numbers ~1.4 s: extract + normalize + math_verify pool 0.6 s; tunix wrapper ~0.6 s). Finished requests are\nalready handed to a thread pool by patch_async_detok; this patch also scores each finished request there (same\nextract_answer / exact-match / math_verify_pool logic as check_numbers, one item at a time) while decode continues.\nMapping request -> (answer, question): grpo_learner._generate_and_compute_advantage stashes training_input for the\nstep and resets an order list; LLMEngine.add_request appends request ids in call order (= prompt order over the\nmicro-batched generate calls). check_numbers then returns the precomputed scores. Safety: step 0 (no tmvp_config\nyet) and any step with missing indices fall back to the synchronous path; ASYNC_REWARD=verify8 (default) recomputes\nevery 8th item synchronously and counts mismatches (mismatched items use the synchronous value).\nBanners: ASYNC-REWARD PATCH: APPLIED|FAILED; per step ASYNC-REWARD n= ready= checked= mismatch= wait=..\"\"\"\nimport sys, os\nSITE = \"/usr/local/lib/python3.12/site-packages\"\nG = SITE + \"/tunix/rl/grpo/grpo_learner.py\"\nE = SITE + \"/vllm/v1/engine/llm_engine.py\"\nU = \"/deps/src/maxtext/trainers/post_train/rl/utils_rl.py\"\nST = SITE + \"/_ar_state.py\"\ng = open(G).read(); e = open(E).read(); u = open(U).read()\nif \"_ASYNC_REWARD\" in u: print(\"ASYNC-REWARD PATCH: already applied\", flush=True); sys.exit(0)\nga = \"  def _generate_and_compute_advantage(\\n      self,\\n      training_input: TrainingInputT,\\n      mode: rl_engine_lib.Mode = rl_engine_lib.Mode.TRAIN,\\n  ) -> TrainExample:\\n\"\nea = \"                _AD_TEXT[o.request_id] = _AD_POOL.submit(_ad_decode, tok, ids)\\n\"\nua = 'check_numbers = _fe_timed(\"check_numbers\", check_numbers)\\n'\nfor nm, txt, anc in ((\"learner\", g, ga), (\"engine\", e, ea), (\"utils_rl\", u, ua)):\n    if txt.count(anc) != 1: print(\"ASYNC-REWARD PATCH: FAILED anchor %s %d\" % (nm, txt.count(anc)), flush=True); sys.exit(0)\nopen(ST, \"w\").write('''\"\"\"_ASYNC_REWARD shared state (written by patch_async_reward.py).\"\"\"\nimport threading\nlock = threading.Lock()\nctx = None          # {\"answer\": [...], \"question\": [...], \"n\": int} for the current step\ncfg = None          # tmvp_config captured from the first synchronous check_numbers call\ncfg_lite = None     # picklable subset for the process-pool worker\norder = []          # request ids in add_request order for the current step\nscores = {}         # global index -> float | multiprocessing AsyncResult\nstats = {\"submitted\": 0, \"errors\": 0}\nmode = \"verify8\"\n\n_pool = None\ndef _pool_init():\n    import os\n    try:\n        os.nice(19)\n    except Exception:\n        pass\n    os.environ.setdefault(\"JAX_PLATFORMS\", \"cpu\")\ndef get_pool():\n    \"\"\"Dedicated 8-process spawn pool at nice 19: small enough not to starve the 32 DPScheduler rank processes.\"\"\"\n    global _pool\n    if _pool is None:\n        import multiprocessing, os\n        n = int(os.environ.get(\"ASYNC_REWARD_PROCS\", \"8\"))\n        _pool = multiprocessing.get_context(\"spawn\").Pool(n, initializer=_pool_init)\n    return _pool\n\ndef score_worker(text, answer_json, cfg):\n    \"\"\"Runs in a math_verify_pool spawn worker: extract + exact match + math_verify for ONE completion.\n    cfg is a SimpleNamespace with the 6 tmvp fields used by extract_answer/check_numbers.\"\"\"\n    import json\n    from maxtext.trainers.post_train.rl import utils_rl as u\n    from maxtext.trainers.post_train.rl import math_verify_pool as mp\n    guess = u.extract_answer(text, cfg)\n    answers = list(dict.fromkeys(json.loads(answer_json)))\n    score = cfg.penalty_incorrect_format\n    if guess is None:\n        return score\n    if guess == u.FALLBACK_ANSWER:\n        return cfg.penalty_incorrect_answer\n    exact = False\n    for ta in answers:\n        if guess == ta:\n            score = max(score, cfg.reward_exact_answer); exact = True\n        elif guess.strip() == ta.strip():\n            score = max(score, cfg.reward_white_space_format_match); exact = True\n    if exact:\n        return score\n    norm_guess = u.preprocess_math_string(guess)\n    norm_answers = [u.boxed(u.preprocess_math_string(ta)) for ta in answers]\n    r = mp.verify_math_worker(norm_answers, [u.boxed(norm_guess)])\n    return max(score, cfg.reward_exact_answer) if r > 0.0 else score\n''')\n# (1) learner: stash the step context before generation\ng = g.replace(ga, ga + '''    # _ASYNC_REWARD: publish answers for the async scorer and reset the request order\n    try:\n      import _ar_state as _ar\n      with _ar.lock:\n        _ar.order = []; _ar.scores = {}\n        _ar.ctx = {\"answer\": list(training_input[\"answer\"]), \"question\": list(training_input[\"question\"]),\n                   \"n\": len(training_input[\"prompts\"])} if (\"answer\" in training_input and \"question\" in training_input) else None\n    except Exception as _ar_e:\n      print(\"ASYNC-REWARD ctx failed: %r\" % (_ar_e,), flush=True)\n''')\n# (2) engine: record request order; score finished requests in the background\ne = e.replace(ea, ea + \"                _ar_submit(o.request_id, _AD_TEXT[o.request_id])\\n\")\ne += r'''\n\n# --- _ASYNC_REWARD ---------------------------------------------------------------\nimport os\nimport _ar_state as _ar\n_ar_orig_add_request = LLMEngine.add_request\ndef _ar_add_request(self, *a, **k):\n    rid = a[0] if a else k.get(\"request_id\")\n    with _ar.lock:\n        _ar.order.append(rid)\n    return _ar_orig_add_request(self, *a, **k)\nLLMEngine.add_request = _ar_add_request\n_AR_POOL = _ad_cf.ThreadPoolExecutor(max_workers=2)\n\ndef _ar_score_item(idx, text):\n    try:\n        from maxtext.trainers.post_train.rl import math_verify_pool as _mp\n        import types as _types\n        cfg = _ar.cfg; ctx = _ar.ctx\n        if cfg is None or ctx is None or idx >= ctx[\"n\"]:\n            return\n        lite = _ar.cfg_lite\n        if lite is None:\n            lite = _types.SimpleNamespace(**{k: getattr(cfg, k) for k in (\n                \"solution_start_token\", \"solution_end_token\", \"penalty_incorrect_format\", \"penalty_incorrect_answer\",\n                \"reward_exact_answer\", \"reward_white_space_format_match\")})\n            _ar.cfg_lite = lite\n        pool = _ar.get_pool()\n        job = pool.apply_async(_ar.score_worker, (text, ctx[\"answer\"][idx], lite))\n        with _ar.lock:\n            _ar.scores[idx] = (None, job)\n    except Exception:\n        _ar.stats[\"errors\"] += 1\n        if _ar.stats[\"errors\"] <= 3:\n            import traceback as _tb; print(\"ASYNC-REWARD score error idx=%s: %s\" % (idx, _tb.format_exc()[-600:]), flush=True)\n\ndef _ar_worker(request_id, fut):\n    try:\n        texts = fut.result()\n        with _ar.lock:\n            try:\n                idx = _ar.order.index(request_id)\n            except ValueError:\n                _ar.stats[\"errors\"] += 1; return\n        _ar.stats[\"submitted\"] += 1\n        _ar_score_item(idx, texts[0])\n    except Exception:\n        _ar.stats[\"errors\"] += 1\n        if _ar.stats[\"errors\"] <= 3:\n            import traceback as _tb; print(\"ASYNC-REWARD worker error rid=%s: %s\" % (request_id, _tb.format_exc()[-600:]), flush=True)\n\ndef _ar_submit(request_id, fut):\n    if _ar.ctx is not None and _ar.cfg is not None:\n        _AR_POOL.submit(_ar_worker, request_id, fut)\n'''\n# (3) utils_rl: consume the precomputed scores in check_numbers\nu = u.replace(ua, ua + r'''\n# --- _ASYNC_REWARD consumer ------------------------------------------------------\nimport _ar_state as _ar\n_ar_sync_check_numbers = check_numbers\n_ar_mode = _fe_os.environ.get(\"ASYNC_REWARD\", \"verify8\")\ndef check_numbers(prompts, completions, answer, tmvp_config, **kargs):  # noqa: F811\n    if _ar.cfg is None:\n        _ar.cfg = tmvp_config\n        return _ar_sync_check_numbers(prompts, completions, answer, tmvp_config, **kargs)\n    n = len(completions); t0 = _fe_time.perf_counter()\n    ctx = _ar.ctx\n    if ctx is None or ctx[\"n\"] != n or _ar_mode == \"off\":\n        print(\"ASYNC-REWARD fallback: ctx=%s n=%d\" % (None if ctx is None else ctx[\"n\"], n), flush=True)\n        return _ar_sync_check_numbers(prompts, completions, answer, tmvp_config, **kargs)\n    # wait briefly for stragglers (last window's finishers are still being scored), but never stall on failures\n    deadline = t0 + 3.0\n    while True:\n        with _ar.lock:\n            ready = len(_ar.scores)\n        if ready >= n or _fe_time.perf_counter() > deadline or ready + _ar.stats[\"errors\"] >= n and ready < 0.9 * n:\n            break\n        _fe_time.sleep(0.02)\n    with _ar.lock:\n        got = dict(_ar.scores)\n    scores = [None] * n\n    for i in range(n):\n        v = got.get(i)\n        if v is None:\n            continue\n        if isinstance(v, tuple):\n            base, job = v\n            try:\n                scores[i] = float(job.get(30.0))\n            except Exception as _e:\n                _ar.stats[\"errors\"] += 1\n                if _ar.stats[\"errors\"] <= 3: print(\"ASYNC-REWARD job error idx=%d: %r\" % (i, _e), flush=True)\n                scores[i] = None\n        else:\n            scores[i] = v\n    _missing = [i for i in range(n) if scores[i] is None]\n    if _missing:\n        # _AR_PARTIAL: sync-score ONLY missing/failed items (full-batch fallback caused 125-156s spikes)\n        if len(_missing) > n // 2:\n            print(\"ASYNC-REWARD mostly-missing (%d/%d) -> full sync\" % (len(_missing), n), flush=True)\n\
    \            return _ar_sync_check_numbers(prompts, completions, answer, tmvp_config, **kargs)\n        _sub_k = {k: ([v[i] for i in _missing] if isinstance(v, list) and len(v) == n else v)\n                  for k, v in kargs.items()}\n        _sub = _ar_sync_check_numbers([prompts[i] for i in _missing],\n                                      [completions[i] for i in _missing],\n                                      [answer[i] for i in _missing], tmvp_config, **_sub_k)\n        for _j, _i in enumerate(_missing):\n            scores[_i] = float(list(_sub)[_j])\n        print(\"ASYNC-REWARD PARTIAL: sync-filled %d/%d items\" % (len(_missing), n), flush=True)\n    checked = mismatch = 0\n    if _ar_mode == \"verify8\":\n        idxs = list(range(0, n, 8))\n        ref = _ar_sync_check_numbers([prompts[i] for i in idxs], [completions[i] for i in idxs], [answer[i] for i in idxs], tmvp_config,\n                                     **{k: ([v[i] for i in idxs] if isinstance(v, list) and len(v) == n else v) for k, v in kargs.items()})\n        for j, i in enumerate(idxs):\n            checked += 1\n            if abs(ref[j] - scores[i]) > 1e-9:\n                mismatch += 1\n                if mismatch <= 5:\n                    print(\"ASYNC-REWARD MISMATCH idx=%d async=%r sync=%r\" % (i, scores[i], ref[j]), flush=True)\n                scores[i] = ref[j]\n    print(\"ASYNC-REWARD n=%d ready=%d checked=%d mismatch=%d wait=%.3f errors=%d\" % (\n        n, len(got), checked, mismatch, _fe_time.perf_counter() - t0, _ar.stats[\"errors\"]), flush=True)\n    return scores\n''')\nfor path, txt in ((G, g), (E, e), (U, u)):\n    compile(txt, path, \"exec\"); open(path, \"w\").write(txt)\nprint(\"ASYNC-REWARD PATCH: APPLIED\", flush=True)"
  patch_approx_topk.py: "\"\"\"APPROX-TOPK: replace the sampler's top-k masking (tpu_inference topk_mask = 32\nbinary-search reductions over the 262k vocab) with jax.lax.approx_max_k. Microbenched\n~2x faster than topk_mask at the decode batch with 0.000% kept-diff at recall 0.99\n(identical nucleus set -> reward-exact). Env-gated by APPROX_TOPK=1 (APPROX_TOPK_K sets the\nstatic candidate count, default 64 >= our top_k=50). Per-row top_k honored via gather of the\nrow's k-th approx value as the threshold. Fail-open with banner.\n\"\"\"\nimport os, sys\n\n\ndef fail(m):\n    print(f\"APPROX-TOPK PATCH: FAILED {m}\", flush=True)\n    sys.exit(0)  # non-fatal: let the run start so the failure is visible\n\n\ntry:\n    import tpu_inference\n    ROOT = os.path.dirname(tpu_inference.__file__)\nexcept Exception as e:\n    fail(f\"cannot import tpu_inference: {e}\")\n\nP = os.path.join(ROOT, \"layers/jax/sample/sampling.py\")\nif not os.path.exists(P):\n    fail(f\"{P} not found\")\nsrc = open(P).read()\nif \"APPROX-TOPK\" in src:\n    print(\"APPROX-TOPK PATCH: already applied\", flush=True)\n    sys.exit(0)\n\nOLD = \"    topk_masked = topk_mask(logits, top_k, replace_val=-1e12)\\n\"\nif src.count(OLD) != 1:\n    fail(f\"anchor count {src.count(OLD)} != 1\")\n\nNEW = (\n    \"    # APPROX-TOPK: approx_max_k replaces 32-reduction topk_mask (~2x, 0% kept-diff @recall 0.99)\\n\"\n    \"    import os as _ax_os\\n\"\n    \"    if _ax_os.environ.get('APPROX_TOPK') == '1':\\n\"\n    \"      _ax_k = int(_ax_os.environ.get('APPROX_TOPK_K', '64'))\\n\"\n    \"      _ax_vals, _ax_idx = jax.lax.approx_max_k(logits, _ax_k, recall_target=0.99)\\n\"\n    \"      _ax_sorted = jnp.flip(jnp.sort(_ax_vals, axis=-1), axis=-1)\\n\"\n    \"      _ax_ki = jnp.clip(top_k - 1, 0, _ax_k - 1)\\n\"\n    \"      _ax_thr = jnp.take_along_axis(_ax_sorted, _ax_ki[:, None], axis=1)\\n\"\n    \"      topk_masked = jnp.where(logits >= _ax_thr, logits, jnp.float32(-1e12))\\n\"\n    \"    else:\\n\"\n    \"      topk_masked = topk_mask(logits, top_k, replace_val=-1e12)\\n\"\n)\nsrc = src.replace(OLD, NEW, 1)\ntry:\n    compile(src, P, \"exec\")\nexcept SyntaxError as e:\n    fail(f\"does not compile: {e}\")\nopen(P, \"w\").write(src)\nprint(\"APPROX-TOPK PATCH: APPLIED\", flush=True)\n"
  patch_block_size.py: "\"\"\"BLOCK-SIZE runtime patch: pin the vLLM KV block (page) size via env VLLM_BLOCK_SIZE.\n\nWHY (runs 22/23, 2026-08-21): tpu_inference auto-picks the KV page size from the\nengine shape (get_page_size/get_min_page_size in platforms/tpu_platform.py).\n16b/21/22b ran with block 128; run 22 (max_model_len 12544) got 32 and run 23\n(TP4xDP32) got 64 -- and exactly those two runs shifted generation (step-0\ntruncation 29%/28% vs 23%, longer completions, rewards unchanged). Pinning the\nblock size removes that confound so engine-shape experiments stay contract-valid.\n\nWHAT: in tunix/generate/vllm_sampler.py::VllmSampler._vllm_config, add\n`args[\"block_size\"] = int(os.environ[\"VLLM_BLOCK_SIZE\"])` when the env is set\n(vLLM then marks cache_config.user_specified_block_size and tpu_inference skips\nits heuristic). Fail-open with banner.\n\"\"\"\nimport os, sys\ndef fail(m):\n    print(f\"BLOCK-SIZE PATCH: FAILED {m}\", flush=True); sys.exit(0)\ntry:\n    import tunix\n    ROOT = os.path.dirname(tunix.__file__)\nexcept Exception as e:\n    fail(f\"cannot import tunix: {e}\")\nP = os.path.join(ROOT, \"generate/vllm_sampler.py\")\nsrc = open(P).read()\nif \"_BLOCK_SIZE_PIN\" in src:\n    print(\"BLOCK-SIZE PATCH: already applied\", flush=True); sys.exit(0)\nOLD = '    args[\"gpu_memory_utilization\"] = config.hbm_utilization\\n'\nif src.count(OLD) != 1:\n    fail(f\"anchor count {src.count(OLD)} != 1\")\nNEW = OLD + ('    # _BLOCK_SIZE_PIN: pin the KV page size so engine-shape changes do not\\n'\n             '    # silently change it (and with it the generation contract).\\n'\n             '    import os as _bs_os\\n'\n             '    if _bs_os.environ.get(\"VLLM_BLOCK_SIZE\"):\\n'\n             '      args[\"block_size\"] = int(_bs_os.environ[\"VLLM_BLOCK_SIZE\"])\\n'\n             '      print(f\"BLOCK-SIZE: pinned vLLM block_size={args[\\'block_size\\']}\", flush=True)\\n')\nNEW += ('    if _bs_os.environ.get(\"VLLM_PREFIX_CACHING\") == \"0\":\\n'\n        '      args[\"enable_prefix_caching\"] = False\\n'\n        '      print(\"PREFIX-CACHE: disabled via VLLM_PREFIX_CACHING=0\", flush=True)\\n')\nsrc = src.replace(OLD, NEW, 1)\ntry:\n    compile(src, P, \"exec\")\nexcept SyntaxError as e:\n    fail(f\"does not compile: {e}\")\nopen(P, \"w\").write(src)\nprint(\"BLOCK-SIZE PATCH: APPLIED\", flush=True)"
  patch_cd_masking.py: "\"\"\"Continuous-batching decode window v2: no EOS early-exit AND inert masked slots.\n\nSUPERSEDES patch_cd_masking.py (contains both edits; do not apply v1).\n\nWHY v2 EXISTS. Runs 10-10f established, with per-request runtime evidence:\n- the deep window works mechanically (full depth, EOS recorded/extracted,\n  every EOS-ending request retires; zombies=0, empty=0, inv=0);\n- yet sequences stop terminating in proportion to window depth\n  (capped-at-8192: 24.0% stock / 35.7% depth-32 / 54.0-54.5% depth-128,\n  3 replications each at step 0 with byte-identical prompts);\n- the failing population is per-sequence random, not rank- or\n  movement-clustered, and zero vLLM preemptions occurred.\n\nThe one remaining device-side channel that scales with masked iterations:\nafter a sequence samples EOS, `_update_loop_state` re-feeds it\n`padding_token_id` at a FROZEN position. Every subsequent iteration the model\nrecomputes that slot and WRITES PAD-DERIVED K/V AT THE FROZEN POSITION --\noverwriting the KV of the sequence's last real token, once per masked\niteration. Stock never executes a single masked step (interval=1 exits the\nwindow first), so this write path is unexercised in production.\n\nTHE FIX (edit 2): re-feed the slot's CURRENT input token instead of PAD.\nSame token, same frozen position, same context => the recomputed K/V is\nIDENTICAL to what is already stored: the write becomes idempotent and the\nmasked slot provably inert. One line in `_run_one_step`:\n\n    next_input_ids = jnp.where(new_active_mask, next_input_ids, ct)\n\n(active rows keep next_tokens; masked rows repeat their last input forever).\n`step_record_tokens` still records PAD for masked rows, so host extraction is\nunchanged. DP-padding rows already re-feed their initial token 0 at a frozen\nposition -- also idempotent.\n\nEdit 1 (unchanged from v1): cond_fn exits on window exhausted OR all done,\ninstead of breaking the fused loop on any EOS:\n\n    return jnp.logical_and(i < max_decode_steps, jnp.any(active_mask))\n\nIf truncation at depth 128 returns to ~24% with this patch, the PAD-KV\noverwrite was the poison and the full rollout win (~45 s/step measured in\nrun 10c: ~1.3 s per 128-iteration window) unlocks. If it stays ~54%, the\nfault is inside the attention kernel's handling of mixed frozen/advancing\nmetadata, and this escalates upstream with the full evidence chain.\n\nFAIL-OPEN. Any anchor mismatch prints FAILED and exits 0.\nPrints exactly one of:\n    CD-MASK2 PATCH: APPLIED\n    CD-MASK2 PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tpu_inference\"\nDL = os.path.join(ROOT, \"runner/decode_loop.py\")\n\n\ndef fail(msg):\n    print(f\"CD-MASK2 PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nif not os.path.exists(DL):\n    fail(f\"{DL} not found\")\nsrc = open(DL, encoding=\"utf-8\").read()\n\nif \"_CD_MASK2\" in src:\n    print(\"CD-MASK2 PATCH: already patched\")\n    sys.exit(0)\nif \"_CD_MASK_NO_EARLY_EXIT\" in src:\n    fail(\"v1 masking already applied; image should be fresh per pod\")\n\n# ---- Edit 1: cond_fn (structural: def -> next def at same indent) ----------\nlines = src.splitlines(keepends=True)\nstart = None\nfor i, ln in enumerate(lines):\n    if ln.strip().startswith(\"def cond_fn(carry):\"):\n        if start is not None:\n            fail(\"multiple cond_fn definitions\")\n        start = i\nif start is None:\n    fail(\"cond_fn not found\")\nindent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]\nend = None\nfor j in range(start + 1, len(lines)):\n    s = lines[j]\n    if s.strip() and not s.startswith(indent + \" \") and s.startswith(indent) \\\n            and s.lstrip().startswith(\"def \"):\n        end = j\n        break\nif end is None:\n    fail(\"could not find the def following cond_fn\")\n\nNEW_COND = (\n    f\"{indent}def cond_fn(carry):\\n\"\n    f\"{indent}    # _CD_MASK2 -- continuous-batching semantics: run the window to\\n\"\n    f\"{indent}    # its static depth (or until every sequence is done) instead of\\n\"\n    f\"{indent}    # breaking the fused loop on any EOS.\\n\"\n    f\"{indent}    _cd = _unpack(carry)\\n\"\n    f\"{indent}    _cd_i = _cd[0]\\n\"\n    f\"{indent}    _cd_active = _cd[2]\\n\"\n    f\"{indent}    # _CD_NOGLOBAL: no jnp.any(active) here -- it is a cross-DP\\n\"\n    f\"{indent}    # all-reduce every iteration (profile run 48: 137us/step).\\n\"\n    f\"{indent}    return _cd_i < max_decode_steps\\n\"\n    f\"\\n\")\nsrc = \"\".join(lines[:start]) + NEW_COND + \"\".join(lines[end:])\n\n# ---- Edit 2: idempotent masked-slot re-feed in _run_one_step ---------------\nANCHOR = \"\"\"        lp_ids_step = None\n        lp_val_step = None\n        lp_ranks_step = None\n        if has_logprobs:\"\"\"\nif src.count(ANCHOR) != 1:\n    fail(f\"_run_one_step anchor count={src.count(ANCHOR)}\")\nINSERT = \"\"\"        # _CD_MASK2 -- inert masked slots. v1 re-fed padding_token_id at a\n        # frozen position, so each masked iteration OVERWROTE the slot's last\n        # real KV with PAD-derived KV. Re-feeding the slot's current input\n        # token instead makes the recomputed K/V identical to what is stored:\n        # the write is idempotent and the masked slot provably inert.\n        next_input_ids = jnp.where(new_active_mask, next_input_ids, ct)\n\n\"\"\"\nsrc = src.replace(ANCHOR, INSERT + ANCHOR)\n\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(DL, \"w\", encoding=\"utf-8\").write(src)\n\nv = open(DL, encoding=\"utf-8\").read()\nproblems = []\nif v.count(\"_CD_MASK2\") < 2:\n    problems.append(\"markers missing\")\nif \"should_check_eos\" in v.split(\"def body_fn\")[0].split(\"def cond_fn\")[1]:\n    problems.append(\"old cond_fn body still present\")\nif \"jnp.where(new_active_mask, next_input_ids, ct)\" not in v:\n    problems.append(\"re-feed line missing\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    problems.append(f\"reparse failed: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"CD-MASK2 PATCH: APPLIED\")"
  patch_cd_noglobal.py: "\"\"\"Remove the per-iteration global (cross-DP) scalar reduction `any_hit_eos` from\nthe fused decode loop body (decode_loop.py::_update_loop_state). With our CD masking\n(EOS check interval <= 0) the carried eos_flag is never consulted by cond_fn, yet the\nreduction still runs every iteration as an all-reduce over all 128 devices\n(profile run 48: all-reduce.127 = 216us/step). Companion of the cond_fn edit in\npatch_cd_masking (_CD_NOGLOBAL). Prints CD-NOGLOBAL PATCH: APPLIED | FAILED.\"\"\"\nimport sys\nP = \"/usr/local/lib/python3.12/site-packages/tpu_inference/runner/decode_loop.py\"\ns = open(P).read()\nold = \"    any_hit_eos = jnp.any(jnp.logical_and(active_mask, is_eos))\\n\"\nif \"_CD_NOGLOBAL_BODY\" in s:\n    print(\"CD-NOGLOBAL PATCH: already applied\", flush=True); sys.exit(0)\nif s.count(old) != 1:\n    print(\"CD-NOGLOBAL PATCH: FAILED anchor count %d\" % s.count(old), flush=True); sys.exit(0)\ns = s.replace(old, \"    any_hit_eos = jnp.array(False)  # _CD_NOGLOBAL_BODY: cross-DP reduce removed (unused under CD masking)\\n\")\ncompile(s, P, \"exec\"); open(P, \"w\").write(s)\nprint(\"CD-NOGLOBAL PATCH: APPLIED\", flush=True)"
  patch_cd_proper.py: "\"\"\"Apply the PROPER continue-decode fix (PR #3374) to the installed tpu_inference.\n\nMirrors https://github.com/vllm-project/tpu-inference/pull/3374 exactly:\n\n  (a) models/common/model_loader.py -- build an options-free twin of run_model and\n      expose it as `step_fn_no_options` on the model object, mirroring the torchax\n      path in models/vllm/vllm_model_wrapper.py.\n  (b) runner/decode_loop.py -- build the fused-decode loop jit lazily from\n      get_step_fn_compiler_options() instead of a hardcoded 3-entry literal, so the\n      fused program keeps all 5 options (incl. the SparseCore offload thresholds).\n\nEvery edit asserts its anchor and re-verifies after writing. Prints exactly one of:\n    CD-PROPER PATCH: APPLIED\n    CD-PROPER PATCH: FAILED <reason>\nA FAILED line means the run proves nothing -- check it before reading any result.\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tpu_inference\"\nML = os.path.join(ROOT, \"models/common/model_loader.py\")\nDL = os.path.join(ROOT, \"runner/decode_loop.py\")\n\n\ndef fail(msg):\n    print(f\"CD-PROPER PATCH: FAILED {msg}\")\n    sys.exit(0)  # non-fatal: let the run start so the failure is visible in logs\n\n\ndef sub(text, old, new, what):\n    if text.count(old) != 1:\n        fail(f\"[{what}] anchor found {text.count(old)} times, expected 1\")\n    return text.replace(old, new)\n\n\n# ---------------------------------------------------------------- (a) model_loader\nif not os.path.exists(ML):\n    fail(f\"{ML} not found\")\nml = open(ML, encoding=\"utf-8\").read()\n\nif \"step_fn_no_options\" in ml and \"run_model_no_options\" in ml:\n    print(\"CD-PROPER PATCH: model_loader already patched\")\nelse:\n    if \"\\nimport functools\\n\" not in ml:\n        ml = sub(ml, \"from typing import Any, Optional\\n\",\n                 \"import functools\\nfrom typing import Any, Optional\\n\",\n                 \"ml-import\")\n\n    ml = sub(\n        ml,\n        \"\"\"    @jax.jit(\n        out_shardings=(\n            kv_cache_sharding,\n            hidden_states_sharding,\n            hidden_states_sharding,  # aux hidden states\n            None,  # expert ids\n        ),\n        donate_argnums=1,  # 0 is state_leaves, 1 is kv_cache\n        static_argnums=(\n            6, 9, 10\n        ),  # 6 is layer_name_to_kvcache_index, 9 is is_first_rank, 10 is is_last_rank\n        compiler_options=get_step_fn_compiler_options(),\n    )\n    def run_model(state_leaves, *args):\n        state = jax.tree_util.tree_unflatten(_state_treedef, state_leaves)\n        model = nnx.merge(graphdef, state)\n        return model(*args)\n\"\"\",\n        \"\"\"    def run_model_impl(state_leaves, *args):\n        state = jax.tree_util.tree_unflatten(_state_treedef, state_leaves)\n        model = nnx.merge(graphdef, state)\n        return model(*args)\n\n    run_model_jit = functools.partial(\n        jax.jit,\n        out_shardings=(\n            kv_cache_sharding,\n            hidden_states_sharding,\n            hidden_states_sharding,  # aux hidden states\n            None,  # expert ids\n        ),\n        donate_argnums=1,  # 0 is state_leaves, 1 is kv_cache\n        static_argnums=(\n            6, 9, 10\n        ),  # 6 is layer_name_to_kvcache_index, 9 is is_first_rank, 10 is is_last_rank\n    )\n\n    run_model_no_options = run_model_jit(run_model_impl)\n\n    run_model = run_model_jit(\n        run_model_impl,\n        compiler_options=get_step_fn_compiler_options(),\n    )\n\"\"\",\n        \"ml-run_model\")\n\n    ml = sub(\n        ml,\n        \"\"\"    def wrapped_model_fn(*args, **kwargs):\n        if not model_supports_spec_step:\n            kwargs.pop(\"spec_step_idx\", None)\n        kwargs.pop(\"shared_attention_metadata\", None)\n        return jitted_model_fn(*args, **kwargs)\n\"\"\",\n        \"\"\"    def wrapped_model_fn(*args, **kwargs):\n        if not model_supports_spec_step:\n            kwargs.pop(\"spec_step_idx\", None)\n        kwargs.pop(\"shared_attention_metadata\", None)\n        return jitted_model_fn(*args, **kwargs)\n\n    jitted_model_fn_no_options = (run_draft_model\n                                  if is_draft_model else run_model_no_options)\n\n    def wrapped_model_fn_no_options(*args, **kwargs):\n        if not model_supports_spec_step:\n            kwargs.pop(\"spec_step_idx\", None)\n        kwargs.pop(\"shared_attention_metadata\", None)\n        return jitted_model_fn_no_options(*args, **kwargs)\n\"\"\",\n        \"ml-wrapper\")\n\n    ml = sub(\n        ml,\n        \"\"\"    return ModelInterface(\n        model_fn=wrapped_model_fn,\"\"\",\n        \"\"\"    jit_model.step_fn_no_options = wrapped_model_fn_no_options\n\n    return ModelInterface(\n        model_fn=wrapped_model_fn,\"\"\",\n        \"ml-attach\")\n\n    try:\n        ast.parse(ml)\n    except SyntaxError as e:\n        fail(f\"[model_loader] patched source does not parse: {e}\")\n    open(ML, \"w\", encoding=\"utf-8\").write(ml)\n\n# ---------------------------------------------------------------- (b) decode_loop\nif not os.path.exists(DL):\n    fail(f\"{DL} not found\")\ndl = open(DL, encoding=\"utf-8\").read()\n\nif \"_get_decode_core\" in dl:\n    print(\"CD-PROPER PATCH: decode_loop already patched\")\nelse:\n    dl = sub(\n        dl,\n        \"\"\"from tpu_inference.layers.common.attention_metadata import (\n    AttentionMetadata, SharedAttentionMetadata)\"\"\",\n        \"\"\"from tpu_inference.layers.common.attention_metadata import (\n    AttentionMetadata, SharedAttentionMetadata)\nfrom tpu_inference.models.common.compiler_options import \\\\\n    get_step_fn_compiler_options\"\"\",\n        \"dl-import\")\n\n    STATIC = \"\"\"    static_argnames=(\n        \"model_fn\",\n        \"compute_logits_fn\",\n        \"sample_fn\",\n        \"mesh\",\n        \"static_max_decode_steps\",\n        \"eos_token_id\",\n        \"padding_token_id\",\n        \"dp_size\",\n        \"pad_len\",\n        \"has_experts\",\n        \"expert_shape\",\n        \"expert_dtype\",\n        \"layer_name_to_kvcache_index\",\n        \"is_first_rank\",\n        \"is_last_rank\",\n        \"max_logprobs\",\n        \"logprobs_mode\",\n        \"continue_decode_eos_check_interval\",\n    ),\n    donate_argnames=(\"kv_caches\", ),\"\"\"\n\n    old_dec = (\"@functools.partial(\\n    jax.jit,\\n\" + STATIC + \"\"\"\n    # Hoisted here from the model's step_fun: JAX forbids compiler_options on\n    # a nested jit, so they must live on this top-level loop jit instead.\n    compiler_options={\n        \"xla_tpu_all_gather_collective_matmul_mode\": \"post_spmd_conservative\",\n        \"xla_tpu_reduce_scatter_collective_matmul_mode\":\n        \"post_spmd_conservative\",\n        \"xla_tpu_use_minor_sharding_for_major_trivial_input\": \"true\"\n    },\n)\ndef _decode_core(\n\"\"\")\n    dl = sub(dl, old_dec, \"def _decode_core_impl(\\n\", \"dl-decorator\")\n\n    factory = (\"@functools.lru_cache(maxsize=1)\\ndef _get_decode_core():\\n\"\n               \"    return functools.partial(\\n        jax.jit,\\n\"\n               + STATIC.replace(\"    static_argnames\", \"        static_argnames\")\n               .replace('        \"model_fn\"', '            \"model_fn\"')\n               + \"\\n        compiler_options=get_step_fn_compiler_options(),\\n\"\n               \"    )(_decode_core_impl)\\n\\n\\n\")\n    # rebuild the static block with consistent 8-space indent instead of string surgery\n    inner = \"\\n\".join((\"    \" + ln) if ln.strip() else ln\n                      for ln in STATIC.split(\"\\n\"))\n    factory = (\"@functools.lru_cache(maxsize=1)\\n\"\n               \"def _get_decode_core():\\n\"\n               \"    # Built lazily (the \\\"auto\\\" SparseCore threshold needs live devices) and\\n\"\n               \"    # cached so the jit is constructed once, not per decode step.\\n\"\n               \"    return functools.partial(\\n\"\n               \"        jax.jit,\\n\"\n               + inner + \"\\n\"\n               \"        compiler_options=get_step_fn_compiler_options(),\\n\"\n               \"    )(_decode_core_impl)\\n\\n\\n\")\n    dl = sub(dl, \"def continue_decode(\\n\", factory + \"def continue_decode(\\n\",\n             \"dl-factory\")\n\n    dl = sub(dl, \"lp_ranks_buffer) = _decode_core(\",\n             \"lp_ranks_buffer) = _get_decode_core()(\", \"dl-callsite\")\n\n    try:\n        ast.parse(dl)\n    except SyntaxError as e:\n        fail(f\"[decode_loop] patched source does not parse: {e}\")\n    open(DL, \"w\", encoding=\"utf-8\").write(dl)\n\n# ---------------------------------------------------------------- verify\nml2 = open(ML, encoding=\"utf-8\").read()\ndl2 = open(DL, encoding=\"utf-8\").read()\nproblems = []\nif \"jit_model.step_fn_no_options = wrapped_model_fn_no_options\" not in ml2:\n    problems.append(\"step_fn_no_options not attached\")\nif \"run_model_no_options = run_model_jit(run_model_impl)\" not in ml2:\n    problems.append(\"options-free twin missing\")\nif \"_get_decode_core()(\" not in dl2:\n    problems.append(\"decode_loop call site not rewired\")\nif \"compiler_options=get_step_fn_compiler_options(),\" not in dl2:\n    problems.append(\"decode_loop still not sourcing options from the function\")\nif '\"xla_tpu_use_minor_sharding_for_major_trivial_input\": \"true\"' in dl2:\n    problems.append(\"decode_loop hardcoded literal still present\")\n\nif problems:\n    fail(\"; \".join(problems))\nprint(\"CD-PROPER PATCH: APPLIED\")"
  patch_cd_report.py: "\"\"\"Report each sequence's real newest token, not the window's last row.\n\nTHE BUG THIS FIXES (diagnosed from run 10, which was VOID because of it).\n\ntpu_runner.py tells the host what each sequence's newest token is by reading ONE row\nof the fused window's token buffer -- the window's last:\n\n    last_step_idx = clip(final_state.step_counter - 1, 0, static_max_decode_steps - 1)\n    next_tokens_in_tpu = generated_tokens[last_step_idx, arange(batch)]\n\nThat is only correct because the window STOPS IMMEDIATELY after any sequence emits EOS.\n`any_hit_eos` is therefore not a performance heuristic -- it is load-bearing for\ncorrectness, and the single-row protocol is why the break has to be global rather than\nper-sequence.\n\nOnce the window keeps running (patch_cd_masking.py), a sequence that finishes mid-window\nis masked for the remaining iterations and `step_record_tokens` writes padding:\n\n    rows:  [t0 t1 t2 t3 t4 EOS PAD PAD ... PAD]\n                            ^              ^\n                       correct        what the host reads\n\nSo the host sees a padding token, concludes the sequence is still generating, never\nretires it, and RE-SEEDS the next window from a padding token. The model happily\ncontinues from that seed, producing fluent text that never terminates. Measured on\nrun 10: OSL 3750 -> 5700, truncation 25% -> 58%, reward 0.146 -> 0.053.\n\nTermination becomes a lottery -- a sequence only ends if its EOS happens to land on the\nwindow's final row.\n\nTHE FIX. Take each sequence's LAST NON-PADDING row instead of the window's last row.\nThe buffer contents are untouched; only the derivation of \"newest token\" changes.\n\n    real   = (generated_tokens != pad_token_id) & (row < step_counter)\n    last   = max over rows of (row where real else 0)\n    tokens = generated_tokens[last, arange(batch)]\n\nTHIS ALSO EXPLAINS A RESULT WE FILED WRONGLY. `CONTINUE_DECODE_EOS_CHECK_INTERVAL=8`\nwas measured 3x SLOWER (02-cdint8: ~2157 s vs 719.2 s) and recorded in FINDINGS as\n\"holding the loop prevents the scheduler retiring finished sequences, so useful work per\niteration collapses\". That is the SAME BUG in milder form: at interval 8, a sequence\nemitting EOS at iteration 2 is masked through iteration 7, so row 7 is padding and the\nhost misses the EOS exactly as above. The lever was never inherently bad -- it hit this\nreporting bug. Fixing the report should revive it AND max_decode_steps together.\n\nORDERING. Independent of patch_cd_masking.py (different file), but pointless without it.\n\nFAIL-OPEN. Any anchor mismatch prints FAILED and exits 0.\nPrints exactly one of:\n    CD-REPORT PATCH: APPLIED\n    CD-REPORT PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport re\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tpu_inference\"\nTR = os.path.join(ROOT, \"runner/tpu_runner.py\")\n\n\ndef fail(msg):\n    print(f\"CD-REPORT PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nif not os.path.exists(TR):\n    fail(f\"{TR} not found\")\nsrc = open(TR, encoding=\"utf-8\").read()\n\nif \"_CD_REPORT_LAST_REAL_TOKEN\" in src:\n    print(\"CD-REPORT PATCH: already patched\")\n    sys.exit(0)\n\nfor name in (\"self.pad_token_id\", \"self.static_max_decode_steps\",\n             \"def _execute_continue_decode\"):\n    if name not in src:\n        fail(f\"expected '{name}' not present in tpu_runner.py\")\n\n# Whitespace-tolerant: match the two statements as one block.\nPAT = re.compile(\n    r\"^([ \\t]*)last_step_idx\\s*=\\s*jnp\\.clip\\(\\s*final_state\\.step_counter\\s*-\\s*1,.*?\\)\\s*\\n\"\n    r\"[ \\t]*next_tokens_in_tpu\\s*=\\s*generated_tokens\\[\\s*\\n?\"\n    r\"[ \\t]*last_step_idx,\\s*\\n?\"\n    r\"[ \\t]*jnp\\.arange\\(generated_tokens\\.shape\\[1\\]\\)\\]\\s*\\n\",\n    re.M | re.S)\nm = PAT.search(src)\nif not m:\n    fail(\"could not match the last_step_idx / next_tokens_in_tpu block\")\nif len(PAT.findall(src)) != 1:\n    fail(f\"block matched {len(PAT.findall(src))} times, expected 1\")\nind = m.group(1)\n\nNEW = (\n    f\"{ind}# _CD_REPORT_LAST_REAL_TOKEN -- see patch_cd_report.py.\\n\"\n    f\"{ind}# Reading ONE row (the window's last) is only correct when the window\\n\"\n    f\"{ind}# stops right after an EOS. With a continuous-batching window a finished\\n\"\n    f\"{ind}# sequence has PADDING in that row, so the host misses its EOS, never\\n\"\n    f\"{ind}# retires it, and re-seeds it from a padding token. Take each sequence's\\n\"\n    f\"{ind}# last NON-PADDING row instead. Buffer contents are untouched.\\n\"\n    f\"{ind}_cd_nsteps = jnp.clip(final_state.step_counter, 1,\\n\"\n    f\"{ind}                      self.static_max_decode_steps)\\n\"\n    f\"{ind}_cd_rows = jnp.arange(generated_tokens.shape[0])[:, None]\\n\"\n    f\"{ind}_cd_real = jnp.logical_and(\\n\"\n    f\"{ind}    generated_tokens != self.pad_token_id,\\n\"\n    f\"{ind}    _cd_rows < _cd_nsteps)\\n\"\n    f\"{ind}_cd_last = jnp.max(jnp.where(_cd_real, _cd_rows, 0), axis=0)\\n\"\n    f\"{ind}next_tokens_in_tpu = generated_tokens[\\n\"\n    f\"{ind}    _cd_last,\\n\"\n    f\"{ind}    jnp.arange(generated_tokens.shape[1])]\\n\")\n\nsrc = src[:m.start()] + NEW + src[m.end():]\n\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(TR, \"w\", encoding=\"utf-8\").write(src)\n\nv = open(TR, encoding=\"utf-8\").read()\nproblems = []\nif \"_CD_REPORT_LAST_REAL_TOKEN\" not in v:\n    problems.append(\"marker missing\")\nif \"last_step_idx\" in v:\n    problems.append(\"old last_step_idx still referenced\")\nif v.count(\"next_tokens_in_tpu = generated_tokens[\") != 1:\n    problems.append(\"next_tokens_in_tpu assignment count wrong\")\nif \"_cd_last\" not in v:\n    problems.append(\"new gather missing\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    problems.append(f\"reparse failed: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"CD-REPORT PATCH: APPLIED\")"
  patch_dp_rr_routing.py: "\"\"\"CREATIVE-7: round-robin DP routing for add_request. tpu_inference DPScheduler._route_and_forward_request\ncalls _find_best_rank_for_request per request, which does GET_PENDING_PREFILL_TOKENS + GET_REQUEST_COUNTS +\nGET_MIN_REMAINING_OUTPUT round trips to ALL dp ranks (~100 pipe messages/request; 2048 requests/step ~ 13 s:\nruns 94/96). Our batch is homogeneous (2048 prompts of ~149 tokens, 8 samples each): plain round-robin is\nbalanced and needs no queries. Env DP_ROUTING=rr enables it. Prints DP-RR-ROUTING PATCH: APPLIED | FAILED.\"\"\"\nimport sys\nP = \"/usr/local/lib/python3.12/site-packages/tpu_inference/core/sched/dp_scheduler.py\"\ns = open(P).read()\nif \"_DP_RR_ROUTING\" in s: print(\"DP-RR-ROUTING PATCH: already applied\", flush=True); sys.exit(0)\na = (\"    def _route_and_forward_request(self, request: Request) -> None:\\n\"\n     \"        \\\"\\\"\\\"Route a single request to a DP rank and send ADD_REQUEST IPC.\\\"\\\"\\\"\\n\"\n     \"        rank = self._find_best_rank_for_request(request)\\n\")\nb = (\"    def _route_and_forward_request(self, request: Request) -> None:\\n\"\n     \"        \\\"\\\"\\\"Route a single request to a DP rank and send ADD_REQUEST IPC.\\\"\\\"\\\"\\n\"\n     \"        # _DP_RR_ROUTING: skip the per-request all-rank state round-trips.\\n\"\n     \"        import os as _rr_os\\n\"\n     \"        if _rr_os.environ.get('DP_ROUTING') == 'rr':\\n\"\n     \"            _c = getattr(self, '_rr_counter', 0)\\n\"\n     \"            rank = _c % self.dp_size\\n\"\n     \"            self._rr_counter = _c + 1\\n\"\n     \"        else:\\n\"\n     \"            rank = self._find_best_rank_for_request(request)\\n\")\nif s.count(a) != 1: print(\"DP-RR-ROUTING PATCH: FAILED anchor %d\" % s.count(a), flush=True); sys.exit(0)\ns = s.replace(a, b); compile(s, P, \"exec\"); open(P, \"w\").write(s); print(\"DP-RR-ROUTING PATCH: APPLIED\", flush=True)"
  patch_fast_detok.py: "\"\"\"CREATIVE-6: batch the post-generation detokenization in tunix VllmSampler.detokenize. The loop calls\nself.tokenizer.decode(ids) once per completion (2048 x ~4.5k tokens per step). Replace with one\nbatch_decode on the underlying HF fast tokenizer when available (falls back to per-item decode).\nToken ids / logprobs handling unchanged. Prints FAST-DETOK PATCH: APPLIED | FAILED.\"\"\"\nimport sys\nP = \"/usr/local/lib/python3.12/site-packages/tunix/generate/vllm_sampler.py\"\ns = open(P).read()\nif \"_FAST_DETOK\" in s: print(\"FAST-DETOK PATCH: already applied\", flush=True); sys.exit(0)\na = (\"        decoded_outputs[idx].append(\\n\"\n     \"            self.tokenizer.decode(single_output.token_ids)\\n\"\n     \"        )\\n\")\nb = (\"        decoded_outputs[idx].append(None)  # _FAST_DETOK: filled by batch_decode below\\n\")\nc = \"    return decoded_outputs, out_logprobs, out_tokens\\n\"\nd = (\"    # _FAST_DETOK: one batched decode for all completions\\n\"\n     \"    _flat = [t for gen in out_tokens for t in gen]\\n\"\n     \"    _hf = getattr(self.tokenizer, '_tokenizer', None) or getattr(self.tokenizer, 'tokenizer', None)\\n\"\n     \"    if _hf is not None and hasattr(_hf, 'batch_decode'):\\n\"\n     \"      _texts = _hf.batch_decode([t.tolist() for t in _flat])\\n\"\n     \"    else:\\n\"\n     \"      _texts = [self.tokenizer.decode(t.tolist()) for t in _flat]\\n\"\n     \"    _k = 0\\n\"\n     \"    for gen_i in range(len(decoded_outputs)):\\n\"\n     \"      for j in range(len(decoded_outputs[gen_i])):\\n\"\n     \"        decoded_outputs[gen_i][j] = _texts[_k]; _k += 1\\n\"\n     \"    return decoded_outputs, out_logprobs, out_tokens\\n\")\nif s.count(a) != 1 or s.count(c) != 1: print(\"FAST-DETOK PATCH: FAILED anchors %d/%d\" % (s.count(a), s.count(c)), flush=True); sys.exit(0)\ns = s.replace(a, b).replace(c, d)\ncompile(s, P, \"exec\"); open(P, \"w\").write(s); print(\"FAST-DETOK PATCH: APPLIED\", flush=True)"
  patch_fast_extract.py: "\"\"\"ROUND 4: fast extract_answer + reward-phase timers. utils_rl.extract_answer scans every completion char by\nchar and slices content[:op] (a ~15 KB copy) on every '}' -- O(len x braces) per completion, x2048 per step: this\nis the ~3 s compute_rewards phase. Replacement: locate each '\\\\boxed{' with str.find and balance braces only inside\nit; returns the match whose closing brace is last (same semantics as the stack version). Mode env\nFAST_EXTRACT=verify8 (default): fast result used, every 8th item cross-checked against the original and counted.\nPrints FAST-EXTRACT n=.. mismatch=.. t_fast=.. t_orig=.. and REWARD-T fn=.. s=.. n=.. per reward call.\"\"\"\nimport sys\nP = \"/deps/src/maxtext/trainers/post_train/rl/utils_rl.py\"\ns = open(P).read()\nif \"_FAST_EXTRACT\" in s: print(\"FAST-EXTRACT PATCH: already applied\", flush=True); sys.exit(0)\nfor name in (\"def extract_answer(\", \"def check_numbers(\", \"def match_format_exactly(\", \"def match_format_approximately(\", \"def math_verify_func(\"):\n    if s.count(name) != 1: print(\"FAST-EXTRACT PATCH: FAILED anchor %s %d\" % (name, s.count(name)), flush=True); sys.exit(0)\ns += r'''\n\n# --- _FAST_EXTRACT ----------------------------------------------------------------\nimport os as _fe_os, time as _fe_time\n_fe_orig_extract_answer = extract_answer\n_FE = {\"n\": 0, \"checked\": 0, \"mismatch\": 0, \"t_fast\": 0.0, \"t_orig\": 0.0}\n_FE_MODE = _fe_os.environ.get(\"FAST_EXTRACT\", \"verify8\")\n\ndef _fe_fast(response, tmvp_config):\n    answer_tag_regex = get_answer_fallback_regex(tmvp_config)\n    answer_matches = answer_tag_regex.findall(response)\n    content = answer_matches[-1] if answer_matches else response\n    best = None; best_close = -1; n = len(content)\n    pos = content.find(\"\\\\boxed{\")\n    while pos != -1:\n        op = pos + 6; depth = 0; i = op\n        while i < n:\n            ch = content[i]\n            if ch == \"{\":\n                depth += 1\n            elif ch == \"}\":\n                depth -= 1\n                if depth == 0:\n                    break\n            i += 1\n        if i < n and i > best_close:\n            best_close = i; best = content[op + 1:i].strip()\n        pos = content.find(\"\\\\boxed{\", pos + 1)\n    if best is not None:\n        return best\n    m = re.search(r\"\\\\boxed\\s*\\{?\\s*([a-zA-Z0-9\\.,\\-]+)\\s*\\}?\", content)\n    if m:\n        return m.group(1).strip()\n    fallback_matches = answer_tag_regex.findall(response)\n    if fallback_matches:\n        return fallback_matches[-1].strip()\n    return FALLBACK_ANSWER\n\ndef extract_answer(response, tmvp_config):  # noqa: F811  (_FAST_EXTRACT)\n    if _FE_MODE == \"orig\":\n        return _fe_orig_extract_answer(response, tmvp_config)\n    t0 = _fe_time.perf_counter(); r = _fe_fast(response, tmvp_config); _FE[\"t_fast\"] += _fe_time.perf_counter() - t0\n    _FE[\"n\"] += 1\n    if _FE_MODE == \"verify8\" and _FE[\"n\"] % 8 == 0:\n        t0 = _fe_time.perf_counter(); o = _fe_orig_extract_answer(response, tmvp_config); _FE[\"t_orig\"] += _fe_time.perf_counter() - t0\n        _FE[\"checked\"] += 1\n        if o != r:\n            _FE[\"mismatch\"] += 1\n            if _FE[\"mismatch\"] <= 5:\n                print(\"FAST-EXTRACT MISMATCH fast=%r orig=%r\" % (r[:80], o[:80]), flush=True)\n            r = o\n    if _FE[\"n\"] % 2048 == 0:\n        print(\"FAST-EXTRACT n=%d checked=%d mismatch=%d t_fast=%.3f t_orig(x8 est)=%.3f\" % (\n            _FE[\"n\"], _FE[\"checked\"], _FE[\"mismatch\"], _FE[\"t_fast\"], _FE[\"t_orig\"] * 8), flush=True)\n    return r\n\ndef _fe_timed(name, fn):\n    def w(*a, **k):\n        t0 = _fe_time.perf_counter(); r = fn(*a, **k)\n        n = len(a[1]) if len(a) > 1 and hasattr(a[1], \"__len__\") else (len(k.get(\"completions\", [])) if \"completions\" in k else len(a[0]) if a and hasattr(a[0], \"__len__\") else -1)\n        print(\"REWARD-T fn=%s s=%.3f n=%d\" % (name, _fe_time.perf_counter() - t0, n), flush=True)\n        return r\n    w.__name__ = fn.__name__; w.__doc__ = fn.__doc__\n    return w\ncheck_numbers = _fe_timed(\"check_numbers\", check_numbers)\nmatch_format_exactly = _fe_timed(\"match_format_exactly\", match_format_exactly)\nmatch_format_approximately = _fe_timed(\"match_format_approximately\", match_format_approximately)\nmath_verify_func = _fe_timed(\"math_verify_func\", math_verify_func)\n'''\ncompile(s, P, \"exec\"); open(P, \"w\").write(s); print(\"FAST-EXTRACT PATCH: APPLIED\", flush=True)"
  patch_flash_sa.py: "\"\"\"RUNG 8 support: let MaxText flash/splash attention run under the RL config. The RL pydantic config\n(extra=forbid) has no sa_* / use_splash_scheduler fields, and AttentionOp reads them as attributes\n(run 72: AttributeError sa_block_q; 72b: CLI rejects the keys). Rewrite those reads in\n/deps/src/maxtext/layers/attention_op.py to getattr(config, name, default). Defaults = MaxText base:\nblocks 512, fused bwd off, layouts HEAD_DIM_MINOR, splash scheduler off, fuse_reciprocal True, base2 False.\nPrints FLASH-SA PATCH: APPLIED n=<replacements> | FAILED.\"\"\"\nimport re, sys\nP = \"/deps/src/maxtext/layers/attention_op.py\"\ns = open(P).read()\nif \"_FLASH_SA_DEFAULTS\" in s:\n    print(\"FLASH-SA PATCH: already applied\", flush=True); sys.exit(0)\ndef default_for(name):\n    n = name.replace(\"local_\", \"\")\n    if n in (\"sa_block_q\", \"sa_block_q_dkv\", \"sa_block_q_dq\"): return \"1024\"\n    if n.startswith(\"sa_block_kv\"): return \"2048\"\n    if n in (\"sa_use_fused_bwd_kernel\", \"use_splash_scheduler\", \"sa_use_base2_exp\"): return \"False\"\n    if n == \"sa_fuse_reciprocal\": return \"True\"\n    if n.endswith(\"_layout\"): return \"'HEAD_DIM_MINOR'\"\n    return \"None\"\npat = re.compile(r\"self\\.config\\.((?:local_)?(?:sa_[a-z0-9_]+|use_splash_scheduler))\\b\")\nn = [0]\ndef repl(m):\n    n[0] += 1\n    return \"getattr(self.config, %r, %s)\" % (m.group(1), default_for(m.group(1)))\ns2 = pat.sub(repl, s)\nif n[0] == 0:\n    print(\"FLASH-SA PATCH: FAILED no sa_* reads found\", flush=True); sys.exit(0)\ns2 = \"# _FLASH_SA_DEFAULTS: sa_* reads tolerate configs without those fields\\n\" + s2\ncompile(s2, P, \"exec\"); open(P, \"w\").write(s2)\nprint(\"FLASH-SA PATCH: APPLIED n=%d\" % n[0], flush=True)"
  patch_g4_format_guard.py: "\"\"\"G4-FORMAT-GUARD: replace match_format_exactly's backtracking regex with an\nequivalent ordered find-chain. rs.*?re.*?ss(.+?)se (DOTALL) matches iff the four\nliteral tokens appear in order (>=1 char between ss and se); on gemma echo outputs\n(~30k chars, repeated tag literals, often no closing tag) the regex backtracks\ncatastrophically (793 s / 32 items on g4-002k step 7 -> async pool timeout -> sync).\"\"\"\nimport sys\nP = \"/deps/src/maxtext/trainers/post_train/rl/utils_rl.py\"\ns = open(P).read()\nif \"_G4_FORMAT_GUARD\" in s: print(\"G4-FORMAT-GUARD PATCH: already applied\", flush=True); sys.exit(0)\nif s.count(\"def match_format_exactly(\") != 1: print(\"G4-FORMAT-GUARD PATCH: FAILED anchor\", flush=True); sys.exit(0)\ns += r'''\n\n# --- _G4_FORMAT_GUARD (appended; column-0 in file) --------------------------------\n_g4fg_orig_mfe = match_format_exactly\ndef match_format_exactly(prompts, completions, tmvp_config, **kargs):\n  rs = \"\" if getattr(tmvp_config, \"reasoning_start_token_in_prompt\", False) else tmvp_config.reasoning_start_token\n  rend = tmvp_config.reasoning_end_token\n  ss = tmvp_config.solution_start_token\n  se = tmvp_config.solution_end_token\n  scores = []\n  for c in completions:\n    ok = False\n    i = c.find(rs) if rs else 0\n    if i >= 0:\n      j = c.find(rend, i + len(rs))\n      if j >= 0:\n        k = c.find(ss, j + len(rend))\n        if k >= 0 and c.find(se, k + len(ss) + 1) >= 0:\n          ok = True\n    scores.append(float(tmvp_config.reward_exact_format_match) if ok else 0.0)\n  return scores\nprint(\"G4-FORMAT-GUARD: match_format_exactly -> find-chain (no regex)\", flush=True)\n'''\nopen(P, \"w\").write(s)\nprint(\"G4-FORMAT-GUARD PATCH: APPLIED\", flush=True)"
  patch_gc_sync.py: "\"\"\"_GC_SYNC: gate tunix's per-step gc.collect() calls behind env TUNIX_GC_COLLECT (default off).\ntunix e4fc1dbf added gc.collect() after rollout.update_params (weight sync) and after the\nactor-logps pass in rl_cluster.py -- unconditional, every step. On our colocated (no CPU\noffload) setup this is a pure host stall: measured +1.2 s/step in perf/train/weight_sync_time\n(run 42 vs run 40). Gating (not deleting) keeps the upstream behaviour one env var away.\nFail-open, idempotent.\"\"\"\ndef _patch():\n    try:\n        import tunix.rl.rl_cluster as RC\n        fp = RC.__file__; src = open(fp).read()\n        if \"_GC_SYNC\" in src:\n            print(\"GC-SYNC: already applied\", flush=True); return\n        n = src.count(\"gc.collect()\")\n        if n == 0:\n            print(\"GC-SYNC: no gc.collect() found (skipped)\", flush=True); return\n        src = src.replace(\"gc.collect()\", \"(gc.collect() if __import__('os').environ.get('TUNIX_GC_COLLECT','0')=='1' else None)  # _GC_SYNC\")\n        compile(src, fp, \"exec\"); open(fp, \"w\").write(src)\n        print(\"GC-SYNC: gated %d gc.collect() call(s) in rl_cluster.py (TUNIX_GC_COLLECT=1 restores)\" % n, flush=True)\n    except Exception as e:\n        print(\"GC-SYNC: failed %r\" % (e,), flush=True)\n_patch()"
  patch_gemma4_prs.py: "\"\"\"Apply the gemma4 correctness/parity PR stack at runtime (maxtext #4807, #4860, #4790).\n\nWHY. Three open PRs fix gemma4 model/checkpoint fidelity:\n  #4807  vision std_bias/std_scale classification per HF `standardize` (config + types + gemma4_vision)\n  #4860  emit vision-tower shapes in the HF export map (hf_shape.py) \u2014 used by offline mapping checks\n  #4790  Gemma-4 E2B image (multimodal) E2E parity: clipped-linears, padded-patch masking, PLE\n         substitution; also adds the E2B image-contract config fields and their param mappings.\n\nTEXT-PATH IMPACT (verified before adopting): every param_mapping change is gated behind\n`use_multimodal` / `use_clipped_linears_for_vit`, both False on the RL path, so the pushed\ntext parameter set is unchanged. The stack is carried to (a) keep our tree aligned with the\nfidelity fixes, (b) let a multimodal-config run be attempted later, and (c) catch RLConfig\nschema drift early (Fix #9/#10/#20 class) via the smoke gate.\n\nWHAT. Applies `gemma4_prs.diff` (the three PRs squashed and rebased onto the image's tree =\nmaxtext fork `ironwood-rl-gemma4` @ 35b7903) with `patch -p3` under the importable maxtext\npackage root. Touches only `src/maxtext/**` (tests are excluded from the diff). Coexists with\npatch_pr4409 (verified: 4409 applies cleanly on top of this stack) \u2014 run this one FIRST.\n\nFAIL-OPEN. Dry-run first; any failure prints FAILED and exits 0 with the tree untouched.\nPrints exactly one of:\n    GEMMA4-PRS PATCH: APPLIED\n    GEMMA4-PRS PATCH: already patched\n    GEMMA4-PRS PATCH: FAILED <reason>\n\"\"\"\nimport importlib.util\nimport os\nimport shutil\nimport subprocess\nimport sys\n\nHERE = os.path.dirname(os.path.abspath(__file__))\nDIFF = os.path.join(HERE, \"gemma4_prs.diff\")\nMARK = \"use_clipped_linears_for_vit\"\n\n\ndef fail(msg):\n  print(f\"GEMMA4-PRS PATCH: FAILED {msg}\")\n  sys.exit(0)\n\n\ndef main():\n  spec = importlib.util.find_spec(\"maxtext\")\n  if spec is None or not spec.submodule_search_locations:\n    fail(\"cannot import maxtext\")\n  root = list(spec.submodule_search_locations)[0]  # .../src/maxtext\n  if not os.path.exists(DIFF):\n    fail(f\"diff not found at {DIFF}\")\n  mark_file = os.path.join(root, \"configs\", \"models\", \"gemma4-e2b.yml\")\n  if os.path.exists(mark_file) and MARK in open(mark_file).read():\n    print(\"GEMMA4-PRS PATCH: already patched\")\n    return\n  if shutil.which(\"patch\"):\n    base = [\"patch\", \"-p3\", \"-d\", root, \"--forward\", \"--batch\", \"-i\", DIFF]\n    dry = subprocess.run(base + [\"--dry-run\"], capture_output=True, text=True)\n    if dry.returncode != 0:\n      fail(f\"patch --dry-run failed under {root}: {dry.stdout[-600:]} {dry.stderr[-300:]}\")\n    r = subprocess.run(base, capture_output=True, text=True)\n    if r.returncode != 0:\n      fail(f\"patch apply failed: {r.stdout[-600:]} {r.stderr[-300:]}\")\n  elif shutil.which(\"git\"):\n    base = [\"git\", \"apply\", \"--unsafe-paths\", \"-p3\", f\"--directory={root}\", DIFF]\n    chk = subprocess.run(base + [\"--check\"], capture_output=True, text=True)\n    if chk.returncode != 0:\n      fail(f\"git apply --check failed under {root}: {chk.stderr[-600:]}\")\n    r = subprocess.run(base, capture_output=True, text=True)\n    if r.returncode != 0:\n      fail(f\"git apply failed: {r.stderr[-600:]}\")\n  else:\n    fail(\"neither `patch` nor `git` available in the image\")\n  if MARK not in open(mark_file).read():\n    fail(\"re-verify failed (gemma4-e2b.yml lacks the new image-contract fields)\")\n  print(f\"GEMMA4-PRS PATCH: APPLIED -> {root}\")\n\n\nif __name__ == \"__main__\":\n  main()"
  patch_host_extract.py: "\"\"\"RUNG 3: vectorize EOS trimming in tpu_runner._process_continue_decode_outputs.\nThe per-request loop called _extract_valid_tokens_host (np.isin + np.where) once per request\nper 128-step window: ~9.7k numpy calls / window = ~60 ms of the ~130 ms host turnaround\n(host trace, run 48). Compute is_eos for the whole [reqs, steps] matrix once; per-request\nwork becomes a slice + tolist. num_eos_hits semantics preserved exactly (== row has an EOS).\nPrints HOST-EXTRACT PATCH: APPLIED | FAILED <reason>.\"\"\"\nimport sys\nP = \"/usr/local/lib/python3.12/site-packages/tpu_inference/runner/tpu_runner.py\"\ns = open(P).read()\nif \"_HOST_EXTRACT_VEC\" in s:\n    print(\"HOST-EXTRACT PATCH: already applied\", flush=True); sys.exit(0)\na = \"    eos_arr = np.atleast_1d(eos_token_id)\\n    requests_dict = requests if requests is not None and hasattr(\\n\"\nb = (\"    eos_arr = np.atleast_1d(eos_token_id)\\n\"\n     \"    # _HOST_EXTRACT_VEC: one vectorized EOS scan for the whole window.\\n\"\n     \"    _is_eos_mat = np.isin(generated_tokens_cpu, eos_arr)\\n\"\n     \"    _has_eos = _is_eos_mat.any(axis=1)\\n\"\n     \"    _vt_len = np.where(_has_eos, _is_eos_mat.argmax(axis=1) + 1,\\n\"\n     \"                       generated_tokens_cpu.shape[1])\\n\"\n     \"    requests_dict = requests if requests is not None and hasattr(\\n\")\nc = (\"        valid_tokens = _extract_valid_tokens_host(tokens, eos_token_id)\\n\"\n     \"        if len(valid_tokens) < len(tokens) or (valid_tokens and\\n\"\n     \"                                               valid_tokens[-1] in eos_arr):\\n\"\n     \"            num_eos_hits += 1\\n\")\nd = (\"        valid_tokens = tokens[:int(_vt_len[req_idx])].tolist()  # _HOST_EXTRACT_VEC\\n\"\n     \"        if _has_eos[req_idx]:\\n\"\n     \"            num_eos_hits += 1\\n\")\nfor anchor, name in ((a, \"prologue\"), (c, \"loop\")):\n    if s.count(anchor) != 1:\n        print(\"HOST-EXTRACT PATCH: FAILED %s anchor count %d\" % (name, s.count(anchor)), flush=True); sys.exit(0)\ns = s.replace(a, b).replace(c, d)\ncompile(s, P, \"exec\"); open(P, \"w\").write(s)\nprint(\"HOST-EXTRACT PATCH: APPLIED\", flush=True)"
  patch_jit_unroll.py: "\"\"\"RUNG 4e: weight sync \u2014 jit the per-layer slicing in tunix generate/utils._unroll_scanned_layers.\nRun 71b (SYNC-T3): unroll = 4.4-4.7 s of the ~4.8 s sync (n=310 arrays), reshard 0.3 s, loop 0.02 s.\nThe unroll does src_val.value[idx] once per layer per scanned param (~290 remote dispatches through the\nPathways proxy). One jitted call per scanned param returns all layer slices at once (~10 dispatches).\nPrints JIT-UNROLL PATCH: APPLIED | FAILED.\"\"\"\nimport sys\nU = \"/usr/local/lib/python3.12/site-packages/tunix/generate/utils.py\"\nu = open(U).read()\nif \"_JIT_UNROLL\" in u:\n    print(\"JIT-UNROLL PATCH: already applied\", flush=True); sys.exit(0)\na = (\"      num_layers = src_val.value.shape[layer_axis]\\n\"\n     \"      for i in range(num_layers):\\n\"\n     \"        idx = [slice(None)] * src_val.value.ndim\\n\"\n     \"        idx[layer_axis] = i\\n\"\n     \"        layer_val = src_val.value[tuple(idx)]\\n\"\n     \"        layer_key = tgt_path[i]\\n\"\n     \"        unscanned_flat[(src_key, layer_key)] = (layer_val, tgt_param[i])\\n\")\nb = (\"      num_layers = src_val.value.shape[layer_axis]\\n\"\n     \"      _layer_vals = _jit_unroll_layers(src_val.value, layer_axis)  # _JIT_UNROLL: one dispatch per param\\n\"\n     \"      for i in range(num_layers):\\n\"\n     \"        layer_val = _layer_vals[i]\\n\"\n     \"        layer_key = tgt_path[i]\\n\"\n     \"        unscanned_flat[(src_key, layer_key)] = (layer_val, tgt_param[i])\\n\")\nif u.count(a) != 1:\n    print(\"JIT-UNROLL PATCH: FAILED anchor count %d\" % u.count(a), flush=True); sys.exit(0)\nhelpers = '\\n\\n# --- _JIT_UNROLL: slice all layers of a scanned param in one jitted call ---------\\nfrom functools import partial as _jur_partial\\n@_jur_partial(jax.jit, static_argnums=1)\\ndef _jit_unroll_layers(x, axis):\\n  return tuple(jnp.take(x, i, axis=axis) for i in range(x.shape[axis]))\\n'\nu = u.replace(a, b) + helpers\ncompile(u, U, \"exec\"); open(U, \"w\").write(u)\nprint(\"JIT-UNROLL PATCH: APPLIED\", flush=True)"
  patch_lendist.py: "\"\"\"Record per-step ISL / OSL / truncation distributions from the GRPO rollout.\n\nWHY. Tunix logs only completions/{mean,max,min}_length -- three scalars. We have never\nseen the length DISTRIBUTION, and `max_length` is 8192 (the OSL cap) in every single\nstep, so we know something is truncated but not whether it is 1 sequence or 40%. That\nnumber gates the tuning plan: holding the OSL cap fixed is only safe if truncation is\nrare.\n\nWHAT IT COSTS. Nothing measurable. Every array read here is ALREADY host-side numpy at\nthis point in the function:\n    rollout_output.tokens                 list[np.ndarray], UNPADDED  -> OSL = len()\n    rollout_output.left_padded_prompt_tokens  np.ndarray              -> ISL\n    pad_value / eos_value                 plain ints (rollout.pad_id()/eos_id())\n    rollout_config.max_tokens_to_generate  the cap\nNo device->host sync is introduced, so step timing is unaffected. ~30 KB/step.\n\nUsing rollout_output.tokens directly (rather than inferring from completion_mask) makes\nOSL exact: len() cannot be fooled by a pad token appearing mid-sequence.\n\nFAIL-OPEN. This patches a file on the live training path. Any anchor mismatch prints\nFAILED and exits 0 without modifying anything -- it must never crash a run. The injected\ncode is itself wrapped in try/except so a logging bug cannot take down training.\n\nPrints exactly one of:\n    LENDIST PATCH: APPLIED\n    LENDIST PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tunix\"\nGL = os.path.join(ROOT, \"rl/grpo/grpo_learner.py\")\n\n\ndef fail(msg):\n    print(f\"LENDIST PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nif not os.path.exists(GL):\n    fail(f\"{GL} not found\")\nsrc = open(GL, encoding=\"utf-8\").read()\n\nif \"_LENDIST_DUMP\" in src:\n    print(\"LENDIST PATCH: already patched\")\n    sys.exit(0)\n\nANCHOR = \"    # Log completion lengths.\\n    agg_completion_mask = completion_mask.sum(axis=-1)\\n\"\nif src.count(ANCHOR) != 1:\n    fail(f\"anchor found {src.count(ANCHOR)} times, expected 1\")\n\n# Verify the names we rely on are actually in scope in this function.\nfor name in (\"rollout_output\", \"rollout_config\", \"pad_value\", \"eos_value\"):\n    if name not in src:\n        fail(f\"expected local '{name}' not present in grpo_learner.py\")\n\nINJECT = '''    # --- _LENDIST_DUMP: per-step ISL/OSL/truncation distributions -------------\n    # All inputs are already host-side numpy here; no device sync is added.\n    try:\n      import json as _json, os as _os, numpy as _np\n      _cap = int(getattr(rollout_config, \"max_tokens_to_generate\", 0) or 0)\n      _osl, _trunc, _eos_end = [], 0, 0; _ft = []\n      for _t in rollout_output.tokens:\n        _n = int(len(_t))\n        _osl.append(_n)\n        _ft.append(int(_t[0]) if _n else -1)\n        if _cap and _n >= _cap:\n          # Distinguish \"ran into the wall\" from \"happened to finish exactly there\".\n          if _n > 0 and int(_t[-1]) == int(eos_value):\n            _eos_end += 1\n          else:\n            _trunc += 1\n      _p = _np.asarray(rollout_output.left_padded_prompt_tokens)\n      _isl = (_p != pad_value).sum(axis=-1).astype(int).tolist()\n      _rec = {\n          \"step\": int(self.rl_cluster.global_steps),\n          \"mode\": str(mode),\n          \"cap\": _cap,\n          \"n\": len(_osl),\n          \"osl\": _osl,\n          \"isl\": _isl,\n          \"truncated_at_cap\": _trunc,\n          \"eos_exactly_at_cap\": _eos_end,\n          \"first_tok\": _ft,\n      }\n      _run = _os.environ.get(\"JOB_IDENTIFIER\", \"unknown-run\")\n      _art = _os.environ.get(\"ARTIFACT_DIR\", \"\")\n      _line = _json.dumps(_rec)\n      print(\"LENDIST step=%d n=%d cap=%d truncated=%d (%.2f%%) eos_at_cap=%d \"\n            \"osl_mean=%.1f isl_mean=%.1f first_think=%d/%d\"\n            % (_rec[\"step\"], _rec[\"n\"], _cap, _trunc,\n               100.0 * _trunc / max(1, len(_osl)), _eos_end,\n               sum(_osl) / max(1, len(_osl)), sum(_isl) / max(1, len(_isl)),\n               sum(1 for _x in _ft if _x == 151667), len(_ft)),\n            flush=True)\n      if _art.startswith(\"gs://\"):\n        from google.cloud import storage as _st\n        _b, _, _pre = _art[5:].partition(\"/\")\n        _key = \"%s/%s/lendist/step_%06d.json\" % (_pre.rstrip(\"/\"), _run, _rec[\"step\"])\n        _st.Client().bucket(_b).blob(_key.lstrip(\"/\")).upload_from_string(\n            _line, content_type=\"application/json\")\n    except Exception as _e:  # never take down training for a logging bug\n      print(\"LENDIST ERROR: %r\" % (_e,), flush=True)\n    # --- end _LENDIST_DUMP ----------------------------------------------------\n\n'''\n\nsrc = src.replace(ANCHOR, INJECT + ANCHOR, 1)\n\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(GL, \"w\", encoding=\"utf-8\").write(src)\n\nv = open(GL, encoding=\"utf-8\").read()\nproblems = []\nif \"_LENDIST_DUMP\" not in v:\n    problems.append(\"marker missing\")\nif \"truncated_at_cap\" not in v:\n    problems.append(\"truncation logic missing\")\nif v.count(\"agg_completion_mask = completion_mask.sum(axis=-1)\") != 1:\n    problems.append(\"original metric line disturbed\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    problems.append(f\"reparse failed: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"LENDIST PATCH: APPLIED\")"
  patch_log_stats.py: "\"\"\"Enable vLLM engine stats logging (KV-cache usage gauge) -- run 15b.\n\nCORRECTED from run 15, where the patch flipped the setdefault in\n_build_engine_args -- dead code on our path: with server_mode=False tunix\nconstructs the OFFLINE engine, `LLM(**self.args)`, and vLLM's LLM.__init__\ndefaults disable_log_stats=True when the key is absent (llm.py:224 at pin\n0ba2aa35a). Run 15 therefore produced zero stats lines (banner APPLIED,\neffect nil).\n\nFix: setdefault the key into `self.args` at its single construction point,\n_vllm_config(). Covers BOTH paths -- LLM(**args) sees the key (vLLM's\n\"not in kwargs\" guard skips), and _build_engine_args copies self.args so\nits own setdefault becomes a no-op.\n\nDeliverable: \"GPU KV cache usage: X%\" lines in pathways-head logs during\nrollout, to size the TP=4 experiment. Reading caveats: CD lookahead\nallocation books up to 128 steps of blocks per window up front, so the\ngauge reads structurally high; throughput numbers are meaningless under\nfused CD windows. Startup-line context from run 15 (identical config):\npool = 34,325,568 tokens at hbm_utilization=0.3; max concurrency 2062.83x\nfor 16,640-token requests, i.e. worst case barely fits at TP8.\n\nPrints exactly one of:\n    LOG-STATS PATCH: APPLIED\n    LOG-STATS PATCH: already patched\n    LOG-STATS PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nP = \"/usr/local/lib/python3.12/site-packages/tunix/generate/vllm_sampler.py\"\n\n\ndef fail(msg):\n    print(f\"LOG-STATS PATCH: FAILED {msg}\")\n    sys.exit(0)  # non-fatal: let the run start so the failure is visible in logs\n\n\nif not os.path.exists(P):\n    fail(f\"{P} not found\")\nsrc = open(P, encoding=\"utf-8\").read()\n\nOLD = \"    args = config._processed_engine_kwargs.copy()\"\nNEW = (\n    \"    args = config._processed_engine_kwargs.copy()\\n\"\n    '    args.setdefault(\"disable_log_stats\", False)  # run-15b: stats ON (offline LLM path)'\n)\n\nif 'args.setdefault(\"disable_log_stats\", False)' in src:\n    print(\"LOG-STATS PATCH: already patched\")\n    sys.exit(0)\nif src.count(OLD) != 1:\n    fail(f\"anchor found {src.count(OLD)} times, expected 1\")\n\nsrc = src.replace(OLD, NEW, 1)\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\nopen(P, \"w\", encoding=\"utf-8\").write(src)\nprint(\"LOG-STATS PATCH: APPLIED\")"
  patch_packer_fast.py: "\"\"\"_PACKER_FAST: numpy-first chunk assembly for tunix.rl.utils.pack_sequences (tunix 408ca1d9).\nWHY: the stock packer builds every packed bin with ~18 jax ops (jnp.zeros/jnp.array/[None,:]/\nconcatenate) -> ~14k device dispatches per step (768 bins) = the +4.7 s actor_dequeue_time measured\nin run 43c vs 42. FIX: fill [pack_size, budget] numpy arrays per feature and do ONE jnp.asarray per\nfeature per chunk (72 dispatches/step). Verified bit-identical output on synthetic data (bench_fast.py).\nReplaces the (_flush_pack, chunk_capacity, _emit) block; FFD, _mark, main loop untouched. Fail-open.\"\"\"\nFAST_BLOCK = '\\n  def _emit(chunk):\\n    \"\"\"[_PACKER_FAST] Merge one chunk (pack_size bins) into a [pack_size, budget] example, numpy-first.\"\"\"\\n    fi = first_item_for_dummy or {}\\n    has_policy_version = fi.get(\"policy_version\") is not None\\n    tracked = [k for k in (\"ref_per_token_logps\", \"old_per_token_logps\", \"returns\", \"old_values\") if fi.get(k) is not None]\\n    P = len(chunk); B = max_token_budget\\n    c_ids = np.full((P, B), pad_id, dtype=np.int32)\\n    c_mask = np.zeros((P, B), dtype=np.int32)\\n    adv = np.zeros((P, B), dtype=np.float32)\\n    seg = np.zeros((P, B), dtype=np.int32)\\n    pos = np.zeros((P, B), dtype=np.int32)\\n    feats = {k: np.zeros((P, B), dtype=np.float32) for k in tracked}\\n    pv = None\\n    for r, pack_items in enumerate(chunk):\\n      if len(pack_items) > effective_max_segments:\\n        raise ValueError(\\n            f\"pack_sequences: a packed row has {len(pack_items)} segments, \"\\n            f\"exceeding max_segments_per_packed_row={effective_max_segments}; \"\\n            \"increase it (or leave it None for the budget-derived safe default).\")\\n      off = 0\\n      for i, item in enumerate(pack_items, start=1):\\n        p_ids = item[\"prompt_ids\"]; cc_ids = item[\"completion_ids\"]\\n        pl = len(p_ids); cl = len(cc_ids); L = pl + cl\\n        c_ids[r, off:off + pl] = p_ids\\n        c_ids[r, off + pl:off + L] = cc_ids\\n        c_mask[r, off + pl:off + L] = item[\"completion_mask\"]\\n        if item[\"adv_is_per_token\"]:\\n          adv[r, off + pl:off + L] = item[\"advantages\"]\\n        else:\\n          adv[r, off + pl:off + L] = item[\"advantages\"]  # scalar broadcast == np.full(cl, adv)\\n        for k in tracked:\\n          feats[k][r, off + pl:off + L] = item[k]\\n        seg[r, off:off + L] = i\\n        pos[r, off:off + L] = np.arange(L, dtype=np.int32)\\n        off += L\\n      if pack_items and has_policy_version and pv is None:\\n        pv = pack_items[0][\"policy_version\"]\\n    kwargs = dict(\\n        prompt_ids=jnp.zeros((P, 0), dtype=jnp.int32),\\n        prompt_mask=jnp.zeros((P, 0), dtype=jnp.int32),\\n        completion_ids=jnp.asarray(c_ids),\\n        completion_mask=jnp.asarray(c_mask),\\n        advantages=jnp.asarray(adv),\\n        ref_per_token_logps=None,\\n        old_per_token_logps=None,\\n        segment_ids=jnp.asarray(seg),\\n        segment_positions=jnp.asarray(pos),\\n    )\\n    for k in tracked:\\n      kwargs[k] = jnp.asarray(feats[k])\\n    if has_policy_version:\\n      # original: per-bin policy_version concatenated along axis 0 (empty bins use first_item\\'s)\\n      pvs = [(b[0][\"policy_version\"] if b else fi[\"policy_version\"]) for b in chunk]\\n      kwargs[\"policy_version\"] = jnp.concatenate([jnp.asarray(x) for x in pvs], axis=0)\\n    return example_cls(**kwargs)  # pytype: disable=wrong-keyword-args\\n\\n  chunk_capacity = pack_size * max_token_budget\\n'\ndef _patch():\n    try:\n        import tunix.rl.utils as U\n        fp = U.__file__; src = open(fp).read()\n        if \"_PACKER_FAST\" in src:\n            print(\"PACKER-FAST: already applied\", flush=True); return\n        a = \"  def _flush_pack(\"; b = \"  def _mark(\"\n        if src.count(a) != 1 or src.count(b) != 1:\n            print(\"PACKER-FAST: anchors %d/%d (skipped)\" % (src.count(a), src.count(b)), flush=True); return\n        i = src.index(a); j = src.index(b)\n        if not (i < j and \"def pack_sequences(\" in src[:i]):\n            print(\"PACKER-FAST: anchor order unexpected (skipped)\", flush=True); return\n        new = src[:i] + FAST_BLOCK.lstrip(\"\\n\") + \"\\n\" + src[j:]\n        compile(new, fp, \"exec\"); open(fp, \"w\").write(new)\n        print(\"PACKER-FAST: replaced _flush_pack/_emit with numpy-first chunk assembly (%d chars removed)\" % (j - i), flush=True)\n    except Exception as e:\n        print(\"PACKER-FAST: failed %r\" % (e,), flush=True)\n_patch()"
  patch_packing_knob.py: "\"\"\"_PACKING_KNOB v2: feed max_seq_token_per_tpu to tunix from env MAX_SEQ_TOKEN_PER_TPU.\nThe image's train_rl.py plumbs `max_seq_token_per_tpu=(getattr(trainer_config, \"max_seq_token_per_tpu\", 0) or None)`\nbut the key is not in MaxText's pydantic RLConfig schema, so the CLI arg is rejected. Read env instead\n(0/unset = packing off). v1 bug: a '#' comment inside the replacement expression commented out\n' or None),' -> unclosed paren (compile-check caught it, file untouched). v2: no inline comment;\nidempotency marker appended at EOF. Fail-open.\"\"\"\nimport glob\ndef _patch():\n    try:\n        cands = glob.glob(\"/deps/src/maxtext/trainers/post_train/rl/train_rl.py\") + glob.glob(\"/app/src/maxtext/trainers/post_train/rl/train_rl.py\")\n        if not cands:\n            print(\"PACKING-KNOB: train_rl.py not found (skipped)\", flush=True); return\n        for fp in cands:\n            src = open(fp).read()\n            if \"_PACKING_KNOB\" in src:\n                print(\"PACKING-KNOB: already applied\", fp, flush=True); continue\n            anchor = 'getattr(trainer_config, \"max_seq_token_per_tpu\", 0)'\n            n = src.count(anchor)\n            if n == 0:\n                print(\"PACKING-KNOB: anchor not found in\", fp, \"(skipped)\", flush=True); continue\n            src = src.replace(anchor, 'int(__import__(\"os\").environ.get(\"MAX_SEQ_TOKEN_PER_TPU\", \"0\"))')\n            src += \"\\n# _PACKING_KNOB applied: max_seq_token_per_tpu read from env MAX_SEQ_TOKEN_PER_TPU\\n\"\n            compile(src, fp, \"exec\"); open(fp, \"w\").write(src)\n            import os\n            print(\"PACKING-KNOB: train_rl reads MAX_SEQ_TOKEN_PER_TPU=%s (%d edit) in %s\" % (os.environ.get(\"MAX_SEQ_TOKEN_PER_TPU\"), n, fp), flush=True)\n    except Exception as e:\n        print(\"PACKING-KNOB: failed %r\" % (e,), flush=True)\n_patch()"
  patch_padding_bucket.py: "\"\"\"Apply the padding-bucket fix (PR candidate, evidence/padding-bucket-fix.diff) to the\ninstalled tpu_inference: get_token_paddings(include_max_token_size=True) so a full\nchunked-prefill step pads to max_num_batched_tokens itself, never to the next 2x bucket.\nPrints PADDING-BUCKET PATCH: APPLIED | FAILED <reason>.\"\"\"\nimport sys\nR = \"/usr/local/lib/python3.12/site-packages/tpu_inference/runner/\"\ndef fail(m): print(\"PADDING-BUCKET PATCH: FAILED \" + m, flush=True); sys.exit(0)\nU = R + \"utils.py\"; u = open(U).read()\nif \"include_max_token_size\" in u:\n    print(\"PADDING-BUCKET PATCH: already applied\", flush=True); sys.exit(0)\na = \"def get_token_paddings(min_token_size: int, max_token_size: int,\\n                       padding_gap: int) -> list[int]:\"\nb = \"def get_token_paddings(min_token_size: int, max_token_size: int,\\n                       padding_gap: int, include_max_token_size: bool = False) -> list[int]:\"\nif u.count(a) != 1: fail(\"utils signature anchor\")\nu = u.replace(a, b)\nc = '    logger.info(f\"Prepared token paddings: {paddings}\")\\n    return paddings'\nd = ('    if include_max_token_size:\\n'\n     '        exact = -(-max_token_size // min_token_size) * min_token_size\\n'\n     '        if exact not in paddings:\\n'\n     '            paddings = sorted(paddings + [exact])\\n' + c)\nif u.count(c) != 1: fail(\"utils tail anchor\")\nu = u.replace(c, d)\nT = R + \"tpu_runner.py\"; r = open(T).read()\ne = \"            padding_gap=envs.VLLM_TPU_BUCKET_PADDING_GAP)\"\nif r.count(e) != 1: fail(\"runner call anchor\")\nr = r.replace(e, \"            padding_gap=envs.VLLM_TPU_BUCKET_PADDING_GAP,\\n            include_max_token_size=True)\")\nfor p, s in ((U, u), (T, r)):\n    compile(s, p, \"exec\"); open(p, \"w\").write(s)\nprint(\"PADDING-BUCKET PATCH: APPLIED\", flush=True)"
  patch_perf_v2.py: "\"\"\"Wire tunix perf-metrics v2 (Perfetto timeline export) -- run 15.\n\nmaxtext's train_rl populates only custom_export_fn (v1 -> the TensorBoard\nperf/* metrics we already use). The v2 path (tunix.perf.experimental)\nwrites a Perfetto timeline of every phase span (rollout / weight_sync /\ntrain, tagged per step) viewable at ui.perfetto.dev. At the pinned tunix\ncommit (683256db) rl_cluster consumes custom_export_fn_v2, the GRPO\nlearner is instrumented, and rl_learner calls perf_v2.export() every\niteration -- only the config field is never populated.\n\nWe patch tunix's rl_cluster.py (byte-verified against the pin) rather than\nmaxtext's train_rl.py (whose image content is date-approximated): default\nthe v2 export fn at the point where cluster_config is in scope. Best-effort\nby construction -- any init failure prints PERF-V2: DISABLED and the run\nproceeds with v2 off.\n\nOutput: ONE file gs://ubench-logs/g4r55/perf_traces/\nperfetto_trace_v2_<epoch>.pb, rewritten each step with all steps\naccumulated (writes serialized on a 1-thread executor; epath/gcsfs handle\nthe gs:// path; perfetto+etils+gcsfs verified in the image layer).\n\nPrints exactly one of:\n    PERF-V2 PATCH: APPLIED\n    PERF-V2 PATCH: already patched\n    PERF-V2 PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nP = \"/usr/local/lib/python3.12/site-packages/tunix/rl/rl_cluster.py\"\n\n\ndef fail(msg):\n    print(f\"PERF-V2 PATCH: FAILED {msg}\")\n    sys.exit(0)  # non-fatal: let the run start so the failure is visible in logs\n\n\nif not os.path.exists(P):\n    fail(f\"{P} not found\")\nsrc = open(P, encoding=\"utf-8\").read()\n\nif \"_PERF_V2_DEFAULT_WIRED\" in src:\n    print(\"PERF-V2 PATCH: already patched\")\n    sys.exit(0)\n\nANCHOR = \"      export_fn_v2 = self.perf_config.custom_export_fn_v2\\n\"\nif src.count(ANCHOR) != 1:\n    fail(f\"anchor found {src.count(ANCHOR)} times, expected 1\")\n\nINJECT = ANCHOR + (\n    \"\\n\"\n    \"      # _PERF_V2_DEFAULT_WIRED (g4r55). maxtext train_rl populates\\n\"\n    \"      # only the v1 export fn; default the v2 (Perfetto) exporter here,\\n\"\n    \"      # where cluster_config is in scope. Best-effort: on any failure v2\\n\"\n    \"      # stays off and the run proceeds.\\n\"\n    \"      if export_fn_v2 is None:\\n\"\n    \"        try:\\n\"\n    \"          from tunix.perf.experimental import export as _pv2_export\\n\"\n    \"          export_fn_v2 = _pv2_export.PerfMetricsExport.from_cluster_config(\\n\"\n    \"              cluster_config=self.cluster_config,\\n\"\n    \"              trace_dir=\\\"gs://ubench-logs/g4r55/perf_traces\\\",\\n\"\n    \"          ).export_metrics\\n\"\n    \"          print(\\\"PERF-V2: perfetto export enabled -> \\\"\\n\"\n    \"                \\\"gs://ubench-logs/g4r55/perf_traces\\\")\\n\"\n    \"        except Exception as _pv2_e:  # pylint: disable=broad-except\\n\"\n    \"          print(\\\"PERF-V2: DISABLED (init failed):\\\", _pv2_e)\\n\"\n    \"          export_fn_v2 = None\\n\"\n)\n\nsrc = src.replace(ANCHOR, INJECT, 1)\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\nopen(P, \"w\", encoding=\"utf-8\").write(src)\nprint(\"PERF-V2 PATCH: APPLIED\")"
  patch_phasetime.py: "\"\"\"Phasetime v2 -- split the `other` residual INTO its components.\n\nV1 (runs 10/10b) plus TensorBoard arithmetic already proved the ~30 s `other`\nresidual is exactly `generate_and_compute_advantage - vllm_rollout`, i.e. the\nreward + advantage + data-marshaling stage between the vLLM generate call and\nthe train loop (verified to +-0.5 s on three matched steps). V2 answers the\nnext question: WHICH of those dominates. It keeps all four v1 timers and adds:\n\n    engine_generate    RLCluster.generate wall -- the vLLM call INCLUDING\n                       tunix-side detokenization; against TensorBoard's\n                       rollout_time this locates where detokenize lands\n    compute_rewards    RLLearner._compute_rewards wall -- the Python reward\n                       functions (match_format_*, check_numbers) over 2048\n                       completions\n\nDerived offline, no extra timers needed:\n    marshal+advantage  = generate_and_advantage - engine_generate\n                         - compute_rewards\n    (contains the 2048 x 8192 pad-and-stack ~67 MB numpy build, jnp\n    conversions, advantage estimator, device_put)\n\nSame mechanics as v1: append-and-monkeypatch on the class objects, six\nperf_counter pairs per global step, no device sync, JSON per step to\n<ARTIFACT_DIR>/<run>/phasetime/step_NNNNNN.json plus a PHASETIME stdout line.\n\nCIRCULAR-IMPORT NOTE. rl_learner imports rl_cluster at module load, so the\nblock appended to rl_cluster.py must import rl_learner LAZILY inside the\nwrapper body, never at module level.\n\nFAIL-OPEN. Any missing class/method prints FAILED and exits 0 without\nwriting. Prints exactly one of:\n    PHASETIME2 PATCH: APPLIED\n    PHASETIME2 PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tunix\"\nRL = os.path.join(ROOT, \"rl/rl_learner.py\")\nGL = os.path.join(ROOT, \"rl/grpo/grpo_learner.py\")\nRC = os.path.join(ROOT, \"rl/rl_cluster.py\")\n\n\ndef fail(msg):\n    print(f\"PHASETIME2 PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nfor p in (RL, GL, RC):\n    if not os.path.exists(p):\n        fail(f\"{p} not found\")\n\nrl_src = open(RL, encoding=\"utf-8\").read()\ngl_src = open(GL, encoding=\"utf-8\").read()\nrc_src = open(RC, encoding=\"utf-8\").read()\n\nif any(\"_PHASETIME\" in s for s in (rl_src, gl_src, rc_src)):\n    print(\"PHASETIME2 PATCH: already patched\")\n    sys.exit(0)\n\nfor needle, where in ((\"class RLLearner\", \"rl_learner.py\"),\n                      (\"def _run_global_step\", \"rl_learner.py\"),\n                      (\"def _prepare_data\", \"rl_learner.py\"),\n                      (\"def _run_all_micro_batch_steps\", \"rl_learner.py\"),\n                      (\"def _compute_rewards\", \"rl_learner.py\")):\n    if needle not in rl_src:\n        fail(f\"'{needle}' not present in {where}\")\nfor needle in (\"class GRPOLearner\", \"def _generate_and_compute_advantage\"):\n    if needle not in gl_src:\n        fail(f\"'{needle}' not present in grpo_learner.py\")\nfor needle in (\"RLCluster\", \"def generate\"):  # _PT_ANCHOR: tunix>=408ca1d9 renamed class RLEngine, keeps alias RLCluster = RLEngine\n    if needle not in rc_src:\n        fail(f\"'{needle}' not present in rl_cluster.py\")\n\nRL_APPEND = '''\n\n# --- _PHASETIME v2: break out the `other` residual --------------------------------\n# Appended by patch_phasetime2.py. Six perf_counter pairs per global step; no\n# device sync. Wrappers are installed on the class objects only.\ntry:\n  import time as _pt_time\n  import json as _pt_json\n  import os as _pt_os\n\n  _PHASETIME = {}\n\n  def _pt_add(_name, _dt):\n    _PHASETIME[_name] = _PHASETIME.get(_name, 0.0) + float(_dt)\n\n  def _pt_wrap(_cls, _meth, _label):\n    _orig = getattr(_cls, _meth)\n\n    def _w(self, *a, **k):\n      _t0 = _pt_time.perf_counter()\n      try:\n        return _orig(self, *a, **k)\n      finally:\n        _pt_add(_label, _pt_time.perf_counter() - _t0)\n\n    _w.__name__ = getattr(_orig, \"__name__\", _meth)\n    setattr(_cls, _meth, _w)\n\n  def _pt_flush(self):\n    try:\n      _step = -1\n      try:\n        _step = int(self.rl_cluster.global_steps)\n      except Exception:\n        pass\n      _rec = dict(_PHASETIME)\n      _rec[\"step\"] = _step\n      print(\"PHASETIME step=%d \" % _step\n            + \" \".join(\"%s=%.2f\" % (_k, _v) for _k, _v in sorted(_rec.items())\n                       if _k != \"step\"), flush=True)\n      _run = _pt_os.environ.get(\"JOB_IDENTIFIER\", \"unknown-run\")\n      _art = _pt_os.environ.get(\"ARTIFACT_DIR\", \"\")\n      if _art.startswith(\"gs://\"):\n        from google.cloud import storage as _st\n        _b, _, _pre = _art[5:].partition(\"/\")\n        _key = \"%s/%s/phasetime/step_%06d.json\" % (_pre.rstrip(\"/\"), _run, _step)\n        _st.Client().bucket(_b).blob(_key.lstrip(\"/\")).upload_from_string(\n            _pt_json.dumps(_rec), content_type=\"application/json\")\n    except Exception as _e:\n      print(\"PHASETIME ERROR: %r\" % (_e,), flush=True)\n    finally:\n      _PHASETIME.clear()\n\n  _pt_wrap(RLLearner, \"_prepare_data\", \"prepare_data\")\n  _pt_wrap(RLLearner, \"_run_all_micro_batch_steps\", \"micro_batch_steps\")\n  _pt_wrap(RLLearner, \"_compute_rewards\", \"compute_rewards\")\n\n  _pt_orig_gs = RLLearner._run_global_step\n\n  def _pt_global_step(self, *a, **k):\n    _t0 = _pt_time.perf_counter()\n    try:\n      return _pt_orig_gs(self, *a, **k)\n    finally:\n      _pt_add(\"run_global_step\", _pt_time.perf_counter() - _t0)\n      _pt_flush(self)\n\n  RLLearner._run_global_step = _pt_global_step\nexcept Exception as _e:\n  print(\"PHASETIME ERROR (install): %r\" % (_e,), flush=True)\n# --- end _PHASETIME ---------------------------------------------------------------\n'''\n\nGL_APPEND = '''\n\n# --- _PHASETIME v2: time the GRPO payload inside prepare_data ---------------------\ntry:\n  import time as _pt2_time\n  from tunix.rl import rl_learner as _pt2_rl\n\n  _pt2_orig = GRPOLearner._generate_and_compute_advantage\n\n  def _pt2_w(self, *a, **k):\n    _t0 = _pt2_time.perf_counter()\n    try:\n      return _pt2_orig(self, *a, **k)\n    finally:\n      try:\n        _pt2_rl._pt_add(\"generate_and_advantage\", _pt2_time.perf_counter() - _t0)\n      except Exception:\n        pass\n\n  GRPOLearner._generate_and_compute_advantage = _pt2_w\nexcept Exception as _e:\n  print(\"PHASETIME ERROR (grpo install): %r\" % (_e,), flush=True)\n# --- end _PHASETIME ---------------------------------------------------------------\n'''\n\nRC_APPEND = '''\n\n# --- _PHASETIME v2: time the engine generate call (vLLM + detokenize) -------------\n# NOTE: rl_learner imports THIS module at load time, so rl_learner must be\n# imported lazily inside the wrapper to avoid a circular import.\ntry:\n  import time as _pt3_time\n\n  _pt3_orig = RLCluster.generate\n\n  def _pt3_w(self, *a, **k):\n    _t0 = _pt3_time.perf_counter()\n    try:\n      return _pt3_orig(self, *a, **k)\n    finally:\n      try:\n        from tunix.rl import rl_learner as _pt3_rl\n        _pt3_rl._pt_add(\"engine_generate\", _pt3_time.perf_counter() - _t0)\n      except Exception:\n        pass\n\n  _pt3_w.__name__ = \"generate\"\n  RLCluster.generate = _pt3_w\nexcept Exception as _e:\n  print(\"PHASETIME ERROR (cluster install): %r\" % (_e,), flush=True)\n# --- end _PHASETIME ---------------------------------------------------------------\n'''\n\nnew_rl = rl_src + RL_APPEND\nnew_gl = gl_src + GL_APPEND\nnew_rc = rc_src + RC_APPEND\nfor name, s in ((\"rl_learner.py\", new_rl), (\"grpo_learner.py\", new_gl),\n                (\"rl_cluster.py\", new_rc)):\n    try:\n        ast.parse(s)\n    except SyntaxError as e:\n        fail(f\"patched {name} does not parse: {e}\")\n\nopen(RL, \"w\", encoding=\"utf-8\").write(new_rl)\nopen(GL, \"w\", encoding=\"utf-8\").write(new_gl)\nopen(RC, \"w\", encoding=\"utf-8\").write(new_rc)\n\nproblems = []\nv_rl = open(RL, encoding=\"utf-8\").read()\nv_gl = open(GL, encoding=\"utf-8\").read()\nv_rc = open(RC, encoding=\"utf-8\").read()\nif \"_pt_flush\" not in v_rl or 'compute_rewards\"' not in v_rl:\n    problems.append(\"rl_learner wrappers missing\")\nif \"_pt2_w\" not in v_gl:\n    problems.append(\"grpo_learner wrapper missing\")\nif \"_pt3_w\" not in v_rc:\n    problems.append(\"rl_cluster wrapper missing\")\nif v_rl.count(\"def _run_global_step\") != 1:\n    problems.append(\"rl_learner._run_global_step disturbed\")\nfor name, s in ((\"rl_learner.py\", v_rl), (\"grpo_learner.py\", v_gl),\n                (\"rl_cluster.py\", v_rc)):\n    try:\n        ast.parse(s)\n    except SyntaxError as e:\n        problems.append(f\"reparse {name}: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"PHASETIME2 PATCH: APPLIED\")"
  patch_profiler_fix.py: "\"\"\"_PROFILER_FIX: disable the tunix trainer profiler when its step window is\ninvalid. In the RL setup the PeftTrainer is built with initial_step==max_step\n(=num_batches*grad_accum, e.g. 160), so first_profile_step = initial_step +\nskip_first_n_steps (161) > last_profile_step (160) -> ValueError crash at\ntunix/sft/profiler.py __init__. This trainer profiler yields no HBM/roofline\nfor us (we use the PERF-V2 phased profiler for the rollout); disable it cleanly\ninstead of crashing. Fail-open, idempotent.\"\"\"\ndef _patch():\n    try:\n        import tunix.sft.profiler as P\n        fp = P.__file__\n        src = open(fp).read()\n        if \"_PROFILER_FIX\" in src:\n            print(\"PROFILER-FIX: already applied\", flush=True); return\n        anchor = ('    if self._first_profile_step >= self._last_profile_step:\\n'\n                  '      raise ValueError(\\n'\n                  '          f\"First profile step {self._first_profile_step} cannot be greater\"\\n'\n                  '          f\" than the last profile step {self._last_profile_step}.\"\\n'\n                  '      )\\n')\n        repl = ('    if self._first_profile_step >= self._last_profile_step:\\n'\n                '      # _PROFILER_FIX invalid window -> disable trainer profiler, do not crash\\n'\n                '      self._first_profile_step = 1000000000\\n'\n                '      self._last_profile_step = 1000000001\\n')\n        n = src.count(anchor)\n        if n == 1:\n            src = src.replace(anchor, repl, 1)\n            compile(src, fp, \"exec\"); open(fp, \"w\").write(src)\n            print(\"PROFILER-FIX: disabled invalid-window trainer profiler\", flush=True)\n        else:\n            print(\"PROFILER-FIX: anchor count %d (skipped)\" % n, flush=True)\n    except Exception as e:\n        print(\"PROFILER-FIX: failed %r\" % (e,), flush=True)\n_patch()"
  patch_reward_dump.py: "\"\"\"Per-item reward diagnostics dump (REWARD-DUMP lines).\n\nAppends wrappers in utils_rl so each step prints, for the first REWARD_DUMP_N items,\none line pairing everything a reward audit needs:\n    REWARD-DUMP step-local i=K fmt=<match_format_exactly score> score=<check_numbers score>\n        guess=<extracted answer> gold=<target answers> n_chars=<len> tail=<last 40 chars>\nGated by env REWARD_DUMP_N (default 0 = silent; DL_RWDUMP knob). Applied AFTER\npatch_fast_extract / patch_g4_format_guard so it wraps the final bindings.\nFAIL-OPEN. Prints REWARD-DUMP PATCH: APPLIED | FAILED <reason>.\"\"\"\nimport sys\nP = \"/deps/src/maxtext/trainers/post_train/rl/utils_rl.py\"\ns = open(P).read()\nif \"_REWARD_DUMP\" in s:\n    print(\"REWARD-DUMP PATCH: already applied\", flush=True); sys.exit(0)\nfor name in (\"def check_numbers(\", \"def match_format_exactly(\"):\n    if name not in s:\n        print(\"REWARD-DUMP PATCH: FAILED anchor %s\" % name, flush=True); sys.exit(0)\ns += r'''\n# --- _REWARD_DUMP ----------------------------------------------------------------\nimport os as _rd_os\n_RD_N = int(_rd_os.environ.get(\"REWARD_DUMP_N\", \"0\"))\n_RD_FMT = {\"scores\": None}\n_rd_orig_mfe = match_format_exactly\ndef match_format_exactly(prompts, completions, tmvp_config, **kargs):  # noqa: F811\n    r = _rd_orig_mfe(prompts, completions, tmvp_config, **kargs)\n    try:\n        _RD_FMT[\"scores\"] = list(r)\n    except Exception:\n        _RD_FMT[\"scores\"] = None\n    return r\n_rd_orig_cn = check_numbers\ndef check_numbers(prompts, completions, answer, tmvp_config, **kargs):  # noqa: F811\n    r = _rd_orig_cn(prompts, completions, answer, tmvp_config, **kargs)\n    if _RD_N > 0:\n        try:\n            fmt = _RD_FMT[\"scores\"] or []\n            for i in range(min(_RD_N, len(completions))):\n                c = completions[i]\n                try:\n                    guess = extract_answer(c, tmvp_config)\n                except Exception as _e:\n                    guess = \"<extract-error:%r>\" % (_e,)\n                # compute fmt inline (pool workers hide the wrapped fn's scores)\n                try:\n                    _rs = \"\" if getattr(tmvp_config, \"reasoning_start_token_in_prompt\", False) else tmvp_config.reasoning_start_token\n                    _ok = False\n                    _i0 = c.find(_rs) if _rs else 0\n                    if _i0 >= 0:\n                        _j = c.find(tmvp_config.reasoning_end_token, _i0 + len(_rs))\n                        if _j >= 0:\n                            _k = c.find(tmvp_config.solution_start_token, _j)\n                            if _k >= 0 and c.find(tmvp_config.solution_end_token, _k + 1) >= 0:\n                                _ok = True\n                    _fmt_v = round(float(tmvp_config.reward_exact_format_match), 4) if _ok else 0.0\n                except Exception:\n                    _fmt_v = \"?\"\n                print(\"REWARD-DUMP i=%d fmt=%s score=%s guess=%r gold=%r n_chars=%d tail=%r\" % (\n                    i, _fmt_v,\n                    round(float(list(r)[i]), 4), str(guess)[:60], str(answer[i])[:60],\n                    len(c), c[-40:]), flush=True)\n        except Exception as _e:\n            print(\"REWARD-DUMP ERROR: %r\" % (_e,), flush=True)\n    return r\n'''\ncompile(s, P, \"exec\"); open(P, \"w\").write(s)\nprint(\"REWARD-DUMP PATCH: APPLIED (REWARD_DUMP_N=%s)\" % __import__('os').environ.get(\"REWARD_DUMP_N\", \"0(default)\"), flush=True)\n"
  patch_reward_parallel.py: "\"\"\"Parallelize the GRPO reward functions across processes.\n\nWHY. Phasetime v2 (run 11) measured the ~30 s `other` residual as almost\nentirely `compute_rewards` (29.77 s at step 1; marshal+advantage is 0.3 s).\nThe reward functions (match_format_*, check_numbers) are pure-Python\nregex/parsing over 2048 independent (prompt, completion) pairs, run serially\non one core while 28-44 head-node cores idle. Expected: ~30 s -> 2-4 s,\ni.e. step ~157 s -> ~132 s.\n\nHOW. Append-and-monkeypatch on tunix/rl/reward_manager.py:\n`SequenceRewardManager._compute_rewards` is replaced by a version that keeps\nthe original signature-inspection logic but calls each reward_fn on CHUNKS of\nthe batch in a fork-based process pool, concatenating results in order.\nCorrectness properties:\n  - per-pair independence: chunking is exact for sequence-level rewards\n  - kwargs that are per-example sequences (len == num_prompts, e.g. ground\n    truth answer columns) are chunked in lockstep; scalars pass through\n  - results are concatenated in chunk order -> byte-identical to serial\n  - ANY error in the parallel path (pickling, fn signature, worker crash)\n    logs one warning and falls back to the ORIGINAL serial implementation\nVALIDITY GATE for the run carrying this patch: rewards/train/mean must equal\nthe unpatched run step-for-step (deterministic seeds make rewards exactly\nreproducible).\n\nTunables via env:\n  TUNIX_REWARD_WORKERS   pool size (default min(32, cpu_count))\n  TUNIX_REWARD_PARALLEL  set to \"0\" to disable (keeps serial path)\n\nFAIL-OPEN. Any missing anchor prints FAILED and exits 0.\nPrints exactly one of:\n    REWARD-PAR PATCH: APPLIED\n    REWARD-PAR PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tunix\"\nRM = os.path.join(ROOT, \"rl/reward_manager.py\")\n\n\ndef fail(msg):\n    print(f\"REWARD-PAR PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nif not os.path.exists(RM):\n    fail(f\"{RM} not found\")\nsrc = open(RM, encoding=\"utf-8\").read()\n\nif \"_REWARD_PAR\" in src:\n    print(\"REWARD-PAR PATCH: already patched\")\n    sys.exit(0)\n\nfor needle in (\"class SequenceRewardManager\", \"def _compute_rewards\",\n               \"def _prepare_log_metrics\"):\n    if needle not in src:\n        fail(f\"'{needle}' not present in reward_manager.py\")\n\nAPPEND = '''\n\n# --- _REWARD_PAR: process-pool reward computation ---------------------------------\n# Appended by patch_reward_parallel.py (see its docstring). The serial\n# implementation above is kept intact as the fallback.\ntry:\n  import os as _rp_os\n  import numpy as _rp_np\n  import multiprocessing as _rp_mp\n  from dataclasses import asdict as _rp_asdict\n  import inspect as _rp_inspect\n  import logging as _rp_logging\n\n  _rp_serial_compute = SequenceRewardManager._compute_rewards\n  _rp_pool = [None]\n  _rp_warned = [False]\n  # Reward fns that must run serially in the parent (learned at runtime):\n  # a fn that spawns its own subprocesses fails inside Pool's daemonic\n  # workers (\"daemonic processes are not allowed to have children\") -- true\n  # for check_numbers, whose math_verify grading dispatches to its own\n  # persistent spawn pool. In the parent that internal pool works normally,\n  # and its width is a MaxText config knob (math_verify_num_procs).\n  _rp_serial_fns = set()\n\n  def _rp_get_pool():\n    if _rp_pool[0] is None:\n      # The tunix trainer runs as a DAEMONIC child of the launcher process,\n      # and multiprocessing forbids daemons from having children (run 12\n      # failed here with \"daemonic processes are not allowed to have\n      # children\"). The flag is inherited launcher plumbing, not a property\n      # this code relies on: clear it so the pool can fork. The only\n      # daemon-flag semantics lost are auto-termination of OUR workers if\n      # the trainer dies mid-step; the pod teardown reaps them anyway.\n      try:\n        _cur = _rp_mp.current_process()\n        if _cur._config.get(\"daemon\"):\n          _cur._config[\"daemon\"] = False\n      except Exception:\n        pass\n      n = int(_rp_os.environ.get(\"TUNIX_REWARD_WORKERS\",\n                                 min(32, _rp_os.cpu_count() or 8)))\n      _rp_pool[0] = _rp_mp.get_context(\"fork\").Pool(processes=n)\n    return _rp_pool[0]\n\n  def _rp_parallel_compute(self, prompts, completions, **kwargs):\n    if _rp_os.environ.get(\"TUNIX_REWARD_PARALLEL\", \"1\") == \"0\":\n      return _rp_serial_compute(self, prompts, completions, **kwargs)\n    try:\n      algo_config_params = _rp_asdict(self.algo_config)\n      base_kwargs = kwargs.copy()\n      num_prompts = len(prompts)\n      num_reward_fns = len(self.reward_fns)\n      rewards = _rp_np.zeros((num_prompts, num_reward_fns))\n\n      pool = _rp_get_pool()\n      n_chunks = max(1, min(pool._processes * 2, num_prompts))\n      bounds = [(num_prompts * c) // n_chunks for c in range(n_chunks + 1)]\n\n      for i, reward_fn in enumerate(self.reward_fns):\n        signature = _rp_inspect.signature(reward_fn)\n        reward_fn_config_params = {}\n        for name, _ in signature.parameters.items():\n          if name in [\"self\", \"prompts\", \"completions\", \"kwargs\"]:\n            continue\n          if name in algo_config_params and name not in base_kwargs:\n            reward_fn_config_params[name] = algo_config_params[name]\n        call_kwargs = base_kwargs.copy()\n        call_kwargs.update(reward_fn_config_params)\n\n        fn_name = getattr(reward_fn, \"__name__\", str(reward_fn))\n        if fn_name in _rp_serial_fns:\n          # This fn previously failed in a worker (e.g. it spawns its own\n          # subprocesses, which Pool's daemonic workers forbid -- true for\n          # check_numbers' math_verify pool). Run it serially in the parent,\n          # where its internal parallelism works as usual.\n          full_kwargs = dict(call_kwargs)\n          full_kwargs[\"prompts\"] = list(prompts)\n          full_kwargs[\"completions\"] = list(completions)\n          flat = list(reward_fn(**full_kwargs))\n        else:\n          try:\n            jobs = []\n            for c in range(n_chunks):\n              lo, hi = bounds[c], bounds[c + 1]\n              if lo == hi:\n                continue\n              ck = {}\n              for k, v in call_kwargs.items():\n                if isinstance(v, (list, tuple)) and len(v) == num_prompts:\n                  ck[k] = list(v[lo:hi])\n                elif isinstance(v, _rp_np.ndarray) and len(v) == num_prompts:\n                  ck[k] = v[lo:hi]\n                else:\n                  ck[k] = v\n              ck[\"prompts\"] = list(prompts[lo:hi])\n              ck[\"completions\"] = list(completions[lo:hi])\n              jobs.append(pool.apply_async(reward_fn, kwds=ck))\n            parts = [j.get(timeout=180) for j in jobs]\n            flat = [x for part in parts for x in list(part)]\n          except Exception as _fe:\n            _rp_serial_fns.add(fn_name)\n            _rp_logging.warning(\n                \"REWARD-PAR: fn %s failed in workers (%r); running it \"\n                \"serially in the parent from now on.\", fn_name, _fe)\n            full_kwargs = dict(call_kwargs)\n            full_kwargs[\"prompts\"] = list(prompts)\n            full_kwargs[\"completions\"] = list(completions)\n            flat = list(reward_fn(**full_kwargs))\n        if len(flat) != num_prompts:\n          raise RuntimeError(\n              \"parallel reward length mismatch for %s: %d vs %d\"\n              % (fn_name, len(flat), num_prompts))\n        rewards[:, i] = _rp_np.array(flat)\n\n      log_metrics = self._prepare_log_metrics(prompts, completions, rewards)\n      return {\n          \"rewards\": _rp_np.nansum(rewards, axis=1),\n          \"log_metrics\": log_metrics,\n      }\n    except Exception as _e:\n      if not _rp_warned[0]:\n        _rp_warned[0] = True\n        _rp_logging.warning(\n            \"REWARD-PAR: parallel path failed (%r); falling back to the \"\n            \"serial implementation for the rest of the run.\", _e)\n      _rp_os.environ[\"TUNIX_REWARD_PARALLEL\"] = \"0\"\n      return _rp_serial_compute(self, prompts, completions, **kwargs)\n\n  SequenceRewardManager._compute_rewards = _rp_parallel_compute\nexcept Exception as _e:\n  print(\"REWARD-PAR ERROR (install): %r\" % (_e,), flush=True)\n# --- end _REWARD_PAR --------------------------------------------------------------\n'''\n\nnew = src + APPEND\ntry:\n    ast.parse(new)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(RM, \"w\", encoding=\"utf-8\").write(new)\n\nv = open(RM, encoding=\"utf-8\").read()\nproblems = []\nif \"_rp_parallel_compute\" not in v:\n    problems.append(\"wrapper missing\")\nif v.count(\"def _compute_rewards\") != 1:\n    problems.append(\"serial _compute_rewards definition disturbed\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    problems.append(f\"reparse failed: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"REWARD-PAR PATCH: APPLIED\")"
  patch_length_shape.py: "\"\"\"LENGTH-SHAPE: add a conciseness penalty to the GRPO total reward that targets the\nSTRAGGLER tail (long, usually-WRONG rambling completions) WITHOUT touching correct answers.\n\nWHY (measured, g4r38 reward dump, n=44): correct completions are short (median 1776,\np95 2982 chars, max 6283); WRONG completions are long (median 4292, p90 8155, max 20346).\nThe rollout straggler (longest-of-2048 per step => makespan = longest * per-step) is\ndominated by these long wrong rambles. So a penalty that ramps in ABOVE the correct-p95\nsteers the model off the long-wrong tail while leaving correct answers (all below target)\nessentially unpenalized.\n\nDESIGN (parity-preserving by construction, not just by gate):\n  penalty_i = -LAMBDA * clip((n_chars_i - TARGET) / SCALE, 0, 1)\n  total_reward_i += penalty_i\n- Correct answers (n_chars < TARGET) get ~0 penalty => check_numbers parity structurally held.\n- The penalty magnitude (<= LAMBDA ~ 0.25) stays below the correctness reward (~1.0), so in\n  mixed groups correct answers keep positive GRPO advantage; it only re-ranks WITHIN a group\n  toward shorter (among wrong: shorter wrong > longer wrong; among correct: ~unchanged).\n- check_numbers and every other reward_fn are UNTOUCHED => the reported parity metric\n  (REWARD-DUMP score=) stays pure and gated.\n\nWIRING: wraps SequenceRewardManager._compute_rewards. MUST be applied AFTER\npatch_reward_parallel.py (which installs _rp_parallel_compute); this wrapper calls whatever\n_compute_rewards is currently bound, then adds the penalty to result[\"rewards\"] and records\ndiagnostics in result[\"log_metrics\"] (len_mean / len_p90 / shape_pen_mean / shape_frac_hit).\n\nEnv knobs (all optional):\n  LENGTH_SHAPE=1            enable (default off => exact no-op passthrough)\n  LENGTH_SHAPE_LAMBDA=0.25  max penalty magnitude\n  LENGTH_SHAPE_TARGET=3500  n_chars where penalty starts (set > correct p95 ~2982)\n  LENGTH_SHAPE_SCALE=9000   n_chars over which it ramps from 0 to LAMBDA\n\nFAIL-OPEN. Prints exactly one of: LENGTH-SHAPE PATCH: APPLIED | FAILED <reason>.\n\"\"\"\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tunix\"\nRM = os.path.join(ROOT, \"rl/reward_manager.py\")\n\n\ndef fail(msg):\n    print(f\"LENGTH-SHAPE PATCH: FAILED {msg}\", flush=True)\n    sys.exit(0)  # non-fatal: let the run start so the failure is visible in logs\n\n\nif not os.path.exists(RM):\n    fail(f\"{RM} not found\")\nsrc = open(RM, encoding=\"utf-8\").read()\n\nif \"_LENGTH_SHAPE\" in src:\n    print(\"LENGTH-SHAPE PATCH: already patched\", flush=True)\n    sys.exit(0)\n\nif \"class SequenceRewardManager\" not in src or \"def _compute_rewards\" not in src:\n    fail(\"SequenceRewardManager/_compute_rewards not present\")\n\nAPPEND = '''\n\n# --- _LENGTH_SHAPE: straggler-tail conciseness penalty on the total reward ---------\n# Appended by patch_length_shape.py (see its docstring). Wraps whatever\n# _compute_rewards is currently bound (serial OR the reward-parallel version) so it\n# MUST be invoked after patch_reward_parallel.py. No-op unless LENGTH_SHAPE=1.\ntry:\n  import os as _ls_os\n  import numpy as _ls_np\n  import logging as _ls_logging\n\n  _ls_inner = SequenceRewardManager._compute_rewards\n\n  def _ls_compute(self, prompts, completions, **kwargs):\n    out = _ls_inner(self, prompts, completions, **kwargs)\n    if _ls_os.environ.get(\"LENGTH_SHAPE\", \"0\") != \"1\":\n      return out\n    try:\n      lam = float(_ls_os.environ.get(\"LENGTH_SHAPE_LAMBDA\", \"0.25\"))\n      tgt = float(_ls_os.environ.get(\"LENGTH_SHAPE_TARGET\", \"3500\"))\n      scl = float(_ls_os.environ.get(\"LENGTH_SHAPE_SCALE\", \"9000\"))\n      lens = _ls_np.array([len(c) for c in completions], dtype=_ls_np.float64)\n      ramp = _ls_np.clip((lens - tgt) / max(scl, 1.0), 0.0, 1.0)\n      pen = -lam * ramp                      # <= 0, zero for lens <= tgt\n      r = _ls_np.asarray(out[\"rewards\"], dtype=_ls_np.float64)\n      if r.shape[0] != pen.shape[0]:\n        raise RuntimeError(\"length mismatch reward %d vs pen %d\" % (r.shape[0], pen.shape[0]))\n      out[\"rewards\"] = r + pen\n      # NOTE: do NOT inject into out[\"log_metrics\"] \u2014 rl_cluster.buffer_metrics expects\n      # each value to be a (value, op) tuple; a plain float raises \"cannot unpack\n      # non-iterable float object\" and crash-loops the run (observed in g4ucl). The\n      # print below is the monitoring channel instead.\n      print(\"LENGTH-SHAPE step: len_mean=%.0f len_p90=%.0f pen_mean=%.4f frac_hit=%.3f \"\n            \"(lam=%.3f tgt=%.0f scl=%.0f)\" % (\n            float(lens.mean()), float(_ls_np.percentile(lens, 90)), float(pen.mean()),\n            float((ramp > 0).mean()), lam, tgt, scl), flush=True)\n    except Exception as _e:\n      _ls_logging.warning(\"LENGTH-SHAPE: skipped this call (%r)\", _e)\n    return out\n\n  SequenceRewardManager._compute_rewards = _ls_compute\nexcept Exception as _e:\n  print(\"LENGTH-SHAPE ERROR (install): %r\" % (_e,), flush=True)\n# --- end _LENGTH_SHAPE ------------------------------------------------------------\n'''\n\nnew = src + APPEND\ntry:\n    ast.parse(new)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(RM, \"w\", encoding=\"utf-8\").write(new)\n\nv = open(RM, encoding=\"utf-8\").read()\nif \"_ls_compute\" not in v or v.count(\"def _compute_rewards\") != 1:\n    fail(\"verification failed (wrapper missing or serial def disturbed)\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    fail(f\"reparse failed: {e}\")\nprint(\"LENGTH-SHAPE PATCH: APPLIED (enable with LENGTH_SHAPE=1)\", flush=True)\n"
  patch_rpa_blocks.py: "\"\"\"Forward RPA_V3_*_BLOCK_SIZES on the MaxText serving path.\n\nTHE BUG. PR #3102 added the RPA v3 block-size env override, but wired it into\nONLY ONE of the two entry points to the kernel:\n\n  layers/jax/attention/attention.py       _rpa_block_size_kwargs() -> d_block_sizes  [WIRED]\n  layers/common/attention_interface.py    sharded_ragged_paged_attention(...)        [NOT WIRED]\n\nMaxText's forward_serve_vllm imports sharded_ragged_paged_attention from\nattention_interface, so OUR path is the unwired one. d_block_sizes therefore\narrives at the kernel as None and kernel.py `_prepare_block_sizes` falls back to\nget_default_block_sizes(), which for tpu7 DECODE sets BOTH bkv_sz and bkv_csz to\nmin(min_bkv_sz_to_peak, max_kv).\n\nMEASURED, not assumed: the decode_only trace from the reference profiling run contains\nexactly one kernel configuration --\n    RPAd-p_64-bq_1_1-bkv_16384_16384      138.4 ms = 74.7% of leaf decode time\n-- i.e. the untouched default, despite RPA_V3_DECODE_BLOCK_SIZES=1,16384,1,4096\nbeing present in the process environment. The compute block is 16384, not 4096.\n\nTHE FIX. Mirror attention.py:268 at the attention_interface call site: forward the\nthree env-derived tuples as kwargs when they are non-empty. Guarded by `not\nuse_hd64` because the hd64 kernel has a different signature (it derives its own\nsizes via get_tuned_block_sizes) -- same guard the surrounding code already uses\nfor update_kv_cache / use_causal_mask.\n\nHOW TO VERIFY IT WORKED. Re-read the decode_only xplane and look at the kernel\nname: it must become bkv_16384_4096. If it still says bkv_16384_16384 the patch\ndid not take effect and any timing comparison is void.\n\nPrints exactly one of:\n    RPA-BLOCKS PATCH: APPLIED\n    RPA-BLOCKS PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tpu_inference\"\nAI = os.path.join(ROOT, \"layers/common/attention_interface.py\")\n\n\ndef fail(msg):\n    print(f\"RPA-BLOCKS PATCH: FAILED {msg}\")\n    sys.exit(0)  # non-fatal: let the run start so the failure is visible in logs\n\n\nif not os.path.exists(AI):\n    fail(f\"{AI} not found\")\nsrc = open(AI, encoding=\"utf-8\").read()\n\nif \"_RPA_V3_BLOCK_SIZES_FORWARDED\" in src:\n    print(\"RPA-BLOCKS PATCH: already patched\")\n    sys.exit(0)\n\n# `envs` must already be imported in this module (it reads USE_BATCHED_RPA_KERNEL).\nif \"envs.USE_BATCHED_RPA_KERNEL\" not in src:\n    fail(\"envs is not referenced in attention_interface.py -- module layout changed\")\n\nANCHOR = \"\"\"        if not use_hd64:\n            kwargs[\"update_kv_cache\"] = update_kv_cache\n            kwargs[\"use_causal_mask\"] = use_causal_mask\n        return func(*args, **kwargs)\n\"\"\"\nif src.count(ANCHOR) != 1:\n    fail(f\"anchor found {src.count(ANCHOR)} times, expected 1\")\n\nINJECT = \"\"\"        if not use_hd64:\n            kwargs[\"update_kv_cache\"] = update_kv_cache\n            kwargs[\"use_causal_mask\"] = use_causal_mask\n            # _RPA_V3_BLOCK_SIZES_FORWARDED -- mirrors _rpa_block_size_kwargs()\n            # in layers/jax/attention/attention.py, which PR #3102 wired into the\n            # OTHER entry point. Without this the env override is silently\n            # ignored on the MaxText serving path and the kernel uses\n            # get_default_block_sizes().\n            for _kw, _val in (\n                    (\"d_block_sizes\", envs.RPA_V3_DECODE_BLOCK_SIZES),\n                    (\"p_block_sizes\", envs.RPA_V3_PREFILL_BLOCK_SIZES),\n                    (\"m_block_sizes\", envs.RPA_V3_MIXED_BLOCK_SIZES),\n            ):\n                if _val:\n                    kwargs[_kw] = tuple(_val)\n        return func(*args, **kwargs)\n\"\"\"\n\nsrc = src.replace(ANCHOR, INJECT, 1)\n\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(AI, \"w\", encoding=\"utf-8\").write(src)\n\nv = open(AI, encoding=\"utf-8\").read()\nproblems = []\nif \"_RPA_V3_BLOCK_SIZES_FORWARDED\" not in v:\n    problems.append(\"marker missing\")\nif \"envs.RPA_V3_DECODE_BLOCK_SIZES\" not in v:\n    problems.append(\"decode override missing\")\nif v.count(\"return func(*args, **kwargs)\") != src.count(\"return func(*args, **kwargs)\"):\n    problems.append(\"call site disturbed\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    problems.append(f\"reparse failed: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"RPA-BLOCKS PATCH: APPLIED\")"
  patch_runner_eos.py: "\"\"\"GEMMA4 line, stop fix part 2: the continuous-decode DEVICE loop stops rows via runner.eos_token_id\n(runner_utils.get_eos_token_id(model_config)) \u2014 the tunix/vLLM host-side stop_token_ids are irrelevant inside a CD window.\ng4-001d proved it: with stop ids [1,50,106] in sampling_params, step 0 was still 99.46% capped, byte-identical to 001c.\nUnion EXTRA_STOP_TOKEN_IDS into runner.eos_token_id (the CD masking and host extract already accept int-or-list).\nPrints RUNNER-EOS PATCH: APPLIED|FAILED and RUNNER-EOS ids=[...] at init.\"\"\"\nimport sys\nP = \"/usr/local/lib/python3.12/site-packages/tpu_inference/runner/tpu_runner.py\"\ns = open(P).read()\nif \"_RUNNER_EOS\" in s: print(\"RUNNER-EOS PATCH: already applied\", flush=True); sys.exit(0)\na = \"        self.eos_token_id = runner_utils.get_eos_token_id(self.model_config)\\n\"\nif s.count(a) != 1: print(\"RUNNER-EOS PATCH: FAILED anchor %d\" % s.count(a), flush=True); sys.exit(0)\nb = (\"        self.eos_token_id = runner_utils.get_eos_token_id(self.model_config)\\n\"\n     \"        # _RUNNER_EOS: union env EXTRA_STOP_TOKEN_IDS (chat-turn enders, e.g. gemma 106/50) into the CD stop set\\n\"\n     \"        import os as _re_os, json as _re_json\\n\"\n     \"        import numpy as _re_np\\n\"\n     \"        try:\\n\"\n     \"            _re_extra = [int(x) for x in _re_json.loads(_re_os.environ.get('EXTRA_STOP_TOKEN_IDS', '[]'))]\\n\"\n     \"        except Exception:\\n\"\n     \"            _re_extra = []\\n\"\n     \"        if _re_extra:\\n\"\n     \"            _re_base = self.eos_token_id\\n\"\n     \"            if _re_base is None:\\n\"\n     \"                _re_ids = _re_extra\\n\"\n     \"            elif isinstance(_re_base, (int, _re_np.integer)):\\n\"\n     \"                _re_ids = [int(_re_base)] + _re_extra\\n\"\n     \"            else:\\n\"\n     \"                _re_ids = [int(x) for x in _re_np.atleast_1d(_re_base).tolist()] + _re_extra\\n\"\n     \"            self.eos_token_id = tuple(sorted(set(_re_ids)))\\n\"\n     \"            print('RUNNER-EOS ids=%s' % (self.eos_token_id,), flush=True)\\n\")\ns = s.replace(a, b)\ncompile(s, P, \"exec\"); open(P, \"w\").write(s); print(\"RUNNER-EOS PATCH: APPLIED\", flush=True)"
  patch_sharded_sampling.py: "\"\"\"Vocab-sharded sampling + logprobs for the fused decode window.\n\nWHY. sampling.py force-replicates the logits over the vocab dim every decode\niteration (\"Unshard the logits explicitly...\", with an upstream TODO asking\nfor exactly this change): a (batch, 151936) f32 all-gather (~78 MB per DP\nrank per iteration), followed by topk_mask/topp_mask -- 32-33 full vocab-axis\nreduction sweeps each (the ~800us/call while-loops in every profile) -- and a\nfull-vocab categorical, all computed redundantly on every TP device. The\nlogprobs path (gather_logprobs) repeats full-vocab log_softmax + top-N + a\nrank reduction on the same replicated array.\n\nWHAT. Rebinds `sample` and `compute_and_gather_logprobs` with vocab-sharded\nimplementations under jax.shard_map:\n  - per TP shard: one lax.top_k over vocab/8, all-gather only the top-64\n    candidate (value, index) pairs (~0.4 MB vs ~78 MB);\n  - exact top-k cutoff, top-p cutoff, and categorical on the merged\n    candidates. EXACTNESS: temperature scaling is monotone (order preserved);\n    the union of per-shard top-64 contains the global top-k for k <= 64; the\n    cutoff mask keeps values >= cutoff exactly like topk_mask (ties\n    included); masked/non-candidate entries underflow to exactly zero\n    probability in f32 softmax, so top-p mass sums and the categorical\n    distribution equal the full-vocab computation. Verified on CPU with an\n    8-device mesh: kept sets identical on adversarial ties, greedy exact,\n    draw distribution within statistical noise, logprob top-N ids exact,\n    values within 1e-6, ranks exact (scratchpad/shard_proto.py).\n  - logprobs: log_softmax via pmax/psum, top-N from the same candidates\n    (log_softmax is monotone in logits), token logprob + rank via psum.\n\nWHAT CHANGES NUMERICALLY. The categorical RNG stream differs (noise drawn\nover candidates, not the full vocab), so sampled tokens are not bitwise equal\nto the old path -- distribution-equal only. Logprob VALUES shift ~1e-6 from\nreduction order. Validity gates for the run: LENDIST truncation band and\nreward band, not bitwise reward equality.\n\nGUARDS.\n  - lax.cond falls back to the ORIGINAL implementation for the whole batch\n    if any row has top_k <= 0 or top_k > 64 (e.g. eval \"liberal\" top_k=2000)\n    or top_p <= 0; both branches are compiled, only the taken one runs.\n  - compute_and_gather_logprobs falls back statically if max_logprobs > 48.\n  - env SHARDED_SAMPLING=0 disables the rebinding entirely at patch time...\n    is checked at RUNTIME by the wrappers, so the kill-switch works from the\n    manifest without re-patching.\n  - `sample`'s ret_logits in the sharded path is the RAW (still-sharded)\n    logits: valid for logprobs_mode=\"raw\" (our config). A processed_logprobs\n    deployment must disable this patch.\n\nFAIL-OPEN. Any missing anchor prints FAILED and exits 0.\nPrints exactly one of:\n    SHARDED-SAMPLING PATCH: APPLIED\n    SHARDED-SAMPLING PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tpu_inference\"\nSP = os.path.join(ROOT, \"layers/jax/sample/sampling.py\")\n\n\ndef fail(msg):\n    print(f\"SHARDED-SAMPLING PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nif not os.path.exists(SP):\n    fail(f\"{SP} not found\")\nsrc = open(SP, encoding=\"utf-8\").read()\n\nif \"_SHARDED_SAMPLING\" in src:\n    print(\"SHARDED-SAMPLING PATCH: already patched\")\n    sys.exit(0)\n\nfor needle in (\"def sample(\", \"def compute_and_gather_logprobs(\",\n               \"def gather_logprobs(\", \"def _apply_sampling_transforms(\",\n               \"ShardingAxisName\"):\n    if needle not in src:\n        fail(f\"anchor '{needle}' not present in sampling.py\")\n\nAPPEND = '''\n\n# --- _SHARDED_SAMPLING -------------------------------------------------------\n# Appended by patch_sharded_sampling.py (see its docstring). Rebinds `sample`\n# and `compute_and_gather_logprobs` below; originals are kept as fallbacks.\ntry:\n  import os as _ss_os\n  from jax import lax as _ss_lax\n  try:\n    from jax import shard_map as _ss_shard_map          # jax >= 0.8\n  except ImportError:\n    from jax.experimental.shard_map import shard_map as _ss_shard_map\n\n  _SS_CAND = 64\n  _SS_NEG = -1e12\n\n  _ss_orig_sample = sample\n  _ss_orig_cgl = compute_and_gather_logprobs\n\n  def _ss_axes(mesh):\n    \"\"\"(batch_axes, vocab_axis) restricted to axes present in the mesh.\"\"\"\n    def present(name):\n      if name is None:\n        return ()\n      if isinstance(name, (tuple, list)):\n        return tuple(a for a in name if a in mesh.axis_names)\n      return (name,) if name in mesh.axis_names else ()\n    batch = present(ShardingAxisName.ATTN_DATA)\n    vocab = present(ShardingAxisName.MODEL)\n    return batch, (vocab[0] if vocab else None)\n\n  def _ss_merged_candidates(x_blk, vocab_axis):\n    v_shard = x_blk.shape[-1]\n    midx = _ss_lax.axis_index(vocab_axis)\n    vals, idx = _ss_lax.top_k(x_blk, _SS_CAND)\n    gidx = idx + midx * v_shard\n    av = _ss_lax.all_gather(vals, vocab_axis)\n    ai = _ss_lax.all_gather(gidx, vocab_axis)\n    n = av.shape[0]\n    av = jnp.transpose(av, (1, 0, 2)).reshape(-1, n * _SS_CAND)\n    ai = jnp.transpose(ai, (1, 0, 2)).reshape(-1, n * _SS_CAND)\n    return av, ai\n\n  def _ss_greedy(cv, ci):\n    m = jnp.max(cv, axis=-1, keepdims=True)\n    big = jnp.iinfo(jnp.int32).max\n    return jnp.min(jnp.where(cv >= m, ci, big), axis=-1)\n\n  def _ss_kth(cv, k):\n    sv = -jnp.sort(-cv, axis=-1)\n    kk = jnp.clip(k, 1, cv.shape[-1]) - 1\n    return jnp.take_along_axis(sv, kk[:, None], axis=-1)\n\n  def _ss_topp_cutoff(probs, p):\n    sp = -jnp.sort(-probs, axis=-1)\n    cum = jnp.cumsum(sp, axis=-1)\n    jstar = jnp.argmax(cum >= p[:, None], axis=-1)\n    return jnp.take_along_axis(sp, jstar[:, None], axis=-1)\n\n  def _ss_sample_block(vocab_axis, batch_axes, rng, x, temperature, top_k,\n                       top_p, do_argmax_only):\n    # x: (b_local, v_shard) f32\n    didx = 0\n    for i, a in enumerate(batch_axes):\n      didx = didx * _ss_lax.axis_size(a) + _ss_lax.axis_index(a)\n    xt = x / temperature[:, None]\n    cv, ci = _ss_merged_candidates(xt, vocab_axis)\n    greedy = _ss_greedy(cv, ci)\n    if do_argmax_only:\n      return _ss_lax.pmax(greedy, vocab_axis)\n    kth = _ss_kth(cv, top_k)\n    mk = jnp.where((top_k > 0)[:, None] & ~(cv >= kth), _SS_NEG, cv)\n    probs = jax.nn.softmax(mk, axis=-1)\n    pcut = _ss_topp_cutoff(probs, top_p)\n    mp = jnp.where((top_p < 1.0)[:, None] & ~(probs >= pcut), _SS_NEG, mk)\n    r = jax.random.fold_in(rng, didx)\n    choice = jax.random.categorical(r, mp)\n    sampled = jnp.take_along_axis(ci, choice[:, None], axis=-1)[:, 0]\n    out = jnp.where(temperature < _SAMPLING_EPS, greedy, sampled)\n    # Values are identical on every vocab shard (built from all-gathered\n    # candidates); the pmax is an identity that makes that replication\n    # provable to shard_map's output check on every jax version.\n    return _ss_lax.pmax(out, vocab_axis)\n\n  def _ss_sample(rng, mesh, logits, meta):\n    batch_axes, vocab_axis = _ss_axes(mesh)\n    bspec = P(batch_axes if batch_axes else None)\n    lspec = P(batch_axes if batch_axes else None, vocab_axis)\n    logits = jax.lax.with_sharding_constraint(logits,\n                                              NamedSharding(mesh, lspec))\n\n    def blk(rng, x, t, k, p):\n      return _ss_sample_block(vocab_axis, batch_axes, rng, x, t, k, p,\n                              do_argmax_only=not meta.do_sampling)\n\n    tokens = _ss_shard_map(blk, mesh=mesh,\n                           in_specs=(P(), lspec, bspec, bspec, bspec),\n                           out_specs=bspec)(\n                               rng, logits, meta.temperature.astype(\n                                   jnp.float32), meta.top_k, meta.top_p)\n    tokens = jax.lax.with_sharding_constraint(tokens, NamedSharding(mesh, P()))\n    return tokens, logits\n\n  def sample(rng, mesh, logits, tpu_sampling_metadata):\n    if _ss_os.environ.get(\"SHARDED_SAMPLING\", \"1\") == \"0\":\n      return _ss_orig_sample(rng, mesh, logits, tpu_sampling_metadata)\n    meta = tpu_sampling_metadata\n    if meta._cache_collision_dummy is not None:\n      logits = logits + 0 * jnp.sum(meta._cache_collision_dummy)\n    _, vocab_axis = _ss_axes(mesh)\n    if vocab_axis is None:\n      return _ss_orig_sample(rng, mesh, logits, meta)\n    logits = logits.astype(jnp.float32)\n    if not meta.do_sampling:\n      return _ss_sample(rng, mesh, logits, meta)\n    # _SS_PADFIX: tpu_inference fills PADDED request rows with top_k=0\n    # (DEFAULT_SAMPLING_PARAMS), which made this whole-batch guard fall back\n    # to the full-vocab sampler whenever any row was padding (profile run 48:\n    # all-gather.5 385us + topk/topp while-loops every decode step). Rows\n    # with top_k<=0 are padding under our config (real rows always top_k=50):\n    # give them top_k=_SS_CAND / top_p=1.0 inside the sharded path instead.\n    import dataclasses as _ss_dc\n    _tk = jnp.where(meta.top_k <= 0, jnp.asarray(_SS_CAND, meta.top_k.dtype), meta.top_k)\n    _tp = jnp.where(meta.top_k <= 0, jnp.asarray(1.0, meta.top_p.dtype), meta.top_p)\n    meta = _ss_dc.replace(meta, top_k=_tk, top_p=_tp)\n    safe = jnp.all((_tk <= _SS_CAND) & (_tp > 0.0))\n    return _ss_cond_sample(safe, rng, mesh, logits, meta)\n\n  def _ss_cond_sample(safe, rng, mesh, logits, meta):\n    # mesh/meta are closed over rather than passed as lax.cond operands\n    # (Mesh is not a valid JAX type). Both branches constrain ret_logits to\n    # the SHARDED spec so cond-output unification cannot reintroduce the\n    # vocab all-gather on the hot path (the fallback branch has already paid\n    # its own gather internally; re-constraining its output is cheap).\n    batch_axes, vocab_axis = _ss_axes(mesh)\n    lspec = P(batch_axes if batch_axes else None, vocab_axis)\n\n    def tru(op):\n\
    \      r, lg = op\n      return _ss_sample(r, mesh, lg, meta)\n\n    def fls(op):\n      r, lg = op\n      toks, ret = _ss_orig_sample(r, mesh, lg, meta)\n      ret = jax.lax.with_sharding_constraint(ret, NamedSharding(mesh, lspec))\n      return toks, ret\n\n    return jax.lax.cond(safe, tru, fls, (rng, logits))\n\n  def compute_and_gather_logprobs(logits, next_tokens, max_logprobs):\n    if (_ss_os.environ.get(\"SHARDED_SAMPLING\", \"1\") == \"0\"\n        or max_logprobs > 48):\n      return _ss_orig_cgl(logits, next_tokens, max_logprobs)\n    # Mesh is implicit here (no arg); derive from the array sharding if\n    # available, else fall back.\n    sh = getattr(logits, \"sharding\", None)\n    mesh = getattr(sh, \"mesh\", None)\n    if mesh is None or getattr(mesh, \"empty\", False):\n      return _ss_orig_cgl(logits, next_tokens, max_logprobs)\n    batch_axes, vocab_axis = _ss_axes(mesh)\n    if vocab_axis is None:\n      return _ss_orig_cgl(logits, next_tokens, max_logprobs)\n    bspec = P(batch_axes if batch_axes else None)\n    lspec = P(batch_axes if batch_axes else None, vocab_axis)\n    logits = jax.lax.with_sharding_constraint(\n        logits, NamedSharding(mesh, lspec))\n\n    def blk(x, toks):\n      v_shard = x.shape[-1]\n      midx = _ss_lax.axis_index(vocab_axis)\n      gmax = _ss_lax.pmax(jnp.max(x, axis=-1), vocab_axis)\n      se = _ss_lax.psum(jnp.sum(jnp.exp(x - gmax[:, None]), axis=-1),\n                        vocab_axis)\n      lse = gmax + jnp.log(se)\n      rv, ri = _ss_merged_candidates(x, vocab_axis)\n      nv, ni = _ss_lax.top_k(rv, max_logprobs)\n      top_ids = jnp.take_along_axis(ri, ni, axis=-1)\n      top_lps = nv - lse[:, None]\n      owner = (toks >= midx * v_shard) & (toks < (midx + 1) * v_shard)\n      col = jnp.clip(toks - midx * v_shard, 0, v_shard - 1)\n      lval = jnp.take_along_axis(x, col[:, None], axis=-1)[:, 0]\n      tok_logit = _ss_lax.psum(jnp.where(owner, lval, 0.0), vocab_axis)\n      tok_lp = tok_logit - lse\n      rank = _ss_lax.psum(jnp.sum(x >= tok_logit[:, None], axis=-1),\n                          vocab_axis)\n      idx = jnp.concatenate((toks[:, None], top_ids), axis=1).astype(jnp.int32)\n      lps = jnp.concatenate((tok_lp[:, None], top_lps), axis=1)\n      # identity pmax: values already replicated across vocab shards; makes\n      # the replication provable to shard_map's output check.\n      return (_ss_lax.pmax(idx, vocab_axis), _ss_lax.pmax(lps, vocab_axis),\n              _ss_lax.pmax(rank, vocab_axis))\n\n    idx, lps, rank = _ss_shard_map(\n        blk, mesh=mesh,\n        in_specs=(lspec, bspec),\n        out_specs=(P(batch_axes if batch_axes else None, None),\n                   P(batch_axes if batch_axes else None, None), bspec),\n        )(logits.astype(jnp.float32), next_tokens)\n    return LogprobsTensors(idx, lps, rank)\nexcept Exception as _e:\n  print(\"SHARDED-SAMPLING ERROR (install): %r\" % (_e,), flush=True)\n# --- end _SHARDED_SAMPLING ---------------------------------------------------\n'''\n\nnew = src + APPEND\ntry:\n    ast.parse(new)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(SP, \"w\", encoding=\"utf-8\").write(new)\n\nv = open(SP, encoding=\"utf-8\").read()\nproblems = []\nif \"_ss_sample_block\" not in v or \"_ss_orig_cgl\" not in v:\n    problems.append(\"appended block incomplete\")\nif v.count(\"def sample(\") != 2:\n    problems.append(\"expected original + rebound sample definitions\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    problems.append(f\"reparse failed: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"SHARDED-SAMPLING PATCH: APPLIED\")"
  patch_stop_tokens.py: "\"\"\"GEMMA4 line: tunix VllmSampler clobbers vLLM's stop set to [tokenizer.eos_id()] \u2014 for google/gemma-4-E2B-it that is\n<eos>=1 only, while the chat model ends turns with ids 106/50 (generation_config eos_token_id=[1,106,50]) \u2192 99.4% of\ncompletions ran to the 8192 cap (g4-001c/002c). Union in EXTRA_STOP_TOKEN_IDS from env. Prints STOP-TOKENS PATCH: APPLIED|FAILED\nand, at runtime, STOP-TOKENS ids=[...] once.\"\"\"\nimport sys\nT = \"/usr/local/lib/python3.12/site-packages/tunix/generate/vllm_sampler.py\"\nt = open(T).read()\nif \"_EXTRA_STOP\" in t: print(\"STOP-TOKENS PATCH: already applied\", flush=True); sys.exit(0)\na = \"      sampling_params.stop_token_ids = [self.tokenizer.eos_id()]\\n\"\nif t.count(a) != 1: print(\"STOP-TOKENS PATCH: FAILED anchor %d\" % t.count(a), flush=True); sys.exit(0)\nb = (\"      sampling_params.stop_token_ids = _extra_stop_ids(self.tokenizer.eos_id())  # _EXTRA_STOP\\n\")\nt = t.replace(a, b) + r'''\n\n# --- _EXTRA_STOP -----------------------------------------------------------------\nimport os as _es_os, json as _es_json\n_ES_PRINTED = [False]\ndef _extra_stop_ids(eos_id):\n    ids = [eos_id]\n    try:\n        ids += [int(x) for x in _es_json.loads(_es_os.environ.get(\"EXTRA_STOP_TOKEN_IDS\", \"[]\"))]\n    except Exception:\n        pass\n    out = sorted(set(int(i) for i in ids if i is not None))\n    if not _ES_PRINTED[0]:\n        print(\"STOP-TOKENS ids=%s\" % out, flush=True); _ES_PRINTED[0] = True\n    return out\n'''\ncompile(t, T, \"exec\"); open(T, \"w\").write(t); print(\"STOP-TOKENS PATCH: APPLIED\", flush=True)"
  patch_sync_keepkv.py: "\"\"\"RUNG 4a: do not delete/re-initialize the vLLM KV cache around the weight sync.\ntunix VllmSampler.update_params calls collective_rpc(\"delete_kv_cache\") before the reshard and\ncollective_rpc(\"reinitialize_kv_cache\") after it. Run 61 timing: 1.1 s + 0.95 s of the ~7.7 s sync.\nAt sync time every KV page is free (rollout finished) and the resharded weights are 0.3 GB/chip\nagainst a 57 GB KV pool, so freeing the pool buys nothing. Keep reset_prefix_cache (prefix\ncaching is off anyway). Prints SYNC-KEEPKV PATCH: APPLIED | FAILED.\"\"\"\nimport sys\nP = \"/usr/local/lib/python3.12/site-packages/tunix/generate/vllm_sampler.py\"\ns = open(P).read()\nif \"_SYNC_KEEPKV\" in s:\n    print(\"SYNC-KEEPKV PATCH: already applied\", flush=True); sys.exit(0)\nedits = [\n  ('      self.llm.collective_rpc(\"delete_kv_cache\") # will free hbm\\n', '      pass  # _SYNC_KEEPKV: delete_kv_cache skipped\\n'),\n  ('      self._driver.llm_engine.collective_rpc(\"delete_kv_cache\")\\n', '      pass  # _SYNC_KEEPKV\\n'),\n  ('      self.llm.collective_rpc(\"reinitialize_kv_cache\")\\n', '      pass  # _SYNC_KEEPKV: reinitialize_kv_cache skipped\\n'),\n  ('      self._driver.llm_engine.collective_rpc(\"reinitialize_kv_cache\")\\n', '      pass  # _SYNC_KEEPKV\\n'),\n]\nfor a, b in edits:\n    if s.count(a) != 1:\n        print(\"SYNC-KEEPKV PATCH: FAILED anchor count %d for %r\" % (s.count(a), a.strip()[:50]), flush=True); sys.exit(0)\n    s = s.replace(a, b)\ncompile(s, P, \"exec\"); open(P, \"w\").write(s)\nprint(\"SYNC-KEEPKV PATCH: APPLIED\", flush=True)"
  patch_textual_stop.py: "\"\"\"TEXTUAL-STOP (reference host_extract variant): retire CD requests at the first textual\n'<end_of_turn>' = ids [236820,643,236779,1340,236779,887,236813]. Model self-dialogs past its\nanswer (49 markers/response measured); GPU stops on strings, TPU only on ids -> OSL 3500 vs 1000.\nEnv TEXTUAL_STOP=1 enables. Requires patch_host_extract (the _HOST_EXTRACT_VEC variant) first.\nPrints TEXTUAL-STOP PATCH: APPLIED | FAILED <reason>.\"\"\"\nimport os\nimport sys\nP = \"/usr/local/lib/python3.12/site-packages/tpu_inference/runner/tpu_runner.py\"\ns = open(P).read()\nif \"_TEXTUAL_STOP\" in s:\n    print(\"TEXTUAL-STOP PATCH: already applied\", flush=True); sys.exit(0)\nif \"_HOST_EXTRACT_VEC\" not in s:\n    print(\"TEXTUAL-STOP PATCH: FAILED requires patch_host_extract first\", flush=True); sys.exit(0)\na = (\"        valid_tokens = tokens[:int(_vt_len[req_idx])].tolist()  # _HOST_EXTRACT_VEC\\n\"\n     \"        if _has_eos[req_idx]:\\n\"\n     \"            num_eos_hits += 1\\n\")\nif s.count(a) != 1:\n    print(\"TEXTUAL-STOP PATCH: FAILED loop anchor %d\" % s.count(a), flush=True); sys.exit(0)\nb = (\"        valid_tokens = tokens[:int(_vt_len[req_idx])].tolist()  # _HOST_EXTRACT_VEC\\n\"\n     \"        _ts_hit = False\\n\"\n     \"        if _TS_ON and not _has_eos[req_idx]:\\n\"\n     \"            _ts_pos = _ts_find(valid_tokens)\\n\"\n     \"            if _ts_pos >= 0:\\n\"\n     \"                valid_tokens = valid_tokens[:_ts_pos] + [_TS_EOS]\\n\"\n     \"                _ts_hit = True\\n\"\n     \"        if _has_eos[req_idx] or _ts_hit:\\n\"\n     \"            num_eos_hits += 1\\n\")\ns = s.replace(a, b)\ns += \"\"\"\n# --- _TEXTUAL_STOP ---------------------------------------------------------------\nimport os as _ts_os, json as _ts_json\n_TS_ON = _ts_os.environ.get(\"TEXTUAL_STOP\", \"0\") == \"1\"\ntry:\n    _TS_PAT = [int(x) for x in _ts_json.loads(_ts_os.environ.get(\n        \"TEXTUAL_STOP_IDS\", \"[236820,643,236779,1340,236779,887,236813]\"))]\nexcept Exception:\n    _TS_PAT = [236820, 643, 236779, 1340, 236779, 887, 236813]\n_TS_EOS = 1\n_TS_N = len(_TS_PAT)\n_TS_HEAD = _TS_PAT[0]\ndef _ts_find(toks):\n    n = len(toks); i = 0\n    while i <= n - _TS_N:\n        if toks[i] == _TS_HEAD and toks[i:i + _TS_N] == _TS_PAT:\n            return i + _TS_N\n        i += 1\n    return -1\nif _TS_ON:\n    print(\"TEXTUAL-STOP: active, pattern=%s\" % (_TS_PAT,), flush=True)\n\"\"\"\ncompile(s, P, \"exec\"); open(P, \"w\").write(s)\nprint(\"TEXTUAL-STOP PATCH: APPLIED (TEXTUAL_STOP=%s)\" % os.environ.get(\"TEXTUAL_STOP\", \"0\"), flush=True)\n"
  patch_verify_timeout.py: "\"\"\"Enable per-item math_verify timeouts to cap the reward-phase long tail.\n\nWHY. math_verify_pool.py grades each completion with parse(...,\nparsing_timeout=None) and verify(..., timeout_seconds=None) -- per-item\ntimeouts DISABLED. A single pathological expression (large nested fraction,\nunsimplifiable radical, malformed LaTeX) runs sympy unbounded until the GLOBAL\nbatch timeout (math_verify_timeout=120). One straggler holds up the parallel\npool, so the reward phase spikes (measured g4r11: 191/126/252s on 3 of 20\nsteps, vs ~10s median) -- the dominant contributor to the step-time MEAN\n(162 vs median 125).\n\nWHAT. Set the per-item parse/verify timeouts to VERIFY_ITEM_TIMEOUT seconds\n(default 5) instead of None. A pathological item then costs <=5s (marked\nwrong, like any grader failure) instead of running to the global cap. Bounds\nthe reward tail without changing grading of well-formed answers. math_verify\nuses signal-based timeouts, valid here because each item runs in its own pool\nWORKER PROCESS (main thread of that process). VERIFY_ITEM_TIMEOUT=0 keeps the\noriginal None (disabled) behavior.\n\nFAIL-OPEN. Prints exactly one of:\n    VERIFY-TIMEOUT PATCH: APPLIED\n    VERIFY-TIMEOUT PATCH: FAILED <reason>\n\"\"\"\nimport ast\nimport os\nimport sys\n\n\ndef fail(msg):\n    print(f\"VERIFY-TIMEOUT PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\ntry:\n    import importlib.util as _u\n    spec = _u.find_spec(\"maxtext\")\n    if spec is None or not spec.submodule_search_locations:\n        fail(\"cannot locate maxtext package\")\n    root = list(spec.submodule_search_locations)[0]\nexcept Exception as e:  # noqa: BLE001\n    fail(f\"maxtext import probe failed: {e}\")\n\nMP = os.path.join(root, \"trainers\", \"post_train\", \"rl\", \"math_verify_pool.py\")\nif not os.path.exists(MP):\n    fail(f\"{MP} not found\")\nsrc = open(MP, encoding=\"utf-8\").read()\nif \"_VT_ITEM\" in src:\n    print(\"VERIFY-TIMEOUT PATCH: already patched\")\n    sys.exit(0)\n\nn_parse = src.count(\"parsing_timeout=None\")\nn_verify = src.count(\"timeout_seconds=None\")\nif n_parse < 1 or n_verify < 1:\n    fail(f\"anchors missing (parsing_timeout=None x{n_parse}, timeout_seconds=None x{n_verify})\")\n\nsrc = src.replace(\"parsing_timeout=None\", \"parsing_timeout=_VT_ITEM\")\nsrc = src.replace(\"timeout_seconds=None\", \"timeout_seconds=_VT_ITEM\")\n\n# module-level: _VT_ITEM = int(env) or None if 0\ninject = (\n    \"import os as _vt_os\\n\"\n    \"_vt_v = _vt_os.environ.get('VERIFY_ITEM_TIMEOUT', '5')\\n\"\n    \"try:\\n\"\n    \"  _VT_ITEM = int(_vt_v) if int(_vt_v) > 0 else None\\n\"\n    \"except Exception:\\n\"\n    \"  _VT_ITEM = 5\\n\"\n)\n# place after the module docstring / first import block\nlines = src.split(\"\\n\")\nins_at = 0\nfor i, ln in enumerate(lines):\n    if ln.startswith(\"import \") or ln.startswith(\"from \"):\n        ins_at = i\n        break\nlines.insert(ins_at, inject)\nsrc = \"\\n\".join(lines)\n\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\nopen(MP, \"w\", encoding=\"utf-8\").write(src)\nv = open(MP, encoding=\"utf-8\").read()\nif \"_VT_ITEM\" not in v or \"timeout_seconds=None\" in v or \"parsing_timeout=None\" in v:\n    fail(\"re-verify failed\")\nprint(f\"VERIFY-TIMEOUT PATCH: APPLIED (VERIFY_ITEM_TIMEOUT={os.environ.get('VERIFY_ITEM_TIMEOUT','5(default)')})\")\n"
  patch_vllm_sampler.py: "\"\"\"Hotfix to disable prompt_logprobs in tunix vLLM Sampler and bypass vLLM V1 scheduler AssertionError.\"\"\"\n\nimport os\n\n# --- Patch 4: pathwaysutils profiling.py ---\nprint(\"Applying hotfix to pathwaysutils/profiling.py...\")\npaths4 = [\n    \"/usr/local/lib/python3.12/site-packages/pathwaysutils/profiling.py\",\n    \"/app/pathways-utils/pathwaysutils/profiling.py\",\n]\nfor p4 in paths4:\n  if os.path.exists(p4):\n    print(f\"Checking pathwaysutils file: {p4}\")\n    with open(p4, \"r\", encoding=\"utf-8\") as f:\n      c4 = f.read()\n\n    target4 = \"      _, result_future = _profile_state.executable.call()\"\n    replacement4 = (\n        \"      import jax\\n\"\n        \"      import jax.numpy as jnp\\n\"\n        \"      out_avals = ()\\n\"\n        \"      out_shardings = ()\\n\"\n        \"      _, result_future = _profile_state.executable.call(\\n\"\n        \"          out_avals=out_avals, out_shardings=out_shardings\\n\"\n        \"      )\"\n    )\n\n    modified4 = False\n    if target4 in c4:\n      c4 = c4.replace(target4, replacement4)\n      modified4 = True\n\n    target4_int = \"      elif isinstance(v, int):\\n\" '        advanced_config[k] = {\"intValue\": v}'\n    replacement4_int = \"      elif isinstance(v, int):\\n\" '        advanced_config[k] = {\"int64Value\": v}'\n    if target4_int in c4:\n      c4 = c4.replace(target4_int, replacement4_int)\n      modified4 = True\n\n    # traceSessionName is enabled now, bypassing replacement:\n    print(\"Retaining traceSessionName configuration in pathwaysutils.\")\n\n    target4_start = (\n        \"def start_trace(\\n\"\n        \"    log_dir: os.PathLike[str] | str,\\n\"\n        \"    *,\\n\"\n        \"    create_perfetto_link: bool = False,\\n\"\n        \"    create_perfetto_trace: bool = False,\\n\"\n        \"    profiler_options: jax.profiler.ProfileOptions | None = None,\\n\"\n        \"    max_num_hosts: int = 1,\\n\"\n        \") -> None:\"\n    )\n    replacement4_start = (\n        \"def start_trace(\\n\"\n        \"    log_dir: os.PathLike[str] | str,\\n\"\n        \"    *,\\n\"\n        \"    create_perfetto_link: bool = False,\\n\"\n        \"    create_perfetto_trace: bool = False,\\n\"\n        \"    profiler_options: jax.profiler.ProfileOptions | None = None,\\n\"\n        \"    max_num_hosts: int | None = None,\\n\"\n        \") -> None:\\n\"\n        \"  if max_num_hosts is None:\\n\"\n        \"    max_num_hosts = 16\"\n    )\n    if target4_start in c4:\n      c4 = c4.replace(target4_start, replacement4_start)\n      modified4 = True\n\n    target4_monkey = (\n        \"  def start_trace_patch(\\n\"\n        \"      log_dir,\\n\"\n        \"      create_perfetto_link: bool = False,\\n\"\n        \"      create_perfetto_trace: bool = False,\\n\"\n        \"      profiler_options: jax.profiler.ProfileOptions | None = None,\\n\"\n        \"      max_num_hosts: int = 1,\\n\"\n        \"  ) -> None:\"\n    )\n    replacement4_monkey = (\n        \"  def start_trace_patch(\\n\"\n        \"      log_dir,\\n\"\n        \"      create_perfetto_link: bool = False,\\n\"\n        \"      create_perfetto_trace: bool = False,\\n\"\n        \"      profiler_options: jax.profiler.ProfileOptions | None = None,\\n\"\n        \"      max_num_hosts: int | None = None,\\n\"\n        \"  ) -> None:\"\n    )\n    if target4_monkey in c4:\n      c4 = c4.replace(target4_monkey, replacement4_monkey)\n      modified4 = True\n\n    if modified4:\n      with open(p4, \"w\", encoding=\"utf-8\") as f:\n        f.write(c4)\n      print(f\"Hotfix successfully applied to {p4}.\")\n    else:\n      print(f\"Warning: target strings not found or already patched in {p4}.\")\n  else:\n    print(f\"Warning: {p4} not found.\")\n\n# --- Patch 5: tpu_inference tpu_runner.py ---\nprint(\"Applying hotfix to tpu_inference/runner/tpu_runner.py...\")\np5 = \"/usr/local/lib/python3.12/site-packages/tpu_inference/runner/tpu_runner.py\"\nif os.path.exists(p5):\n  with open(p5, \"r\", encoding=\"utf-8\") as f:\n    c5 = f.read()\n\n  # Simpler replacement to limit the size of req_id_kwargs to avoid nanobind limit\n  target5 = \", **req_id_kwargs):\"\n  replacement5 = \", **dict(list(req_id_kwargs.items())[:100])):\"\n\n  if target5 in c5:\n    c5 = c5.replace(target5, replacement5)\n    with open(p5, \"w\", encoding=\"utf-8\") as f:\n      f.write(c5)\n    print(\"Hotfix successfully applied to tpu_inference/runner/tpu_runner.py (limited req_id_kwargs).\")\n  else:\n    if \"dict(list(req_id_kwargs.items())\" in c5:\n      print(\"Hotfix already applied to tpu_inference/runner/tpu_runner.py.\")\n    else:\n      print(\"Warning: target string not found in tpu_runner.py.\")\nelse:\n  print(\"Warning: tpu_runner.py path not found.\")"
kind: ConfigMap
metadata:
  name: g4ucq2-patches
  namespace: ubench-regression-tests
---
apiVersion: v1
data:
  launch-workload.sh: |2-

    #!/bin/bash
    set -e

    _sigterm() {
      echo "Caught SIGTERM signal, sending to child process..."
      kill -SIGTERM "$PID" 2>/dev/null
    }
    trap _sigterm SIGTERM

    MAXTEXT_CONFIG_PATH="maxtext/configs/post_train/rl.yml"

    # Fallback check to support different image structures
    if [ ! -f "${MAXTEXT_CONFIG_PATH}" ] && [ -f "src/${MAXTEXT_CONFIG_PATH}" ]; then
      echo "MAXTEXT_CONFIG_PATH not found at ${MAXTEXT_CONFIG_PATH}, falling back to src/${MAXTEXT_CONFIG_PATH}"
      MAXTEXT_CONFIG_PATH="src/${MAXTEXT_CONFIG_PATH}"
    fi

    # --- pathwaysutils profiling hotfix (upstream scripts/patch_vllm_sampler.py) ---
    # Non-fatal: if the target strings are absent the patch is a no-op.
    if [ -f /workload/patches/patch_vllm_sampler.py ]; then
      echo "Applying pathwaysutils profiling hotfix..."
      python3 /workload/patches/patch_vllm_sampler.py || echo "WARN: hotfix did not apply cleanly; continuing"
    fi

    # --- PROPER continue-decode fix (mirrors PR #3374) ---
    # Adds step_fn_no_options on the flax_nnx path AND makes decode_loop source its
    # compiler options from get_step_fn_compiler_options() instead of a 3-entry literal.
    # Self-verifying: prints CD-PROPER PATCH: APPLIED or ... FAILED <reason>.
    if [ -f /workload/patches/patch_cd_proper.py ]; then
      python3 /workload/patches/patch_cd_proper.py
    fi

    # --- ISL/OSL/truncation instrumentation ---
    # max_prefill_predict_length drops 16384 -> 8192 in this run, so prompt truncation
    # stops being a curiosity and becomes a CORRECTNESS dependency: if any prompt
    # exceeds 8192 we silently change the RL problem and the comparison against Magellan's
    # 299 s is void. This dumps the per-step ISL/OSL distribution + truncation counts.
    # Fail-open and free (all inputs are already host-side numpy; no device sync).
    # Prints LENDIST PATCH: APPLIED or ... FAILED <reason>.
    if [ -f /workload/patches/patch_lendist.py ]; then
      python3 /workload/patches/patch_lendist.py
    fi

    # --- RPA v3 block-size forwarding (THE POINT OF RUN 06) ---
    # PR #3102's env override is wired into layers/jax/attention/attention.py only;
    # MaxText's forward_serve_vllm enters through layers/common/attention_interface.py,
    # which never forwards it -- so RPA_V3_DECODE_BLOCK_SIZES has been INERT in every
    # run to date, including the 274.9 s one. Proven from run 05's decode_only trace:
    # the only kernel executed was RPAd-p_64-bq_1_1-bkv_16384_16384 (the default),
    # 138.4 ms = 74.7% of leaf decode time, despite the env var being set.
    # Self-verifying: prints RPA-BLOCKS PATCH: APPLIED or ... FAILED <reason>.
    if [ -f /workload/patches/patch_rpa_blocks.py ]; then
      python3 /workload/patches/patch_rpa_blocks.py
    fi

    # --- CONTINUOUS-BATCHING DECODE WINDOW: the two halves must BOTH apply ---
    # (1) stop cond_fn ending the window on any EOS; (2) make the host read each
    # sequence's last NON-PADDING row. Run 10 applied only (1) and was VOID --
    # reward 0.146 -> 0.053 -- because the host read the window's last row, saw
    # padding for every sequence that finished mid-window, never retired it, and
    # re-seeded it from a padding token. Termination became a lottery.
    # If CD-REPORT reports FAILED while CD-MASK reports APPLIED, KILL THE RUN.
    if [ -f /workload/patches/patch_cd_masking.py ]; then
      python3 /workload/patches/patch_cd_masking.py
    fi
    if [ -f /workload/patches/patch_cd_report.py ]; then
      python3 /workload/patches/patch_cd_report.py
    fi
    if [ -f /workload/patches/patch_phasetime.py ]; then
      python3 /workload/patches/patch_phasetime.py
    fi
    if [ -f /workload/patches/patch_reward_parallel.py ]; then
      python3 /workload/patches/patch_reward_parallel.py
      python3 /workload/patches/patch_length_shape.py
    fi
    if [ -f /workload/patches/patch_sharded_sampling.py ]; then
      python3 /workload/patches/patch_sharded_sampling.py
    fi
    if [ -f /workload/patches/patch_profiler_fix.py ]; then
      python3 /workload/patches/patch_profiler_fix.py
    fi
    if [ -f /workload/patches/patch_gc_sync.py ]; then
      python3 /workload/patches/patch_gc_sync.py
    fi
    if [ -f /workload/patches/patch_packing_knob.py ]; then
      python3 /workload/patches/patch_packing_knob.py
    fi
    if [ -f /workload/patches/patch_packer_fast.py ]; then
      python3 /workload/patches/patch_packer_fast.py
    fi
    if [ -f /workload/patches/patch_block_size.py ]; then
      python3 /workload/patches/patch_block_size.py
      python3 /workload/patches/patch_approx_topk.py
    fi
    if [ -f /workload/patches/patch_async_detok.py ]; then
      python3 /workload/patches/patch_async_detok.py
    fi
    if [ -f /workload/patches/patch_async_logprobs.py ]; then
      python3 /workload/patches/patch_async_logprobs.py
    fi
    # patch_gemma4_prs SKIPPED for now: its diff adds a `packing:` key to the gemma4 model ymls that the image RLConfig (extra=forbid) rejects; PR-parity pending
    if [ -f /workload/patches/patch_dp_rr_routing.py ]; then
      python3 /workload/patches/patch_dp_rr_routing.py
    fi
    if [ -f /workload/patches/patch_stop_tokens.py ]; then
      python3 /workload/patches/patch_stop_tokens.py
    fi
    if [ -f /workload/patches/patch_runner_eos.py ]; then
      python3 /workload/patches/patch_runner_eos.py
    fi
    if [ -f /workload/patches/patch_fast_extract.py ]; then
      python3 /workload/patches/patch_fast_extract.py
    fi
    if [ -f /workload/patches/patch_g4_format_guard.py ]; then
      python3 /workload/patches/patch_g4_format_guard.py
    fi
    if [ -f /workload/patches/patch_async_reward.py ]; then
      python3 /workload/patches/patch_async_reward.py
    fi
    if [ -f /workload/patches/patch_flash_sa.py ]; then
      python3 /workload/patches/patch_flash_sa.py
    fi
    if [ -f /workload/patches/patch_jit_unroll.py ]; then
      python3 /workload/patches/patch_jit_unroll.py
    fi
    if [ -f /workload/patches/patch_sync_keepkv.py ]; then
      python3 /workload/patches/patch_sync_keepkv.py
    fi
    if [ -f /workload/patches/patch_host_extract.py ]; then
      python3 /workload/patches/patch_host_extract.py
    fi
    if [ -f /workload/patches/patch_cd_noglobal.py ]; then
      python3 /workload/patches/patch_cd_noglobal.py
    fi
    if [ -f /workload/patches/patch_padding_bucket.py ]; then
      python3 /workload/patches/patch_padding_bucket.py
    fi
    if [ -f /workload/patches/patch_log_stats.py ]; then
      python3 /workload/patches/patch_log_stats.py
    fi
    if [ -f /workload/patches/patch_textual_stop.py ]; then
      python3 /workload/patches/patch_textual_stop.py
    fi
    if [ -f /workload/patches/patch_verify_timeout.py ]; then
      python3 /workload/patches/patch_verify_timeout.py
    fi
    if [ -f /workload/patches/patch_reward_dump.py ]; then
      python3 /workload/patches/patch_reward_dump.py
    fi


    # --- ROLLOUT PROFILING (the whole point of this run) ---
    # profiler=xplane captures ONLY the trainer mesh -- verified by grepping a 111 MB
    # xplane from the 2026-08-13 run: jit__train_step x31, jit_compute_per_token_logps
    # x16, and ZERO step_fn / ragged_paged_attention / continue_decode / jit__generate.
    # So rollout (~70% of the step, 100% of its variance) has never been profiled.
    # PHASED_PROFILING_DIR is tpu_inference's own profiler (envs.py:23,
    # tpu_runner._init_phased_profiling) and DOES capture the decode path.
    #
    # THE PATH MUST BE gs://, NOT LOCAL. Attempt 1 of this run used /tmp and crashed on
    # the FIRST rollout, 14 times:
    #   tpu_runner._prepare_inputs:2816 -> phase_based_profiler.step()
    #     -> utils.py:699 _start_profiling -> jax.profiler.start_trace
    #       -> pathwaysutils/profiling.py:269
    #          ValueError: log_dir must be a GCS bucket path, got /tmp/phased_profile/...
    # Under Pathways the trace writer requires GCS. (The accompanying
    # "AttributeError: 'Qwen3ForCausalLM' object has no attribute 'modules'" is an
    # atexit/weakref cleanup firing during the shutdown that follows -- a symptom, not
    # a second bug.)
    #
    # _start_profiling ALSO does os.makedirs() on this path and _resolve_canonical_dst_ts
    # opens a marker file under it with a plain open(). With a gs:// value those create a
    # junk LOCAL tree ./gs:/... and succeed (POSIX collapses the double slash), while
    # start_trace gets the GCS path it needs. Side effect: the small
    # batch_composition_stats files land in that junk local tree and are lost. The traces
    # -- the actual objective -- go straight to GCS, so no syncer is needed.
    export VLLM_BLOCK_SIZE=128
    export APPROX_TOPK=1
    export APPROX_TOPK_K=64            # pin KV page size
    # padding fix now in-tree via patch_padding_bucket.py (PR #3466); gap env no longer needed
    export VLLM_PREFIX_CACHING=0          # -6 s/step, byte-identical generation (33j)
    export DP_ROUTING=rr                  # (INERT: tpu_inference reads DP_SCHED_ROUTING, not this)
    export DP_SCHED_ROUTING=round_robin   # FIX: the real knob. Default is least_loaded, which
                                          # probes all 128 ranks x4 per request (2048 reqs) for zero
                                          # benefit here (equal ~150-tok prompts, prefix-caching off).
    export EXTRA_STOP_TOKEN_IDS=[106,50]   # gemma-4-E2B-it generation_config eos set [1,106,50]; tunix only used tokenizer eos=1
    export FAST_EXTRACT=fast             # ROUND 4: fast extract_answer (112: 2560 checked, 0 mismatches)
    export ASYNC_REWARD=on               # ROUND 4: score during rollout; every 8th item cross-checked
    export ASYNC_LOGPROBS=on             # ROUND 4: 117 = 1280+ completions cross-checked, 0 mismatches
    export MAX_SEQ_TOKEN_PER_TPU=8192    # covers prefill 4096 + response 4096 (teammate-parity caps)
    export PHASED_PROFILING_DIR=""
    # ROOT CAUSE of prior empty captures: the phased profiler needs
    # NUM_STEPS_TO_PROFILE_FOR (default 15) execute_model calls of one phase
    # before stop_trace() writes the xplane. With continue-decode max_decode_steps=512
    # each execute advances ~512 tokens but counts as ONE profiler step, so at OSL~1420
    # the decode phase drains (EOS) after ~3 calls, never reaching 15 -> no flush.
    # Set to 2 so the window closes (and writes) after ~2 execute calls (~1024 decode
    # steps captured), guaranteeing a flush inside a single rollout step.
    export PHASED_PROFILER_NUM_STEPS_TO_PROFILE_FOR=2
    echo "PHASED_PROFILING_DIR=$PHASED_PROFILING_DIR NUM_STEPS=$PHASED_PROFILER_NUM_STEPS_TO_PROFILE_FOR"

    # --- Magellan's two decode-kernel env levers (rungs 3 and 4 of their ladder) ---
    # NOTE: their launch.sh exports GRR_RPA_DECODE_BLOCKS / GRR_CD_EOS_CHECK_INTERVAL.
    # Those names exist in NO version of tpu-inference (checked all 346 open PRs, the
    # fork at their PR head, and both images) -- an internal prefix that leaked into
    # the published script. These are the names the code actually reads:
    #   RPA_V3_DECODE_BLOCK_SIZES        -- PR #3102, bq_sz,bkv_sz,bq_csz,bkv_csz
    #   CONTINUE_DECODE_EOS_CHECK_INTERVAL -- PR #3174, default 1
    # WARNING on the second one: at OUR old config (batch 480, max_decode_steps=10)
    # interval 8 measured 719 -> ~2157 s. Their claim is 327 -> 299 s. The regimes
    # differ (compute-bound vs dispatch-bound), so it is included here for a faithful
    # reproduction -- but if this run lands far above 299 s, THIS IS SUSPECT #1 and the
    # follow-up is to drop it and target their 327 s rung instead.
    # RPA tile envs unset for gemma4 (head_dim differs from qwen; kernel defaults)
    export CONTINUE_DECODE_EOS_CHECK_INTERVAL="32"
    export TEXTUAL_STOP=0
    export VERIFY_ITEM_TIMEOUT=5
    export REWARD_DUMP_N=512
    export LENGTH_SHAPE=0
    export LENGTH_SHAPE_LAMBDA=0.25
    export LENGTH_SHAPE_TARGET=3500
    export LENGTH_SHAPE_SCALE=9000

    # --- RL Sampler Patches & Env Setup ---
    export HF_TOKEN=''
    export HF_HUB_ENABLE_HF_TRANSFER=0
    export HF_HUB_DISABLE_XET=1
    export NUM_PRECOMPILE_WORKERS=1
    export NEW_MODEL_DESIGN=1
    export TPU_MIN_LOG_LEVEL=0
    export TF_CPP_MIN_LOG_LEVEL=0
    export TPU_STDERR_LOG_LEVEL=0
    export JAX_BACKEND_TARGET=grpc://127.0.0.1:29140

    # Multimodal-default shims carried over from the ubench recipe (harmless if unused)
    cat << 'EOF' >> /deps/src/maxtext/configs/types.py

    # --- Auto-patch RLConfig with Multimodal defaults ---
    if 'RLConfig' in globals():
      if not hasattr(RLConfig, 'use_mrope'):
        RLConfig.use_mrope = False
      if not hasattr(RLConfig, 'mrope_section'):
        RLConfig.mrope_section = [24, 20, 20]
      if not hasattr(RLConfig, 'position_id_per_seconds'):
        RLConfig.position_id_per_seconds = 25
    EOF
    sed -i 's/mrope_section=config.mrope_section/mrope_section=getattr(config, "mrope_section", [24, 20, 20])/g; s/mrope_section=cfg.mrope_section/mrope_section=getattr(cfg, "mrope_section", [24, 20, 20])/g' /deps/src/maxtext/models/qwen3.py 2>/dev/null || true

    # --- Main Execution ---
    (
      export ENABLE_PATHWAYS_PERSISTENCE='1'
      export JAX_PLATFORMS="${JAX_PLATFORMS:-proxy,cpu}"
      export ENABLE_PJRT_COMPATIBILITY='true'
      # NOTE: XLA flags are NOT set here. Under JAX_PLATFORMS=proxy the client owns
      # no TPU, so LIBTPU_INIT_ARGS would be inert. They are passed as argv to the
      # pathways-proxy container instead (upstream: --custom-pathways-proxy-server-args).

      # continue-decode is ENABLED with max_decode_steps=128 (Magellan's value; every prior
      # CD run of ours silently used DEFAULT_MAX_DECODE_STEPS = 10). This depends on
      # patch_cd_proper.py (PR #3374) having applied -- without it the fused loop raises
      # "compiler_options can only be passed to top-level jax.jit" on this image.
      python3 -m maxtext.trainers.post_train.rl.train_rl "${MAXTEXT_CONFIG_PATH}" \
        model_name='gemma4-e2b' \
        tokenizer_path='google/gemma-4-E2B-it' \
        dataset_name='nvidia/OpenMathInstruct-2' \
        dataset_processor_path=/workload/patches/gemma_data.py \
        hf_train_files='hf://datasets/nvidia/OpenMathInstruct-2/data/train_1M-*.parquet' \
        train_split='train_1M' \
        rl.num_generations=8 \
        rl.grpo_beta=0.0 \
        rl.grpo_epsilon=0.2 \
        rl.epsilon_high=0.28 \
        checkpoint_storage_use_ocdbt=False \
        async_scheduling=False \
        math_verify_num_procs=64 \
        chips_per_vm=8 \
        num_batches=100 \
        num_test_batches=0 \
        debug=True \
        profiler=xplane \
        skip_first_n_steps_for_profiler=100 \
        profiler_steps=1 \
        gradient_clipping_threshold=1.0 \
        decode_sampling_temperature=0.8 \
        decode_sampling_top_k=50 \
        decode_sampling_nucleus_p=0.95 \
        max_target_length=6144 \
        kv_cache_buffer=3840 \
        max_prefill_predict_length=4096 \
        learning_rate=1e-6 \
        batch_size=256 \
        train_micro_batch_size=8 \
        rollout_micro_batch_size=256 \
        trainer_devices_fraction=1.0 \
        sampler_devices_fraction=1.0 \
        rollout_data_parallelism=128 \
        rollout_tensor_parallelism=1 \
        enable_dp_attention=false \
        hbm_utilization_vllm=0.3 \
        max_num_seqs=256 \
        max_num_batched_tokens=33280 \
        scan_layers=False \
        allow_split_physical_axes=True \
        vllm_hf_overrides='{architectures: ["MaxTextForCausalLM"]}' \
        attention='flash' \
        allow_split_physical_axes=True \
        enable_tunix_perf_metrics=True \
        checkpoint_period=100 \
        max_num_checkpoints_to_keep=1000 \
        enable_checkpointing=true \
        load_parameters_path='gs://ubench-logs/alisachen-tpu7x/ckpt/gemma4-e2b-raw2/0/items' \
        skip_jax_distributed_system=True \
        vllm_additional_config='{"enable_continue_decode": true, "max_decode_steps": 1024, "maxtext_config": {"model_name": "gemma4-e2b", "model_call_mode": "inference", "log_config": false, "weight_dtype": "bfloat16", "allow_split_physical_axes": true}}' \
        base_output_directory=${ARTIFACT_DIR} \
        run_name=${JOB_IDENTIFIER}
    ) & PID=$!

    wait $PID
    EXIT_CODE=$?

    echo "MaxText Job Ended at: $(date) with exit code $EXIT_CODE"
    exit $EXIT_CODE
kind: ConfigMap
metadata:
  name: g4ucq2-launcher
  namespace: ubench-regression-tests
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: "g4ucq2"
  namespace: ubench-regression-tests
  labels:
    kueue.x-k8s.io/queue-name: "multislice-queue"
spec:
  coordinator:
    replicatedJob: pathways-head
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  failurePolicy:
    maxRestarts: 3
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - pathways-head
  replicatedJobs:
  - name: pathways-head
    replicas: 1
    template:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: "multislice-queue"
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              kueue.x-k8s.io/podset: pathways-head
              kueue.x-k8s.io/queue-name: "multislice-queue"
            annotations:
              kubectl.kubernetes.io/default-container: jax-tpu
              gke-gcsfuse/volumes: "true"
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-nodepool: "cpu-np"
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/replicatedjob-name
                        operator: In
                        values: ["pathways-head"]
            containers:
            - name: jax-tpu
              image: "gcr.io/supercomputer-testing/maxtext-rl-ironwood@sha256:f7c957d0b286e03966fdd6f9b15e7609fae8460a933a9da0b9fbab3e04723c94"
              command:
              - bash
              - -c
              - |
                echo Pathways Helm Start: $(date);
                _sigterm() (kill -SIGTERM $! 2>/dev/null;);
                trap _sigterm SIGTERM;
                echo "Executing payload from /workload/launcher/launch-workload.sh..."
                ( bash /workload/launcher/launch-workload.sh ) & PID=$!;
                while kill -0 $PID 2>/dev/null;
                    do sleep 5;
                done;
                wait $PID;
                EXIT_CODE=$?;
                echo Pathways Helm End: $(date);
                echo EXIT_CODE=$EXIT_CODE;
                exit $EXIT_CODE
              env:
              - name: JAX_PLATFORMS
                value: "proxy,cpu"
              - name: PATHWAYS_HEAD
                value: "g4ucq2-pathways-head-0-0.g4ucq2"
              - name: JAX_BACKEND_TARGET
                value: grpc://g4ucq2-pathways-head-0-0.g4ucq2:29140
              - name: JOB_IDENTIFIER
                value: "g4ucq2"
              - name: ARTIFACT_DIR
                value: "gs://ubench-logs"
              - name: JAX_COMPILATION_CACHE_DIR
                value: "gs://ubench-logs/compilation_cache/qwen3-0.6b/rl_repro_jax_tpu7x_20260730"
              - name: SKIP_JAX_PRECOMPILE
                value: "1"
              resources:
                requests:
                  cpu: "28"
                  memory: 130G
                limits:
                  cpu: "44"
                  memory: 170G
              securityContext:
                privileged: true
              volumeMounts:
              - name: workload-launcher
                mountPath: /workload/launcher
              - name: workload-patches
                mountPath: /workload/patches
              - name: shared-tmp
                mountPath: /tmp
            initContainers:
            - name: pathways-rm
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: HOST_ADDRESS
                value: "g4ucq2-pathways-head-0-0.g4ucq2"
              args:
              - --server_port=29141
              - --node_type=resource_manager
              - --gcs_scratch_location=gs://ubench-logs/compilation_cache/qwen3-0.6b/rl_repro_pathways_tpu7x_20260730
              - --instance_count=1
              - --instance_type=tpu7x:4x4x4
              resources:
                requests:
                  cpu: "8"
                  memory: 24G
                limits:
                  cpu: "16"
                  memory: 64G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            - name: pathways-proxy
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: PATHWAYS_HEAD
                value: "g4ucq2-pathways-head-0-0.g4ucq2"
              args:
              - --server_port=29140
              - --resource_manager_address=g4ucq2-pathways-head-0-0.g4ucq2:29141
              - --gcs_scratch_location=gs://ubench-logs/compilation_cache/qwen3-0.6b/rl_repro_pathways_tpu7x_20260730
              - --xla_tpu_dvfs_p_state=6
              - --xla_tpu_scoped_vmem_limit_kib=65536
              - --xla_tpu_num_sparse_cores_for_gather_offloading=1
              - --xla_tpu_bf16_emission_mode=NATIVE_EMISSION
              - --xla_tpu_enable_sparse_core_reduce_scatter_v2=true
              - --xla_tpu_enable_sparse_core_collective_offload_all_gather=true
              - --xla_tpu_enable_sparse_core_collective_offload_2d_all_gather=true
              - --xla_tpu_use_tc_device_shape_on_sc=True
              - --xla_sc_disable_megacore_partitioning=True
              - --xla_tpu_enable_async_collective_fusion_fuse_all_gather=false
              - --xla_enable_async_all_gather=true
              - --xla_tpu_prefer_async_allgather_to_allreduce=true
              - --xla_tpu_enable_sparse_core_collective_offload_all_reduce=true
              - --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=true
              - --xla_tpu_enable_sparse_core_collective_offload_3d_all_gather=true
              - --xla_tpu_use_single_sparse_core_for_all_gather_offload=true
              - --xla_tpu_enable_concurrent_sparse_core_offloading=true
              - --xla_tpu_enable_offloading_gather_to_sparsecore=true
              - --xla_tpu_sparse_core_all_gather_latency_multiplier=1
              - --xla_tpu_sparse_core_reduce_scatter_latency_multiplier=3
              - --xla_tpu_enable_sparse_core_collective_aggregator=true
              - --xla_tpu_enable_latency_hiding_layer_scheduler=true
              - --xla_tpu_scheduler_percent_shared_memory_limit=150
              - --xla_tpu_enable_layer_scheduler_for_dependent_collectives=true
              - --xla_tpu_enable_sparse_core_collective_offload_nd_reduce_scatter=true
              - --xla_tpu_pcie_bandwidth_multiplier=0.03
              - --xla_tpu_enable_sparse_core_offload_queuing_in_lhs=true
              - --xla_tpu_enable_multi_compute_overlap_in_layer_scheduler=false
              - --xla_tpu_enable_3d_reduce_scatter_decomposer=false
              resources:
                requests:
                  cpu: "8"
                  memory: 32G
                limits:
                  cpu: "16"
                  memory: 64G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            volumes:
            - name: shared-tmp
              hostPath:
                path: /tmp
                type: DirectoryOrCreate
            - name: workload-launcher
              configMap:
                name: "g4ucq2-launcher"
            - name: workload-patches
              configMap:
                name: "g4ucq2-patches"
  - name: worker
    replicas: 1
    template:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: "multislice-queue"
      spec:
        parallelism: 16
        completions: 16
        backoffLimit: 32
        completionMode: Indexed
        template:
          metadata:
            annotations:
              alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
              cloud.google.com/gke-tpu-slice-topology: "4x4x4"
              kueue.x-k8s.io/podset-unconstrained-topology: "true"
            labels:
              kueue.x-k8s.io/podset: worker
              kueue.x-k8s.io/queue-name: "multislice-queue"
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-tpu-topology: "4x4x4"
              cloud.google.com/gke-tpu-accelerator: tpu7x
            containers:
            - name: pathways-worker
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              env:
              - name: PATHWAYS_HEAD
                value: "g4ucq2-pathways-head-0-0.g4ucq2"
              - name: MEGASCALE_SLICE_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              - name: MEGASCALE_NUM_SLICES
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-replicas']
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              - name: MEGASCALE_COORDINATOR_ADDRESS
                value: "g4ucq2-pathways-head-0-0.g4ucq2"
              - name: TPU_SKIP_MDS_QUERY
                value: "true"
              args:
              - --server_port=29005
              - --resource_manager_address=g4ucq2-pathways-head-0-0.g4ucq2:29141
              - --gcs_scratch_location=gs://ubench-logs/compilation_cache/qwen3-0.6b/rl_repro_pathways_tpu7x_20260730
              - --enable_metrics_collection=true
              - --xla_tpu_use_enhanced_launch_barrier=true
              ports:
              - containerPort: 29005
                protocol: TCP
              - containerPort: 29006
                protocol: TCP
              - containerPort: 8471
                protocol: TCP
              - containerPort: 8080
                protocol: TCP
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  google.com/tpu: "4"
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            volumes:
            - name: shared-tmp
              hostPath:
                path: /tmp
                type: DirectoryOrCreate
