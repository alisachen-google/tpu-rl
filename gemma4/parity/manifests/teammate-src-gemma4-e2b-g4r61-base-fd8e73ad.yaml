        _tk = jnp.where(_has_pos_topk & (meta.top_k <= 0), jnp.asarray(_SS_CAND, meta.top_k.dtype), meta.top_k)
        _tp = jnp.where(_has_pos_topk & (meta.top_k <= 0), jnp.asarray(1.0, meta.top_p.dtype), meta.top_p)
        meta = _ss_dc.replace(meta, top_k=_tk, top_p=_tp)
