                return _ar_sync_check_numbers(prompts, completions, answer, tmvp_config, **kargs)
            _sub_k = {k: ([v[i] for i in _missing] if isinstance(v, list) and len(v) == n else v)
                      for k, v in kargs.items()}
            _sub = _ar_sync_check_numbers([prompts[i] for i in _missing],
                                          [completions[i] for i in _missing],
                                          [answer[i] for i in _missing], tmvp_config, **_sub_k)
            for _j, _i in enumerate(_missing):
                scores[_i] = float(list(_sub)[_j])
            print("ASYNC-REWARD PARTIAL: sync-filled %d/%d items" % (len(_missing), n), flush=True)
