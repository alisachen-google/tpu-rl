    def _tfevents_has_scalar_summaries(data: bytes) -> bool:
        import struct as _st
        pos = 0
        while pos + 12 <= len(data):
            length = _st.unpack("<Q", data[pos : pos + 8])[0]
            pos += 12
            if pos + length + 4 > len(data):
                break
            rec = data[pos : pos + length]
            pos += length + 4
            p = 0
            while p < len(rec):
                tag = 0
                shift = 0
                while p < len(rec):
                    b = rec[p]
                    p += 1
                    tag |= (b & 0x7F) << shift
                    if not (b & 0x80):
                        break
                    shift += 7
                fn, wt = tag >> 3, tag & 7
                if wt == 0:
                    while p < len(rec) and (rec[p] & 0x80):
                        p += 1
                    p += 1
                elif wt == 1:
                    p += 8
                elif wt == 2:
                    ln = 0
                    shift = 0
                    while p < len(rec):
                        b = rec[p]
                        p += 1
                        ln |= (b & 0x7F) << shift
                        if not (b & 0x80):
                            break
                        shift += 7
                    if fn == 5 and ln > 0:
                        return True
                    p += ln
                elif wt == 5:
                    p += 4
                else:
                    break
        return False


