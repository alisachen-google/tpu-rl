        except Exception as e:
            print("PACKING-KNOB: FAILED %r" % (e,), flush=True); raise SystemExit(1)
    _patch()
  patch_padding_bucket.py: |-
    """Apply the padding-bucket fix (PR candidate, evidence/padding-bucket-fix.diff) to the
    installed tpu_inference: get_token_paddings(include_max_token_size=True) so a full
    chunked-prefill step pads to max_num_batched_tokens itself, never to the next 2x bucket.
    Prints PADDING-BUCKET PATCH: APPLIED | FAILED <reason>."""
    import sys
    R = "/usr/local/lib/python3.12/site-packages/tpu_inference/runner/"
    def fail(m): print("PADDING-BUCKET PATCH: FAILED " + m, flush=True); sys.exit(1)
    U = R + "utils.py"; u = open(U).read()
    if "include_max_token_size" in u:
        print("PADDING-BUCKET PATCH: already applied", flush=True); sys.exit(0)
    a = "def get_token_paddings(min_token_size: int, max_token_size: int,\n                       padding_gap: int) -> list[int]:"
    b = "def get_token_paddings(min_token_size: int, max_token_size: int,\n                       padding_gap: int, include_max_token_size: bool = False) -> list[int]:"
    if u.count(a) != 1: fail("utils signature anchor")
    u = u.replace(a, b)
    c = '    logger.info(f"Prepared token paddings: {paddings}")\n    return paddings'
    d = ('    if include_max_token_size:\n'
         '        exact = -(-max_token_size // min_token_size) * min_token_size\n'
         '        if exact not in paddings:\n'
         '            paddings = sorted(paddings + [exact])\n' + c)
    if u.count(c) != 1: fail("utils tail anchor")
    u = u.replace(c, d)
    T = R + "tpu_runner.py"; r = open(T).read()
    e = "            padding_gap=envs.VLLM_TPU_BUCKET_PADDING_GAP)"
    if r.count(e) != 1: fail("runner call anchor")
    r = r.replace(e, "            padding_gap=envs.VLLM_TPU_BUCKET_PADDING_GAP,\n            include_max_token_size=True)")
    for p, s in ((U, u), (T, r)):
        compile(s, p, "exec"); open(p, "w").write(s)
    print("PADDING-BUCKET PATCH: APPLIED", flush=True)
  patch_perf_v2.py: |-
    """Wire tunix perf-metrics v2 (Perfetto timeline export) -- run 15.

    maxtext's train_rl populates only custom_export_fn (v1 -> the TensorBoard
    perf/* metrics we already use). The v2 path (tunix.perf.experimental)
    writes a Perfetto timeline of every phase span (rollout / weight_sync /
    train, tagged per step) viewable at ui.perfetto.dev. At the pinned tunix
    commit (683256db) rl_cluster consumes custom_export_fn_v2, the GRPO
    learner is instrumented, and rl_learner calls perf_v2.export() every
    iteration -- only the config field is never populated.

    We patch tunix's rl_cluster.py (byte-verified against the pin) rather than
    maxtext's train_rl.py (whose image content is date-approximated): default
    the v2 export fn at the point where cluster_config is in scope. Best-effort
    by construction -- any init failure prints PERF-V2: DISABLED and the run
    proceeds with v2 off.

    Output: ONE file gs://ubench-logs/g4r55/perf_traces/
    perfetto_trace_v2_<epoch>.pb, rewritten each step with all steps
    accumulated (writes serialized on a 1-thread executor; epath/gcsfs handle
    the gs:// path; perfetto+etils+gcsfs verified in the image layer).

    Prints exactly one of:
        PERF-V2 PATCH: APPLIED
        PERF-V2 PATCH: already patched
        PERF-V2 PATCH: FAILED <reason>
    """

    import ast
    import os
    import sys

    P = "/usr/local/lib/python3.12/site-packages/tunix/rl/rl_cluster.py"


    def fail(msg):
        print(f"PERF-V2 PATCH: FAILED {msg}")
        sys.exit(0)  # non-fatal: let the run start so the failure is visible in logs


    if not os.path.exists(P):
        fail(f"{P} not found")
    src = open(P, encoding="utf-8").read()

    if "_PERF_V2_DEFAULT_WIRED" in src:
        print("PERF-V2 PATCH: already patched")
        sys.exit(0)

    ANCHOR = "      export_fn_v2 = self.perf_config.custom_export_fn_v2\n"
    if src.count(ANCHOR) != 1:
        fail(f"anchor found {src.count(ANCHOR)} times, expected 1")

    INJECT = ANCHOR + (
        "\n"
        "      # _PERF_V2_DEFAULT_WIRED (g4r55). maxtext train_rl populates\n"
        "      # only the v1 export fn; default the v2 (Perfetto) exporter here,\n"
        "      # where cluster_config is in scope. Best-effort: on any failure v2\n"
        "      # stays off and the run proceeds.\n"
        "      if export_fn_v2 is None:\n"
        "        try:\n"
        "          from tunix.perf.experimental import export as _pv2_export\n"
        "          export_fn_v2 = _pv2_export.PerfMetricsExport.from_cluster_config(\n"
        "              cluster_config=self.cluster_config,\n"
        "              trace_dir=\"gs://ubench-logs/g4r55/perf_traces\",\n"
        "          ).export_metrics\n"
        "          print(\"PERF-V2: perfetto export enabled -> \"\n"
        "                \"gs://ubench-logs/g4r55/perf_traces\")\n"
        "        except Exception as _pv2_e:  # pylint: disable=broad-except\n"
        "          print(\"PERF-V2: DISABLED (init failed):\", _pv2_e)\n"
        "          export_fn_v2 = None\n"
    )

    src = src.replace(ANCHOR, INJECT, 1)
    try:
        ast.parse(src)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")
    open(P, "w", encoding="utf-8").write(src)
    print("PERF-V2 PATCH: APPLIED")
  patch_phasetime.py: |-
    """Phasetime v2 -- split the `other` residual INTO its components.

    V1 (runs 10/10b) plus TensorBoard arithmetic already proved the ~30 s `other`
    residual is exactly `generate_and_compute_advantage - vllm_rollout`, i.e. the
    reward + advantage + data-marshaling stage between the vLLM generate call and
    the train loop (verified to +-0.5 s on three matched steps). V2 answers the
    next question: WHICH of those dominates. It keeps all four v1 timers and adds:

        engine_generate    RLCluster.generate wall -- the vLLM call INCLUDING
                           tunix-side detokenization; against TensorBoard's
                           rollout_time this locates where detokenize lands
        compute_rewards    RLLearner._compute_rewards wall -- the Python reward
                           functions (match_format_*, check_numbers) over 2048
                           completions

    Derived offline, no extra timers needed:
        marshal+advantage  = generate_and_advantage - engine_generate
                             - compute_rewards
        (contains the 2048 x 8192 pad-and-stack ~67 MB numpy build, jnp
        conversions, advantage estimator, device_put)

    Same mechanics as v1: append-and-monkeypatch on the class objects, six
    perf_counter pairs per global step, no device sync, JSON per step to
    <ARTIFACT_DIR>/<run>/phasetime/step_NNNNNN.json plus a PHASETIME stdout line.

    CIRCULAR-IMPORT NOTE. rl_learner imports rl_cluster at module load, so the
    block appended to rl_cluster.py must import rl_learner LAZILY inside the
    wrapper body, never at module level.

    FAIL-OPEN. Any missing class/method prints FAILED and exits 0 without
    writing. Prints exactly one of:
        PHASETIME2 PATCH: APPLIED
        PHASETIME2 PATCH: FAILED <reason>
    """

    import ast
    import os
    import sys

    ROOT = "/usr/local/lib/python3.12/site-packages/tunix"
    RL = os.path.join(ROOT, "rl/rl_learner.py")
    GL = os.path.join(ROOT, "rl/grpo/grpo_learner.py")
    RC = os.path.join(ROOT, "rl/rl_cluster.py")


    def fail(msg):
        print(f"PHASETIME2 PATCH: FAILED {msg}")
        sys.exit(1)


    for p in (RL, GL, RC):
        if not os.path.exists(p):
            fail(f"{p} not found")

    rl_src = open(RL, encoding="utf-8").read()
    gl_src = open(GL, encoding="utf-8").read()
    rc_src = open(RC, encoding="utf-8").read()

    if any("_PHASETIME" in s for s in (rl_src, gl_src, rc_src)):
        print("PHASETIME2 PATCH: already patched")
        sys.exit(0)

    for needle, where in (("class RLLearner", "rl_learner.py"),
                          ("def _run_global_step", "rl_learner.py"),
                          ("def _prepare_data", "rl_learner.py"),
                          ("def _run_all_micro_batch_steps", "rl_learner.py"),
                          ("def _compute_rewards", "rl_learner.py")):
        if needle not in rl_src:
            fail(f"'{needle}' not present in {where}")
    for needle in ("class GRPOLearner", "def _generate_and_compute_advantage"):
        if needle not in gl_src:
            fail(f"'{needle}' not present in grpo_learner.py")
    for needle in ("RLCluster", "def generate"):  # _PT_ANCHOR: tunix>=408ca1d9 renamed class RLEngine, keeps alias RLCluster = RLEngine
        if needle not in rc_src:
            fail(f"'{needle}' not present in rl_cluster.py")

    RL_APPEND = '''

    # --- _PHASETIME v2: break out the `other` residual --------------------------------
    # Appended by patch_phasetime2.py. Six perf_counter pairs per global step; no
    # device sync. Wrappers are installed on the class objects only.
    try:
      import time as _pt_time
      import json as _pt_json
      import os as _pt_os

      _PHASETIME = {}

      def _pt_add(_name, _dt):
        _PHASETIME[_name] = _PHASETIME.get(_name, 0.0) + float(_dt)

      def _pt_wrap(_cls, _meth, _label):
        _orig = getattr(_cls, _meth)

        def _w(self, *a, **k):
          _t0 = _pt_time.perf_counter()
          try:
            return _orig(self, *a, **k)
          finally:
            _pt_add(_label, _pt_time.perf_counter() - _t0)

        _w.__name__ = getattr(_orig, "__name__", _meth)
        setattr(_cls, _meth, _w)

      def _pt_flush(self):
        try:
          import sys as _pt_sys
          _step = -1
          try:
            _step = int(self.rl_cluster.global_steps)
          except Exception:
            pass
          _rec = dict(_PHASETIME)
          _rec["step"] = _step
          _usa = getattr(_pt_sys, "_tpu_usa_audit", None)
          if isinstance(_usa, dict):
            for _uk, _uv in _usa.items():
              if not str(_uk).startswith("_"):
                _rec[_uk] = _uv
          try:
            _ar_chk, _ar_mis, _ar_ovh = 0, 0, 0.0
            try:
              import _ar_state as _ar
              _ar_chk = int(_ar.stats.get("checked_total", 0))
              _ar_mis = int(_ar.stats.get("mismatch_total", 0))
              _ar_ovh = float(_ar.stats.get("last_step_verify_overhead_s", 0.0))
              _rec["async_reward_checked"] = _ar_chk
              _rec["async_reward_mismatch"] = _ar_mis
              _rec["async_reward_verify_overhead_s"] = _ar_ovh
            except Exception:
              pass
            _al_chk, _al_mis, _al_ovh = 0, 0, 0.0
            try:
              from tunix.generate import vllm_sampler as _vs_pt
              _als = getattr(_vs_pt, "_AL_STATS", {})
              _al_chk = int(_als.get("checked", 0))
              _al_mis = int(_als.get("mismatch", 0))
              _al_ovh = float(_als.get("verify_overhead_s", 0.0))
            except Exception:
              pass
            _fe_chk, _fe_mis, _fe_ovh = 0, 0, 0.0
            try:
              from maxtext.trainers.post_train.rl import utils_rl as _url_pt
              _fes = getattr(_url_pt, "_FE", {})
              _fe_chk = int(_fes.get("checked", 0))
              _fe_mis = int(_fes.get("mismatch", 0))
              _fe_ovh = float(_fes.get("t_orig", 0.0))
            except Exception:
              pass
            _rec["async_verify"] = {
                "async_reward": {"checked": _ar_chk, "mismatch": _ar_mis, "verify_overhead_s": _ar_ovh, "pool_procs": 8},
                "async_logprobs": {"checked": _al_chk, "mismatch": _al_mis, "verify_overhead_s": _al_ovh},
                "fast_extract": {"checked": _fe_chk, "mismatch": _fe_mis, "verify_overhead_s": _fe_ovh},
            }
          except Exception:
            pass
          _pt_sys._last_pt_rec = dict(_rec)
          print("PHASETIME step=%d " % _step
                + " ".join("%s=%s" % (_k, ("%.4f" % _v if isinstance(_v, float) else str(_v)))
                           for _k, _v in sorted(_rec.items())
                           if _k not in ("step", "async_verify")), flush=True)
          _run = _pt_os.environ.get("JOB_IDENTIFIER", "unknown-run")
          _art = _pt_os.environ.get("ARTIFACT_DIR", "")
          if _art.startswith("gs://"):
            from google.cloud import storage as _st
            _b, _, _pre = _art[5:].partition("/")
            _key = "%s/%s/phasetime/step_%06d.json" % (_pre.rstrip("/"), _run, _step)
            _st.Client().bucket(_b).blob(_key.lstrip("/")).upload_from_string(
                _pt_json.dumps(_rec), content_type="application/json")
        except Exception as _e:
          print("PHASETIME ERROR: %r" % (_e,), flush=True)
        finally:
          _PHASETIME.clear()

      _pt_wrap(RLLearner, "_prepare_data", "prepare_data")
      _pt_orig_mb = RLLearner._run_all_micro_batch_steps
      def _pt_mb_steps(self, *a, **k):
        _t0 = _pt_time.perf_counter()
        _res = _pt_orig_mb(self, *a, **k)
        _pt_add("micro_batch_steps", _pt_time.perf_counter() - _t0)
        import sys as _pt_sys
        _usa = getattr(_pt_sys, "_tpu_usa_audit", None)
        if not isinstance(_usa, dict):
          _usa = {"trainer_weight_version": 0, "sampler_weight_version": 0}
          _pt_sys._tpu_usa_audit = _usa
        _usa["trainer_weight_version"] = int(_usa.get("trainer_weight_version", 0)) + 1
        return _res
      RLLearner._run_all_micro_batch_steps = _pt_mb_steps
      _pt_wrap(RLLearner, "_compute_rewards", "compute_rewards")

      _pt_orig_gs = RLLearner._run_global_step

      def _pt_global_step(self, *a, **k):
        _t0 = _pt_time.perf_counter()
        try:
          _res = _pt_orig_gs(self, *a, **k)
        except Exception:
          _PHASETIME.clear()
          raise
        _pt_add("run_global_step", _pt_time.perf_counter() - _t0)
        _pt_flush(self)
        return _res

      RLLearner._run_global_step = _pt_global_step
    except Exception as _e:
      print("PHASETIME ERROR (install): %r" % (_e,), flush=True)
    # --- end _PHASETIME ---------------------------------------------------------------
    '''

    GL_APPEND = '''

    # --- _PHASETIME v2: time the GRPO payload inside prepare_data ---------------------
    try:
      import time as _pt2_time
      from tunix.rl import rl_learner as _pt2_rl

      _pt2_orig = GRPOLearner._generate_and_compute_advantage

      def _pt2_w(self, *a, **k):
        _t0 = _pt2_time.perf_counter()
        try:
          return _pt2_orig(self, *a, **k)
        finally:
          try:
            _pt2_rl._pt_add("generate_and_advantage", _pt2_time.perf_counter() - _t0)
          except Exception:
            pass

      GRPOLearner._generate_and_compute_advantage = _pt2_w
    except Exception as _e:
      print("PHASETIME ERROR (grpo install): %r" % (_e,), flush=True)
    # --- end _PHASETIME ---------------------------------------------------------------
    '''

    RC_APPEND = '''

    # --- _PHASETIME v2: time the engine generate call (vLLM + detokenize) -------------
    # NOTE: rl_learner imports THIS module at load time, so rl_learner must be
    # imported lazily inside the wrapper to avoid a circular import.
    try:
      import time as _pt3_time

      _pt3_orig = RLCluster.generate

      def _pt3_w(self, *a, **k):
        _t0 = _pt3_time.perf_counter()
        try:
          return _pt3_orig(self, *a, **k)
        finally:
          try:
            from tunix.rl import rl_learner as _pt3_rl
            _pt3_rl._pt_add("engine_generate", _pt3_time.perf_counter() - _t0)
          except Exception:
            pass

      _pt3_w.__name__ = "generate"
      RLCluster.generate = _pt3_w
    except Exception as _e:
      print("PHASETIME ERROR (cluster install): %r" % (_e,), flush=True)
    # --- end _PHASETIME ---------------------------------------------------------------
    '''

    new_rl = rl_src + RL_APPEND
    new_gl = gl_src + GL_APPEND
    new_rc = rc_src + RC_APPEND
    for name, s in (("rl_learner.py", new_rl), ("grpo_learner.py", new_gl),
                    ("rl_cluster.py", new_rc)):
        try:
            ast.parse(s)
        except SyntaxError as e:
            fail(f"patched {name} does not parse: {e}")

    open(RL, "w", encoding="utf-8").write(new_rl)
    open(GL, "w", encoding="utf-8").write(new_gl)
    open(RC, "w", encoding="utf-8").write(new_rc)

    problems = []
    v_rl = open(RL, encoding="utf-8").read()
    v_gl = open(GL, encoding="utf-8").read()
    v_rc = open(RC, encoding="utf-8").read()
    if "_pt_flush" not in v_rl or 'compute_rewards"' not in v_rl:
        problems.append("rl_learner wrappers missing")
    if "_pt2_w" not in v_gl:
        problems.append("grpo_learner wrapper missing")
    if "_pt3_w" not in v_rc:
        problems.append("rl_cluster wrapper missing")
    if v_rl.count("def _run_global_step") != 1:
        problems.append("rl_learner._run_global_step disturbed")
    for name, s in (("rl_learner.py", v_rl), ("grpo_learner.py", v_gl),
                    ("rl_cluster.py", v_rc)):
        try:
            ast.parse(s)
        except SyntaxError as e:
            problems.append(f"reparse {name}: {e}")
    if problems:
        fail("; ".join(problems))
    print("PHASETIME2 PATCH: APPLIED")
  patch_profiler_fix.py: |-
    """_PROFILER_FIX: disable the tunix trainer profiler when its step window is
    invalid. In the RL setup the PeftTrainer is built with initial_step==max_step
    (=num_batches*grad_accum, e.g. 160), so first_profile_step = initial_step +
    skip_first_n_steps (161) > last_profile_step (160) -> ValueError crash at
    tunix/sft/profiler.py __init__. This trainer profiler yields no HBM/roofline
    for us (we use the PERF-V2 phased profiler for the rollout); disable it cleanly
    instead of crashing. Fail-open, idempotent."""
    def _patch():
        try:
            import tunix.sft.profiler as P
            fp = P.__file__
            src = open(fp).read()
            if "_PROFILER_FIX" in src:
                print("PROFILER-FIX: already applied", flush=True); return
            anchor = ('    if self._first_profile_step >= self._last_profile_step:\n'
                      '      raise ValueError(\n'
                      '          f"First profile step {self._first_profile_step} cannot be greater"\n'
                      '          f" than the last profile step {self._last_profile_step}."\n'
                      '      )\n')
            repl = ('    if self._first_profile_step >= self._last_profile_step:\n'
                    '      # _PROFILER_FIX invalid window -> disable trainer profiler, do not crash\n'
                    '      self._first_profile_step = 1000000000\n'
                    '      self._last_profile_step = 1000000001\n')
            n = src.count(anchor)
            if n == 1:
                src = src.replace(anchor, repl, 1)
                compile(src, fp, "exec"); open(fp, "w").write(src)
                print("PROFILER-FIX: disabled invalid-window trainer profiler", flush=True)
            else:
                print("PROFILER-FIX: anchor count %d (skipped)" % n, flush=True)
        except Exception as e:
            print("PROFILER-FIX: failed %r" % (e,), flush=True)
    _patch()
  patch_reward_dump.py: |-
    """Per-item reward diagnostics dump (REWARD-DUMP lines).

    Appends wrappers in utils_rl so each step prints, for the first REWARD_DUMP_N items,
    one line pairing everything a reward audit needs:
        REWARD-DUMP step-local i=K fmt=<match_format_exactly score> score=<check_numbers score>
            guess=<extracted answer> gold=<target answers> n_chars=<len> tail=<last 40 chars>
    Gated by env REWARD_DUMP_N (default 0 = silent; DL_RWDUMP knob). Applied AFTER
    patch_fast_extract / patch_g4_format_guard so it wraps the final bindings.
    FAIL-OPEN. Prints REWARD-DUMP PATCH: APPLIED | FAILED <reason>."""
    import sys
    P = "/deps/src/maxtext/trainers/post_train/rl/utils_rl.py"
    s = open(P).read()
    if "_REWARD_DUMP" in s:
        print("REWARD-DUMP PATCH: already applied", flush=True); sys.exit(0)
    for name in ("def check_numbers(", "def match_format_exactly("):
        if name not in s:
            print("REWARD-DUMP PATCH: FAILED anchor %s" % name, flush=True); sys.exit(0)
    s += r'''
    # --- _REWARD_DUMP ----------------------------------------------------------------
    import os as _rd_os
    _RD_N = int(_rd_os.environ.get("REWARD_DUMP_N", "0"))
    _RD_FMT = {"scores": None}
    _rd_orig_mfe = match_format_exactly
    def match_format_exactly(prompts, completions, tmvp_config, **kargs):  # noqa: F811
        r = _rd_orig_mfe(prompts, completions, tmvp_config, **kargs)
        try:
            _RD_FMT["scores"] = list(r)
        except Exception:
            _RD_FMT["scores"] = None
        return r
    _rd_orig_cn = check_numbers
    def check_numbers(prompts, completions, answer, tmvp_config, **kargs):  # noqa: F811
        r = _rd_orig_cn(prompts, completions, answer, tmvp_config, **kargs)
        if _RD_N > 0:
            try:
                fmt = _RD_FMT["scores"] or []
                for i in range(min(_RD_N, len(completions))):
                    c = completions[i]
                    try:
                        guess = extract_answer(c, tmvp_config)
                    except Exception as _e:
                        guess = "<extract-error:%r>" % (_e,)
                    # compute fmt inline (pool workers hide the wrapped fn's scores)
                    try:
                        _rs = "" if getattr(tmvp_config, "reasoning_start_token_in_prompt", False) else tmvp_config.reasoning_start_token
                        _ok = False
                        _i0 = c.find(_rs) if _rs else 0
                        if _i0 >= 0:
                            _j = c.find(tmvp_config.reasoning_end_token, _i0 + len(_rs))
                            if _j >= 0:
                                _k = c.find(tmvp_config.solution_start_token, _j)
                                if _k >= 0 and c.find(tmvp_config.solution_end_token, _k + 1) >= 0:
                                    _ok = True
                        _fmt_v = round(float(tmvp_config.reward_exact_format_match), 4) if _ok else 0.0
                    except Exception:
                        _fmt_v = "?"
                    print("REWARD-DUMP i=%d fmt=%s score=%s guess=%r gold=%r n_chars=%d tail=%r" % (
                        i, _fmt_v,
                        round(float(list(r)[i]), 4), str(guess)[:60], str(answer[i])[:60],
                        len(c), c[-40:]), flush=True)
            except Exception as _e:
                print("REWARD-DUMP ERROR: %r" % (_e,), flush=True)
        return r
    '''
    compile(s, P, "exec"); open(P, "w").write(s)
    print("REWARD-DUMP PATCH: APPLIED (REWARD_DUMP_N=%s)" % __import__('os').environ.get("REWARD_DUMP_N", "0(default)"), flush=True)
  patch_reward_parallel.py: |-
    """Parallelize the GRPO reward functions across processes.

    WHY. Phasetime v2 (run 11) measured the ~30 s `other` residual as almost
    entirely `compute_rewards` (29.77 s at step 1; marshal+advantage is 0.3 s).
    The reward functions (match_format_*, check_numbers) are pure-Python
    regex/parsing over 2048 independent (prompt, completion) pairs, run serially
    on one core while 28-44 head-node cores idle. Expected: ~30 s -> 2-4 s,
    i.e. step ~157 s -> ~132 s.

    HOW. Append-and-monkeypatch on tunix/rl/reward_manager.py:
    `SequenceRewardManager._compute_rewards` is replaced by a version that keeps
    the original signature-inspection logic but calls each reward_fn on CHUNKS of
    the batch in a fork-based process pool, concatenating results in order.
    Correctness properties:
      - per-pair independence: chunking is exact for sequence-level rewards
      - kwargs that are per-example sequences (len == num_prompts, e.g. ground
        truth answer columns) are chunked in lockstep; scalars pass through
      - results are concatenated in chunk order -> byte-identical to serial
      - ANY error in the parallel path (pickling, fn signature, worker crash)
        logs one warning and falls back to the ORIGINAL serial implementation
    VALIDITY GATE for the run carrying this patch: rewards/train/mean must equal
    the unpatched run step-for-step (deterministic seeds make rewards exactly
    reproducible).

    Tunables via env:
      TUNIX_REWARD_WORKERS   pool size (default min(32, cpu_count))
      TUNIX_REWARD_PARALLEL  set to "0" to disable (keeps serial path)

    FAIL-OPEN. Any missing anchor prints FAILED and exits 0.
    Prints exactly one of:
        REWARD-PAR PATCH: APPLIED
        REWARD-PAR PATCH: FAILED <reason>
    """

    import ast
    import os
    import sys

    ROOT = "/usr/local/lib/python3.12/site-packages/tunix"
    RM = os.path.join(ROOT, "rl/reward_manager.py")


    def fail(msg):
        print(f"REWARD-PAR PATCH: FAILED {msg}")
        sys.exit(0)


    if not os.path.exists(RM):
        fail(f"{RM} not found")
    src = open(RM, encoding="utf-8").read()

    if "_REWARD_PAR" in src:
        print("REWARD-PAR PATCH: already patched")
        sys.exit(0)

    for needle in ("class SequenceRewardManager", "def _compute_rewards",
                   "def _prepare_log_metrics"):
        if needle not in src:
            fail(f"'{needle}' not present in reward_manager.py")

    APPEND = '''

    # --- _REWARD_PAR: process-pool reward computation ---------------------------------
    # Appended by patch_reward_parallel.py (see its docstring). The serial
    # implementation above is kept intact as the fallback.
    try:
      import os as _rp_os
      import numpy as _rp_np
      import multiprocessing as _rp_mp
      from dataclasses import asdict as _rp_asdict
      import inspect as _rp_inspect
      import logging as _rp_logging

      _rp_serial_compute = SequenceRewardManager._compute_rewards
      _rp_pool = [None]
      _rp_warned = [False]
      # Reward fns that must run serially in the parent (learned at runtime):
      # a fn that spawns its own subprocesses fails inside Pool's daemonic
      # workers ("daemonic processes are not allowed to have children") -- true
      # for check_numbers, whose math_verify grading dispatches to its own
      # persistent spawn pool. In the parent that internal pool works normally,
      # and its width is a MaxText config knob (math_verify_num_procs).
      _rp_serial_fns = set()

      def _rp_get_pool():
        if _rp_pool[0] is None:
          # The tunix trainer runs as a DAEMONIC child of the launcher process,
          # and multiprocessing forbids daemons from having children (run 12
          # failed here with "daemonic processes are not allowed to have
          # children"). The flag is inherited launcher plumbing, not a property
          # this code relies on: clear it so the pool can fork. The only
          # daemon-flag semantics lost are auto-termination of OUR workers if
          # the trainer dies mid-step; the pod teardown reaps them anyway.
          try:
            _cur = _rp_mp.current_process()
            if _cur._config.get("daemon"):
              _cur._config["daemon"] = False
          except Exception:
            pass
          n = int(_rp_os.environ.get("TUNIX_REWARD_WORKERS",
                                     min(32, _rp_os.cpu_count() or 8)))
          _rp_pool[0] = _rp_mp.get_context("fork").Pool(processes=n)
        return _rp_pool[0]

      def _rp_parallel_compute(self, prompts, completions, **kwargs):
        if _rp_os.environ.get("TUNIX_REWARD_PARALLEL", "1") == "0":
          return _rp_serial_compute(self, prompts, completions, **kwargs)
        try:
          algo_config_params = _rp_asdict(self.algo_config)
          base_kwargs = kwargs.copy()
          num_prompts = len(prompts)
          num_reward_fns = len(self.reward_fns)
          rewards = _rp_np.zeros((num_prompts, num_reward_fns))

          pool = _rp_get_pool()
          n_chunks = max(1, min(pool._processes * 2, num_prompts))
          bounds = [(num_prompts * c) // n_chunks for c in range(n_chunks + 1)]

          for i, reward_fn in enumerate(self.reward_fns):
            signature = _rp_inspect.signature(reward_fn)
            reward_fn_config_params = {}
            for name, _ in signature.parameters.items():
              if name in ["self", "prompts", "completions", "kwargs"]:
                continue
              if name in algo_config_params and name not in base_kwargs:
                reward_fn_config_params[name] = algo_config_params[name]
            call_kwargs = base_kwargs.copy()
            call_kwargs.update(reward_fn_config_params)

            fn_name = getattr(reward_fn, "__name__", str(reward_fn))
            if fn_name in _rp_serial_fns:
              # This fn previously failed in a worker (e.g. it spawns its own
              # subprocesses, which Pool's daemonic workers forbid -- true for
              # check_numbers' math_verify pool). Run it serially in the parent,
              # where its internal parallelism works as usual.
              full_kwargs = dict(call_kwargs)
              full_kwargs["prompts"] = list(prompts)
              full_kwargs["completions"] = list(completions)
              flat = list(reward_fn(**full_kwargs))
            else:
              try:
                jobs = []
                for c in range(n_chunks):
                  lo, hi = bounds[c], bounds[c + 1]
                  if lo == hi:
                    continue
                  ck = {}
                  for k, v in call_kwargs.items():
                    if isinstance(v, (list, tuple)) and len(v) == num_prompts:
                      ck[k] = list(v[lo:hi])
                    elif isinstance(v, _rp_np.ndarray) and len(v) == num_prompts:
                      ck[k] = v[lo:hi]
                    else:
                      ck[k] = v
                  ck["prompts"] = list(prompts[lo:hi])
                  ck["completions"] = list(completions[lo:hi])
                  jobs.append(pool.apply_async(reward_fn, kwds=ck))
                parts = [j.get(timeout=180) for j in jobs]
                flat = [x for part in parts for x in list(part)]
              except Exception as _fe:
                _rp_serial_fns.add(fn_name)
                _rp_logging.warning(
                    "REWARD-PAR: fn %s failed in workers (%r); running it "
                    "serially in the parent from now on.", fn_name, _fe)
                full_kwargs = dict(call_kwargs)
                full_kwargs["prompts"] = list(prompts)
                full_kwargs["completions"] = list(completions)
                flat = list(reward_fn(**full_kwargs))
            if len(flat) != num_prompts:
              raise RuntimeError(
                  "parallel reward length mismatch for %s: %d vs %d"
                  % (fn_name, len(flat), num_prompts))
            rewards[:, i] = _rp_np.array(flat)

          log_metrics = self._prepare_log_metrics(prompts, completions, rewards)
          return {
              "rewards": _rp_np.nansum(rewards, axis=1),
              "log_metrics": log_metrics,
          }
        except Exception as _e:
          if not _rp_warned[0]:
            _rp_warned[0] = True
            _rp_logging.warning(
                "REWARD-PAR: parallel path failed (%r); falling back to the "
                "serial implementation for the rest of the run.", _e)
          _rp_os.environ["TUNIX_REWARD_PARALLEL"] = "0"
          return _rp_serial_compute(self, prompts, completions, **kwargs)

      SequenceRewardManager._compute_rewards = _rp_parallel_compute
    except Exception as _e:
      print("REWARD-PAR ERROR (install): %r" % (_e,), flush=True)
    # --- end _REWARD_PAR --------------------------------------------------------------
    '''

    new = src + APPEND
    try:
        ast.parse(new)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")

    open(RM, "w", encoding="utf-8").write(new)

    v = open(RM, encoding="utf-8").read()
    problems = []
    if "_rp_parallel_compute" not in v:
        problems.append("wrapper missing")
    if v.count("def _compute_rewards") != 1:
        problems.append("serial _compute_rewards definition disturbed")
    try:
        ast.parse(v)
    except SyntaxError as e:
        problems.append(f"reparse failed: {e}")
    if problems:
        fail("; ".join(problems))
    print("REWARD-PAR PATCH: APPLIED")
  patch_rpa_blocks.py: |-
    """Forward RPA_V3_*_BLOCK_SIZES on the MaxText serving path.

    THE BUG. PR #3102 added the RPA v3 block-size env override, but wired it into
    ONLY ONE of the two entry points to the kernel:

      layers/jax/attention/attention.py       _rpa_block_size_kwargs() -> d_block_sizes  [WIRED]
      layers/common/attention_interface.py    sharded_ragged_paged_attention(...)        [NOT WIRED]

    MaxText's forward_serve_vllm imports sharded_ragged_paged_attention from
    attention_interface, so OUR path is the unwired one. d_block_sizes therefore
    arrives at the kernel as None and kernel.py `_prepare_block_sizes` falls back to
    get_default_block_sizes(), which for tpu7 DECODE sets BOTH bkv_sz and bkv_csz to
    min(min_bkv_sz_to_peak, max_kv).

    MEASURED, not assumed: the decode_only trace from the reference profiling run contains
    exactly one kernel configuration --
        RPAd-p_64-bq_1_1-bkv_16384_16384      138.4 ms = 74.7% of leaf decode time
    -- i.e. the untouched default, despite RPA_V3_DECODE_BLOCK_SIZES=1,16384,1,4096
    being present in the process environment. The compute block is 16384, not 4096.

    THE FIX. Mirror attention.py:268 at the attention_interface call site: forward the
    three env-derived tuples as kwargs when they are non-empty. Guarded by `not
    use_hd64` because the hd64 kernel has a different signature (it derives its own
    sizes via get_tuned_block_sizes) -- same guard the surrounding code already uses
    for update_kv_cache / use_causal_mask.

    HOW TO VERIFY IT WORKED. Re-read the decode_only xplane and look at the kernel
    name: it must become bkv_16384_4096. If it still says bkv_16384_16384 the patch
    did not take effect and any timing comparison is void.

    Prints exactly one of:
        RPA-BLOCKS PATCH: APPLIED
        RPA-BLOCKS PATCH: FAILED <reason>
    """

    import ast
    import os
    import sys

    ROOT = "/usr/local/lib/python3.12/site-packages/tpu_inference"
    AI = os.path.join(ROOT, "layers/common/attention_interface.py")


    def fail(msg):
        print(f"RPA-BLOCKS PATCH: FAILED {msg}")
        sys.exit(0)  # non-fatal: let the run start so the failure is visible in logs


    if not os.path.exists(AI):
        fail(f"{AI} not found")
    src = open(AI, encoding="utf-8").read()

    if "_RPA_V3_BLOCK_SIZES_FORWARDED" in src:
        print("RPA-BLOCKS PATCH: already patched")
        sys.exit(0)

    # `envs` must already be imported in this module (it reads USE_BATCHED_RPA_KERNEL).
    if "envs.USE_BATCHED_RPA_KERNEL" not in src:
        fail("envs is not referenced in attention_interface.py -- module layout changed")

    ANCHOR = """        if not use_hd64:
                kwargs["update_kv_cache"] = update_kv_cache
                kwargs["use_causal_mask"] = use_causal_mask
            return func(*args, **kwargs)
    """
    if src.count(ANCHOR) != 1:
        fail(f"anchor found {src.count(ANCHOR)} times, expected 1")

    INJECT = """        if not use_hd64:
                kwargs["update_kv_cache"] = update_kv_cache
                kwargs["use_causal_mask"] = use_causal_mask
                # _RPA_V3_BLOCK_SIZES_FORWARDED -- mirrors _rpa_block_size_kwargs()
                # in layers/jax/attention/attention.py, which PR #3102 wired into the
                # OTHER entry point. Without this the env override is silently
                # ignored on the MaxText serving path and the kernel uses
                # get_default_block_sizes().
                for _kw, _val in (
                        ("d_block_sizes", envs.RPA_V3_DECODE_BLOCK_SIZES),
                        ("p_block_sizes", envs.RPA_V3_PREFILL_BLOCK_SIZES),
                        ("m_block_sizes", envs.RPA_V3_MIXED_BLOCK_SIZES),
                ):
                    if _val:
                        kwargs[_kw] = tuple(_val)
            return func(*args, **kwargs)
    """

    src = src.replace(ANCHOR, INJECT, 1)

    try:
        ast.parse(src)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")

    open(AI, "w", encoding="utf-8").write(src)

    v = open(AI, encoding="utf-8").read()
    problems = []
    if "_RPA_V3_BLOCK_SIZES_FORWARDED" not in v:
        problems.append("marker missing")
    if "envs.RPA_V3_DECODE_BLOCK_SIZES" not in v:
        problems.append("decode override missing")
    if v.count("return func(*args, **kwargs)") != src.count("return func(*args, **kwargs)"):
        problems.append("call site disturbed")
    try:
        ast.parse(v)
    except SyntaxError as e:
        problems.append(f"reparse failed: {e}")
    if problems:
        fail("; ".join(problems))
    print("RPA-BLOCKS PATCH: APPLIED")
  patch_runner_eos.py: |-
    """GEMMA4 line, stop fix part 2: the continuous-decode DEVICE loop stops rows via runner.eos_token_id
    (runner_utils.get_eos_token_id(model_config)) — the tunix/vLLM host-side stop_token_ids are irrelevant inside a CD window.
    g4-001d proved it: with stop ids [1,50,106] in sampling_params, step 0 was still 99.46% capped, byte-identical to 001c.
    Union EXTRA_STOP_TOKEN_IDS into runner.eos_token_id (the CD masking and host extract already accept int-or-list).
    Prints RUNNER-EOS PATCH: APPLIED|FAILED and RUNNER-EOS ids=[...] at init."""
    import sys
    P = "/usr/local/lib/python3.12/site-packages/tpu_inference/runner/tpu_runner.py"
    s = open(P).read()
    if "_RUNNER_EOS" in s: print("RUNNER-EOS PATCH: already applied", flush=True); sys.exit(0)
    a = "        self.eos_token_id = runner_utils.get_eos_token_id(self.model_config)\n"
    if s.count(a) != 1: print("RUNNER-EOS PATCH: FAILED anchor %d" % s.count(a), flush=True); sys.exit(1)
    b = ("        self.eos_token_id = runner_utils.get_eos_token_id(self.model_config)\n"
         "        # _RUNNER_EOS: union env EXTRA_STOP_TOKEN_IDS (chat-turn enders, e.g. gemma 106/50) into the CD stop set\n"
         "        import os as _re_os, json as _re_json\n"
         "        import numpy as _re_np\n"
         "        try:\n"
         "            _re_extra = [int(x) for x in _re_json.loads(_re_os.environ.get('EXTRA_STOP_TOKEN_IDS', '[]'))]\n"
         "        except Exception:\n"
         "            _re_extra = []\n"
         "        if _re_extra:\n"
         "            _re_base = self.eos_token_id\n"
         "            if _re_base is None:\n"
         "                _re_ids = _re_extra\n"
         "            elif isinstance(_re_base, (int, _re_np.integer)):\n"
         "                _re_ids = [int(_re_base)] + _re_extra\n"
         "            else:\n"
         "                _re_ids = [int(x) for x in _re_np.atleast_1d(_re_base).tolist()] + _re_extra\n"
         "            self.eos_token_id = tuple(sorted(set(_re_ids)))\n"
         "            print('RUNNER-EOS ids=%s' % (self.eos_token_id,), flush=True)\n")
    s = s.replace(a, b)
    compile(s, P, "exec"); open(P, "w").write(s); print("RUNNER-EOS PATCH: APPLIED", flush=True)
  patch_sharded_sampling.py: |-
    """Vocab-sharded sampling + logprobs for the fused decode window.

    WHY. sampling.py force-replicates the logits over the vocab dim every decode
    iteration ("Unshard the logits explicitly...", with an upstream TODO asking
    for exactly this change): a (batch, 151936) f32 all-gather (~78 MB per DP
    rank per iteration), followed by topk_mask/topp_mask -- 32-33 full vocab-axis
    reduction sweeps each (the ~800us/call while-loops in every profile) -- and a
    full-vocab categorical, all computed redundantly on every TP device. The
    logprobs path (gather_logprobs) repeats full-vocab log_softmax + top-N + a
    rank reduction on the same replicated array.

    WHAT. Rebinds `sample` and `compute_and_gather_logprobs` with vocab-sharded
    implementations under jax.shard_map:
      - per TP shard: one lax.top_k over vocab/8, all-gather only the top-64
        candidate (value, index) pairs (~0.4 MB vs ~78 MB);
      - exact top-k cutoff, top-p cutoff, and categorical on the merged
        candidates. EXACTNESS: temperature scaling is monotone (order preserved);
        the union of per-shard top-64 contains the global top-k for k <= 64; the
        cutoff mask keeps values >= cutoff exactly like topk_mask (ties
        included); masked/non-candidate entries underflow to exactly zero
        probability in f32 softmax, so top-p mass sums and the categorical
        distribution equal the full-vocab computation. Verified on CPU with an
        8-device mesh: kept sets identical on adversarial ties, greedy exact,
        draw distribution within statistical noise, logprob top-N ids exact,
        values within 1e-6, ranks exact (scratchpad/shard_proto.py).
      - logprobs: log_softmax via pmax/psum, top-N from the same candidates
        (log_softmax is monotone in logits), token logprob + rank via psum.

    WHAT CHANGES NUMERICALLY. The categorical RNG stream differs (noise drawn
    over candidates, not the full vocab), so sampled tokens are not bitwise equal
    to the old path -- distribution-equal only. Logprob VALUES shift ~1e-6 from
    reduction order. Validity gates for the run: LENDIST truncation band and
    reward band, not bitwise reward equality.

    GUARDS.
      - lax.cond falls back to the ORIGINAL implementation for the whole batch
        if any row has top_k <= 0 or top_k > 64 (e.g. eval "liberal" top_k=2000)
        or top_p <= 0; both branches are compiled, only the taken one runs.
      - compute_and_gather_logprobs falls back statically if max_logprobs > 48.
      - env SHARDED_SAMPLING=0 disables the rebinding entirely at patch time...
        is checked at RUNTIME by the wrappers, so the kill-switch works from the
        manifest without re-patching.
      - `sample`'s ret_logits in the sharded path is the RAW (still-sharded)
        logits: valid for logprobs_mode="raw" (our config). A processed_logprobs
        deployment must disable this patch.

    FAIL-OPEN. Any missing anchor prints FAILED and exits 0.
    Prints exactly one of:
        SHARDED-SAMPLING PATCH: APPLIED
        SHARDED-SAMPLING PATCH: FAILED <reason>
    """

    import ast
    import os
    import sys

    ROOT = "/usr/local/lib/python3.12/site-packages/tpu_inference"
    SP = os.path.join(ROOT, "layers/jax/sample/sampling.py")


    def fail(msg):
        print(f"SHARDED-SAMPLING PATCH: FAILED {msg}")
        sys.exit(1)


    if not os.path.exists(SP):
        fail(f"{SP} not found")
    src = open(SP, encoding="utf-8").read()

    if "_SHARDED_SAMPLING" in src:
        print("SHARDED-SAMPLING PATCH: already patched")
        sys.exit(0)

    for needle in ("def sample(", "def compute_and_gather_logprobs(",
                   "def gather_logprobs(", "def _apply_sampling_transforms(",
                   "ShardingAxisName"):
        if needle not in src:
            fail(f"anchor '{needle}' not present in sampling.py")

    APPEND = '''

    # --- _SHARDED_SAMPLING -------------------------------------------------------
    # Appended by patch_sharded_sampling.py (see its docstring). Rebinds `sample`
    # and `compute_and_gather_logprobs` below; originals are kept as fallbacks.
    try:
      import os as _ss_os
      from jax import lax as _ss_lax
      try:
        from jax import shard_map as _ss_shard_map          # jax >= 0.8
      except ImportError:
        from jax.experimental.shard_map import shard_map as _ss_shard_map

      _SS_CAND = 64
      _SS_NEG = -1e12

      _ss_orig_sample = sample
      _ss_orig_cgl = compute_and_gather_logprobs

      def _ss_axes(mesh):
        """(batch_axes, vocab_axis) restricted to axes present in the mesh."""
        def present(name):
          if name is None:
            return ()
          if isinstance(name, (tuple, list)):
            return tuple(a for a in name if a in mesh.axis_names)
          return (name,) if name in mesh.axis_names else ()
        batch = present(ShardingAxisName.ATTN_DATA)
        vocab = present(ShardingAxisName.MODEL)
        return batch, (vocab[0] if vocab else None)

      def _ss_merged_candidates(x_blk, vocab_axis):
        v_shard = x_blk.shape[-1]
        midx = _ss_lax.axis_index(vocab_axis)
        vals, idx = _ss_lax.top_k(x_blk, _SS_CAND)
        gidx = idx + midx * v_shard
        av = _ss_lax.all_gather(vals, vocab_axis)
        ai = _ss_lax.all_gather(gidx, vocab_axis)
        n = av.shape[0]
        av = jnp.transpose(av, (1, 0, 2)).reshape(-1, n * _SS_CAND)
        ai = jnp.transpose(ai, (1, 0, 2)).reshape(-1, n * _SS_CAND)
        return av, ai

      def _ss_greedy(cv, ci):
        m = jnp.max(cv, axis=-1, keepdims=True)
        big = jnp.iinfo(jnp.int32).max
        return jnp.min(jnp.where(cv >= m, ci, big), axis=-1)

      def _ss_kth(cv, k):
        sv = -jnp.sort(-cv, axis=-1)
        kk = jnp.clip(k, 1, cv.shape[-1]) - 1
        return jnp.take_along_axis(sv, kk[:, None], axis=-1)

      def _ss_topp_cutoff(probs, p):
        sp = -jnp.sort(-probs, axis=-1)
        cum = jnp.cumsum(sp, axis=-1)
        jstar = jnp.argmax(cum >= p[:, None], axis=-1)
        return jnp.take_along_axis(sp, jstar[:, None], axis=-1)

      def _ss_sample_block(vocab_axis, batch_axes, rng, x, temperature, top_k,
                           top_p, do_argmax_only):
        # x: (b_local, v_shard) f32
        didx = 0
        for i, a in enumerate(batch_axes):
          didx = didx * _ss_lax.axis_size(a) + _ss_lax.axis_index(a)
        xt = x / temperature[:, None]
        cv, ci = _ss_merged_candidates(xt, vocab_axis)
        greedy = _ss_greedy(cv, ci)
        if do_argmax_only:
          return _ss_lax.pmax(greedy, vocab_axis)
        kth = _ss_kth(cv, top_k)
        mk = jnp.where((top_k > 0)[:, None] & ~(cv >= kth), _SS_NEG, cv)
        probs = jax.nn.softmax(mk, axis=-1)
        pcut = _ss_topp_cutoff(probs, top_p)
        mp = jnp.where((top_p < 1.0)[:, None] & ~(probs >= pcut), _SS_NEG, mk)
        r = jax.random.fold_in(rng, didx)
        choice = jax.random.categorical(r, mp)
        sampled = jnp.take_along_axis(ci, choice[:, None], axis=-1)[:, 0]
        out = jnp.where(temperature < _SAMPLING_EPS, greedy, sampled)
        # Values are identical on every vocab shard (built from all-gathered
        # candidates); the pmax is an identity that makes that replication
        # provable to shard_map's output check on every jax version.
        return _ss_lax.pmax(out, vocab_axis)

      def _ss_sample(rng, mesh, logits, meta):
        batch_axes, vocab_axis = _ss_axes(mesh)
        bspec = P(batch_axes if batch_axes else None)
        lspec = P(batch_axes if batch_axes else None, vocab_axis)
        logits = jax.lax.with_sharding_constraint(logits,
                                                  NamedSharding(mesh, lspec))

        def blk(rng, x, t, k, p):
          return _ss_sample_block(vocab_axis, batch_axes, rng, x, t, k, p,
                                  do_argmax_only=not meta.do_sampling)

