            jax.jit,
            out_shardings=(
                kv_cache_sharding,
                hidden_states_sharding,
                hidden_states_sharding,  # aux hidden states
                None,  # expert ids
            ),
            donate_argnums=1,  # 0 is state_leaves, 1 is kv_cache
            static_argnums=(
                6, 9, 10
            ),  # 6 is layer_name_to_kvcache_index, 9 is is_first_rank, 10 is is_last_rank
        )

