    The unroll does src_val.value[idx] once per layer per scanned param (~290 remote dispatches through the
    Pathways proxy). One jitted call per scanned param returns all layer slices at once (~10 dispatches).
    Prints JIT-UNROLL PATCH: APPLIED | FAILED."""
