            from google.cloud import storage as _gcs_st
            bname, _, prefix = art[5:].partition("/")
            base_pre = f"{prefix.rstrip('/')}/{jid}".lstrip("/")
            bkt = _gcs_st.Client().bucket(bname)
            rs_blob = bkt.blob(f"{base_pre}/run_status.json")
            if rs_blob.exists():
                rs_blob.delete()
                print(f"PR16-RESUME-CLEANUP: deleted stale gs://{bname}/{base_pre}/run_status.json", flush=True)
            for blob in bkt.list_blobs(prefix=f"{base_pre}/tensorboard/"):
                if "events.out.tfevents" in blob.name and int(blob.size or 0) < 4096:
