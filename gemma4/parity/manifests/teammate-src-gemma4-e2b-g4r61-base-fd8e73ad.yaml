  gemma4_gsm8k_data.py: |-
    """PR #16 Frozen Gemma-4 E2B GSM8K 8K Dataset Processor & Prompt Fixture Gate.

    Enforces the exact input contract from `examples/grpo_trainer/my_scripts_GKE_gemma4/gsm8k_8k/TPU_INSTRUCTIONS.md`:
      - System message:
          "You are a helpful assistant. Please reason step by step, and put your final answer within \\boxed{}."
      - Native Gemma-4 chat template rendered ONCE (`add_generation_prompt=True`, `tokenize=False`),
        producing:
          `<bos><|turn>system\n{SYSTEM_MESSAGE}<turn|>\n<|turn>user\n{question}<turn|>\n<|turn>model\n`
      - Tokenized with `add_special_tokens=False` so `<bos>` (id 2) is never duplicated:
          starts with `[2, 105, 9731, 107, ...]` and ends with `[..., 106, 107, 105, 4368, 107]`.
      - Prompt token cap: `512` tokens (`add_special_tokens=False`). Overlong input (> 512 tokens) raises
        a hard `ValueError` and is never truncated or silently filtered.
      - Verifies the 6 frozen GSM8K prompt fixtures (`prompt_fixture_gemma.json`: train qids 2348, 0, 3331
        and test qids 10000595, 10000000, 10001077) on first invocation.
    """

    import json
    import os
    import re

    SYSTEM_MESSAGE = (
        "You are a helpful assistant. Please reason step by step, and put your final answer within \\boxed{}."
    )
    PROMPT_CAP_TOKENS = 512
    FIXTURE_PATH = os.path.join(os.path.dirname(os.path.abspath(__file__)), "prompt_fixture_gemma.json")
    _VERIFIED_FIXTURES = [False]
    _PRINTED_SAMPLE = [False]
    _ANS_HASH_RE = re.compile(r"####\s*(.+)$", re.MULTILINE)


    def _to_str(val) -> str:
        return val.decode("utf-8") if isinstance(val, bytes) else str(val)


    def render_gemma4_gsm8k_prompt(question: str, tokenizer=None) -> str:
        """Render a GSM8K question once with the native Gemma-4 chat template."""
        canonical = (
            f"<bos><|turn>system\n{SYSTEM_MESSAGE}<turn|>\n"
            f"<|turn>user\n{question}<turn|>\n"
            f"<|turn>model\n"
        )
        if tokenizer is not None and hasattr(tokenizer, "apply_chat_template"):
            try:
                messages = [
                    {"role": "system", "content": SYSTEM_MESSAGE},
                    {"role": "user", "content": question},
                ]
                rendered = tokenizer.apply_chat_template(
                    messages, tokenize=False, add_generation_prompt=True
                )
                if isinstance(rendered, str) and rendered.startswith("<bos><|turn>system\n"):
                    if rendered != canonical:
                        raise ValueError(
                            f"Gemma-4 apply_chat_template output diverged from canonical template: {rendered!r} vs {canonical!r}"
                        )
                    return rendered
            except Exception as exc:
                if isinstance(exc, ValueError):
                    raise
        return canonical


    def encode_prompt_no_extra_bos(tokenizer, rendered_prompt: str) -> list[int]:
        """Encode a rendered `<bos>...` prompt with `add_special_tokens=False` (single leading BOS=2)."""
        for cand in (
            tokenizer,
            getattr(tokenizer, "_tokenizer", None),
            getattr(tokenizer, "tokenizer", None),
        ):
            if cand is None or not hasattr(cand, "encode"):
                continue
            try:
                enc = cand.encode(rendered_prompt, add_special_tokens=False)
                raw_ids = enc.ids if hasattr(enc, "ids") else enc
                return [int(t) for t in raw_ids]
            except TypeError:
                continue
        enc = tokenizer.encode(rendered_prompt)
        raw_ids = list(enc.ids if hasattr(enc, "ids") else enc)
        while len(raw_ids) >= 2 and raw_ids[0] == 2 and raw_ids[1] == 2:
            raw_ids = raw_ids[1:]
        return [int(t) for t in raw_ids]


    def verify_prompt_fixtures(tokenizer=None) -> dict:
        """Verify the 6 frozen GSM8K prompt fixtures from `prompt_fixture_gemma.json`."""
        if not os.path.isfile(FIXTURE_PATH):
            raise FileNotFoundError(f"Missing frozen PR #16 prompt fixture file: {FIXTURE_PATH}")
        with open(FIXTURE_PATH, "r", encoding="utf-8") as f:
            fx = json.load(f)
        fixtures = list(fx.get("train", [])) + list(fx.get("test", []))
        if len(fixtures) != 6:
            raise ValueError(f"Expected 6 frozen prompt fixtures (3 train + 3 test), found {len(fixtures)}")

        checked = 0
        for item in fixtures:
            qid = int(item["qid"])
            msgs = item["messages"]
            if msgs[0]["content"] != SYSTEM_MESSAGE:
                raise ValueError(f"Prompt fixture qid={qid} system_message mismatch: {msgs[0]['content']!r}")
            question = msgs[-1]["content"]
            rendered = render_gemma4_gsm8k_prompt(question, tokenizer=tokenizer)
            if rendered != item["rendered"]:
                raise ValueError(f"Prompt fixture qid={qid} rendered string mismatch")
            ref_ids = [int(x) for x in item["input_ids"]]
            if len(ref_ids) != int(item["n_tokens"]) or len(ref_ids) > PROMPT_CAP_TOKENS:
                raise ValueError(f"Prompt fixture qid={qid} invalid ref token count {len(ref_ids)}")
            if ref_ids[:4] != [2, 105, 9731, 107] or ref_ids[-5:] != [106, 107, 105, 4368, 107]:
                raise ValueError(f"Prompt fixture qid={qid} boundary IDs mismatch: {ref_ids[:4]} ... {ref_ids[-5:]}")
            if tokenizer is not None:
                ids = encode_prompt_no_extra_bos(tokenizer, rendered)
                if len(ids) != int(item["n_tokens"]):
                    raise ValueError(
                        f"Prompt fixture qid={qid} token_count={len(ids)} != expected {item['n_tokens']}"
                    )
                if ids != ref_ids:
                    raise ValueError(f"Prompt fixture qid={qid} token IDs mismatch")
            checked += 1
        return {"checked": checked, "qids": [int(x["qid"]) for x in fixtures]}


    def extract_gsm8k_gold(raw_answer: str) -> str:
        """Extract the gold answer string from GSM8K `answer` (`#### <gold>`) or already-extracted `ground_truth`."""
        s = _to_str(raw_answer).strip()
        m = _ANS_HASH_RE.search(s)
        if m:
            return m.group(1).strip()
        return s


    def extract_row_question_and_gold(x) -> tuple[str, str]:
        """Extract `(question, gold)` from either raw GSM8K (`question`/`answer`) or verl parquet (`prompt`/`reward_model`)."""
        if not isinstance(x, dict) and hasattr(x, "keys"):
            x = {k: x[k] for k in x.keys()}
        if not isinstance(x, dict):
            return _to_str(x), ""

        p_val = x.get("prompt")
        if (
            p_val is not None
            and not isinstance(p_val, (str, bytes, dict))
            and hasattr(p_val, "__len__")
            and len(p_val) > 0
        ):
            last_msg = p_val[-1]
            question = _to_str(last_msg["content"] if isinstance(last_msg, dict) else last_msg)
        elif isinstance(x.get("extra_info"), dict) and "question" in x["extra_info"]:
            question = _to_str(x["extra_info"]["question"])
        else:
            question = None
            for key in ("question", "problem", "prompt"):
                if key in x:
                    question = _to_str(x[key])
                    break
            if question is None:
                raise KeyError(f"GSM8K record missing question/prompt field: keys={list(x.keys())}")

        if "reward_model" in x and isinstance(x["reward_model"], dict) and "ground_truth" in x["reward_model"]:
            gold = extract_gsm8k_gold(_to_str(x["reward_model"]["ground_truth"]).strip())
        elif isinstance(x.get("extra_info"), dict) and "answer" in x["extra_info"]:
            gold = extract_gsm8k_gold(_to_str(x["extra_info"]["answer"]).strip())
        else:
            raw_ans = None
            for key in ("ground_truth", "answer", "solution", "expected_answer"):
                if key in x:
                    raw_ans = _to_str(x[key])
                    break
            if raw_ans is None:
                gold = ""
            else:
                gold = extract_gsm8k_gold(raw_ans)
        return question, gold


    def audit_gsm8k_prompt_lengths(rows_or_questions, tokenizer, cap: int = PROMPT_CAP_TOKENS) -> dict:
        """Audit all GSM8K prompts after native Gemma-4 chat-template rendering (`add_special_tokens=False`).

        Supports both raw question strings and full dataset records in either schema:
          - Raw HF `openai/gsm8k` (`question`, `answer`)
          - PR #16 verl parquet (`prompt`, `reward_model.ground_truth`)
        Fails closed (`ValueError`) if any prompt exceeds `cap` (512) tokens or violates the
        single-BOS / turn-boundary token ID invariant (`[2, 105, 9731, 107] ... [106, 107, 105, 4368, 107]`).
        """
        import hashlib as _hl
        if tokenizer is None:
            raise ValueError("audit_gsm8k_prompt_lengths requires a non-None tokenizer")
        lengths = []
        over_cap = []
        norm_questions = []
        norm_golds = []
        rendered_prompts = []
        for idx, item in enumerate(rows_or_questions):
            if isinstance(item, dict) or hasattr(item, "keys"):
                q_str, gold_str = extract_row_question_and_gold(item)
            else:
                q_str, gold_str = _to_str(item), ""
            norm_questions.append(q_str.strip())
            norm_golds.append(gold_str.strip())
            rendered = render_gemma4_gsm8k_prompt(q_str, tokenizer=tokenizer)
            rendered_prompts.append(rendered)
            ids = encode_prompt_no_extra_bos(tokenizer, rendered)
            if ids[:4] != [2, 105, 9731, 107] or ids[-5:] != [106, 107, 105, 4368, 107]:
                raise ValueError(
                    f"GSM8K row {idx} boundary token IDs invalid: prefix={ids[:4]}, suffix={ids[-5:]}"
                )
            n_tok = len(ids)
            lengths.append(n_tok)
            if n_tok > cap:
                over_cap.append((idx, n_tok))
        if not lengths:
            raise ValueError("audit_gsm8k_prompt_lengths received empty question list")
        if over_cap:
            raise ValueError(
                f"PR #16 GSM8K prompt cap ({cap}) violated on {len(over_cap)} row(s): first={over_cap[:5]}"
            )
        return {
            "num_questions": len(lengths),
            "max_prompt_tokens": max(lengths),
            "min_prompt_tokens": min(lengths),
            "over_cap_count": len(over_cap),
            "questions_sha256": _hl.sha256("\n".join(norm_questions).encode("utf-8")).hexdigest(),
            "golds_sha256": _hl.sha256("\n".join(norm_golds).encode("utf-8")).hexdigest(),
            "rendered_prompts_sha256": _hl.sha256("\n".join(rendered_prompts).encode("utf-8")).hexdigest(),
        }


    def _ensure_staged_gsm8k_parquet(split: str = "train") -> str | None:
        """Resolve local or GCS-staged frozen PR #16 GSM8K parquet (`train` or `test`)."""
        import os as _os
        fname = "gsm8k_boxed_test.parquet" if split == "test" else "gsm8k_boxed_train.parquet"
        for cand in (f"/gcs/gsm8k_pr16_data/{fname}", f"/tmp/gsm8k_pr16_data/{fname}"):
            if _os.path.isfile(cand) and _os.path.getsize(cand) > 0:
                return cand
        try:
            from google.cloud import storage as _st
            _os.makedirs("/tmp/gsm8k_pr16_data", exist_ok=True)
            dst = f"/tmp/gsm8k_pr16_data/{fname}"
            blob = _st.Client().bucket("ubench-logs").blob(f"gsm8k_pr16_data/{fname}")
            if blob.exists():
                blob.download_to_filename(dst)
                if _os.path.isfile(dst) and _os.path.getsize(dst) > 0:
                    return dst
        except Exception as _se:
            print(f"PR16-STAGE-PARQUET WARN ({split}): {_se!r}", flush=True)
        return None


    def compute_input_data_identity(
        data,
        split: str,
        data_source: str,
        parquet_path: str | None = None,
        prompt_audit: dict | None = None,
        prompt_fixtures_checked: int = 6,
    ) -> dict:
        """Build a verifiable `input_data_identity.json` manifest for train/eval GSM8K data."""
        import hashlib as _hl
        import os as _os
        cols = list(getattr(data, "column_names", None) or [])
        if not cols and len(data) > 0:
            first = data[0]
            if isinstance(first, dict) or hasattr(first, "keys"):
                cols = [str(k) for k in first.keys()]
        pq_sha256 = None
        if parquet_path and isinstance(parquet_path, str):
            p_clean = parquet_path.strip()
            if p_clean and not p_clean.startswith(("hf://", "gs://", "http://", "https://")) and _os.path.isfile(p_clean):
                h = _hl.sha256()
                with open(p_clean, "rb") as f:
                    for chunk in iter(lambda: f.read(1 << 20), b""):
                        h.update(chunk)
                pq_sha256 = h.hexdigest()
        if prompt_audit is None:
            qs = []
            gs = []
            for row in data:
                q_str, g_str = extract_row_question_and_gold(row)
                qs.append(q_str.strip())
                gs.append(g_str.strip())
            q_sha = _hl.sha256("\n".join(qs).encode("utf-8")).hexdigest()
            g_sha = _hl.sha256("\n".join(gs).encode("utf-8")).hexdigest()
            max_tok = None
            min_tok = None
            over_cap = None
        else:
            q_sha = prompt_audit.get("questions_sha256")
            g_sha = prompt_audit.get("golds_sha256")
            max_tok = prompt_audit.get("max_prompt_tokens")
            min_tok = prompt_audit.get("min_prompt_tokens")
            over_cap = prompt_audit.get("over_cap_count")
        return {
            "split": str(split),
            "data_source": str(data_source),
            "parquet_path": str(parquet_path).strip() if parquet_path else None,
            "parquet_sha256": pq_sha256,
            "num_rows": int(len(data)),
            "num_questions": int(len(data)),
            "prompt_fixtures_checked": int(prompt_fixtures_checked),
            "schema_columns": cols,
            "questions_sha256": q_sha,
            "golds_sha256": g_sha,
            "max_prompt_tokens": max_tok,
            "min_prompt_tokens": min_tok,
            "over_cap_count": over_cap,
        }


    def load_gsm8k_dataset(
        tmvp_config,
        split: str = "train",
        data_files=None,
        dataset_name: str | None = None,
        datasets_mod=None,
        tokenizer=None,
    ):
        """Load GSM8K dataset for PR #16 (`parquet` or `openai/gsm8k`), audit prompts, and emit `input_data_identity.json`."""
        import json as _json
        import os as _os
        import sys as _sys
        if datasets_mod is None:
            import datasets as datasets_mod

        ds_name = str(dataset_name or getattr(tmvp_config, "dataset_name", "openai/gsm8k") or "openai/gsm8k").strip()
        subset = getattr(tmvp_config, "hf_subset", "main") or "main"
        env_pq = _os.environ.get("PR16_TRAIN_PARQUET", "").strip()
        raw_cfg_files = data_files if data_files is not None else getattr(tmvp_config, "hf_train_files", None)
        cfg_train_files = str(raw_cfg_files if raw_cfg_files is not None else env_pq).strip()
        default_hf_glob = "hf://datasets/openai/gsm8k/main/train-*.parquet"
        if (
            cfg_train_files in ("", default_hf_glob)
            or (cfg_train_files.startswith("/gcs/gsm8k_pr16_data/") and not _os.path.isfile(cfg_train_files))
        ):
            staged_pq = _ensure_staged_gsm8k_parquet(split)
            if staged_pq:
                cfg_train_files = staged_pq

        # Use parquet loader whenever dataset_name == 'parquet' OR a custom parquet path was provided.
        use_parquet = (
            ds_name.lower() in ("parquet", "gsm8k-parquet")
            or (
                bool(cfg_train_files)
                and cfg_train_files != default_hf_glob
                and (
                    cfg_train_files.endswith(".parquet")
                    or cfg_train_files.startswith(("/", "./", "../", "gs://", "hf://"))
                )
            )
        )
        if use_parquet and cfg_train_files:
            try:
                pq_files = (
                    cfg_train_files
                    if split == "train"
                    else ({split: cfg_train_files} if isinstance(cfg_train_files, str) else cfg_train_files)
                )
                data = datasets_mod.load_dataset("parquet", data_files=pq_files, split=split)
                actual_source = f"parquet:{cfg_train_files}"
                used_pq_path = cfg_train_files
            except Exception:
                # Only allow fallback when using the built-in default HF glob URI without custom override
                if cfg_train_files == default_hf_glob and ds_name.lower() != "parquet":
                    data = datasets_mod.load_dataset("openai/gsm8k", name=subset, split=split)
                    actual_source = f"openai/gsm8k:{subset}"
                    used_pq_path = None
                else:
                    raise
        else:
            data = datasets_mod.load_dataset("openai/gsm8k", name=subset, split=split)
            actual_source = f"openai/gsm8k:{subset}"
            used_pq_path = None

        if tokenizer is None:
            from transformers import AutoTokenizer as _AutoTokenizer
            tokenizer = _AutoTokenizer.from_pretrained(
                getattr(tmvp_config, "tokenizer_path", "google/gemma-4-E2B-it")
            )
        verify_prompt_fixtures(tokenizer=tokenizer)
        aud_len = audit_gsm8k_prompt_lengths(data, tokenizer, cap=PROMPT_CAP_TOKENS)
        identity = compute_input_data_identity(
            data,
            split=split,
            data_source=actual_source,
            parquet_path=used_pq_path,
            prompt_audit=aud_len,
        )
        _sys._pr16_input_data_identity = identity
        try:
            with open("/tmp/input_data_identity.json", "w", encoding="utf-8") as f:
                _json.dump(identity, f, indent=2, sort_keys=True)
            _run = _os.environ.get("JOB_IDENTIFIER", "unknown-run")
            _art = _os.environ.get("ARTIFACT_DIR", "")
            if _art.startswith("gs://"):
                from google.cloud import storage as _st
                _b, _, _pre = _art[5:].partition("/")
                _key = ("%s/%s/input_data_identity.json" % (_pre.rstrip("/"), _run)).lstrip("/")
                _st.Client().bucket(_b).blob(_key).upload_from_string(
                    _json.dumps(identity, indent=2, sort_keys=True),
                    content_type="application/json",
                )
        except Exception as _ie:
            print(f"PR16-DATA-IDENTITY WARN: {_ie!r}", flush=True)
        print(
            f"PR16-DATASET-GATE split={split} source={actual_source} rows={len(data)} cols={identity['schema_columns']} "
            f"fixtures_6_ok=True max_prompt_tokens={aud_len['max_prompt_tokens']} over_512={aud_len['over_cap_count']} "
            f"questions_sha256={identity['questions_sha256'][:16]} golds_sha256={identity['golds_sha256'][:16]}",
            flush=True,
        )
        return data


    def summarize_pytree_float_dtypes(tree_obj) -> tuple[str, int]:
        """Inspect every floating-point leaf in a pytree or iterable.

        Returns `(dtype_summary, num_float_leaves)`:
          - `"float32"` iff `num_float_leaves > 0` and every floating-point leaf is `float32`.
          - `"mixed:" + ",".join(uniq)` if multiple floating-point dtypes are present.
          - Single dtype string (e.g. `"bfloat16"`) if all leaves share another float dtype.
          - `"unknown"` if no floating-point leaves exist.
        """
        if tree_obj is None:
            return "unknown", 0
        leaves = []

        def _walk(node):
            if node is None:
                return
            if isinstance(node, str):
                if "float" in node or "bfloat" in node:
                    leaves.append(node)
                return
            arr = getattr(node, "value", node)
            if hasattr(arr, "dtype") and not isinstance(arr, (dict, list, tuple)):
                dt_s = str(arr.dtype)
                if "float" in dt_s or "bfloat" in dt_s:
                    leaves.append(dt_s)
                return
            if isinstance(node, dict):
                for v in node.values():
                    _walk(v)
            elif isinstance(node, (list, tuple)):
                for v in node:
                    _walk(v)
            elif hasattr(node, "__dict__"):
                for v in vars(node).values():
                    _walk(v)

        try:
            import jax as _jax
            flat_leaves, _ = _jax.tree_util.tree_flatten(tree_obj)
            for lf in flat_leaves:
                _walk(lf)
        except Exception:
            _walk(tree_obj)

        norm_dtypes = []
        for d in leaves:
            if "bfloat16" in d:
                norm_dtypes.append("bfloat16")
            elif "float32" in d:
                norm_dtypes.append("float32")
            elif "float16" in d:
                norm_dtypes.append("float16")
            elif "float64" in d:
                norm_dtypes.append("float64")
            else:
                norm_dtypes.append(d)
        if not norm_dtypes:
            return "unknown", 0
        uniq = sorted(set(norm_dtypes))
        if len(uniq) == 1:
            return uniq[0], len(norm_dtypes)
        return "mixed:" + ",".join(uniq), len(norm_dtypes)


