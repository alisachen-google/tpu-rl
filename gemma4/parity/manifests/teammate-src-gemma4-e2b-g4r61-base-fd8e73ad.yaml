    c = ("        valid_tokens = _extract_valid_tokens_host(tokens, eos_token_id)\n"
         "        if len(valid_tokens) < len(tokens) or (valid_tokens and\n"
         "                                               valid_tokens[-1] in eos_arr):\n"
         "            num_eos_hits += 1\n")
    d = ("        valid_tokens = tokens[:int(_vt_len[req_idx])].tolist()  # _HOST_EXTRACT_VEC\n"
         "        if _has_eos[req_idx]:\n"
