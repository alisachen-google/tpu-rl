            if hasattr(node, "mu") and hasattr(node, "nu"):
                found.append((getattr(node, "mu"), getattr(node, "nu")))
                return
            if isinstance(node, dict) and "mu" in node and "nu" in node:
                found.append((node["mu"], node["nu"]))
                return
            if isinstance(node, dict):
                for v in node.values():
                    _search(v, depth + 1)
            elif isinstance(node, (list, tuple)):
                for v in node:
                    _search(v, depth + 1)
            elif hasattr(node, "inner_state"):
                _search(getattr(node, "inner_state"), depth + 1)

        _search(opt_state_tree, 0)
        if found:
            return found[0]
        return None, None


    def audit_completion_masks_and_truncation(
        completion_ids,
        completion_mask,
        raw_sampler_tokens=None,
        response_cap: int = 8192,
        stop_ids: tuple[int, ...] = (1, 106, 50),
    ) -> dict:
        """Audit completion token IDs and loss masks for PR #16 stop-token and truncation invariants.

        Checks:
          1. Response width and valid mask count never exceed `response_cap` (8,192), and no stop token
             or active mask appears at index `>= response_cap` (catching appended 8,193rd synthetic EOS).
          2. Active mask positions form a contiguous prefix `0 .. valid_len - 1`.
          3. If a stop token in `stop_ids` (`[1, 106, 50]`) appears in `0 .. response_cap - 1`, the first
             stop token has `mask == 1` and all subsequent positions have `mask == 0` (`valid_len == first_s + 1`).
          4. For any sequence reaching `response_cap` (`valid_len == response_cap`), the final token at
             index `response_cap - 1` must NOT be a synthetic stop token: if `row_ids[response_cap - 1] in stop_ids`,
             it is rejected unless `raw_sampler_tokens` proves the sampler genuinely generated that stop token at
             index `response_cap - 1` (and when `raw_sampler_tokens` is provided, every row's valid prefix must
             match the raw unpadded sampler tokens exactly).
        """
        import numpy as _np
        ids_np = _np.asarray(completion_ids)
        msk_np = _np.asarray(completion_mask)
        if ids_np.ndim == 1:
            ids_np = ids_np[None, :]
            msk_np = msk_np[None, :]
        stop_set = set(int(x) for x in stop_ids)
        mask_ok = True
        trunc_ok = True
        rows_checked = int(ids_np.shape[0])
        seq_width = int(ids_np.shape[1]) if ids_np.ndim >= 2 else 0

        if seq_width > response_cap:
            if _np.any(msk_np[:, response_cap:] > 0.0):
                mask_ok = False
                trunc_ok = False
            if _np.any(_np.isin(ids_np[:, response_cap:], list(stop_set))):
                trunc_ok = False

        for r_i in range(rows_checked):
            row_ids = ids_np[r_i]
            row_msk = msk_np[r_i]
            valid_len = int(_np.sum(row_msk > 0.0))
            if valid_len > response_cap:
                mask_ok = False
                trunc_ok = False
            if valid_len > 0:
                if not _np.all(row_msk[:valid_len] > 0.0) or _np.any(row_msk[valid_len:] > 0.0):
                    mask_ok = False

            prefix_w = min(seq_width, response_cap)
            stop_idx = _np.nonzero(_np.isin(row_ids[:prefix_w], list(stop_set)))[0]
            if stop_idx.size > 0:
                first_s = int(stop_idx[0])
                if float(row_msk[first_s]) <= 0.0:
                    mask_ok = False
                if first_s + 1 < row_msk.shape[0] and _np.any(row_msk[first_s + 1:] > 0.0):
                    mask_ok = False
                if valid_len != first_s + 1:
                    mask_ok = False

            if valid_len >= response_cap and prefix_w >= response_cap:
                last_tok = int(row_ids[response_cap - 1])
                if last_tok in stop_set:
                    if raw_sampler_tokens is None or r_i >= len(raw_sampler_tokens):
                        trunc_ok = False
                    else:
                        raw_row = _np.asarray(raw_sampler_tokens[r_i], dtype=_np.int64).reshape(-1)
                        if raw_row.size != response_cap or int(raw_row[response_cap - 1]) != last_tok:
                            trunc_ok = False

            if raw_sampler_tokens is not None and r_i < len(raw_sampler_tokens):
                raw_row = _np.asarray(raw_sampler_tokens[r_i], dtype=_np.int64).reshape(-1)
                if raw_row.size > response_cap:
                    trunc_ok = False
                elif raw_row.size != valid_len or not _np.array_equal(row_ids[:valid_len].astype(_np.int64), raw_row):
                    trunc_ok = False

        return {
            "stop_token_mask_ok": bool(mask_ok),
            "truncation_no_synth_eos_ok": bool(trunc_ok),
            "stop_token_rows_checked": int(rows_checked),
            "raw_sampler_tokens_verified": bool(
                isinstance(raw_sampler_tokens, list) and len(raw_sampler_tokens) == rows_checked
            ),
        }


