                if not ex_aud["truncation_no_synth_eos_ok"]:
                  trunc_ok = False
                rows_checked += int(ex_aud["stop_token_rows_checked"])
              if rows_checked > 0:
                aud["stop_token_mask_ok"] = bool(mask_ok)
                aud["truncation_no_synth_eos_ok"] = bool(trunc_ok)
                aud["stop_token_rows_checked"] = int(rows_checked)
                aud["raw_sampler_tokens_verified"] = bool(isinstance(raw_tokens, list) and len(raw_tokens) == rows_checked)
          except Exception as _pe:
            print(f"PR16-PREP-AUDIT WARN: {_pe!r}", flush=True)
        return res

      RLLearner._prepare_data = _pr16_wrapped_prep_data

      def _pr16_wrapped_mb(self, *a, **k):
        if _pr16_rl_os.environ.get("RECIPE_MODE", "gsm8k-pr16").strip() != "gsm8k-pr16":
          return _pr16_orig_rl_mb(self, *a, **k)
        aud = getattr(_pr16_rl_sys, "_tpu_usa_audit", None)
        if not isinstance(aud, dict):
          aud = {"trainer_weight_version": 0, "sampler_weight_version": 0}
          _pr16_rl_sys._tpu_usa_audit = aud

        step_s = int(getattr(self.rl_cluster, "global_steps", 0))
        update_u = step_s + 1
        rollout_ver_used = int(aud.get("sampler_weight_version", step_s))
        pre_upd_counter = int(aud.get("_opt_updates_counter", 0))
        pre_p, p_dtype, pre_adam, mu_dt, nu_dt, pre_opt_cnt, pre_opt_lr = _pr16_extract_trainer_canary(self)

        horizon = int(_pr16_rl_os.environ.get("SCHEDULE_HORIZON_STEPS", "250"))
        sched_fn = getattr(_pr16_rl_sys, "_pr16_lr_schedule_fn", None)
        eff_s = int(pre_opt_cnt) if pre_opt_cnt is not None else step_s
        if callable(sched_fn):
          lr_sched_pre = float(sched_fn(eff_s))
          lr_sched_post = float(sched_fn(eff_s + 1))
        else:
          lr_sched_pre = 2e-6 * (eff_s / 10.0) if eff_s < 10 else 2e-6 * 0.5 * (1.0 + _pr16_rl_math.cos(_pr16_rl_math.pi * (eff_s - 10) / max(1, horizon - 10)))
          lr_sched_post = 2e-6 * ((eff_s + 1) / 10.0) if (eff_s + 1) < 10 else 2e-6 * 0.5 * (1.0 + _pr16_rl_math.cos(_pr16_rl_math.pi * ((eff_s + 1) - 10) / max(1, horizon - 10)))

        res = _pr16_orig_rl_mb(self, *a, **k)

        post_p, post_p_dtype, post_adam, post_mu_dt, post_nu_dt, post_opt_cnt, post_opt_lr = _pr16_extract_trainer_canary(self)
        post_upd_counter = int(aud.get("_opt_updates_counter", 0))
        # In Optax inject_hyperparams, hyperparams["learning_rate"] is updated inside opt.update()
        # using the pre-update count `eff_s` (so post_opt_lr == sched_fn(eff_s) == lr_actually_used).
        lr_used = float(post_opt_lr) if post_opt_lr is not None else float(lr_sched_pre)
        lr_post = float(lr_sched_post)
        if pre_opt_cnt is not None and post_opt_cnt is not None:
          opt_steps_batch = int(post_opt_cnt - pre_opt_cnt)
        else:
          opt_steps_batch = int(post_upd_counter - pre_upd_counter)

        if pre_p is not None and post_p is not None:
          diff_p = post_p - pre_p
          param_delta_l2 = float(_pr16_rl_np.linalg.norm(diff_p))
          changed_frac = float(_pr16_rl_np.mean(_pr16_rl_np.abs(diff_p) > 0.0))
          param_norm = float(_pr16_rl_np.linalg.norm(post_p))
        else:
          param_delta_l2 = None
          changed_frac = None
          param_norm = None

        if pre_adam is not None and post_adam is not None:
          adam_delta_l2 = float(_pr16_rl_np.linalg.norm(post_adam - pre_adam))
        else:
          adam_delta_l2 = None

        aud["rollout_policy_version_used"] = rollout_ver_used
        aud["lr_actually_used"] = float(lr_used)
        aud["lr_post_scheduler"] = float(lr_post)
        aud["schedule_horizon_steps"] = int(horizon)
        aud["canary_param_norm"] = param_norm
        aud["canary_param_delta_l2"] = param_delta_l2
        aud["changed_fp32_elem_frac"] = changed_frac
        aud["adam_state_delta_l2"] = adam_delta_l2
        aud["master_param_dtype"] = str(post_p_dtype)
        aud["adam_mu_dtype"] = str(post_mu_dt)
        aud["adam_nu_dtype"] = str(post_nu_dt)
        aud["all_float_leaves_fp32"] = bool(
            str(post_p_dtype) == "float32"
            and str(post_mu_dt) == "float32"
            and str(post_nu_dt) == "float32"
            and str(aud.get("grad_accum_dtype", "")) == "float32"
        )
        aud["optimizer_steps_this_batch"] = int(opt_steps_batch)
        aud["configured_prompts_per_batch"] = 128
        aud["configured_generations_per_prompt"] = 16
        try:
          for _cand_bm in (
              getattr(self.rl_cluster.actor_trainer, "_buffered_train_metrics", None),
              getattr(self.rl_cluster.actor_trainer, "_prev_buffered_train_metrics", None),
          ):
            if _cand_bm is not None:
              if getattr(_cand_bm, "loss", None) is not None:
                aud["actor_loss"] = float(_pr16_rl_np.asarray(_cand_bm.loss).mean())
              _am = getattr(_cand_bm, "additional_metrics", None) or {}
              if "grad_norm" in _am and _am["grad_norm"][0] is not None:
                aud["actor_grad_norm"] = float(_pr16_rl_np.asarray(_am["grad_norm"][0]).mean())
              if "kl" in _am and _am["kl"][0] is not None:
                aud["actor_kl"] = float(_pr16_rl_np.asarray(_am["kl"][0]).mean())
              if "actor_loss" in aud and "actor_grad_norm" in aud:
                break
        except Exception:
          pass
        aud["_pr16_step_delta_locked"] = True
        print(
            f"PR16-STEP-AUDIT s={step_s} u={update_u} policy_v={rollout_ver_used} "
            f"lr_used={lr_used:.3e} lr_post={lr_post:.3e} opt_steps={opt_steps_batch} "
            f"param_delta_l2={param_delta_l2} changed_fp32_frac={changed_frac} adam_delta_l2={adam_delta_l2}",
            flush=True,
        )
        return res

      RLLearner._run_all_micro_batch_steps = _pr16_wrapped_mb

      try:
        from tunix.rl import reward_manager as _pr16_rm_mod
        from maxtext.trainers.post_train.rl import utils_rl as _pr16_url_mod
        _pr16_orig_rm_init = _pr16_rm_mod.SequenceRewardManager.__init__

        def _pr16_rm_init(self, reward_fns, algo_config, **kwargs):
          if _pr16_rl_os.environ.get("RECIPE_MODE", "gsm8k-pr16").strip() == "gsm8k-pr16":
            if hasattr(_pr16_url_mod, "pr16_boxed_reward_v2"):
              reward_fns = [_pr16_url_mod.pr16_boxed_reward_v2]
          return _pr16_orig_rm_init(self, reward_fns, algo_config, **kwargs)

        _pr16_rm_mod.SequenceRewardManager.__init__ = _pr16_rm_init

        _pr16_orig_prep_log = _pr16_rm_mod.SequenceRewardManager._prepare_log_metrics

        def _pr16_prep_log_metrics(self, prompts, completions, rewards):
          metrics = _pr16_orig_prep_log(self, prompts, completions, rewards)
          if _pr16_rl_os.environ.get("RECIPE_MODE", "gsm8k-pr16").strip() == "gsm8k-pr16":
            arrs = getattr(_pr16_rl_sys, "_pr16_last_reward_arrays", None)
            if arrs is not None:
              r_list, a_list, f_list = arrs
              r_np = _pr16_rl_np.asarray(r_list, dtype=_pr16_rl_np.float32)
              a_np = _pr16_rl_np.asarray(a_list, dtype=_pr16_rl_np.float32)
              f_np = _pr16_rl_np.asarray(f_list, dtype=_pr16_rl_np.float32)
              metrics["rewards/reward_v2"] = (r_np, _pr16_rl_np.mean)
              metrics["rewards/acc_v2"] = (a_np, _pr16_rl_np.mean)
              metrics["rewards/boxed"] = (f_np, _pr16_rl_np.mean)
              metrics["rewards/check_numbers"] = (a_np, _pr16_rl_np.mean)
              metrics["rewards/score/mean"] = (r_np, _pr16_rl_np.mean)
          return metrics

        _pr16_rm_mod.SequenceRewardManager._prepare_log_metrics = _pr16_prep_log_metrics
      except Exception as _rm_e:
        print("PR16-RM-LOG WARN: %r" % (_rm_e,), flush=True)

      # 4. PR #16 14-point GSM8K test greedy evaluation (steps 0, 20, 40, ..., 240, 250; n=1319, temp=0, max_tokens=8192)
      try:
        import time as _pr16_ev_time
        import json as _pr16_ev_json
        import datetime as _pr16_ev_dt
        import importlib.util as _pr16_ev_ilu
        import datasets as _pr16_ev_datasets
        from tunix.rl import rl_cluster as _pr16_rc_mod
        from maxtext.trainers.post_train.rl import utils_rl as _pr16_ev_url_mod

        if not hasattr(_pr16_rl_sys, "_pr16_completed_eval_steps"):
          _pr16_rl_sys._pr16_completed_eval_steps = set()
        if not hasattr(_pr16_rl_sys, "_pr16_eval_history"):
          _pr16_rl_sys._pr16_eval_history = []

        def _pr16_load_existing_eval_history():
          if getattr(_pr16_rl_sys, "_pr16_eval_history_loaded", False):
            return
          _pr16_rl_sys._pr16_eval_history_loaded = True
          try:
            _run = _pr16_rl_os.environ.get("JOB_IDENTIFIER", "unknown-run")
            _art = _pr16_rl_os.environ.get("ARTIFACT_DIR", "")
            if _art.startswith("gs://"):
              from google.cloud import storage as _ev_st
              _b, _, _pre = _art[5:].partition("/")
              _bkt = _ev_st.Client().bucket(_b)
              _sum_key = ("%s/%s/eval_gsm8k/eval_summary.json" % (_pre.rstrip("/"), _run)).lstrip("/")
              _blob = _bkt.blob(_sum_key)
              if _blob.exists():
                _data = _pr16_ev_json.loads(_blob.download_as_text())
                _recs = _data.get("records", [])
                _by_step = {int(r["eval_step"]): r for r in _recs if "eval_step" in r}
                for _r in _pr16_rl_sys._pr16_eval_history:
                  if "eval_step" in _r:
                    _by_step[int(_r["eval_step"])] = _r
                _pr16_rl_sys._pr16_eval_history = [_by_step[k] for k in sorted(_by_step)]
                _pr16_rl_sys._pr16_completed_eval_steps.update(_by_step.keys())
                print(
                    f"PR16-TEST-EVAL: restored {len(_pr16_rl_sys._pr16_eval_history)} prior eval records "
                    f"(steps={sorted(_by_step.keys())}) from gs://{_b}/{_sum_key}",
                    flush=True,
                )
          except Exception as _le:
            print(f"PR16-TEST-EVAL LOAD-PRIOR WARN: {_le!r}", flush=True)

        _pr16_orig_rl_train = RLLearner.train

        def _pr16_wrapped_rl_train(self, train_ds, eval_ds=None, skip_jit=False):
          if _pr16_rl_os.environ.get("RECIPE_MODE", "gsm8k-pr16").strip() == "gsm8k-pr16":
            _pr16_load_existing_eval_history()
            restored_step = int(getattr(self.rl_cluster, "global_steps", 0))
            if restored_step > 0:
              aud = getattr(_pr16_rl_sys, "_tpu_usa_audit", None)
              if not isinstance(aud, dict):
                aud = {}
                _pr16_rl_sys._tpu_usa_audit = aud
              aud["trainer_weight_version"] = restored_step
              aud["sampler_weight_version"] = restored_step
              _pr16_rl_sys._last_pt_rec = None
              print(
                  f"PR16-RESUME: restored_step={restored_step}; syncing restored actor weights to vLLM sampler...",
                  flush=True,
              )
              if getattr(self, "should_sync_weights", True):
                self.rl_cluster.global_steps = restored_step - 1
                self.rl_cluster.sync_weights()
              self.rl_cluster.global_steps = restored_step
              aud["trainer_weight_version"] = restored_step
              aud["sampler_weight_version"] = restored_step
              aud["_prev_step_end_mono"] = float(_pr16_ev_time.perf_counter())
              aud.pop("_last_eval_duration_s", None)
              try:
                _run = _pr16_rl_os.environ.get("JOB_IDENTIFIER", "unknown-run")
                _art = _pr16_rl_os.environ.get("ARTIFACT_DIR", "")
                _pt_prev = {}
                if _art.startswith("gs://"):
                  from google.cloud import storage as _res_st
                  _b, _, _pre = _art[5:].partition("/")
                  _bkt = _res_st.Client().bucket(_b)
                  _pt_key = ("%s/%s/phasetime/step_%06d.json" % (_pre.rstrip("/"), _run, restored_step - 1)).lstrip("/")
                  _pt_blob = _bkt.blob(_pt_key)
                  if _pt_blob.exists():
                    _pt_prev = _pr16_ev_json.loads(_pt_blob.download_as_text())
                # Strict fail-closed resume: NEVER fabricate fallback constants (e.g. 18.0, -0.002, 0.15).
                # Only flush metrics for u=restored_step that were actually persisted in step_{restored_step-1}.json.
                _buf_perf = {}
                if _pt_prev.get("run_global_step") is not None:
                  _gs_t = float(_pt_prev["run_global_step"])
                  _buf_perf["perf/global_step_time"] = (_gs_t, _pr16_rl_np.mean)
                  if _pt_prev.get("micro_batch_steps") is not None:
                    _ws_t = max(1e-4, _gs_t - float(_pt_prev["micro_batch_steps"]))
                    _buf_perf["perf/weight_sync_time"] = (_ws_t, _pr16_rl_np.mean)
                if _buf_perf:
                  self.rl_cluster.buffer_metrics(_buf_perf, mode=_pr16_rc_mod.Mode.TRAIN)
                _mlog = getattr(self.rl_cluster.actor_trainer, "metrics_logger", None) or getattr(
                    self.rl_cluster, "_rl_metrics_logger", None
                )
                _flushed_tags = []
                if _mlog is not None and hasattr(_mlog, "log"):
                  if _pt_prev.get("actor_loss") is not None:
                    _loss_prev = float(_pt_prev["actor_loss"])
                    _mlog.log("actor", "loss", _loss_prev, _pr16_rc_mod.Mode.TRAIN, restored_step)
                    _mlog.log(
                        "actor",
                        "perplexity",
                        float(_pr16_rl_math.exp(min(_loss_prev, 20.0))),
                        _pr16_rc_mod.Mode.TRAIN,
                        restored_step,
                    )
                    _flushed_tags.append("loss")
                  if _pt_prev.get("actor_grad_norm") is not None:
                    _mlog.log("actor", "grad_norm", float(_pt_prev["actor_grad_norm"]), _pr16_rc_mod.Mode.TRAIN, restored_step)
                    _flushed_tags.append("grad_norm")
                  if _pt_prev.get("actor_kl") is not None:
                    _mlog.log("actor", "kl", float(_pt_prev["actor_kl"]), _pr16_rc_mod.Mode.TRAIN, restored_step)
                    _flushed_tags.append("kl")
                  if _pt_prev.get("lr_actually_used") is not None:
                    _mlog.log("actor", "learning_rate", float(_pt_prev["lr_actually_used"]), _pr16_rc_mod.Mode.TRAIN, restored_step)
                    _flushed_tags.append("learning_rate")
                print(
                    f"PR16-RESUME: flushed persisted boundary metrics for u={restored_step} "
                    f"(perf_keys={list(_buf_perf.keys())}, actor_tags={_flushed_tags})",
                    flush=True,
                )
              except Exception as _bf_e:
                print(f"PR16-RESUME BOUNDARY-FLUSH WARN: {_bf_e!r}", flush=True)
              if hasattr(train_ds, "__getitem__") and hasattr(train_ds, "__len__"):
                _orig_ds_len = len(train_ds)
                train_ds = train_ds[restored_step:]
                print(
                    f"PR16-RESUME: sliced train_ds[{restored_step}:] -> len={len(train_ds)} (from {_orig_ds_len})",
                    flush=True,
                )
              else:
                import itertools as _pr16_it
                train_ds = _pr16_it.islice(iter(train_ds), restored_step, None)
                print(f"PR16-RESUME: advanced train_ds iterator by {restored_step} batches", flush=True)
              self._iter_steps = int(getattr(self, "_last_iter_step", 0))
              self._last_iter_step = int(self._iter_steps)
              print(f"PR16-RESUME: synchronized _iter_steps={self._iter_steps} with _last_iter_step", flush=True)
          return _pr16_orig_rl_train(self, train_ds, eval_ds=eval_ds, skip_jit=skip_jit)

        RLLearner.train = _pr16_wrapped_rl_train

        def _pr16_get_gsm8k_test_items(tokenizer):
          cached = getattr(_pr16_rl_sys, "_pr16_cached_gsm8k_test", None)
          if cached is not None:
            return cached
          _dp = "/workload/patches/gemma4_gsm8k_data.py"
          _dsp = _pr16_ev_ilu.spec_from_file_location("gemma4_gsm8k_data", _dp)
          _dmod = _pr16_ev_ilu.module_from_spec(_dsp)
          _dsp.loader.exec_module(_dmod)
          _test_pq = _pr16_rl_os.environ.get("PR16_TEST_PARQUET", "/gcs/gsm8k_pr16_data/gsm8k_boxed_test.parquet").strip()
          if (not _test_pq or not _pr16_rl_os.path.isfile(_test_pq)) and hasattr(_dmod, "_ensure_staged_gsm8k_parquet"):
            _staged_test = _dmod._ensure_staged_gsm8k_parquet("test")
            if _staged_test:
              _test_pq = _staged_test
          if _test_pq and _pr16_rl_os.path.isfile(_test_pq):
            ds_test = _pr16_ev_datasets.load_dataset("parquet", data_files={"test": _test_pq}, split="test")
          else:
            ds_test = _pr16_ev_datasets.load_dataset("openai/gsm8k", name="main", split="test")
          if len(ds_test) != 1319:
            raise ValueError(f"Expected 1319 GSM8K test rows, got {len(ds_test)}")
          prompts = []
          questions = []
          golds = []
          qids = []
          for idx, row in enumerate(ds_test):
            q_str, g_str = _dmod.extract_row_question_and_gold(row)
            p_str = _dmod.render_gemma4_gsm8k_prompt(q_str, tokenizer=tokenizer)
            prompts.append(p_str)
            questions.append(q_str)
            golds.append(g_str)
            qids.append(10000000 + idx)
          cached = {
              "prompts": prompts,
              "questions": questions,
              "golds": golds,
              "qids": qids,
          }
          _pr16_rl_sys._pr16_cached_gsm8k_test = cached
          print(f"PR16-TEST-EVAL: cached {len(prompts)} GSM8K test prompts (qids {qids[0]}..{qids[-1]})", flush=True)
          return cached

        def _pr16_run_gsm8k_test_eval(rl_cluster, eval_step: int):
          if _pr16_rl_os.environ.get("RECIPE_MODE", "gsm8k-pr16").strip() != "gsm8k-pr16":
            return
          if _pr16_rl_os.environ.get("PR16_ENABLE_TEST_EVAL", "1").strip() in ("0", "false", "False"):
            return
          ev_steps_raw = _pr16_rl_os.environ.get(
              "PR16_EVAL_STEPS", "0,20,40,60,80,100,120,140,160,180,200,220,240,250"
          )
          target_steps = {int(x.strip()) for x in ev_steps_raw.split(",") if x.strip()}
          eval_step = int(eval_step)
          if eval_step not in target_steps or eval_step in _pr16_rl_sys._pr16_completed_eval_steps:
            return
          _pr16_rl_sys._pr16_completed_eval_steps.add(eval_step)

          t0 = _pr16_ev_time.perf_counter()
          aud = getattr(_pr16_rl_sys, "_tpu_usa_audit", None)
          if not isinstance(aud, dict):
            aud = {"trainer_weight_version": 0, "sampler_weight_version": 0}
            _pr16_rl_sys._tpu_usa_audit = aud
          policy_ver = int(aud.get("sampler_weight_version", eval_step))
          print(f"PR16-TEST-EVAL: starting greedy evaluation at step={eval_step} (policy_v={policy_ver}, n=1319)...", flush=True)

          test_data = _pr16_get_gsm8k_test_items(rl_cluster.tokenizer)
          test_prompts = test_data["prompts"]
          test_questions = test_data["questions"]
          test_golds = test_data["golds"]
          test_qids = test_data["qids"]

          saved_rollout_out = getattr(rl_cluster.rollout, "output", None)
          try:
            import _ar_state as _ar
            with _ar.lock:
              _ar.ctx = None
          except Exception:
            pass

          _pr16_rl_os.environ["_PR16_GREEDY_EVAL_ACTIVE"] = "1"
          try:
            rollout_cfg = rl_cluster.cluster_config.rollout_config
            if isinstance(rollout_cfg, dict):
              rollout_cfg = list(rollout_cfg.values())[0]
            with rl_cluster._get_mesh_and_logical_axis_rules_cm(_pr16_rc_mod.Role.ROLLOUT):
              eval_out = rl_cluster.rollout.generate(test_prompts, rollout_cfg)
          finally:
            _pr16_rl_os.environ["_PR16_GREEDY_EVAL_ACTIVE"] = "0"
            try:
              rl_cluster.rollout.output = saved_rollout_out
            except Exception:
              pass
            try:
              from vllm.v1.engine import llm_engine as _ev_le
              if hasattr(_ev_le, "_AD_TEXT") and isinstance(_ev_le._AD_TEXT, dict):
                _ev_le._AD_TEXT.clear()
              if hasattr(_ev_le, "_AL") and isinstance(_ev_le._AL, dict):
                _ev_le._AL.clear()
            except Exception:
              pass

          v2_mod = _pr16_ev_url_mod._pr16_get_v2_mod()
          resp_texts = list(eval_out.text)
          resp_tokens = list(eval_out.tokens)
          if len(resp_texts) != 1319:
            raise RuntimeError(f"GSM8K test eval expected 1319 outputs, got {len(resp_texts)}")

          rewards_v2 = []
          accs_v2 = []
          accs_v1 = []
          boxeds = []
          lengths = []
          clipped_flags = []
          jsonl_lines = []

          for idx in range(1319):
            txt = resp_texts[idx]
            gold = test_golds[idx]
            toks = resp_tokens[idx]
            tok_len = int(len(toks))
            last_tok = int(toks[-1]) if tok_len > 0 else -1
            is_clipped = bool(tok_len >= 8192 and last_tok not in (1, 50, 106))
            r_v2, a_v2, f_box, _cred, a_v1 = v2_mod.boxed_math_v2(txt, str(gold))
            ext_box = v2_mod.v1.extract_boxed(txt)
            rewards_v2.append(float(r_v2))
            accs_v2.append(float(a_v2))
            accs_v1.append(float(a_v1))
            boxeds.append(float(f_box))
            lengths.append(tok_len)
            clipped_flags.append(1.0 if is_clipped else 0.0)
            jsonl_lines.append(
                _pr16_ev_json.dumps({
                    "idx": idx,
                    "qid": int(test_qids[idx]),
                    "gold": gold,
                    "extracted_boxed": ext_box,
                    "reward_v2": float(r_v2),
                    "acc_v2": float(a_v2),
                    "acc_v1": float(a_v1),
                    "boxed": float(f_box),
                    "token_len": tok_len,
                    "clipped": is_clipped,
                    "last_token_id": last_tok,
                    "question": test_questions[idx],
                    "response": txt,
                })
            )

