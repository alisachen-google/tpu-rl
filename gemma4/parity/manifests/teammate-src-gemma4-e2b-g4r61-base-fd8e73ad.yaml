---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "g4r55-launcher"
  namespace: ubench-regression-tests
data:
  launch-workload.sh: |-
    #!/bin/bash
    set -e

    _sigterm() {
      echo "Caught SIGTERM signal, sending to child process..."
      kill -SIGTERM "$PID" 2>/dev/null
    }
    trap _sigterm SIGTERM

    MAXTEXT_CONFIG_PATH="maxtext/configs/post_train/rl.yml"

    # Fallback check to support different image structures
    if [ ! -f "${MAXTEXT_CONFIG_PATH}" ] && [ -f "src/${MAXTEXT_CONFIG_PATH}" ]; then
      echo "MAXTEXT_CONFIG_PATH not found at ${MAXTEXT_CONFIG_PATH}, falling back to src/${MAXTEXT_CONFIG_PATH}"
      MAXTEXT_CONFIG_PATH="src/${MAXTEXT_CONFIG_PATH}"
    fi

    # --- FAIL-CLOSED PATCH ROSTER GATE ---
    # Every patch affecting rollout/decode/reward/trainer correctness is classified as
    # REQUIRED. If any REQUIRED patch file is missing, exits non-zero, or prints FAILED,
    # startup aborts immediately before launching train_rl.
    python3 - << 'PYEOF'
    import datetime
    import json
    import os
    import subprocess
    import sys

    PATCH_DIR = "/workload/patches"
    SYNTAX_ONLY_MODULES = [
        ("gemma4_gsm8k_data.py", "REQUIRED", "PR #16 native Gemma-4 GSM8K prompt formatter & 6-fixture gate"),
        ("boxed_math_reward.py", "REQUIRED", "PR #16 frozen Meta boxed_math v1 scorer"),
        ("boxed_math_reward_v2.py", "REQUIRED", "PR #16 frozen GSM8K boxed_v2 scorer (1.0 / 0.1 / 0.0)"),
        ("gemma_data.py", "REQUIRED", "Legacy Alisa OMI2 Gemma-3 prompt formatter"),
    ]
    PATCH_ROSTER = [
        ("patch_vllm_sampler.py", "OPTIONAL", "pathwaysutils profiling & tpu_runner req_id_kwargs hotfix"),
        ("patch_cd_proper.py", "REQUIRED", "continue-decode step_fn_no_options & compiler_options"),
        ("patch_lendist.py", "OPTIONAL", "ISL/OSL length distribution telemetry"),
        ("patch_rpa_blocks.py", "OPTIONAL", "RPA v3 decode block size env forwarding"),
        ("patch_cd_masking.py", "REQUIRED", "continue-decode window non-EOS masking"),
        ("patch_cd_report.py", "REQUIRED", "continue-decode host last non-padding token read"),
        ("patch_phasetime.py", "REQUIRED", "per-step phasetime JSON + weight-sync/canary telemetry"),
        ("patch_reward_parallel.py", "OPTIONAL", "persistent synchronous math_verify ProcessPool (64 procs)"),
        ("patch_sharded_sampling.py", "REQUIRED", "sharded device-side token sampling (top_k=-1 safe)"),
        ("patch_profiler_fix.py", "OPTIONAL", "trainer profiler step gate fix"),
        ("patch_gc_sync.py", "OPTIONAL", "GC sync around rollout/weight transfer"),
        ("patch_packing_knob.py", "REQUIRED", "trainer sequence packing config knob"),
        ("patch_packer_fast.py", "REQUIRED", "fast host batch packer"),
        ("patch_block_size.py", "REQUIRED", "KV cache VLLM_BLOCK_SIZE override"),
        ("patch_async_detok.py", "REQUIRED", "background detokenization overlap"),
        ("patch_async_logprobs.py", "REQUIRED", "async old-logprob overlap + sample cross-check"),
        ("patch_dp_rr_routing.py", "REQUIRED", "round-robin DP request routing"),
        ("patch_stop_tokens.py", "REQUIRED", "Gemma-4 extra stop token IDs [1, 106, 50]"),
        ("patch_runner_eos.py", "REQUIRED", "runner EOS handling in continue-decode"),
        ("patch_fast_extract.py", "REQUIRED", "fast answer extraction + sample cross-check"),
        ("patch_g4_format_guard.py", "REQUIRED", "Gemma-4 format reward guard"),
        ("patch_async_reward.py", "REQUIRED", "async reward scoring (8-proc spawn pool) + sample cross-check"),
        ("patch_flash_sa.py", "REQUIRED", "flash splash attention configuration"),
        ("patch_jit_unroll.py", "REQUIRED", "trainer JIT unroll & canary param delta tracking"),
        ("patch_sync_keepkv.py", "REQUIRED", "weight sync keep-KV + trainer/sampler version & diff check"),
        ("patch_host_extract.py", "REQUIRED", "host token extraction from continue-decode window"),
        ("patch_cd_noglobal.py", "REQUIRED", "continue-decode remove redundant global sync"),
        ("patch_padding_bucket.py", "REQUIRED", "padding bucket gap fix (PR #3466)"),
        ("patch_log_stats.py", "OPTIONAL", "extra rollout logging stats"),
        ("patch_textual_stop.py", "REQUIRED", "textual stop string handling"),
        ("patch_verify_timeout.py", "REQUIRED", "per-item math_verify timeout guard"),
        ("patch_reward_dump.py", "OPTIONAL", "debug_rl_logs per-step sample completion dump"),
        ("patch_pr16_gsm8k_recipe.py", "REQUIRED", "PR #16 frozen GSM8K 8K recipe (REINFORCE+TIS=3, boxed_v2, 250-step cosine LR)"),
    ]

    results = []
    required_failures = []

    # Syntax-check modules in-memory using compile() so we NEVER write __pycache__
    # onto the read-only /workload/patches ConfigMap volume mount.
    for mod_name, mod_tier, mod_desc in SYNTAX_ONLY_MODULES:
      mod_path = os.path.join(PATCH_DIR, mod_name)
      if not os.path.isfile(mod_path):
        required_failures.append(f"{mod_name} (MISSING)")
        results.append({
            "patch": mod_name,
            "tier": mod_tier,
            "status": "MISSING",
            "returncode": -1,
            "description": mod_desc,
            "summary": "File not found",
        })
      else:
        try:
          with open(mod_path, "r", encoding="utf-8") as _mf:
            compile(_mf.read(), mod_path, "exec")
          results.append({
              "patch": mod_name,
              "tier": mod_tier,
              "status": "APPLIED",
              "returncode": 0,
              "description": mod_desc,
              "summary": "Syntax verified in-memory (read-only mount safe)",
          })
        except Exception as e:
          required_failures.append(f"{mod_name} ({e})")
          results.append({
              "patch": mod_name,
              "tier": mod_tier,
              "status": "FAILED",
              "returncode": 1,
              "description": mod_desc,
              "summary": str(e),
          })

    for fname, tier, desc in PATCH_ROSTER:
      fpath = os.path.join(PATCH_DIR, fname)
      if not os.path.isfile(fpath):
        status = "MISSING"
        rc = -1
        summary = "File not found"
        if tier == "REQUIRED":
          required_failures.append(f"{fname} (MISSING)")
      else:
        proc = subprocess.run(["python3", fpath], capture_output=True, text=True)
        rc = proc.returncode
        combined = ((proc.stdout or "") + "\n" + (proc.stderr or "")).strip()
        if proc.stdout:
          print(proc.stdout, end="" if proc.stdout.endswith("\n") else "\n", flush=True)
        if proc.stderr:
          print(proc.stderr, end="" if proc.stderr.endswith("\n") else "\n", file=sys.stderr, flush=True)
        lines = [ln.strip() for ln in combined.splitlines() if ln.strip()]
        summary = lines[-1] if lines else "(no output)"
        has_fail_marker = (
            "PATCH: FAILED" in combined
            or "PATCH FAILED" in combined
            or "Traceback (most recent call last)" in combined
        )
        if rc != 0 or has_fail_marker:
          status = "FAILED" if tier == "REQUIRED" else "WARN_SKIPPED"
          if tier == "REQUIRED":
            required_failures.append(f"{fname} (rc={rc}: {summary})")
        else:
          status = "APPLIED"
      results.append({
          "patch": fname,
          "tier": tier,
          "status": status,
          "returncode": rc,
          "description": desc,
          "summary": summary,
      })

    print("==============================================================================================", flush=True)
    print("=== PATCH ROSTER STATUS TABLE                                                              ===", flush=True)
    print("==============================================================================================", flush=True)
    print(f"{'Patch Script':<28} | {'Tier':<8} | {'Status':<12} | {'Summary'}", flush=True)
    print("-" * 94, flush=True)
    for r in results:
      print(f"{r['patch']:<28} | {r['tier']:<8} | {r['status']:<12} | {r['summary'][:68]}", flush=True)
    print("==============================================================================================", flush=True)

    roster_payload = {
        "job_identifier": os.environ.get("JOB_IDENTIFIER", ""),
        "checked_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
        "all_required_applied": len(required_failures) == 0,
        "required_total": sum(1 for r in results if r["tier"] == "REQUIRED"),
        "required_applied": sum(1 for r in results if r["tier"] == "REQUIRED" and r["status"] == "APPLIED"),
        "optional_total": sum(1 for r in results if r["tier"] == "OPTIONAL"),
        "optional_applied": sum(1 for r in results if r["tier"] == "OPTIONAL" and r["status"] == "APPLIED"),
        "required_failures": required_failures,
        "patches": results,
    }
    try:
      with open("/tmp/patch_roster_status.json", "w", encoding="utf-8") as f:
        json.dump(roster_payload, f, indent=2)
      art = os.environ.get("ARTIFACT_DIR", "").rstrip("/")
      jid = os.environ.get("JOB_IDENTIFIER", "").strip("/")
      if art and jid:
        import tensorflow as tf
        dst_dir = f"{art}/{jid}"
        tf.io.gfile.makedirs(dst_dir)
        with tf.io.gfile.GFile(f"{dst_dir}/patch_roster_status.json", "w") as gf:
          json.dump(roster_payload, gf, indent=2)
    except Exception as e:
      print(f"[PATCH-ROSTER] Warning: failed to persist patch_roster_status.json: {e}", flush=True)

    if required_failures:
      print(f"PATCH ROSTER GATE: FAILED ({len(required_failures)} required patch(es) failed): {required_failures}", flush=True)
      sys.exit(1)
    print(f"PATCH ROSTER GATE: PASSED ({roster_payload['required_applied']}/{roster_payload['required_total']} REQUIRED patches applied)", flush=True)
    PYEOF


    # --- ROLLOUT PROFILING (the whole point of this run) ---
    # profiler=xplane captures ONLY the trainer mesh -- verified by grepping a 111 MB
    # xplane from the 2026-08-13 run: jit__train_step x31, jit_compute_per_token_logps
    # x16, and ZERO step_fn / ragged_paged_attention / continue_decode / jit__generate.
    # So rollout (~70% of the step, 100% of its variance) has never been profiled.
    # PHASED_PROFILING_DIR is tpu_inference's own profiler (envs.py:23,
    # tpu_runner._init_phased_profiling) and DOES capture the decode path.
    #
    # THE PATH MUST BE gs://, NOT LOCAL. Attempt 1 of this run used /tmp and crashed on
    # the FIRST rollout, 14 times:
    #   tpu_runner._prepare_inputs:2816 -> phase_based_profiler.step()
    #     -> utils.py:699 _start_profiling -> jax.profiler.start_trace
    #       -> pathwaysutils/profiling.py:269
    #          ValueError: log_dir must be a GCS bucket path, got /tmp/phased_profile/...
    # Under Pathways the trace writer requires GCS. (The accompanying
    # "AttributeError: 'Qwen3ForCausalLM' object has no attribute 'modules'" is an
    # atexit/weakref cleanup firing during the shutdown that follows -- a symptom, not
    # a second bug.)
    #
    # _start_profiling ALSO does os.makedirs() on this path and _resolve_canonical_dst_ts
    # opens a marker file under it with a plain open(). With a gs:// value those create a
    # junk LOCAL tree ./gs:/... and succeed (POSIX collapses the double slash), while
    # start_trace gets the GCS path it needs. Side effect: the small
    # batch_composition_stats files land in that junk local tree and are lost. The traces
    # -- the actual objective -- go straight to GCS, so no syncer is needed.
    export RECIPE_MODE="${RECIPE_MODE:-gsm8k-pr16}"
    export SEED="${SEED:-1}"
    export SCHEDULE_HORIZON_STEPS="${SCHEDULE_HORIZON_STEPS:-250}"
    export STOP_AFTER_STEPS="${STOP_AFTER_STEPS:-3}"
    export HF_MODEL_REVISION="3e22461f65e89153144f8adb70e3b8c2cc9845a7"
    export REWARD_OVERLONG_BUFFER=0

    export VLLM_BLOCK_SIZE=128            # pin KV page size
    # padding fix now in-tree via patch_padding_bucket.py (PR #3466); gap env no longer needed
    export VLLM_PREFIX_CACHING=0          # -6 s/step, byte-identical generation (33j)
    export DP_ROUTING=rr                  # CREATIVE-7: round-robin DP routing (no per-request all-rank state queries)
    export EXTRA_STOP_TOKEN_IDS=[106,50]   # gemma-4-E2B-it generation_config eos set [1,106,50] (<eos>, <turn|>, <|tool_response>)
    export FAST_EXTRACT="${FAST_EXTRACT:-fast}"           # fast extract_answer; cross-checks ASYNC_VERIFY_SAMPLE_N items on step 1
    export ASYNC_REWARD="${ASYNC_REWARD:-on}"             # 8-proc spawn pool (ASYNC_REWARD_PROCS=8); math_verify_num_procs=64 is sync pool
    export ASYNC_LOGPROBS="${ASYNC_LOGPROBS:-on}"         # overlaps old_per_token_logps; cross-checks ASYNC_VERIFY_SAMPLE_N items on step 1
    export ASYNC_VERIFY_SAMPLE_N="${ASYNC_VERIFY_SAMPLE_N:-32}" # sample cross-check count in 'on'/'fast' mode (verify_overhead_s timed separately)
    export PHASED_PROFILING_DIR=""   # depth 512: phased decode capture races the trainer profiler at step 1
    echo "RECIPE_MODE=$RECIPE_MODE SEED=$SEED SCHEDULE_HORIZON_STEPS=$SCHEDULE_HORIZON_STEPS STOP_AFTER_STEPS=$STOP_AFTER_STEPS"

    export CONTINUE_DECODE_EOS_CHECK_INTERVAL="8"
    export TEXTUAL_STOP=0
    export VERIFY_ITEM_TIMEOUT=5
    export REWARD_DUMP_N=4

    # --- RL Sampler Patches & Env Setup ---
    export HF_TOKEN=''
    export HF_HUB_ENABLE_HF_TRANSFER=0
    export HF_HUB_DISABLE_XET=1
    export NUM_PRECOMPILE_WORKERS=1
    export NEW_MODEL_DESIGN=1
    export TPU_MIN_LOG_LEVEL=0
    export TF_CPP_MIN_LOG_LEVEL=0
    export TPU_STDERR_LOG_LEVEL=0
    export JAX_BACKEND_TARGET=grpc://127.0.0.1:29000

    # Multimodal-default shims carried over from the ubench recipe (harmless if unused)
    cat << 'EOF' >> /deps/src/maxtext/configs/types.py

    # --- Auto-patch RLConfig with Multimodal defaults ---
    if 'RLConfig' in globals():
      if not hasattr(RLConfig, 'use_mrope'):
        RLConfig.use_mrope = False
      if not hasattr(RLConfig, 'mrope_section'):
        RLConfig.mrope_section = [24, 20, 20]
      if not hasattr(RLConfig, 'position_id_per_seconds'):
        RLConfig.position_id_per_seconds = 25
    EOF
    sed -i 's/mrope_section=config.mrope_section/mrope_section=getattr(config, "mrope_section", [24, 20, 20])/g; s/mrope_section=cfg.mrope_section/mrope_section=getattr(cfg, "mrope_section", [24, 20, 20])/g' /deps/src/maxtext/models/qwen3.py 2>/dev/null || true

    # --- Main Execution ---
    (
      export ENABLE_PATHWAYS_PERSISTENCE='1'
      export JAX_PLATFORMS="${JAX_PLATFORMS:-proxy,cpu}"
      export ENABLE_PJRT_COMPATIBILITY='true'
      # NOTE: XLA flags are NOT set here. Under JAX_PLATFORMS=proxy the client owns
      # no TPU, so LIBTPU_INIT_ARGS would be inert. They are passed as argv to the
      # pathways-proxy container instead (upstream: --custom-pathways-proxy-server-args).

      # PR #16 Frozen Gemma-4 E2B GSM8K 8K Recipe:
      #   - 128 prompts x 16 rollouts/prompt = 2,048 responses/step, 1 optimizer step/batch
      #   - Prompt cap = 512 tokens, Response cap = 8,192 tokens (max_target_length = 8704)
      #   - Full-vocab sampling: temperature=1.0, top_p=1.0, top_k=-1 (SHARDED_SAMPLING=0)
      #   - Single-forward REINFORCE + detached token-level TIS (cap = 3.0, log-ratio clip [-20, 20])
      #   - Peak LR = 2e-6, 10-step linear warmup, 250-step cosine schedule horizon (decoupled from STOP_AFTER_STEPS)
      #   - AdamW (b1=0.9, b2=0.999, eps=1e-8, weight_decay=0.0), grad_clip=1.0
      #   - boxed_math_reward_v2.py (1.0 / 0.1 / 0.0 training reward + binary acc_v2)
      export SHARDED_SAMPLING="${SHARDED_SAMPLING:-0}"
      export TUNIX_REWARD_PARALLEL="${TUNIX_REWARD_PARALLEL:-0}"
      export MAX_SEQ_TOKEN_PER_TPU=8704
      python3 -m maxtext.trainers.post_train.rl.train_rl "${MAXTEXT_CONFIG_PATH}" \
        model_name='gemma4-e2b' \
        tokenizer_path='google/gemma-4-E2B-it' \
        dataset_name="${PR16_DATASET_NAME:-openai/gsm8k}" \
        dataset_processor_path=/workload/patches/gemma4_gsm8k_data.py \
        hf_train_files="${PR16_TRAIN_PARQUET:-hf://datasets/openai/gsm8k/main/train-*.parquet}" \
        train_split='train' \
        rl.num_generations=16 \
        data_shuffle_seed=${SEED} \
        rl.grpo_beta=0.0 \
        rl.grpo_epsilon=0.2 \
        rl.epsilon_high=0.28 \
        checkpoint_storage_use_ocdbt=False \
        async_scheduling=False \
        math_verify_num_procs=64 \
        chips_per_vm=8 \
        num_batches=${STOP_AFTER_STEPS} \
        num_test_batches=0 \
        debug=True \
        profiler=xplane \
        skip_first_n_steps_for_profiler=1 \
        profiler_steps=1 \
        gradient_clipping_threshold=1.0 \
        decode_sampling_temperature=1.0 \
        decode_sampling_top_k=-1 \
        decode_sampling_nucleus_p=1.0 \
        max_target_length=8704 \
        kv_cache_buffer=256 \
        max_prefill_predict_length=512 \
        learning_rate=2e-6 \
        learning_rate_schedule_steps=${SCHEDULE_HORIZON_STEPS} \
        warmup_steps_fraction=0.04 \
        adam_b1=0.9 \
        adam_b2=0.999 \
        adam_eps=1e-8 \
        adam_weight_decay=0.0 \
        batch_size=128 \
        train_micro_batch_size=8 \
        rollout_micro_batch_size=128 \
        trainer_devices_fraction=1.0 \
        sampler_devices_fraction=1.0 \
        rollout_data_parallelism=128 \
        rollout_tensor_parallelism=1 \
        enable_dp_attention=false \
        hbm_utilization_vllm=0.3 \
        max_num_seqs=256 \
        max_num_batched_tokens=33280 \
        scan_layers=False \
        allow_split_physical_axes=True \
        vllm_hf_overrides='{architectures: ["MaxTextForCausalLM"]}' \
        attention='flash' \
        allow_split_physical_axes=True \
        enable_tunix_perf_metrics=True \
        checkpoint_period=100 \
        max_num_checkpoints_to_keep=1000 \
        enable_checkpointing=true \
        load_parameters_path="${CHECKPOINT_PATH:-gs://ubench-logs/gemma4-e2b-it-pr16-3e22461f/0/items}" \
        skip_jax_distributed_system=True \
        vllm_additional_config='{"enable_continue_decode": true, "max_decode_steps": 512, "maxtext_config": {"model_name": "gemma4-e2b", "model_call_mode": "inference", "log_config": false, "weight_dtype": "bfloat16", "allow_split_physical_axes": true}}' \
        base_output_directory=${ARTIFACT_DIR} \
        run_name=${JOB_IDENTIFIER}
    ) & PID=$!

    set +e
    wait $PID
    EXIT_CODE=$?
    set -e

    python3 - "${EXIT_CODE}" << 'PYEOF' || true
    import datetime
    import json
    import os
    import sys

    exit_code = int(sys.argv[1])
    art = os.environ.get("ARTIFACT_DIR", "").rstrip("/")
    jid = os.environ.get("JOB_IDENTIFIER", "").strip("/")
    roster = {}
    try:
      if os.path.isfile("/tmp/patch_roster_status.json"):
        with open("/tmp/patch_roster_status.json", "r", encoding="utf-8") as f:
          roster = json.load(f)
    except Exception:
      pass

    payload = {
        "run_name": jid,
        "artifact_dir": art,
        "exit_code": exit_code,
        "recipe_mode": os.environ.get("RECIPE_MODE", "gsm8k-pr16"),
        "seed": int(os.environ.get("SEED", "1")),
        "schedule_horizon_steps": int(os.environ.get("SCHEDULE_HORIZON_STEPS", "250")),
        "stop_after_steps": int(os.environ.get("STOP_AFTER_STEPS", "3")),
        "hf_model_revision": os.environ.get("HF_MODEL_REVISION", "3e22461f65e89153144f8adb70e3b8c2cc9845a7"),
        "patch_manifest_ok": bool(roster.get("all_required_applied", False)),
        "required_patches_applied": roster.get("required_applied"),
        "required_patches_total": roster.get("required_total"),
        "async_reward_mode": os.environ.get("ASYNC_REWARD", "on"),
        "async_logprobs_mode": os.environ.get("ASYNC_LOGPROBS", "on"),
        "fast_extract_mode": os.environ.get("FAST_EXTRACT", "fast"),
        "async_verify_sample_n": int(os.environ.get("ASYNC_VERIFY_SAMPLE_N", "32")),
        "ended_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
    }
    with open("/tmp/run_status.json", "w", encoding="utf-8") as f:
      json.dump(payload, f, indent=2)
    if art and jid:
      import tensorflow as tf
      dst_dir = f"{art}/{jid}"
      tf.io.gfile.makedirs(dst_dir)
      with tf.io.gfile.GFile(f"{dst_dir}/run_status.json", "w") as gf:
        json.dump(payload, gf, indent=2)
      print(f"[RUN-STATUS] Wrote {dst_dir}/run_status.json (exit_code={exit_code})", flush=True)
      try:
        import base64
        import tarfile
        from google.cloud import storage as _end_st
        if art.startswith("gs://"):
          _b, _, _pre = art[5:].partition("/")
          _base_pre = f"{_pre.rstrip('/')}/{jid}".lstrip("/")
          _bkt = _end_st.Client().bucket(_b)
          _bundle_root = f"/tmp/final_artifacts/{jid}"
          for _sub in ("phasetime", "tensorboard", "eval_gsm8k"):
            os.makedirs(f"{_bundle_root}/{_sub}", exist_ok=True)
          for _fn in ("run_status.json", "patch_roster_status.json", "input_data_identity.json"):
            _bl = _bkt.blob(f"{_base_pre}/{_fn}")
            if _bl.exists():
              _bl.download_to_filename(f"{_bundle_root}/{_fn}")
          for _bl in _bkt.list_blobs(prefix=f"{_base_pre}/phasetime/"):
            if _bl.name.endswith(".json"):
              _bl.download_to_filename(f"{_bundle_root}/phasetime/{_bl.name.rsplit('/', 1)[-1]}")
          for _bl in _bkt.list_blobs(prefix=f"{_base_pre}/tensorboard/"):
            if "events.out.tfevents" in _bl.name:
              _bl.download_to_filename(f"{_bundle_root}/tensorboard/{_bl.name.rsplit('/', 1)[-1]}")
          for _bl in _bkt.list_blobs(prefix=f"{_base_pre}/eval_gsm8k/"):
            if _bl.name.endswith(".json"):
              _bl.download_to_filename(f"{_bundle_root}/eval_gsm8k/{_bl.name.rsplit('/', 1)[-1]}")
          _tar_path = "/tmp/final_artifacts.tar.gz"
          with tarfile.open(_tar_path, "w:gz") as _tf:
            _tf.add(_bundle_root, arcname=jid)
          with open(_tar_path, "rb") as _bf:
            _b64 = base64.b64encode(_bf.read()).decode("ascii")
          print("===BEGIN_FINAL_ARTIFACTS_B64===", flush=True)
          for _i in range(0, len(_b64), 4096):
            print(_b64[_i : _i + 4096], flush=True)
          print("===END_FINAL_ARTIFACTS_B64===", flush=True)
      except Exception as _be:
        print(f"[RUN-STATUS] Bundle export warn: {_be!r}", flush=True)
    PYEOF

    echo "MaxText Job Ended at: $(date) with exit code $EXIT_CODE"
    exit $EXIT_CODE
