    if u.count(a) != 1:
        print("JIT-UNROLL PATCH: FAILED anchor count %d" % u.count(a), flush=True); sys.exit(1)
    u = u.replace(a, b)
    for _else_line in (
        "      unscanned_flat[(src_key, tgt_path)] = (src_val.value, tgt_param)\n",
        "      unscanned_flat[(src_key, tgt_path)] = (val, tgt_param)\n",
    ):
        if _else_line in u:
            _else_repl = (
                _else_line
                + "      _uv = unscanned_flat[(src_key, tgt_path)][0]\n"
                + "      if getattr(__import__('sys'), '_tpu_usa_pair', None) is None and hasattr(_uv, 'shape') and getattr(_uv, 'size', 0) >= 64 and _uv.shape[0] != 262144 and 'embed' not in str(src_key).lower():\n"
                + "        __import__('sys')._tpu_usa_pair = (_uv, tgt_param)\n"
