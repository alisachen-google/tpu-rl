      def sample(rng, mesh, logits, tpu_sampling_metadata):
        if _ss_os.environ.get("SHARDED_SAMPLING", "1") == "0":
          _s_toks, _s_logits = _ss_orig_sample(rng, mesh, logits, tpu_sampling_metadata)
          if tpu_sampling_metadata.do_sampling and tpu_sampling_metadata.temperature is not None:
            _is_g = tpu_sampling_metadata.temperature < _SAMPLING_EPS
            _g_toks = jax.lax.with_sharding_constraint(
                jnp.argmax(logits, axis=-1).astype(_s_toks.dtype),
