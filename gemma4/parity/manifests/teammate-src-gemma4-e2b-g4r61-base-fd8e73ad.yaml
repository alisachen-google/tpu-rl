  patch_g4_format_guard.py: |-
    """G4-FORMAT-GUARD: replace match_format_exactly's backtracking regex with an
    equivalent ordered find-chain. rs.*?re.*?ss(.+?)se (DOTALL) matches iff the four
    literal tokens appear in order (>=1 char between ss and se); on gemma echo outputs
    (~30k chars, repeated tag literals, often no closing tag) the regex backtracks
    catastrophically (793 s / 32 items on g4-002k step 7 -> async pool timeout -> sync)."""
    import sys
    P = "/deps/src/maxtext/trainers/post_train/rl/utils_rl.py"
    s = open(P).read()
    if "_G4_FORMAT_GUARD" in s: print("G4-FORMAT-GUARD PATCH: already applied", flush=True); sys.exit(0)
    if s.count("def match_format_exactly(") != 1: print("G4-FORMAT-GUARD PATCH: FAILED anchor", flush=True); sys.exit(1)
    s += r'''

    # --- _G4_FORMAT_GUARD (appended; column-0 in file) --------------------------------
    _g4fg_orig_mfe = match_format_exactly
    def match_format_exactly(prompts, completions, tmvp_config, **kargs):
      rs = "" if getattr(tmvp_config, "reasoning_start_token_in_prompt", False) else tmvp_config.reasoning_start_token
      rend = tmvp_config.reasoning_end_token
      ss = tmvp_config.solution_start_token
      se = tmvp_config.solution_end_token
      scores = []
      for c in completions:
        ok = False
        i = c.find(rs) if rs else 0
        if i >= 0:
          j = c.find(rend, i + len(rs))
          if j >= 0:
            k = c.find(ss, j + len(rend))
            if k >= 0 and c.find(se, k + len(ss) + 1) >= 0:
              ok = True
        scores.append(float(tmvp_config.reward_exact_format_match) if ok else 0.0)
      return scores
    print("G4-FORMAT-GUARD: match_format_exactly -> find-chain (no regex)", flush=True)
    '''
    open(P, "w").write(s)
    print("G4-FORMAT-GUARD PATCH: APPLIED", flush=True)
  patch_gc_sync.py: |-
    """_GC_SYNC: gate tunix's per-step gc.collect() calls behind env TUNIX_GC_COLLECT (default off).
    tunix e4fc1dbf added gc.collect() after rollout.update_params (weight sync) and after the
    actor-logps pass in rl_cluster.py -- unconditional, every step. On our colocated (no CPU
    offload) setup this is a pure host stall: measured +1.2 s/step in perf/train/weight_sync_time
    (run 42 vs run 40). Gating (not deleting) keeps the upstream behaviour one env var away.
    Fail-open, idempotent."""
    def _patch():
        try:
            import tunix.rl.rl_cluster as RC
            fp = RC.__file__; src = open(fp).read()
            if "_GC_SYNC" in src:
                print("GC-SYNC: already applied", flush=True); return
            n = src.count("gc.collect()")
            if n == 0:
                print("GC-SYNC: no gc.collect() found (skipped)", flush=True); return
            src = src.replace("gc.collect()", "(gc.collect() if __import__('os').environ.get('TUNIX_GC_COLLECT','0')=='1' else None)  # _GC_SYNC")
            compile(src, fp, "exec"); open(fp, "w").write(src)
            print("GC-SYNC: gated %d gc.collect() call(s) in rl_cluster.py (TUNIX_GC_COLLECT=1 restores)" % n, flush=True)
        except Exception as e:
            print("GC-SYNC: failed %r" % (e,), flush=True)
    _patch()
