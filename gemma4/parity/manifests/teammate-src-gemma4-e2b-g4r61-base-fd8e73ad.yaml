    b = ("      num_layers = src_val.value.shape[layer_axis]\n"
         "      _layer_vals = _jit_unroll_layers(src_val.value, layer_axis)  # _JIT_UNROLL: one dispatch per param\n"
         "      if getattr(__import__('sys'), '_tpu_usa_pair', None) is None and num_layers > 0:\n"
         "        __import__('sys')._tpu_usa_pair = (_layer_vals[0], tgt_param[0])\n"
         "      for i in range(num_layers):\n"
