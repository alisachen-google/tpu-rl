# =============================================================================
# RUN -- g4r55   BEST PERF: gemma4-E2B GRPO, tp1xdp128 FULL-SLICE, CD window 512
#                fixed checkpoint (gemma4-e2b-raw2) -- 34.5 s/step, rewards 0.58
# =============================================================================
# The campaign's production configuration and best measured result:
#   clean step 34.5-37.2 s (best 34.5), check_numbers 0.54-0.62 (GPU parity).
#   Ladder endpoints: 175.6 -> 34.5 s (5.1x) and rewards 0.02 -> 0.58.
# Self-contained: kubectl apply -f this file. No helm required.
#   FULLY SELF-CONTAINED: all 36 runtime patch .py files are embedded verbatim in the
#   g4final8k-patches ConfigMap (mounted at /workload/patches) and applied at pod start by
#   the launcher. No external image layer, git checkout, or file fetch is needed --
#   `kubectl apply -f g4r55-best-perf-all-in-one.yaml` deploys the complete run.
#   - ConfigMap g4final8k-patches   : the runtime patch roster (applied at pod start)
#   - ConfigMap g4final8k-launcher  : launch-workload.sh (full train command)
#   - JobSet    g4r55           : Pathways head (rm+proxy sidecars) + 16 TPU workers
#
# Config identity:
#   image           2026-08-24-packing (sha f7c957d0)
#   topology        TP1 x DP128 on tpu7x 4x4x4 (64 chips / 128 devices)
#   decode          CD window 512 + 29-flag XLA proxy ladder
#   host scheduling rr DP routing (the -70s lever) + async detok/logprobs/reward
#   reward guard    verify-timeout (per-item sympy timeout; kills the 156s spike)
#   stop            NATIVE on gemma id 106 <turn|> (textual <end_of_turn> stop RETIRED
#                   -- the fixed ckpt emits its trained stop token; textual scan removed)
#   prompt          gemma-3 textual (gemma_data.py)
#   checkpoint      gs://ubench-logs/alisachen-tpu7x/ckpt/gemma4-e2b-raw2/0/items
#                   (VERIFIED: embedding audit cos 0.999999, forward-pass KL 5.3e-3 vs HF)
#
# Docs: gemma4/OPTIMIZATION_175_to_34.md, GEMMA4_PERF_LADDER_DETAILED.md,
#       GEMMA4_REWARD_BUG_REPORT.md
# =============================================================================
---
apiVersion: v1
data:
  gemma_data.py: "\"\"\"gemma4 line: custom process_data v2 (dataset_processor_path hook). EMPIRICAL findings driving this design:\n(1) the checkpoint outputs garbage under the canonical gemma-4 <|turn> markers (ids 105/106 are effectively untrained for it),\n(2) it answers math correctly under gemma-3-STYLE textual markers (<start_of_turn>... \u2014 7 BPE pieces each, NOT special tokens\nin this tokenizer; teammate's 39/39-verified smoke used exactly that), so this builder renders the gemma-3-style prompt\nMANUALLY (single wrap, no apply_chat_template; no literal <bos> \u2014 tunix's tokenize() lets the tokenizer add bos).\nConsequence: there is no single-token turn terminator; sequences stop only at <eos> (id 1) or the cap \u2014 truncation is part of\nthe gemma contract (cap chosen from the measured OSL distribution).\"\"\"\nimport json\n\nSYSTEM_PROMPT = (\"You are given a problem. Think about the problem and provide your reasoning. Place it between \"\n                 \"<reasoning> and </reasoning>. Then, provide the final answer (i.e., just one numerical value) \"\n                 \"between <answer> and </answer>.\")\n_PRINTED = [False]\n\ndef _s(v):\n    return v.decode(\"utf-8\") if isinstance(v, bytes) else str(v)\n\ndef process_data(dataset_name, model_tokenizer, template_config, tmvp_config, x):\n    from maxtext.trainers.post_train.rl import utils_rl\n    for key in (\"problem\", \"prompt\", \"question\"):\n        if key in x:\n            question = _s(x[key]); break\n    for key in (\"answer\", \"solution\", \"expected_answer\"):\n        if key in x:\n            answer = _s(x[key]); break\n    qt = _s(x[\"question_type\"]) if \"question_type\" in x else \"default\"\n    processed_answer = utils_rl.process_answer(question, answer, qt)\n    prompt = f\"<start_of_turn>user\\n{SYSTEM_PROMPT}\\n\\n{question}<end_of_turn>\\n<start_of_turn>model\\n\"\n    if not _PRINTED[0]:\n        print(\"GEMMA-PROMPT %r\" % prompt[:300], flush=True)\n        _PRINTED[0] = True\n    return {\"prompts\": prompt, \"question\": question, \"answer\": json.dumps(processed_answer)}"
  patch_lendist.py: "\"\"\"Record per-step ISL / OSL / truncation distributions from the GRPO rollout.\n\nWHY. Tunix logs only completions/{mean,max,min}_length -- three scalars. We have never\nseen the length DISTRIBUTION, and `max_length` is 8192 (the OSL cap) in every single\nstep, so we know something is truncated but not whether it is 1 sequence or 40%. That\nnumber gates the tuning plan: holding the OSL cap fixed is only safe if truncation is\nrare.\n\nWHAT IT COSTS. Nothing measurable. Every array read here is ALREADY host-side numpy at\nthis point in the function:\n    rollout_output.tokens                 list[np.ndarray], UNPADDED  -> OSL = len()\n    rollout_output.left_padded_prompt_tokens  np.ndarray              -> ISL\n    pad_value / eos_value                 plain ints (rollout.pad_id()/eos_id())\n    rollout_config.max_tokens_to_generate  the cap\nNo device->host sync is introduced, so step timing is unaffected. ~30 KB/step.\n\nUsing rollout_output.tokens directly (rather than inferring from completion_mask) makes\nOSL exact: len() cannot be fooled by a pad token appearing mid-sequence.\n\nFAIL-OPEN. This patches a file on the live training path. Any anchor mismatch prints\nFAILED and exits 0 without modifying anything -- it must never crash a run. The injected\ncode is itself wrapped in try/except so a logging bug cannot take down training.\n\nPrints exactly one of:\n    LENDIST PATCH: APPLIED\n    LENDIST PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tunix\"\nGL = os.path.join(ROOT, \"rl/grpo/grpo_learner.py\")\n\n\ndef fail(msg):\n    print(f\"LENDIST PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nif not os.path.exists(GL):\n    fail(f\"{GL} not found\")\nsrc = open(GL, encoding=\"utf-8\").read()\n\nif \"_LENDIST_DUMP\" in src:\n    print(\"LENDIST PATCH: already patched\")\n    sys.exit(0)\n\nANCHOR = \"    # Log completion lengths.\\n    agg_completion_mask = completion_mask.sum(axis=-1)\\n\"\nif src.count(ANCHOR) != 1:\n    fail(f\"anchor found {src.count(ANCHOR)} times, expected 1\")\n\n# Verify the names we rely on are actually in scope in this function.\nfor name in (\"rollout_output\", \"rollout_config\", \"pad_value\", \"eos_value\"):\n    if name not in src:\n        fail(f\"expected local '{name}' not present in grpo_learner.py\")\n\nINJECT = '''    # --- _LENDIST_DUMP: per-step ISL/OSL/truncation distributions -------------\n    # All inputs are already host-side numpy here; no device sync is added.\n    try:\n      import json as _json, os as _os, numpy as _np\n      _cap = int(getattr(rollout_config, \"max_tokens_to_generate\", 0) or 0)\n      _osl, _trunc, _eos_end = [], 0, 0; _ft = []\n      for _t in rollout_output.tokens:\n        _n = int(len(_t))\n        _osl.append(_n)\n        _ft.append(int(_t[0]) if _n else -1)\n        if _cap and _n >= _cap:\n          # Distinguish \"ran into the wall\" from \"happened to finish exactly there\".\n          if _n > 0 and int(_t[-1]) == int(eos_value):\n            _eos_end += 1\n          else:\n            _trunc += 1\n      _p = _np.asarray(rollout_output.left_padded_prompt_tokens)\n      _isl = (_p != pad_value).sum(axis=-1).astype(int).tolist()\n      _rec = {\n          \"step\": int(self.rl_cluster.global_steps),\n          \"mode\": str(mode),\n          \"cap\": _cap,\n          \"n\": len(_osl),\n          \"osl\": _osl,\n          \"isl\": _isl,\n          \"truncated_at_cap\": _trunc,\n          \"eos_exactly_at_cap\": _eos_end,\n          \"first_tok\": _ft,\n      }\n      _run = _os.environ.get(\"JOB_IDENTIFIER\", \"unknown-run\")\n      _art = _os.environ.get(\"ARTIFACT_DIR\", \"\")\n      _line = _json.dumps(_rec)\n      print(\"LENDIST step=%d n=%d cap=%d truncated=%d (%.2f%%) eos_at_cap=%d \"\n            \"osl_mean=%.1f isl_mean=%.1f first_think=%d/%d\"\n            % (_rec[\"step\"], _rec[\"n\"], _cap, _trunc,\n               100.0 * _trunc / max(1, len(_osl)), _eos_end,\n               sum(_osl) / max(1, len(_osl)), sum(_isl) / max(1, len(_isl)),\n               sum(1 for _x in _ft if _x == 151667), len(_ft)),\n            flush=True)\n      if _art.startswith(\"gs://\"):\n        from google.cloud import storage as _st\n        _b, _, _pre = _art[5:].partition(\"/\")\n        _key = \"%s/%s/lendist/step_%06d.json\" % (_pre.rstrip(\"/\"), _run, _rec[\"step\"])\n        _st.Client().bucket(_b).blob(_key.lstrip(\"/\")).upload_from_string(\n            _line, content_type=\"application/json\")\n    except Exception as _e:  # never take down training for a logging bug\n      print(\"LENDIST ERROR: %r\" % (_e,), flush=True)\n    # --- end _LENDIST_DUMP ----------------------------------------------------\n\n'''\n\nsrc = src.replace(ANCHOR, INJECT + ANCHOR, 1)\n\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(GL, \"w\", encoding=\"utf-8\").write(src)\n\nv = open(GL, encoding=\"utf-8\").read()\nproblems = []\nif \"_LENDIST_DUMP\" not in v:\n    problems.append(\"marker missing\")\nif \"truncated_at_cap\" not in v:\n    problems.append(\"truncation logic missing\")\nif v.count(\"agg_completion_mask = completion_mask.sum(axis=-1)\") != 1:\n    problems.append(\"original metric line disturbed\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    problems.append(f\"reparse failed: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"LENDIST PATCH: APPLIED\")"
  patch_phasetime.py: "\"\"\"Phasetime v2 -- split the `other` residual INTO its components.\n\nV1 (runs 10/10b) plus TensorBoard arithmetic already proved the ~30 s `other`\nresidual is exactly `generate_and_compute_advantage - vllm_rollout`, i.e. the\nreward + advantage + data-marshaling stage between the vLLM generate call and\nthe train loop (verified to +-0.5 s on three matched steps). V2 answers the\nnext question: WHICH of those dominates. It keeps all four v1 timers and adds:\n\n    engine_generate    RLCluster.generate wall -- the vLLM call INCLUDING\n                       tunix-side detokenization; against TensorBoard's\n                       rollout_time this locates where detokenize lands\n    compute_rewards    RLLearner._compute_rewards wall -- the Python reward\n                       functions (match_format_*, check_numbers) over 2048\n                       completions\n\nDerived offline, no extra timers needed:\n    marshal+advantage  = generate_and_advantage - engine_generate\n                         - compute_rewards\n    (contains the 2048 x 8192 pad-and-stack ~67 MB numpy build, jnp\n    conversions, advantage estimator, device_put)\n\nSame mechanics as v1: append-and-monkeypatch on the class objects, six\nperf_counter pairs per global step, no device sync, JSON per step to\n<ARTIFACT_DIR>/<run>/phasetime/step_NNNNNN.json plus a PHASETIME stdout line.\n\nCIRCULAR-IMPORT NOTE. rl_learner imports rl_cluster at module load, so the\nblock appended to rl_cluster.py must import rl_learner LAZILY inside the\nwrapper body, never at module level.\n\nFAIL-OPEN. Any missing class/method prints FAILED and exits 0 without\nwriting. Prints exactly one of:\n    PHASETIME2 PATCH: APPLIED\n    PHASETIME2 PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tunix\"\nRL = os.path.join(ROOT, \"rl/rl_learner.py\")\nGL = os.path.join(ROOT, \"rl/grpo/grpo_learner.py\")\nRC = os.path.join(ROOT, \"rl/rl_cluster.py\")\n\n\ndef fail(msg):\n    print(f\"PHASETIME2 PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nfor p in (RL, GL, RC):\n    if not os.path.exists(p):\n        fail(f\"{p} not found\")\n\nrl_src = open(RL, encoding=\"utf-8\").read()\ngl_src = open(GL, encoding=\"utf-8\").read()\nrc_src = open(RC, encoding=\"utf-8\").read()\n\nif any(\"_PHASETIME\" in s for s in (rl_src, gl_src, rc_src)):\n    print(\"PHASETIME2 PATCH: already patched\")\n    sys.exit(0)\n\nfor needle, where in ((\"class RLLearner\", \"rl_learner.py\"),\n                      (\"def _run_global_step\", \"rl_learner.py\"),\n                      (\"def _prepare_data\", \"rl_learner.py\"),\n                      (\"def _run_all_micro_batch_steps\", \"rl_learner.py\"),\n                      (\"def _compute_rewards\", \"rl_learner.py\")):\n    if needle not in rl_src:\n        fail(f\"'{needle}' not present in {where}\")\nfor needle in (\"class GRPOLearner\", \"def _generate_and_compute_advantage\"):\n    if needle not in gl_src:\n        fail(f\"'{needle}' not present in grpo_learner.py\")\nfor needle in (\"RLCluster\", \"def generate\"):  # _PT_ANCHOR: tunix>=408ca1d9 renamed class RLEngine, keeps alias RLCluster = RLEngine\n    if needle not in rc_src:\n        fail(f\"'{needle}' not present in rl_cluster.py\")\n\nRL_APPEND = '''\n\n# --- _PHASETIME v2: break out the `other` residual --------------------------------\n# Appended by patch_phasetime2.py. Six perf_counter pairs per global step; no\n# device sync. Wrappers are installed on the class objects only.\ntry:\n  import time as _pt_time\n  import json as _pt_json\n  import os as _pt_os\n\n  _PHASETIME = {}\n\n  def _pt_add(_name, _dt):\n    _PHASETIME[_name] = _PHASETIME.get(_name, 0.0) + float(_dt)\n\n  def _pt_wrap(_cls, _meth, _label):\n    _orig = getattr(_cls, _meth)\n\n    def _w(self, *a, **k):\n      _t0 = _pt_time.perf_counter()\n      try:\n        return _orig(self, *a, **k)\n      finally:\n        _pt_add(_label, _pt_time.perf_counter() - _t0)\n\n    _w.__name__ = getattr(_orig, \"__name__\", _meth)\n    setattr(_cls, _meth, _w)\n\n  def _pt_flush(self):\n    try:\n      _step = -1\n      try:\n        _step = int(self.rl_cluster.global_steps)\n      except Exception:\n        pass\n      _rec = dict(_PHASETIME)\n      _rec[\"step\"] = _step\n      print(\"PHASETIME step=%d \" % _step\n            + \" \".join(\"%s=%.2f\" % (_k, _v) for _k, _v in sorted(_rec.items())\n                       if _k != \"step\"), flush=True)\n      _run = _pt_os.environ.get(\"JOB_IDENTIFIER\", \"unknown-run\")\n      _art = _pt_os.environ.get(\"ARTIFACT_DIR\", \"\")\n      if _art.startswith(\"gs://\"):\n        from google.cloud import storage as _st\n        _b, _, _pre = _art[5:].partition(\"/\")\n        _key = \"%s/%s/phasetime/step_%06d.json\" % (_pre.rstrip(\"/\"), _run, _step)\n        _st.Client().bucket(_b).blob(_key.lstrip(\"/\")).upload_from_string(\n            _pt_json.dumps(_rec), content_type=\"application/json\")\n    except Exception as _e:\n      print(\"PHASETIME ERROR: %r\" % (_e,), flush=True)\n    finally:\n      _PHASETIME.clear()\n\n  _pt_wrap(RLLearner, \"_prepare_data\", \"prepare_data\")\n  _pt_wrap(RLLearner, \"_run_all_micro_batch_steps\", \"micro_batch_steps\")\n  _pt_wrap(RLLearner, \"_compute_rewards\", \"compute_rewards\")\n\n  _pt_orig_gs = RLLearner._run_global_step\n\n  def _pt_global_step(self, *a, **k):\n    _t0 = _pt_time.perf_counter()\n    try:\n      return _pt_orig_gs(self, *a, **k)\n    finally:\n      _pt_add(\"run_global_step\", _pt_time.perf_counter() - _t0)\n      _pt_flush(self)\n\n  RLLearner._run_global_step = _pt_global_step\nexcept Exception as _e:\n  print(\"PHASETIME ERROR (install): %r\" % (_e,), flush=True)\n# --- end _PHASETIME ---------------------------------------------------------------\n'''\n\nGL_APPEND = '''\n\n# --- _PHASETIME v2: time the GRPO payload inside prepare_data ---------------------\ntry:\n  import time as _pt2_time\n  from tunix.rl import rl_learner as _pt2_rl\n\n  _pt2_orig = GRPOLearner._generate_and_compute_advantage\n\n  def _pt2_w(self, *a, **k):\n    _t0 = _pt2_time.perf_counter()\n    try:\n      return _pt2_orig(self, *a, **k)\n    finally:\n      try:\n        _pt2_rl._pt_add(\"generate_and_advantage\", _pt2_time.perf_counter() - _t0)\n      except Exception:\n        pass\n\n  GRPOLearner._generate_and_compute_advantage = _pt2_w\nexcept Exception as _e:\n  print(\"PHASETIME ERROR (grpo install): %r\" % (_e,), flush=True)\n# --- end _PHASETIME ---------------------------------------------------------------\n'''\n\nRC_APPEND = '''\n\n# --- _PHASETIME v2: time the engine generate call (vLLM + detokenize) -------------\n# NOTE: rl_learner imports THIS module at load time, so rl_learner must be\n# imported lazily inside the wrapper to avoid a circular import.\ntry:\n  import time as _pt3_time\n\n  _pt3_orig = RLCluster.generate\n\n  def _pt3_w(self, *a, **k):\n    _t0 = _pt3_time.perf_counter()\n    try:\n      return _pt3_orig(self, *a, **k)\n    finally:\n      try:\n        from tunix.rl import rl_learner as _pt3_rl\n        _pt3_rl._pt_add(\"engine_generate\", _pt3_time.perf_counter() - _t0)\n      except Exception:\n        pass\n\n  _pt3_w.__name__ = \"generate\"\n  RLCluster.generate = _pt3_w\nexcept Exception as _e:\n  print(\"PHASETIME ERROR (cluster install): %r\" % (_e,), flush=True)\n# --- end _PHASETIME ---------------------------------------------------------------\n'''\n\nnew_rl = rl_src + RL_APPEND\nnew_gl = gl_src + GL_APPEND\nnew_rc = rc_src + RC_APPEND\nfor name, s in ((\"rl_learner.py\", new_rl), (\"grpo_learner.py\", new_gl),\n                (\"rl_cluster.py\", new_rc)):\n    try:\n        ast.parse(s)\n    except SyntaxError as e:\n        fail(f\"patched {name} does not parse: {e}\")\n\nopen(RL, \"w\", encoding=\"utf-8\").write(new_rl)\nopen(GL, \"w\", encoding=\"utf-8\").write(new_gl)\nopen(RC, \"w\", encoding=\"utf-8\").write(new_rc)\n\nproblems = []\nv_rl = open(RL, encoding=\"utf-8\").read()\nv_gl = open(GL, encoding=\"utf-8\").read()\nv_rc = open(RC, encoding=\"utf-8\").read()\nif \"_pt_flush\" not in v_rl or 'compute_rewards\"' not in v_rl:\n    problems.append(\"rl_learner wrappers missing\")\nif \"_pt2_w\" not in v_gl:\n    problems.append(\"grpo_learner wrapper missing\")\nif \"_pt3_w\" not in v_rc:\n    problems.append(\"rl_cluster wrapper missing\")\nif v_rl.count(\"def _run_global_step\") != 1:\n    problems.append(\"rl_learner._run_global_step disturbed\")\nfor name, s in ((\"rl_learner.py\", v_rl), (\"grpo_learner.py\", v_gl),\n                (\"rl_cluster.py\", v_rc)):\n    try:\n        ast.parse(s)\n    except SyntaxError as e:\n        problems.append(f\"reparse {name}: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"PHASETIME2 PATCH: APPLIED\")"
  patch_newimg_fix.py: "\"\"\"KV-SCATTER-PR: apply the MaxText PR change (scatter_layer_kv_caches skips unchanged alias entries) for validation.\"\"\"\nimport sys\nP=\"/deps/src/maxtext/integration/vllm/hybrid_cache_utils.py\"\nOLD='  updated = list(kv_caches)\\n  for lyr, idx in enumerate(physical_indices):\\n    updated[idx] = layer_kv_caches[lyr]\\n  return updated'\nNEW=\"  updated = list(kv_caches)\\n  for lyr, idx in enumerate(physical_indices):\\n    if layer_kv_caches[lyr] is kv_caches[idx]:\\n      # Unchanged view of the physical cache: nothing to write back, and doing\\n      # so could clobber another (donor) layer's update of the same cache.\\n      continue\\n    updated[idx] = layer_kv_caches[lyr]\\n  return updated\"\ns=open(P).read()\nif \"Unchanged view of the physical cache\" in s:\n    print(\"KV-SCATTER-PR: already applied\"); sys.exit(0)\nif s.count(OLD)!=1:\n    print(\"KV-SCATTER-PR: FAILED anchor count\", s.count(OLD)); sys.exit(1)\ns=s.replace(OLD,NEW); compile(s,P,\"exec\"); open(P,\"w\").write(s); print(\"KV-SCATTER-PR: APPLIED\")\n"
kind: ConfigMap
metadata:
  name: g4final8k-patches
  namespace: ubench-regression-tests
---
apiVersion: v1
data:
  launch-workload.sh: "\n#!/bin/bash\nset -e\n\n_sigterm() {\n  echo \"Caught SIGTERM signal, sending to child process...\"\n  kill -SIGTERM \"$PID\" 2>/dev/null\n}\ntrap _sigterm SIGTERM\n\nMAXTEXT_CONFIG_PATH=\"maxtext/configs/post_train/rl.yml\"\n\n# Fallback check to support different image structures\nif [ ! -f \"${MAXTEXT_CONFIG_PATH}\" ] && [ -f \"src/${MAXTEXT_CONFIG_PATH}\" ]; then\n  echo \"MAXTEXT_CONFIG_PATH not found at ${MAXTEXT_CONFIG_PATH}, falling back to src/${MAXTEXT_CONFIG_PATH}\"\n  MAXTEXT_CONFIG_PATH=\"src/${MAXTEXT_CONFIG_PATH}\"\nfi\n\n# --- pathwaysutils profiling hotfix (upstream scripts/patch_vllm_sampler.py) ---\n# Non-fatal: if the target strings are absent the patch is a no-op.\nif [ -f /workload/patches/patch_vllm_sampler.py ]; then\n  echo \"Applying pathwaysutils profiling hotfix...\"\n  : # patch_vllm_sampler removed (no-op on the latest image)\nfi\n\n# --- PROPER continue-decode fix (mirrors PR #3374) ---\n# Adds step_fn_no_options on the flax_nnx path AND makes decode_loop source its\n# compiler options from get_step_fn_compiler_options() instead of a 3-entry literal.\n# Self-verifying: prints CD-PROPER PATCH: APPLIED or ... FAILED <reason>.\nif [ -f /workload/patches/patch_cd_proper.py ]; then\n  : # patch_cd_proper removed (no-op on the latest image)\nfi\n\n# --- ISL/OSL/truncation instrumentation ---\n# max_prefill_predict_length drops 16384 -> 8192 in this run, so prompt truncation\n# stops being a curiosity and becomes a CORRECTNESS dependency: if any prompt\n# exceeds 8192 we silently change the RL problem and the comparison against Magellan's\n# 299 s is void. This dumps the per-step ISL/OSL distribution + truncation counts.\n# Fail-open and free (all inputs are already host-side numpy; no device sync).\n# Prints LENDIST PATCH: APPLIED or ... FAILED <reason>.\nif [ -f /workload/patches/patch_lendist.py ]; then\n  python3 /workload/patches/patch_newimg_fix.py\n  python3 /workload/patches/patch_lendist.py\nfi\n\n# --- RPA v3 block-size forwarding (THE POINT OF RUN 06) ---\n# PR #3102's env override is wired into layers/jax/attention/attention.py only;\n# MaxText's forward_serve_vllm enters through layers/common/attention_interface.py,\n# which never forwards it -- so RPA_V3_DECODE_BLOCK_SIZES has been INERT in every\n# run to date, including the 274.9 s one. Proven from run 05's decode_only trace:\n# the only kernel executed was RPAd-p_64-bq_1_1-bkv_16384_16384 (the default),\n# 138.4 ms = 74.7% of leaf decode time, despite the env var being set.\n# Self-verifying: prints RPA-BLOCKS PATCH: APPLIED or ... FAILED <reason>.\nif [ -f /workload/patches/patch_rpa_blocks.py ]; then\n  : # patch_rpa_blocks removed (no-op on the latest image)\nfi\n\n# --- CONTINUOUS-BATCHING DECODE WINDOW: the two halves must BOTH apply ---\n# (1) stop cond_fn ending the window on any EOS; (2) make the host read each\n# sequence's last NON-PADDING row. Run 10 applied only (1) and was VOID --\n# reward 0.146 -> 0.053 -- because the host read the window's last row, saw\n# padding for every sequence that finished mid-window, never retired it, and\n# re-seeded it from a padding token. Termination became a lottery.\n# If CD-REPORT reports FAILED while CD-MASK reports APPLIED, KILL THE RUN.\nif [ -f /workload/patches/patch_cd_masking.py ]; then\n  : # patch_cd_masking removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_cd_report.py ]; then\n  : # patch_cd_report removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_phasetime.py ]; then\n  python3 /workload/patches/patch_phasetime.py\nfi\nif [ -f /workload/patches/patch_reward_parallel.py ]; then\n  : # patch_reward_parallel removed (no-op on the latest image)\n  : # patch_length_shape removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_sharded_sampling.py ]; then\n  : # patch_sharded_sampling removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_profiler_fix.py ]; then\n  : # patch_profiler_fix removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_gc_sync.py ]; then\n  : # patch_gc_sync removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_packing_knob.py ]; then\n  : # patch_packing_knob removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_packer_fast.py ]; then\n  : # patch_packer_fast removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_block_size.py ]; then\n  : # patch_block_size removed (no-op on the latest image)\n  : # patch_approx_topk removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_async_detok.py ]; then\n  : # patch_async_detok removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_async_logprobs.py ]; then\n  : # patch_async_logprobs removed (no-op on the latest image)\nfi\n# patch_gemma4_prs SKIPPED for now: its diff adds a `packing:` key to the gemma4 model ymls that the image RLConfig (extra=forbid) rejects; PR-parity pending\nif [ -f /workload/patches/patch_dp_rr_routing.py ]; then\n  : # patch_dp_rr_routing removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_stop_tokens.py ]; then\n  : # patch_stop_tokens removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_runner_eos.py ]; then\n  : # patch_runner_eos removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_fast_extract.py ]; then\n  : # patch_fast_extract removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_g4_format_guard.py ]; then\n  : # patch_g4_format_guard removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_async_reward.py ]; then\n  : # patch_async_reward removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_flash_sa.py ]; then\n  : # patch_flash_sa removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_jit_unroll.py ]; then\n  : # patch_jit_unroll removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_sync_keepkv.py ]; then\n  : # patch_sync_keepkv removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_host_extract.py ]; then\n  : # patch_host_extract removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_cd_noglobal.py ]; then\n  : # patch_cd_noglobal removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_padding_bucket.py ]; then\n  : # patch_padding_bucket removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_log_stats.py ]; then\n  : # patch_log_stats removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_textual_stop.py ]; then\n  : # patch_textual_stop removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_verify_timeout.py ]; then\n  : # patch_verify_timeout removed (no-op on the latest image)\nfi\nif [ -f /workload/patches/patch_reward_dump.py ]; then\n  : # patch_reward_dump removed (no-op on the latest image)\nfi\n\n\n# --- ROLLOUT PROFILING (the whole point of this run) ---\n# profiler=xplane captures ONLY the trainer mesh -- verified by grepping a 111 MB\n# xplane from the 2026-08-13 run: jit__train_step x31, jit_compute_per_token_logps\n# x16, and ZERO step_fn / ragged_paged_attention / continue_decode / jit__generate.\n# So rollout (~70% of the step, 100% of its variance) has never been profiled.\n# PHASED_PROFILING_DIR is tpu_inference's own profiler (envs.py:23,\n# tpu_runner._init_phased_profiling) and DOES capture the decode path.\n#\n# THE PATH MUST BE gs://, NOT LOCAL. Attempt 1 of this run used /tmp and crashed on\n# the FIRST rollout, 14 times:\n#   tpu_runner._prepare_inputs:2816 -> phase_based_profiler.step()\n#     -> utils.py:699 _start_profiling -> jax.profiler.start_trace\n#       -> pathwaysutils/profiling.py:269\n#          ValueError: log_dir must be a GCS bucket path, got /tmp/phased_profile/...\n# Under Pathways the trace writer requires GCS. (The accompanying\n# \"AttributeError: 'Qwen3ForCausalLM' object has no attribute 'modules'\" is an\n# atexit/weakref cleanup firing during the shutdown that follows -- a symptom, not\n# a second bug.)\n#\n# _start_profiling ALSO does os.makedirs() on this path and _resolve_canonical_dst_ts\n# opens a marker file under it with a plain open(). With a gs:// value those create a\n# junk LOCAL tree ./gs:/... and succeed (POSIX collapses the double slash), while\n# start_trace gets the GCS path it needs. Side effect: the small\n# batch_composition_stats files land in that junk local tree and are lost. The traces\n# -- the actual objective -- go straight to GCS, so no syncer is needed.\nexport VLLM_BLOCK_SIZE=128\nexport APPROX_TOPK=1\nexport APPROX_TOPK_K=64            # pin KV page size\n# padding fix now in-tree via patch_padding_bucket.py (PR #3466); gap env no longer needed\nexport VLLM_PREFIX_CACHING=0          # -6 s/step, byte-identical generation (33j)\nexport DP_ROUTING=rr                  # (INERT: tpu_inference reads DP_SCHED_ROUTING, not this)\nexport DP_SCHED_ROUTING=round_robin   # FIX: the real knob. Default is least_loaded, which\n                                      # probes all 128 ranks x4 per request (2048 reqs) for zero\n                                      # benefit here (equal ~150-tok prompts, prefix-caching off).\nexport EXTRA_STOP_TOKEN_IDS=[106,50]   # gemma-4-E2B-it generation_config eos set [1,106,50]; tunix only used tokenizer eos=1\nexport FAST_EXTRACT=fast             # ROUND 4: fast extract_answer (112: 2560 checked, 0 mismatches)\nexport ASYNC_REWARD=on; export DP_SCHED_ROUTING=round_robin               # ROUND 4: score during rollout; every 8th item cross-checked\nexport ASYNC_LOGPROBS=on             # ROUND 4: 117 = 1280+ completions cross-checked, 0 mismatches\nexport MAX_SEQ_TOKEN_PER_TPU=8192    # covers prefill 4096 + response 4096 (teammate-parity caps)\nexport PHASED_PROFILING_DIR=\"\"\n# ROOT CAUSE of prior empty captures: the phased profiler needs\n# NUM_STEPS_TO_PROFILE_FOR (default 15) execute_model calls of one phase\n# before stop_trace() writes the xplane. With continue-decode max_decode_steps=512\n# each execute advances ~512 tokens but counts as ONE profiler step, so at OSL~1420\n# the decode phase drains (EOS) after ~3 calls, never reaching 15 -> no flush.\n# Set to 2 so the window closes (and writes) after ~2 execute calls (~1024 decode\n# steps captured), guaranteeing a flush inside a single rollout step.\nexport PHASED_PROFILER_NUM_STEPS_TO_PROFILE_FOR=2\necho \"PHASED_PROFILING_DIR=$PHASED_PROFILING_DIR NUM_STEPS=$PHASED_PROFILER_NUM_STEPS_TO_PROFILE_FOR\"\n\n# --- Magellan's two decode-kernel env levers (rungs 3 and 4 of their ladder) ---\n# NOTE: their launch.sh exports GRR_RPA_DECODE_BLOCKS / GRR_CD_EOS_CHECK_INTERVAL.\n# Those names exist in NO version of tpu-inference (checked all 346 open PRs, the\n# fork at their PR head, and both images) -- an internal prefix that leaked into\n# the published script. These are the names the code actually reads:\n#   RPA_V3_DECODE_BLOCK_SIZES        -- PR #3102, bq_sz,bkv_sz,bq_csz,bkv_csz\n#   CONTINUE_DECODE_EOS_CHECK_INTERVAL -- PR #3174, default 1\n# WARNING on the second one: at OUR old config (batch 480, max_decode_steps=10)\n# interval 8 measured 719 -> ~2157 s. Their claim is 327 -> 299 s. The regimes\n# differ (compute-bound vs dispatch-bound), so it is included here for a faithful\n# reproduction -- but if this run lands far above 299 s, THIS IS SUSPECT #1 and the\n# follow-up is to drop it and target their 327 s rung instead.\n# RPA tile envs unset for gemma4 (head_dim differs from qwen; kernel defaults)\nexport CONTINUE_DECODE_EOS_CHECK_INTERVAL=\"0\"\nexport TEXTUAL_STOP=0\nexport VERIFY_ITEM_TIMEOUT=5\nexport REWARD_DUMP_N=512\nexport LENGTH_SHAPE=0\nexport LENGTH_SHAPE_LAMBDA=0.25\nexport LENGTH_SHAPE_TARGET=3500\nexport LENGTH_SHAPE_SCALE=9000\n\n# --- RL Sampler Patches & Env Setup ---\nexport HF_TOKEN=''\nexport HF_HUB_ENABLE_HF_TRANSFER=0\nexport HF_HUB_DISABLE_XET=1\nexport NUM_PRECOMPILE_WORKERS=1\nexport NEW_MODEL_DESIGN=1\nexport TPU_MIN_LOG_LEVEL=0\nexport TF_CPP_MIN_LOG_LEVEL=0\nexport TPU_STDERR_LOG_LEVEL=0\nexport JAX_BACKEND_TARGET=grpc://127.0.0.1:29140\n\n# Multimodal-default shims carried over from the ubench recipe (harmless if unused)\ncat << 'EOF' >> /deps/src/maxtext/configs/types.py\n\n# --- Auto-patch RLConfig with Multimodal defaults ---\nif 'RLConfig' in globals():\n  if not hasattr(RLConfig, 'use_mrope'):\n    RLConfig.use_mrope = False\n  if not hasattr(RLConfig, 'mrope_section'):\n    RLConfig.mrope_section = [24, 20, 20]\n  if not hasattr(RLConfig, 'position_id_per_seconds'):\n    RLConfig.position_id_per_seconds = 25\nEOF\nsed -i 's/mrope_section=config.mrope_section/mrope_section=getattr(config, \"mrope_section\", [24, 20, 20])/g; s/mrope_section=cfg.mrope_section/mrope_section=getattr(cfg, \"mrope_section\", [24, 20, 20])/g' /deps/src/maxtext/models/qwen3.py 2>/dev/null || true\n\n# --- Main Execution ---\n(\n  export ENABLE_PATHWAYS_PERSISTENCE='1'\n  export JAX_PLATFORMS=\"${JAX_PLATFORMS:-proxy,cpu}\"\n  export ENABLE_PJRT_COMPATIBILITY='true'\n  # NOTE: XLA flags are NOT set here. Under JAX_PLATFORMS=proxy the client owns\n  # no TPU, so LIBTPU_INIT_ARGS would be inert. They are passed as argv to the\n  # pathways-proxy container instead (upstream: --custom-pathways-proxy-server-args).\n\n  # continue-decode is ENABLED with max_decode_steps=128 (Magellan's value; every prior\n  # CD run of ours silently used DEFAULT_MAX_DECODE_STEPS = 10). This depends on\n  # patch_cd_proper.py (PR #3374) having applied -- without it the fused loop raises\n  # \"compiler_options can only be passed to top-level jax.jit\" on this image.\n  python3 -m maxtext.trainers.post_train.rl.train_rl \"${MAXTEXT_CONFIG_PATH}\" \\\n    model_name='gemma4-e2b' \\\n    tokenizer_path='google/gemma-4-E2B-it' \\\n    dataset_name='nvidia/OpenMathInstruct-2' \\\n    dataset_processor_path=/workload/patches/gemma_data.py \\\n    hf_train_files='hf://datasets/nvidia/OpenMathInstruct-2/data/train_1M-*.parquet' \\\n    train_split='train_1M' \\\n    rl.num_generations=8 \\\n    rl.grpo_beta=0.0 \\\n    rl.grpo_epsilon=0.2 \\\n    rl.epsilon_high=0.28 \\\n    checkpoint_storage_use_ocdbt=False \\\n    async_scheduling=False \\\n    math_verify_num_procs=64 \\\n    chips_per_vm=8 \\\n    local_sa_block_q=512 \\\n    local_sa_block_kv=512 \\\n    local_sa_block_kv_compute=512 \\\n    local_sa_block_q_dkv=512 \\\n    local_sa_block_kv_dkv=512 \\\n    local_sa_block_kv_dkv_compute=512 \\\n    local_sa_block_q_dq=512 \\\n    local_sa_block_kv_dq=512 \\\n    local_sa_use_fused_bwd_kernel=false \\\n    local_sa_q_layout=HEAD_DIM_MINOR \\\n    local_sa_k_layout=HEAD_DIM_MINOR \\\n    local_sa_v_layout=HEAD_DIM_MINOR \\\n    local_sa_fuse_reciprocal=true \\\n    local_sa_use_base2_exp=true \\\n    eval_local_sa_block_q=512 \\\n    eval_local_sa_block_kv=512 \\\n    eval_local_sa_block_kv_compute=512 \\\n    eval_local_sa_q_layout=HEAD_DIM_MINOR \\\n    eval_local_sa_k_layout=HEAD_DIM_MINOR \\\n    eval_local_sa_v_layout=HEAD_DIM_MINOR \\\n    num_batches=8 \\\n    free_kv_cache_during_weight_sync=false \\\n    vllm_block_size=128 \\\n    max_seq_token_per_tpu=12288 \\\n    reward_num_workers=0 \\\n    num_test_batches=0 \\\n    debug=True \\\n    profiler=xplane \\\n    skip_first_n_steps_for_profiler=100 \\\n    profiler_steps=1 \\\n    gradient_clipping_threshold=1.0 \\\n    decode_sampling_temperature=0.8 \\\n    decode_sampling_top_k=50 \\\n    decode_sampling_nucleus_p=0.95 \\\n    max_target_length=12288 \\\n    kv_cache_buffer=12288 \\\n    max_prefill_predict_length=4096 \\\n    learning_rate=1e-6 \\\n    batch_size=256 \\\n    train_micro_batch_size=8 \\\n    rollout_micro_batch_size=256 \\\n    trainer_devices_fraction=1.0 \\\n    sampler_devices_fraction=1.0 \\\n    rollout_data_parallelism=128 \\\n    rollout_tensor_parallelism=1 \\\n    enable_dp_attention=false \\\n    hbm_utilization_vllm=0.3 \\\n    max_num_seqs=256 \\\n    max_num_batched_tokens=33280 \\\n    scan_layers=False \\\n    allow_split_physical_axes=True \\\n    vllm_hf_overrides='{architectures: [\"MaxTextForCausalLM\"]}' \\\n    attention='flash' \\\n    allow_split_physical_axes=True \\\n    enable_tunix_perf_metrics=True \\\n    checkpoint_period=100 \\\n    max_num_checkpoints_to_keep=1000 \\\n    enable_checkpointing=true \\\n    load_parameters_path='gs://ubench-logs/alisachen-tpu7x/ckpt/gemma4-e2b-raw2/0/items' \\\n    skip_jax_distributed_system=True \\\n    vllm_additional_config='{\"enable_continue_decode\": true, \"max_decode_steps\": 1024, \"maxtext_config\": {\"model_name\": \"gemma4-e2b\", \"model_call_mode\": \"inference\", \"log_config\": false, \"weight_dtype\": \"bfloat16\", \"allow_split_physical_axes\": true}}' \\\n    base_output_directory=${ARTIFACT_DIR} \\\n    run_name=${JOB_IDENTIFIER}\n) & PID=$!\n\nwait $PID\nEXIT_CODE=$?\n\necho \"MaxText Job Ended at: $(date) with exit code $EXIT_CODE\"\nexit $EXIT_CODE"
  patch_newimg_fix.py: "\"\"\"KV-SCATTER-PR: apply the MaxText PR change (scatter_layer_kv_caches skips unchanged alias entries) for validation.\"\"\"\nimport sys\nP=\"/deps/src/maxtext/integration/vllm/hybrid_cache_utils.py\"\nOLD='  updated = list(kv_caches)\\n  for lyr, idx in enumerate(physical_indices):\\n    updated[idx] = layer_kv_caches[lyr]\\n  return updated'\nNEW=\"  updated = list(kv_caches)\\n  for lyr, idx in enumerate(physical_indices):\\n    if layer_kv_caches[lyr] is kv_caches[idx]:\\n      # Unchanged view of the physical cache: nothing to write back, and doing\\n      # so could clobber another (donor) layer's update of the same cache.\\n      continue\\n    updated[idx] = layer_kv_caches[lyr]\\n  return updated\"\ns=open(P).read()\nif \"Unchanged view of the physical cache\" in s:\n    print(\"KV-SCATTER-PR: already applied\"); sys.exit(0)\nif s.count(OLD)!=1:\n    print(\"KV-SCATTER-PR: FAILED anchor count\", s.count(OLD)); sys.exit(1)\ns=s.replace(OLD,NEW); compile(s,P,\"exec\"); open(P,\"w\").write(s); print(\"KV-SCATTER-PR: APPLIED\")\n"
kind: ConfigMap
metadata:
  name: g4final8k-launcher
  namespace: ubench-regression-tests
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: g4final8k
  namespace: ubench-regression-tests
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
spec:
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  failurePolicy:
    maxRestarts: 3
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - pathways-head
  replicatedJobs:
  - name: pathways-head
    replicas: 1
    template:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: multislice-queue
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              kueue.x-k8s.io/podset: pathways-head
              kueue.x-k8s.io/queue-name: multislice-queue
            annotations:
              kubectl.kubernetes.io/default-container: jax-tpu
              gke-gcsfuse/volumes: 'true'
          spec:
            restartPolicy: OnFailure
            priorityClassName: medium
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-nodepool: cpu-np
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/replicatedjob-name
                        operator: In
                        values:
                        - pathways-head
            containers:
            - name: jax-tpu
              image: gcr.io/supercomputer-testing/maxtext-rl-ironwood@sha256:4dc6ca720017bf93b6bae9524519cf5b7a8b16706ca6aab2a355af26d75a6bf3
              command:
              - bash
              - -c
              - "echo Pathways Helm Start: $(date);\n_sigterm() (kill -SIGTERM $! 2>/dev/null;);\ntrap _sigterm SIGTERM;\necho \"Executing payload from /workload/launcher/launch-workload.sh...\"\n( bash /workload/launcher/launch-workload.sh ) & PID=$!;\nwhile kill -0 $PID 2>/dev/null;\n    do sleep 5;\ndone;\nwait $PID;\nEXIT_CODE=$?;\necho Pathways Helm End: $(date);\necho EXIT_CODE=$EXIT_CODE;\nexit $EXIT_CODE\n"
              env:
              - name: JAX_PLATFORMS
                value: proxy,cpu
              - name: PATHWAYS_HEAD
                value: g4final8k-pathways-head-0-0.g4final8k
              - name: JAX_BACKEND_TARGET
                value: grpc://g4final8k-pathways-head-0-0.g4final8k:29140
              - name: JOB_IDENTIFIER
                value: g4final8k
              - name: ARTIFACT_DIR
                value: gs://ubench-logs
              - name: JAX_COMPILATION_CACHE_DIR
                value: gs://ubench-logs/compilation_cache/qwen3-0.6b/rl_repro_jax_tpu7x_20260730
              - name: SKIP_JAX_PRECOMPILE
                value: '1'
              resources:
                requests:
                  cpu: '28'
                  memory: 130G
                limits:
                  cpu: '44'
                  memory: 170G
              securityContext:
                privileged: true
              volumeMounts:
              - name: workload-launcher
                mountPath: /workload/launcher
              - name: workload-patches
                mountPath: /workload/patches
              - name: shared-tmp
                mountPath: /tmp
            initContainers:
            - name: pathways-rm
              image: us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20261028-jax_0.11.0
              restartPolicy: Always
              env:
              - name: HOST_ADDRESS
                value: g4final8k-pathways-head-0-0.g4final8k
              args:
              - --server_port=29141
              - --node_type=resource_manager
              - --gcs_scratch_location=gs://ubench-logs/compilation_cache/qwen3-0.6b/rl_repro_pathways_tpu7x_20260730
              - --instance_count=1
              - --instance_type=tpu7x:4x4x4
              resources:
                requests:
                  cpu: '8'
                  memory: 24G
                limits:
                  cpu: '16'
                  memory: 64G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            - name: pathways-proxy
              image: us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:20261028-jax_0.11.0
              restartPolicy: Always
              env:
              - name: PATHWAYS_HEAD
                value: g4final8k-pathways-head-0-0.g4final8k
              args:
              - --server_port=29140
              - --resource_manager_address=g4final8k-pathways-head-0-0.g4final8k:29141
