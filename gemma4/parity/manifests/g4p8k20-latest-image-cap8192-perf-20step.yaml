apiVersion: v1
data:
  launch-workload.sh: "\n#!/bin/bash\nset -e\n\n_sigterm() {\n  echo \"Caught SIGTERM signal, sending to child process...\"\n  kill -SIGTERM \"$PID\" 2>/dev/null\n}\ntrap _sigterm SIGTERM\n\nMAXTEXT_CONFIG_PATH=\"maxtext/configs/post_train/rl.yml\"\n\n# Fallback check to support different image structures\nif [ ! -f \"${MAXTEXT_CONFIG_PATH}\" ] && [ -f \"src/${MAXTEXT_CONFIG_PATH}\" ]; then\n  echo \"MAXTEXT_CONFIG_PATH not found at ${MAXTEXT_CONFIG_PATH}, falling back to src/${MAXTEXT_CONFIG_PATH}\"\n  MAXTEXT_CONFIG_PATH=\"src/${MAXTEXT_CONFIG_PATH}\"\nfi\n\n# --- pathwaysutils profiling hotfix (upstream scripts/patch_vllm_sampler.py) ---\n# Non-fatal: if the target strings are absent the patch is a no-op.\nif [ -f /workload/patches/patch_vllm_sampler.py ]; then\n  echo \"Applying pathwaysutils profiling hotfix...\"\n  python3 /workload/patches/patch_vllm_sampler.py || echo \"WARN: hotfix did not apply cleanly; continuing\"\nfi\n\n# --- PROPER continue-decode fix (mirrors PR #3374) ---\n# Adds step_fn_no_options on the flax_nnx path AND makes decode_loop source its\n# compiler options from get_step_fn_compiler_options() instead of a 3-entry literal.\n# Self-verifying: prints CD-PROPER PATCH: APPLIED or ... FAILED <reason>.\nif [ -f /workload/patches/patch_cd_proper.py ]; then\nfi\n\n# --- ISL/OSL/truncation instrumentation ---\n# max_prefill_predict_length drops 16384 -> 8192 in this run, so prompt truncation\n# stops being a curiosity and becomes a CORRECTNESS dependency: if any prompt\n# exceeds 8192 we silently change the RL problem and the comparison against Magellan's\n# 299 s is void. This dumps the per-step ISL/OSL distribution + truncation counts.\n# Fail-open and free (all inputs are already host-side numpy; no device sync).\n# Prints LENDIST PATCH: APPLIED or ... FAILED <reason>.\nif [ -f /workload/patches/patch_lendist.py ]; then\n  python3 /workload/patches/patch_lendist.py\nfi\n\n# --- RPA v3 block-size forwarding (THE POINT OF RUN 06) ---\n# PR #3102's env override is wired into layers/jax/attention/attention.py only;\n# MaxText's forward_serve_vllm enters through layers/common/attention_interface.py,\n# which never forwards it -- so RPA_V3_DECODE_BLOCK_SIZES has been INERT in every\n# run to date, including the 274.9 s one. Proven from run 05's decode_only trace:\n# the only kernel executed was RPAd-p_64-bq_1_1-bkv_16384_16384 (the default),\n# 138.4 ms = 74.7% of leaf decode time, despite the env var being set.\n# Self-verifying: prints RPA-BLOCKS PATCH: APPLIED or ... FAILED <reason>.\nif [ -f /workload/patches/patch_rpa_blocks.py ]; then\nfi\n\n# --- CONTINUOUS-BATCHING DECODE WINDOW: the two halves must BOTH apply ---\n# (1) stop cond_fn ending the window on any EOS; (2) make the host read each\n# sequence's last NON-PADDING row. Run 10 applied only (1) and was VOID --\n# reward 0.146 -> 0.053 -- because the host read the window's last row, saw\n# padding for every sequence that finished mid-window, never retired it, and\n# re-seeded it from a padding token. Termination became a lottery.\n# If CD-REPORT reports FAILED while CD-MASK reports APPLIED, KILL THE RUN.\nif [ -f /workload/patches/patch_cd_masking.py ]; then\n  python3 /workload/patches/patch_cd_masking.py\nfi\nif [ -f /workload/patches/patch_cd_report.py ]; then\n  python3 /workload/patches/patch_cd_report.py\nfi\nif [ -f /workload/patches/patch_phasetime.py ]; then\n  python3 /workload/patches/patch_phasetime.py\nfi\nif [ -f /workload/patches/patch_reward_parallel.py ]; then\n  python3 /workload/patches/patch_reward_parallel.py\n  python3 /workload/patches/patch_sampler_is.py\n  python3 /workload/patches/patch_newimg_fix.py\nfi\nif [ -f /workload/patches/patch_sharded_sampling.py ]; then\nfi\nif [ -f /workload/patches/patch_profiler_fix.py ]; then\nfi\nif [ -f /workload/patches/patch_gc_sync.py ]; then\n  python3 /workload/patches/patch_gc_sync.py\nfi\nif [ -f /workload/patches/patch_packing_knob.py ]; then\nfi\nif [ -f /workload/patches/patch_packer_fast.py ]; then\nfi\nif [ -f /workload/patches/patch_block_size.py ]; then\n  python3 /workload/patches/patch_block_size.py\n  python3 /workload/patches/patch_approx_topk.py\nfi\nif [ -f /workload/patches/patch_async_detok.py ]; then\nfi\nif [ -f /workload/patches/patch_async_logprobs.py ]; then\nfi\n# patch_gemma4_prs SKIPPED for now: its diff adds a `packing:` key to the gemma4 model ymls that the image RLConfig (extra=forbid) rejects; PR-parity pending\nif [ -f /workload/patches/patch_dp_rr_routing.py ]; then\nfi\nif [ -f /workload/patches/patch_stop_tokens.py ]; then\nfi\nif [ -f /workload/patches/patch_runner_eos.py ]; then\n  python3 /workload/patches/patch_runner_eos.py\nfi\nif [ -f /workload/patches/patch_fast_extract.py ]; then\n  python3 /workload/patches/patch_fast_extract.py\nfi\nif [ -f /workload/patches/patch_g4_format_guard.py ]; then\n  python3 /workload/patches/patch_g4_format_guard.py\nfi\nif [ -f /workload/patches/patch_async_reward.py ]; then\nfi\nif [ -f /workload/patches/patch_flash_sa.py ]; then\nfi\nif [ -f /workload/patches/patch_jit_unroll.py ]; then\nfi\nif [ -f /workload/patches/patch_sync_keepkv.py ]; then\nfi\nif [ -f /workload/patches/patch_host_extract.py ]; then\nfi\nif [ -f /workload/patches/patch_cd_noglobal.py ]; then\n  python3 /workload/patches/patch_cd_noglobal.py\nfi\nif [ -f /workload/patches/patch_padding_bucket.py ]; then\nfi\nif [ -f /workload/patches/patch_log_stats.py ]; then\n  python3 /workload/patches/patch_log_stats.py\nfi\nif [ -f /workload/patches/patch_textual_stop.py ]; then\nfi\nif [ -f /workload/patches/patch_verify_timeout.py ]; then\n  python3 /workload/patches/patch_verify_timeout.py\nfi\nif [ -f /workload/patches/patch_reward_dump.py ]; then\nfi\n\n\n# --- ROLLOUT PROFILING (the whole point of this run) ---\n# profiler=xplane captures ONLY the trainer mesh -- verified by grepping a 111 MB\n# xplane from the 2026-08-13 run: jit__train_step x31, jit_compute_per_token_logps\n# x16, and ZERO step_fn / ragged_paged_attention / continue_decode / jit__generate.\n# So rollout (~70% of the step, 100% of its variance) has never been profiled.\n# PHASED_PROFILING_DIR is tpu_inference's own profiler (envs.py:23,\n# tpu_runner._init_phased_profiling) and DOES capture the decode path.\n#\n# THE PATH MUST BE gs://, NOT LOCAL. Attempt 1 of this run used /tmp and crashed on\n# the FIRST rollout, 14 times:\n#   tpu_runner._prepare_inputs:2816 -> phase_based_profiler.step()\n#     -> utils.py:699 _start_profiling -> jax.profiler.start_trace\n#       -> pathwaysutils/profiling.py:269\n#          ValueError: log_dir must be a GCS bucket path, got /tmp/phased_profile/...\n# Under Pathways the trace writer requires GCS. (The accompanying\n# \"AttributeError: 'Qwen3ForCausalLM' object has no attribute 'modules'\" is an\n# atexit/weakref cleanup firing during the shutdown that follows -- a symptom, not\n# a second bug.)\n#\n# _start_profiling ALSO does os.makedirs() on this path and _resolve_canonical_dst_ts\n# opens a marker file under it with a plain open(). With a gs:// value those create a\n# junk LOCAL tree ./gs:/... and succeed (POSIX collapses the double slash), while\n# start_trace gets the GCS path it needs. Side effect: the small\n# batch_composition_stats files land in that junk local tree and are lost. The traces\n# -- the actual objective -- go straight to GCS, so no syncer is needed.\nexport VLLM_BLOCK_SIZE=128\nexport APPROX_TOPK=1\nexport APPROX_TOPK_K=64            # pin KV page size\n# padding fix now in-tree via patch_padding_bucket.py (PR #3466); gap env no longer needed\nexport VLLM_PREFIX_CACHING=0          # -6 s/step, byte-identical generation (33j)\nexport DP_ROUTING=rr                  # (INERT: tpu_inference reads DP_SCHED_ROUTING, not this)\nexport DP_SCHED_ROUTING=round_robin   # FIX: the real knob. Default is least_loaded, which\n                                      # probes all 128 ranks x4 per request (2048 reqs) for zero\n                                      # benefit here (equal ~150-tok prompts, prefix-caching off).\nexport EXTRA_STOP_TOKEN_IDS=[106,50]   # gemma-4-E2B-it generation_config eos set [1,106,50]; tunix only used tokenizer eos=1\nexport FAST_EXTRACT=fast             # ROUND 4: fast extract_answer (112: 2560 checked, 0 mismatches)\nexport ASYNC_REWARD=on; export DP_SCHED_ROUTING=round_robin               # ROUND 4: score during rollout; every 8th item cross-checked\nexport ASYNC_LOGPROBS=on             # ROUND 4: 117 = 1280+ completions cross-checked, 0 mismatches\nexport MAX_SEQ_TOKEN_PER_TPU=8192    # covers prefill 4096 + response 4096 (teammate-parity caps)\nexport PHASED_PROFILING_DIR=\"\"\n# ROOT CAUSE of prior empty captures: the phased profiler needs\n# NUM_STEPS_TO_PROFILE_FOR (default 15) execute_model calls of one phase\n# before stop_trace() writes the xplane. With continue-decode max_decode_steps=512\n# each execute advances ~512 tokens but counts as ONE profiler step, so at OSL~1420\n# the decode phase drains (EOS) after ~3 calls, never reaching 15 -> no flush.\n# Set to 2 so the window closes (and writes) after ~2 execute calls (~1024 decode\n# steps captured), guaranteeing a flush inside a single rollout step.\nexport PHASED_PROFILER_NUM_STEPS_TO_PROFILE_FOR=2\necho \"PHASED_PROFILING_DIR=$PHASED_PROFILING_DIR NUM_STEPS=$PHASED_PROFILER_NUM_STEPS_TO_PROFILE_FOR\"\n\n# --- Magellan's two decode-kernel env levers (rungs 3 and 4 of their ladder) ---\n# NOTE: their launch.sh exports GRR_RPA_DECODE_BLOCKS / GRR_CD_EOS_CHECK_INTERVAL.\n# Those names exist in NO version of tpu-inference (checked all 346 open PRs, the\n# fork at their PR head, and both images) -- an internal prefix that leaked into\n# the published script. These are the names the code actually reads:\n#   RPA_V3_DECODE_BLOCK_SIZES        -- PR #3102, bq_sz,bkv_sz,bq_csz,bkv_csz\n#   CONTINUE_DECODE_EOS_CHECK_INTERVAL -- PR #3174, default 1\n# WARNING on the second one: at OUR old config (batch 480, max_decode_steps=10)\n# interval 8 measured 719 -> ~2157 s. Their claim is 327 -> 299 s. The regimes\n# differ (compute-bound vs dispatch-bound), so it is included here for a faithful\n# reproduction -- but if this run lands far above 299 s, THIS IS SUSPECT #1 and the\n# follow-up is to drop it and target their 327 s rung instead.\n# RPA tile envs unset for gemma4 (head_dim differs from qwen; kernel defaults)\nexport CONTINUE_DECODE_EOS_CHECK_INTERVAL=\"32\"\nexport TEXTUAL_STOP=0\nexport VERIFY_ITEM_TIMEOUT=5\nexport REWARD_DUMP_N=512\nexport LENGTH_SHAPE=0\nexport PARITY_SAMPLER_IS=token\nexport PARITY_SAMPLER_IS_THRESHOLD=3.0\nexport ASYNC_REWARD=on; export DP_SCHED_ROUTING=round_robin\nexport ASYNC_LOGPROBS=off\nexport LENGTH_SHAPE_LAMBDA=0.25\nexport LENGTH_SHAPE_TARGET=3500\nexport LENGTH_SHAPE_SCALE=9000\n\n# --- RL Sampler Patches & Env Setup ---\nexport HF_TOKEN=''\nexport HF_HUB_ENABLE_HF_TRANSFER=0\nexport HF_HUB_DISABLE_XET=1\nexport NUM_PRECOMPILE_WORKERS=1\nexport NEW_MODEL_DESIGN=1\nexport TPU_MIN_LOG_LEVEL=0\nexport TF_CPP_MIN_LOG_LEVEL=0\nexport TPU_STDERR_LOG_LEVEL=0\nexport JAX_BACKEND_TARGET=grpc://127.0.0.1:29140\n\n# Multimodal-default shims carried over from the ubench recipe (harmless if unused)\ncat << 'EOF' >> /deps/src/maxtext/configs/types.py\n\n# --- Auto-patch RLConfig with Multimodal defaults ---\nif 'RLConfig' in globals():\n  if not hasattr(RLConfig, 'use_mrope'):\n    RLConfig.use_mrope = False\n  if not hasattr(RLConfig, 'mrope_section'):\n    RLConfig.mrope_section = [24, 20, 20]\n  if not hasattr(RLConfig, 'position_id_per_seconds'):\n    RLConfig.position_id_per_seconds = 25\nEOF\nsed -i 's/mrope_section=config.mrope_section/mrope_section=getattr(config, \"mrope_section\", [24, 20, 20])/g; s/mrope_section=cfg.mrope_section/mrope_section=getattr(cfg, \"mrope_section\", [24, 20, 20])/g' /deps/src/maxtext/models/qwen3.py 2>/dev/null || true\n\n# --- Faithful HF -> MaxText conversion of the RAW google/gemma-4-E2B-it (instruct) ---\n# Guarded: SKIPS because gemma4-e2b-it-fresh/0/items already exists (built by the g4cvp\n# probe). Kept here so the run is self-contained/reproducible. Sanitizes base.yml (which\n# carries the RL-only key max_seq_token_per_tpu the converter's MaxTextConfig rejects).\nCKPT_IT=gs://ubench-logs/alisachen-tpu7x/ckpt/gemma4-e2b-it-fresh\nif gsutil ls \"${CKPT_IT}/0/items/\" >/dev/null 2>&1; then\n  echo \"[convert] ${CKPT_IT}/0/items present; skipping conversion\"\nelse\n  BASE_YML=maxtext/configs/base.yml\n  [ -f \"$BASE_YML\" ] || BASE_YML=src/maxtext/configs/base.yml\n  SAN=/tmp/base_for_conv.yml\n  cp \"$BASE_YML\" \"$SAN\" && sed -i '/max_seq_token_per_tpu/d' \"$SAN\"\n  echo \"[convert] START google/gemma-4-E2B-it -> ${CKPT_IT} at $(date)\"\n  JAX_PLATFORMS=cpu python3 -m maxtext.checkpoint_conversion.to_maxtext \\\n    $SAN \\\n    model_name=gemma4-e2b \\\n    base_output_directory=${CKPT_IT} \\\n    hardware=cpu \\\n    scan_layers=False \\\n    use_multimodal=false \\\n    skip_jax_distributed_system=True \\\n    --lazy_load_tensors=True \\\n    --hf_model_path=google/gemma-4-E2B-it \\\n    --simulated_cpu_devices_count=16 \\\n    checkpoint_storage_use_ocdbt=False \\\n    checkpoint_storage_use_zarr3=False\n  CONV_RC=$?\n  echo \"[convert] DONE exit=${CONV_RC} at $(date)\"\n  if [ \"${CONV_RC}\" -ne 0 ]; then echo \"[convert] FAILED; aborting\"; exit ${CONV_RC}; fi\nfi\n\n# --- Main Execution ---\n(\n  export ENABLE_PATHWAYS_PERSISTENCE='1'\n  export JAX_PLATFORMS=\"${JAX_PLATFORMS:-proxy,cpu}\"\n  export ENABLE_PJRT_COMPATIBILITY='true'\n  # NOTE: XLA flags are NOT set here. Under JAX_PLATFORMS=proxy the client owns\n  # no TPU, so LIBTPU_INIT_ARGS would be inert. They are passed as argv to the\n  # pathways-proxy container instead (upstream: --custom-pathways-proxy-server-args).\n\n  # continue-decode is ENABLED with max_decode_steps=128 (Magellan's value; every prior\n  # CD run of ours silently used DEFAULT_MAX_DECODE_STEPS = 10). This depends on\n  # patch_cd_proper.py (PR #3374) having applied -- without it the fused loop raises\n  # \"compiler_options can only be passed to top-level jax.jit\" on this image.\n  python3 -m maxtext.trainers.post_train.rl.train_rl \"${MAXTEXT_CONFIG_PATH}\" \\\n    model_name='gemma4-e2b' \\\n    tokenizer_path='google/gemma-4-E2B-it' \\\n    dataset_name='openai/gsm8k' \\\n    dataset_processor_path=/workload/patches/gemma_data_parity_native.py \\\n    hf_train_files='hf://datasets/openai/gsm8k/main/train-*.parquet' \\\n    train_split='train' \\\n    rl.num_generations=16 \\\n    rl.grpo_beta=0.0 \\\n    rl.grpo_epsilon=0.2 \\\n    rl.epsilon_high=0.28 \\\n    checkpoint_storage_use_ocdbt=False \\\n    async_scheduling=False \\\n    math_verify_num_procs=64 \\\n    chips_per_vm=8 \\\n    local_sa_block_q=512 \\\n    local_sa_block_kv=512 \\\n    local_sa_block_kv_compute=512 \\\n    local_sa_block_q_dkv=512 \\\n    local_sa_block_kv_dkv=512 \\\n    local_sa_block_kv_dkv_compute=512 \\\n    local_sa_block_q_dq=512 \\\n    local_sa_block_kv_dq=512 \\\n    local_sa_use_fused_bwd_kernel=false \\\n    local_sa_q_layout=HEAD_DIM_MINOR \\\n    local_sa_k_layout=HEAD_DIM_MINOR \\\n    local_sa_v_layout=HEAD_DIM_MINOR \\\n    local_sa_fuse_reciprocal=true \\\n    local_sa_use_base2_exp=true \\\n    eval_local_sa_block_q=512 \\\n    eval_local_sa_block_kv=512 \\\n    eval_local_sa_block_kv_compute=512 \\\n    eval_local_sa_q_layout=HEAD_DIM_MINOR \\\n    eval_local_sa_k_layout=HEAD_DIM_MINOR \\\n    eval_local_sa_v_layout=HEAD_DIM_MINOR \\\n    num_batches=20 \\\n    free_kv_cache_during_weight_sync=false \\\n    vllm_block_size=128 \\\n    num_test_batches=11 \\\n    debug=True \\\n    profiler=xplane \\\n    skip_first_n_steps_for_profiler=100 \\\n    profiler_steps=1 \\\n    gradient_clipping_threshold=1.0 \\\n    decode_sampling_temperature=1.0 \\\n    decode_sampling_top_k=-1 \\\n    decode_sampling_nucleus_p=1.0 \\\n    max_target_length=8704 \\\n    kv_cache_buffer=8704 \\\n    max_prefill_predict_length=512 \\\n    learning_rate=2e-6 \\\n    eval_dataset_name='openai/gsm8k' \\\n    hf_eval_files='hf://datasets/openai/gsm8k/main/test-*.parquet' \\\n    eval_split='test' \\\n    reward_functions_path=/workload/patches/reward_parity_boxed.py \\\n    reward_functions='compute_score' \\\n    rl.loss_agg_mode=token-mean \\\n    eval_interval=20 \\\n    eval_sampling_strategy='greedy' \\\n    eval_batch_size=128 \\\n    lr_schedule_type='cosine' \\\n    weight_dtype=float32 \\\n    mu_dtype=float32 \\\n    num_epoch=5 \\\n    learning_rate_schedule_steps=250 \\\n    warmup_steps_fraction=0.04 \\\n    learning_rate_final_fraction=0.0 \\\n    adam_b1=0.9 \\\n    adam_b2=0.999 \\\n    adam_eps=1e-8 \\\n    adam_weight_decay=0.0 \\\n    batch_size=128 \\\n    train_micro_batch_size=8 \\\n    rollout_micro_batch_size=128 \\\n    data_shuffle_seed=42 \\\n    init_weights_seed=42 \\\n    trainer_devices_fraction=1.0 \\\n    sampler_devices_fraction=1.0 \\\n    rollout_data_parallelism=128 \\\n    rollout_tensor_parallelism=1 \\\n    enable_dp_attention=false \\\n    hbm_utilization_vllm=0.3 \\\n    max_num_seqs=256 \\\n    max_num_batched_tokens=33280 \\\n    scan_layers=False \\\n    allow_split_physical_axes=True \\\n    vllm_hf_overrides='{architectures: [\"MaxTextForCausalLM\"]}' \\\n    attention='flash' \\\n    allow_split_physical_axes=True \\\n    enable_tunix_perf_metrics=True \\\n    checkpoint_period=20 \\\n    max_num_checkpoints_to_keep=1000 \\\n    enable_checkpointing=true \\\n    load_parameters_path='gs://ubench-logs/alisachen-tpu7x/ckpt/gemma4-e2b-it-fresh/0/items' \\\n    skip_jax_distributed_system=True \\\n    vllm_additional_config='{\"enable_continue_decode\": true, \"max_decode_steps\": 1024, \"maxtext_config\": {\"model_name\": \"gemma4-e2b\", \"model_call_mode\": \"inference\", \"log_config\": false, \"weight_dtype\": \"bfloat16\", \"allow_split_physical_axes\": true}}' \\\n    base_output_directory=${ARTIFACT_DIR} \\\n    run_name=${JOB_IDENTIFIER}\n) & PID=$!\n\nwait $PID\nEXIT_CODE=$?\n\necho \"MaxText Job Ended at: $(date) with exit code $EXIT_CODE\"\nexit $EXIT_CODE"
kind: ConfigMap
metadata:
  name: g4p8k20-launcher
  namespace: ubench-regression-tests
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: "g4p8k20"
  namespace: ubench-regression-tests
  labels:
    kueue.x-k8s.io/queue-name: "multislice-queue"
spec:
  coordinator:
    replicatedJob: pathways-head
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  failurePolicy:
    maxRestarts: 3
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - pathways-head
  replicatedJobs:
  - name: pathways-head
    replicas: 1
    template:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: "multislice-queue"
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              kueue.x-k8s.io/podset: pathways-head
              kueue.x-k8s.io/queue-name: "multislice-queue"
            annotations:
              kubectl.kubernetes.io/default-container: jax-tpu
              gke-gcsfuse/volumes: "true"
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-nodepool: "cpu-np"
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchExpressions:
                      - key: jobset.sigs.k8s.io/replicatedjob-name
                        operator: In
                        values: ["pathways-head"]
            containers:
            - name: jax-tpu
              image: "gcr.io/supercomputer-testing/maxtext-rl-ironwood@sha256:4dc6ca720017bf93b6bae9524519cf5b7a8b16706ca6aab2a355af26d75a6bf3"
              command:
              - bash
              - -c
              - |
                echo Pathways Helm Start: $(date);
                _sigterm() (kill -SIGTERM $! 2>/dev/null;);
                trap _sigterm SIGTERM;
                echo "Executing payload from /workload/launcher/launch-workload.sh..."
                ( bash /workload/launcher/launch-workload.sh ) & PID=$!;
                while kill -0 $PID 2>/dev/null;
                    do sleep 5;
                done;
                wait $PID;
                EXIT_CODE=$?;
                echo Pathways Helm End: $(date);
                echo EXIT_CODE=$EXIT_CODE;
                exit $EXIT_CODE
              env:
              - name: JAX_PLATFORMS
                value: "proxy,cpu"
              - name: PATHWAYS_HEAD
                value: "g4p8k20-pathways-head-0-0.g4p8k20"
              - name: JAX_BACKEND_TARGET
                value: grpc://g4p8k20-pathways-head-0-0.g4p8k20:29140
              - name: JOB_IDENTIFIER
                value: "g4p8k20"
              - name: ARTIFACT_DIR
                value: "gs://ubench-logs"
              - name: JAX_COMPILATION_CACHE_DIR
                value: "gs://ubench-logs/compilation_cache/qwen3-0.6b/rl_repro_jax_tpu7x_20260730"
              - name: SKIP_JAX_PRECOMPILE
                value: "1"
              resources:
                requests:
                  cpu: "28"
                  memory: 130G
                limits:
                  cpu: "44"
                  memory: 170G
              securityContext:
                privileged: true
              volumeMounts:
              - name: workload-launcher
                mountPath: /workload/launcher
              - name: workload-patches
                mountPath: /workload/patches
              - name: shared-tmp
                mountPath: /tmp
            initContainers:
            - name: pathways-rm
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20261028-jax_0.11.0"
              restartPolicy: Always
              env:
              - name: HOST_ADDRESS
                value: "g4p8k20-pathways-head-0-0.g4p8k20"
              args:
              - --server_port=29141
              - --node_type=resource_manager
