apiVersion: v1
data:
  gemma_data.py: "\"\"\"gemma4 line: custom process_data v2 (dataset_processor_path hook). EMPIRICAL findings driving this design:\n(1) the checkpoint outputs garbage under the canonical gemma-4 <|turn> markers (ids 105/106 are effectively untrained for it),\n(2) it answers math correctly under gemma-3-STYLE textual markers (<start_of_turn>... \u2014 7 BPE pieces each, NOT special tokens\nin this tokenizer; teammate's 39/39-verified smoke used exactly that), so this builder renders the gemma-3-style prompt\nMANUALLY (single wrap, no apply_chat_template; no literal <bos> \u2014 tunix's tokenize() lets the tokenizer add bos).\nConsequence: there is no single-token turn terminator; sequences stop only at <eos> (id 1) or the cap \u2014 truncation is part of\nthe gemma contract (cap chosen from the measured OSL distribution).\"\"\"\nimport json\n\nSYSTEM_PROMPT = (\"You are given a problem. Think about the problem and provide your reasoning. Place it between \"\n                 \"<reasoning> and </reasoning>. Then, provide the final answer (i.e., just one numerical value) \"\n                 \"between <answer> and </answer>.\")\n_PRINTED = [False]\n\ndef _s(v):\n    return v.decode(\"utf-8\") if isinstance(v, bytes) else str(v)\n\ndef process_data(dataset_name, model_tokenizer, template_config, tmvp_config, x):\n    from maxtext.trainers.post_train.rl import utils_rl\n    for key in (\"problem\", \"prompt\", \"question\"):\n        if key in x:\n            question = _s(x[key]); break\n    for key in (\"answer\", \"solution\", \"expected_answer\"):\n        if key in x:\n            answer = _s(x[key]); break\n    qt = _s(x[\"question_type\"]) if \"question_type\" in x else \"default\"\n    processed_answer = utils_rl.process_answer(question, answer, qt)\n    prompt = f\"<start_of_turn>user\\n{SYSTEM_PROMPT}\\n\\n{question}<end_of_turn>\\n<start_of_turn>model\\n\"\n    if not _PRINTED[0]:\n        print(\"GEMMA-PROMPT %r\" % prompt[:300], flush=True)\n        _PRINTED[0] = True\n    return {\"prompts\": prompt, \"question\": question, \"answer\": json.dumps(processed_answer)}"
  patch_approx_topk.py: "\"\"\"APPROX-TOPK: replace the sampler's top-k masking (tpu_inference topk_mask = 32\nbinary-search reductions over the 262k vocab) with jax.lax.approx_max_k. Microbenched\n~2x faster than topk_mask at the decode batch with 0.000% kept-diff at recall 0.99\n(identical nucleus set -> reward-exact). Env-gated by APPROX_TOPK=1 (APPROX_TOPK_K sets the\nstatic candidate count, default 64 >= our top_k=50). Per-row top_k honored via gather of the\nrow's k-th approx value as the threshold. Fail-open with banner.\n\"\"\"\nimport os, sys\n\n\ndef fail(m):\n    print(f\"APPROX-TOPK PATCH: FAILED {m}\", flush=True)\n    sys.exit(0)  # non-fatal: let the run start so the failure is visible\n\n\ntry:\n    import tpu_inference\n    ROOT = os.path.dirname(tpu_inference.__file__)\nexcept Exception as e:\n    fail(f\"cannot import tpu_inference: {e}\")\n\nP = os.path.join(ROOT, \"layers/jax/sample/sampling.py\")\nif not os.path.exists(P):\n    fail(f\"{P} not found\")\nsrc = open(P).read()\nif \"APPROX-TOPK\" in src:\n    print(\"APPROX-TOPK PATCH: already applied\", flush=True)\n    sys.exit(0)\n\nOLD = \"    topk_masked = topk_mask(logits, top_k, replace_val=-1e12)\\n\"\nif src.count(OLD) != 1:\n    fail(f\"anchor count {src.count(OLD)} != 1\")\n\nNEW = (\n    \"    # APPROX-TOPK: approx_max_k replaces 32-reduction topk_mask (~2x, 0% kept-diff @recall 0.99)\\n\"\n    \"    import os as _ax_os\\n\"\n    \"    if _ax_os.environ.get('APPROX_TOPK') == '1':\\n\"\n    \"      _ax_k = int(_ax_os.environ.get('APPROX_TOPK_K', '64'))\\n\"\n    \"      _ax_vals, _ax_idx = jax.lax.approx_max_k(logits, _ax_k, recall_target=0.99)\\n\"\n    \"      _ax_sorted = jnp.flip(jnp.sort(_ax_vals, axis=-1), axis=-1)\\n\"\n    \"      _ax_ki = jnp.clip(top_k - 1, 0, _ax_k - 1)\\n\"\n    \"      _ax_thr = jnp.take_along_axis(_ax_sorted, _ax_ki[:, None], axis=1)\\n\"\n    \"      topk_masked = jnp.where(logits >= _ax_thr, logits, jnp.float32(-1e12))\\n\"\n    \"    else:\\n\"\n    \"      topk_masked = topk_mask(logits, top_k, replace_val=-1e12)\\n\"\n)\nsrc = src.replace(OLD, NEW, 1)\ntry:\n    compile(src, P, \"exec\")\nexcept SyntaxError as e:\n    fail(f\"does not compile: {e}\")\nopen(P, \"w\").write(src)\nprint(\"APPROX-TOPK PATCH: APPLIED\", flush=True)\n"
  patch_block_size.py: "\"\"\"BLOCK-SIZE runtime patch: pin the vLLM KV block (page) size via env VLLM_BLOCK_SIZE.\n\nWHY (runs 22/23, 2026-08-21): tpu_inference auto-picks the KV page size from the\nengine shape (get_page_size/get_min_page_size in platforms/tpu_platform.py).\n16b/21/22b ran with block 128; run 22 (max_model_len 12544) got 32 and run 23\n(TP4xDP32) got 64 -- and exactly those two runs shifted generation (step-0\ntruncation 29%/28% vs 23%, longer completions, rewards unchanged). Pinning the\nblock size removes that confound so engine-shape experiments stay contract-valid.\n\nWHAT: in tunix/generate/vllm_sampler.py::VllmSampler._vllm_config, add\n`args[\"block_size\"] = int(os.environ[\"VLLM_BLOCK_SIZE\"])` when the env is set\n(vLLM then marks cache_config.user_specified_block_size and tpu_inference skips\nits heuristic). Fail-open with banner.\n\"\"\"\nimport os, sys\ndef fail(m):\n    print(f\"BLOCK-SIZE PATCH: FAILED {m}\", flush=True); sys.exit(0)\ntry:\n    import tunix\n    ROOT = os.path.dirname(tunix.__file__)\nexcept Exception as e:\n    fail(f\"cannot import tunix: {e}\")\nP = os.path.join(ROOT, \"generate/vllm_sampler.py\")\nsrc = open(P).read()\nif \"_BLOCK_SIZE_PIN\" in src:\n    print(\"BLOCK-SIZE PATCH: already applied\", flush=True); sys.exit(0)\nOLD = '    args[\"gpu_memory_utilization\"] = config.hbm_utilization\\n'\nif src.count(OLD) != 1:\n    fail(f\"anchor count {src.count(OLD)} != 1\")\nNEW = OLD + ('    # _BLOCK_SIZE_PIN: pin the KV page size so engine-shape changes do not\\n'\n             '    # silently change it (and with it the generation contract).\\n'\n             '    import os as _bs_os\\n'\n             '    if _bs_os.environ.get(\"VLLM_BLOCK_SIZE\"):\\n'\n             '      args[\"block_size\"] = int(_bs_os.environ[\"VLLM_BLOCK_SIZE\"])\\n'\n             '      print(f\"BLOCK-SIZE: pinned vLLM block_size={args[\\'block_size\\']}\", flush=True)\\n')\nNEW += ('    if _bs_os.environ.get(\"VLLM_PREFIX_CACHING\") == \"0\":\\n'\n        '      args[\"enable_prefix_caching\"] = False\\n'\n        '      print(\"PREFIX-CACHE: disabled via VLLM_PREFIX_CACHING=0\", flush=True)\\n')\nsrc = src.replace(OLD, NEW, 1)\ntry:\n    compile(src, P, \"exec\")\nexcept SyntaxError as e:\n    fail(f\"does not compile: {e}\")\nopen(P, \"w\").write(src)\nprint(\"BLOCK-SIZE PATCH: APPLIED\", flush=True)"
  patch_cd_masking.py: "\"\"\"Continuous-batching decode window v2: no EOS early-exit AND inert masked slots.\n\nSUPERSEDES patch_cd_masking.py (contains both edits; do not apply v1).\n\nWHY v2 EXISTS. Runs 10-10f established, with per-request runtime evidence:\n- the deep window works mechanically (full depth, EOS recorded/extracted,\n  every EOS-ending request retires; zombies=0, empty=0, inv=0);\n- yet sequences stop terminating in proportion to window depth\n  (capped-at-8192: 24.0% stock / 35.7% depth-32 / 54.0-54.5% depth-128,\n  3 replications each at step 0 with byte-identical prompts);\n- the failing population is per-sequence random, not rank- or\n  movement-clustered, and zero vLLM preemptions occurred.\n\nThe one remaining device-side channel that scales with masked iterations:\nafter a sequence samples EOS, `_update_loop_state` re-feeds it\n`padding_token_id` at a FROZEN position. Every subsequent iteration the model\nrecomputes that slot and WRITES PAD-DERIVED K/V AT THE FROZEN POSITION --\noverwriting the KV of the sequence's last real token, once per masked\niteration. Stock never executes a single masked step (interval=1 exits the\nwindow first), so this write path is unexercised in production.\n\nTHE FIX (edit 2): re-feed the slot's CURRENT input token instead of PAD.\nSame token, same frozen position, same context => the recomputed K/V is\nIDENTICAL to what is already stored: the write becomes idempotent and the\nmasked slot provably inert. One line in `_run_one_step`:\n\n    next_input_ids = jnp.where(new_active_mask, next_input_ids, ct)\n\n(active rows keep next_tokens; masked rows repeat their last input forever).\n`step_record_tokens` still records PAD for masked rows, so host extraction is\nunchanged. DP-padding rows already re-feed their initial token 0 at a frozen\nposition -- also idempotent.\n\nEdit 1 (unchanged from v1): cond_fn exits on window exhausted OR all done,\ninstead of breaking the fused loop on any EOS:\n\n    return jnp.logical_and(i < max_decode_steps, jnp.any(active_mask))\n\nIf truncation at depth 128 returns to ~24% with this patch, the PAD-KV\noverwrite was the poison and the full rollout win (~45 s/step measured in\nrun 10c: ~1.3 s per 128-iteration window) unlocks. If it stays ~54%, the\nfault is inside the attention kernel's handling of mixed frozen/advancing\nmetadata, and this escalates upstream with the full evidence chain.\n\nFAIL-OPEN. Any anchor mismatch prints FAILED and exits 0.\nPrints exactly one of:\n    CD-MASK2 PATCH: APPLIED\n    CD-MASK2 PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tpu_inference\"\nDL = os.path.join(ROOT, \"runner/decode_loop.py\")\n\n\ndef fail(msg):\n    print(f\"CD-MASK2 PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nif not os.path.exists(DL):\n    fail(f\"{DL} not found\")\nsrc = open(DL, encoding=\"utf-8\").read()\n\nif \"_CD_MASK2\" in src:\n    print(\"CD-MASK2 PATCH: already patched\")\n    sys.exit(0)\nif \"_CD_MASK_NO_EARLY_EXIT\" in src:\n    fail(\"v1 masking already applied; image should be fresh per pod\")\n\n# ---- Edit 1: cond_fn (structural: def -> next def at same indent) ----------\nlines = src.splitlines(keepends=True)\nstart = None\nfor i, ln in enumerate(lines):\n    if ln.strip().startswith(\"def cond_fn(carry):\"):\n        if start is not None:\n            fail(\"multiple cond_fn definitions\")\n        start = i\nif start is None:\n    fail(\"cond_fn not found\")\nindent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]\nend = None\nfor j in range(start + 1, len(lines)):\n    s = lines[j]\n    if s.strip() and not s.startswith(indent + \" \") and s.startswith(indent) \\\n            and s.lstrip().startswith(\"def \"):\n        end = j\n        break\nif end is None:\n    fail(\"could not find the def following cond_fn\")\n\nNEW_COND = (\n    f\"{indent}def cond_fn(carry):\\n\"\n    f\"{indent}    # _CD_MASK2 -- continuous-batching semantics: run the window to\\n\"\n    f\"{indent}    # its static depth (or until every sequence is done) instead of\\n\"\n    f\"{indent}    # breaking the fused loop on any EOS.\\n\"\n    f\"{indent}    _cd = _unpack(carry)\\n\"\n    f\"{indent}    _cd_i = _cd[0]\\n\"\n    f\"{indent}    _cd_active = _cd[2]\\n\"\n    f\"{indent}    # _CD_NOGLOBAL: no jnp.any(active) here -- it is a cross-DP\\n\"\n    f\"{indent}    # all-reduce every iteration (profile run 48: 137us/step).\\n\"\n    f\"{indent}    return _cd_i < max_decode_steps\\n\"\n    f\"\\n\")\nsrc = \"\".join(lines[:start]) + NEW_COND + \"\".join(lines[end:])\n\n# ---- Edit 2: idempotent masked-slot re-feed in _run_one_step ---------------\nANCHOR = \"\"\"        lp_ids_step = None\n        lp_val_step = None\n        lp_ranks_step = None\n        if has_logprobs:\"\"\"\nif src.count(ANCHOR) != 1:\n    fail(f\"_run_one_step anchor count={src.count(ANCHOR)}\")\nINSERT = \"\"\"        # _CD_MASK2 -- inert masked slots. v1 re-fed padding_token_id at a\n        # frozen position, so each masked iteration OVERWROTE the slot's last\n        # real KV with PAD-derived KV. Re-feeding the slot's current input\n        # token instead makes the recomputed K/V identical to what is stored:\n        # the write is idempotent and the masked slot provably inert.\n        next_input_ids = jnp.where(new_active_mask, next_input_ids, ct)\n\n\"\"\"\nsrc = src.replace(ANCHOR, INSERT + ANCHOR)\n\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(DL, \"w\", encoding=\"utf-8\").write(src)\n\nv = open(DL, encoding=\"utf-8\").read()\nproblems = []\nif v.count(\"_CD_MASK2\") < 2:\n    problems.append(\"markers missing\")\nif \"should_check_eos\" in v.split(\"def body_fn\")[0].split(\"def cond_fn\")[1]:\n    problems.append(\"old cond_fn body still present\")\nif \"jnp.where(new_active_mask, next_input_ids, ct)\" not in v:\n    problems.append(\"re-feed line missing\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    problems.append(f\"reparse failed: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"CD-MASK2 PATCH: APPLIED\")"
  patch_cd_noglobal.py: "\"\"\"Remove the per-iteration global (cross-DP) scalar reduction `any_hit_eos` from\nthe fused decode loop body (decode_loop.py::_update_loop_state). With our CD masking\n(EOS check interval <= 0) the carried eos_flag is never consulted by cond_fn, yet the\nreduction still runs every iteration as an all-reduce over all 128 devices\n(profile run 48: all-reduce.127 = 216us/step). Companion of the cond_fn edit in\npatch_cd_masking (_CD_NOGLOBAL). Prints CD-NOGLOBAL PATCH: APPLIED | FAILED.\"\"\"\nimport sys\nP = \"/usr/local/lib/python3.12/site-packages/tpu_inference/runner/decode_loop.py\"\ns = open(P).read()\nold = \"    any_hit_eos = jnp.any(jnp.logical_and(active_mask, is_eos))\\n\"\nif \"_CD_NOGLOBAL_BODY\" in s:\n    print(\"CD-NOGLOBAL PATCH: already applied\", flush=True); sys.exit(0)\nif s.count(old) != 1:\n    print(\"CD-NOGLOBAL PATCH: FAILED anchor count %d\" % s.count(old), flush=True); sys.exit(0)\ns = s.replace(old, \"    any_hit_eos = jnp.array(False)  # _CD_NOGLOBAL_BODY: cross-DP reduce removed (unused under CD masking)\\n\")\ncompile(s, P, \"exec\"); open(P, \"w\").write(s)\nprint(\"CD-NOGLOBAL PATCH: APPLIED\", flush=True)"
  patch_cd_report.py: "\"\"\"Report each sequence's real newest token, not the window's last row.\n\nTHE BUG THIS FIXES (diagnosed from run 10, which was VOID because of it).\n\ntpu_runner.py tells the host what each sequence's newest token is by reading ONE row\nof the fused window's token buffer -- the window's last:\n\n    last_step_idx = clip(final_state.step_counter - 1, 0, static_max_decode_steps - 1)\n    next_tokens_in_tpu = generated_tokens[last_step_idx, arange(batch)]\n\nThat is only correct because the window STOPS IMMEDIATELY after any sequence emits EOS.\n`any_hit_eos` is therefore not a performance heuristic -- it is load-bearing for\ncorrectness, and the single-row protocol is why the break has to be global rather than\nper-sequence.\n\nOnce the window keeps running (patch_cd_masking.py), a sequence that finishes mid-window\nis masked for the remaining iterations and `step_record_tokens` writes padding:\n\n    rows:  [t0 t1 t2 t3 t4 EOS PAD PAD ... PAD]\n                            ^              ^\n                       correct        what the host reads\n\nSo the host sees a padding token, concludes the sequence is still generating, never\nretires it, and RE-SEEDS the next window from a padding token. The model happily\ncontinues from that seed, producing fluent text that never terminates. Measured on\nrun 10: OSL 3750 -> 5700, truncation 25% -> 58%, reward 0.146 -> 0.053.\n\nTermination becomes a lottery -- a sequence only ends if its EOS happens to land on the\nwindow's final row.\n\nTHE FIX. Take each sequence's LAST NON-PADDING row instead of the window's last row.\nThe buffer contents are untouched; only the derivation of \"newest token\" changes.\n\n    real   = (generated_tokens != pad_token_id) & (row < step_counter)\n    last   = max over rows of (row where real else 0)\n    tokens = generated_tokens[last, arange(batch)]\n\nTHIS ALSO EXPLAINS A RESULT WE FILED WRONGLY. `CONTINUE_DECODE_EOS_CHECK_INTERVAL=8`\nwas measured 3x SLOWER (02-cdint8: ~2157 s vs 719.2 s) and recorded in FINDINGS as\n\"holding the loop prevents the scheduler retiring finished sequences, so useful work per\niteration collapses\". That is the SAME BUG in milder form: at interval 8, a sequence\nemitting EOS at iteration 2 is masked through iteration 7, so row 7 is padding and the\nhost misses the EOS exactly as above. The lever was never inherently bad -- it hit this\nreporting bug. Fixing the report should revive it AND max_decode_steps together.\n\nORDERING. Independent of patch_cd_masking.py (different file), but pointless without it.\n\nFAIL-OPEN. Any anchor mismatch prints FAILED and exits 0.\nPrints exactly one of:\n    CD-REPORT PATCH: APPLIED\n    CD-REPORT PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport re\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tpu_inference\"\nTR = os.path.join(ROOT, \"runner/tpu_runner.py\")\n\n\ndef fail(msg):\n    print(f\"CD-REPORT PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nif not os.path.exists(TR):\n    fail(f\"{TR} not found\")\nsrc = open(TR, encoding=\"utf-8\").read()\n\nif \"_CD_REPORT_LAST_REAL_TOKEN\" in src:\n    print(\"CD-REPORT PATCH: already patched\")\n    sys.exit(0)\n\nfor name in (\"self.pad_token_id\", \"self.static_max_decode_steps\",\n             \"def _execute_continue_decode\"):\n    if name not in src:\n        fail(f\"expected '{name}' not present in tpu_runner.py\")\n\n# Whitespace-tolerant: match the two statements as one block.\nPAT = re.compile(\n    r\"^([ \\t]*)last_step_idx\\s*=\\s*jnp\\.clip\\(\\s*final_state\\.step_counter\\s*-\\s*1,.*?\\)\\s*\\n\"\n    r\"[ \\t]*next_tokens_in_tpu\\s*=\\s*generated_tokens\\[\\s*\\n?\"\n    r\"[ \\t]*last_step_idx,\\s*\\n?\"\n    r\"[ \\t]*jnp\\.arange\\(generated_tokens\\.shape\\[1\\]\\)\\]\\s*\\n\",\n    re.M | re.S)\nm = PAT.search(src)\nif not m:\n    fail(\"could not match the last_step_idx / next_tokens_in_tpu block\")\nif len(PAT.findall(src)) != 1:\n    fail(f\"block matched {len(PAT.findall(src))} times, expected 1\")\nind = m.group(1)\n\nNEW = (\n    f\"{ind}# _CD_REPORT_LAST_REAL_TOKEN -- see patch_cd_report.py.\\n\"\n    f\"{ind}# Reading ONE row (the window's last) is only correct when the window\\n\"\n    f\"{ind}# stops right after an EOS. With a continuous-batching window a finished\\n\"\n    f\"{ind}# sequence has PADDING in that row, so the host misses its EOS, never\\n\"\n    f\"{ind}# retires it, and re-seeds it from a padding token. Take each sequence's\\n\"\n    f\"{ind}# last NON-PADDING row instead. Buffer contents are untouched.\\n\"\n    f\"{ind}_cd_nsteps = jnp.clip(final_state.step_counter, 1,\\n\"\n    f\"{ind}                      self.static_max_decode_steps)\\n\"\n    f\"{ind}_cd_rows = jnp.arange(generated_tokens.shape[0])[:, None]\\n\"\n    f\"{ind}_cd_real = jnp.logical_and(\\n\"\n    f\"{ind}    generated_tokens != self.pad_token_id,\\n\"\n    f\"{ind}    _cd_rows < _cd_nsteps)\\n\"\n    f\"{ind}_cd_last = jnp.max(jnp.where(_cd_real, _cd_rows, 0), axis=0)\\n\"\n    f\"{ind}next_tokens_in_tpu = generated_tokens[\\n\"\n    f\"{ind}    _cd_last,\\n\"\n    f\"{ind}    jnp.arange(generated_tokens.shape[1])]\\n\")\n\nsrc = src[:m.start()] + NEW + src[m.end():]\n\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(TR, \"w\", encoding=\"utf-8\").write(src)\n\nv = open(TR, encoding=\"utf-8\").read()\nproblems = []\nif \"_CD_REPORT_LAST_REAL_TOKEN\" not in v:\n    problems.append(\"marker missing\")\nif \"last_step_idx\" in v:\n    problems.append(\"old last_step_idx still referenced\")\nif v.count(\"next_tokens_in_tpu = generated_tokens[\") != 1:\n    problems.append(\"next_tokens_in_tpu assignment count wrong\")\nif \"_cd_last\" not in v:\n    problems.append(\"new gather missing\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    problems.append(f\"reparse failed: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"CD-REPORT PATCH: APPLIED\")"
  patch_fast_extract.py: "\"\"\"ROUND 4: fast extract_answer + reward-phase timers. utils_rl.extract_answer scans every completion char by\nchar and slices content[:op] (a ~15 KB copy) on every '}' -- O(len x braces) per completion, x2048 per step: this\nis the ~3 s compute_rewards phase. Replacement: locate each '\\\\boxed{' with str.find and balance braces only inside\nit; returns the match whose closing brace is last (same semantics as the stack version). Mode env\nFAST_EXTRACT=verify8 (default): fast result used, every 8th item cross-checked against the original and counted.\nPrints FAST-EXTRACT n=.. mismatch=.. t_fast=.. t_orig=.. and REWARD-T fn=.. s=.. n=.. per reward call.\"\"\"\nimport sys\nP = \"/deps/src/maxtext/trainers/post_train/rl/utils_rl.py\"\ns = open(P).read()\nif \"_FAST_EXTRACT\" in s: print(\"FAST-EXTRACT PATCH: already applied\", flush=True); sys.exit(0)\nfor name in (\"def extract_answer(\", \"def check_numbers(\", \"def match_format_exactly(\", \"def match_format_approximately(\", \"def math_verify_func(\"):\n    if s.count(name) != 1: print(\"FAST-EXTRACT PATCH: FAILED anchor %s %d\" % (name, s.count(name)), flush=True); sys.exit(0)\ns += r'''\n\n# --- _FAST_EXTRACT ----------------------------------------------------------------\nimport os as _fe_os, time as _fe_time\n_fe_orig_extract_answer = extract_answer\n_FE = {\"n\": 0, \"checked\": 0, \"mismatch\": 0, \"t_fast\": 0.0, \"t_orig\": 0.0}\n_FE_MODE = _fe_os.environ.get(\"FAST_EXTRACT\", \"verify8\")\n\ndef _fe_fast(response, tmvp_config):\n    answer_tag_regex = get_answer_fallback_regex(tmvp_config)\n    answer_matches = answer_tag_regex.findall(response)\n    content = answer_matches[-1] if answer_matches else response\n    best = None; best_close = -1; n = len(content)\n    pos = content.find(\"\\\\boxed{\")\n    while pos != -1:\n        op = pos + 6; depth = 0; i = op\n        while i < n:\n            ch = content[i]\n            if ch == \"{\":\n                depth += 1\n            elif ch == \"}\":\n                depth -= 1\n                if depth == 0:\n                    break\n            i += 1\n        if i < n and i > best_close:\n            best_close = i; best = content[op + 1:i].strip()\n        pos = content.find(\"\\\\boxed{\", pos + 1)\n    if best is not None:\n        return best\n    m = re.search(r\"\\\\boxed\\s*\\{?\\s*([a-zA-Z0-9\\.,\\-]+)\\s*\\}?\", content)\n    if m:\n        return m.group(1).strip()\n    fallback_matches = answer_tag_regex.findall(response)\n    if fallback_matches:\n        return fallback_matches[-1].strip()\n    return FALLBACK_ANSWER\n\ndef extract_answer(response, tmvp_config):  # noqa: F811  (_FAST_EXTRACT)\n    if _FE_MODE == \"orig\":\n        return _fe_orig_extract_answer(response, tmvp_config)\n    t0 = _fe_time.perf_counter(); r = _fe_fast(response, tmvp_config); _FE[\"t_fast\"] += _fe_time.perf_counter() - t0\n    _FE[\"n\"] += 1\n    if _FE_MODE == \"verify8\" and _FE[\"n\"] % 8 == 0:\n        t0 = _fe_time.perf_counter(); o = _fe_orig_extract_answer(response, tmvp_config); _FE[\"t_orig\"] += _fe_time.perf_counter() - t0\n        _FE[\"checked\"] += 1\n        if o != r:\n            _FE[\"mismatch\"] += 1\n            if _FE[\"mismatch\"] <= 5:\n                print(\"FAST-EXTRACT MISMATCH fast=%r orig=%r\" % (r[:80], o[:80]), flush=True)\n            r = o\n    if _FE[\"n\"] % 2048 == 0:\n        print(\"FAST-EXTRACT n=%d checked=%d mismatch=%d t_fast=%.3f t_orig(x8 est)=%.3f\" % (\n            _FE[\"n\"], _FE[\"checked\"], _FE[\"mismatch\"], _FE[\"t_fast\"], _FE[\"t_orig\"] * 8), flush=True)\n    return r\n\ndef _fe_timed(name, fn):\n    def w(*a, **k):\n        t0 = _fe_time.perf_counter(); r = fn(*a, **k)\n        n = len(a[1]) if len(a) > 1 and hasattr(a[1], \"__len__\") else (len(k.get(\"completions\", [])) if \"completions\" in k else len(a[0]) if a and hasattr(a[0], \"__len__\") else -1)\n        print(\"REWARD-T fn=%s s=%.3f n=%d\" % (name, _fe_time.perf_counter() - t0, n), flush=True)\n        return r\n    w.__name__ = fn.__name__; w.__doc__ = fn.__doc__\n    return w\ncheck_numbers = _fe_timed(\"check_numbers\", check_numbers)\nmatch_format_exactly = _fe_timed(\"match_format_exactly\", match_format_exactly)\nmatch_format_approximately = _fe_timed(\"match_format_approximately\", match_format_approximately)\nmath_verify_func = _fe_timed(\"math_verify_func\", math_verify_func)\n'''\ncompile(s, P, \"exec\"); open(P, \"w\").write(s); print(\"FAST-EXTRACT PATCH: APPLIED\", flush=True)"
  patch_g4_format_guard.py: "\"\"\"G4-FORMAT-GUARD: replace match_format_exactly's backtracking regex with an\nequivalent ordered find-chain. rs.*?re.*?ss(.+?)se (DOTALL) matches iff the four\nliteral tokens appear in order (>=1 char between ss and se); on gemma echo outputs\n(~30k chars, repeated tag literals, often no closing tag) the regex backtracks\ncatastrophically (793 s / 32 items on g4-002k step 7 -> async pool timeout -> sync).\"\"\"\nimport sys\nP = \"/deps/src/maxtext/trainers/post_train/rl/utils_rl.py\"\ns = open(P).read()\nif \"_G4_FORMAT_GUARD\" in s: print(\"G4-FORMAT-GUARD PATCH: already applied\", flush=True); sys.exit(0)\nif s.count(\"def match_format_exactly(\") != 1: print(\"G4-FORMAT-GUARD PATCH: FAILED anchor\", flush=True); sys.exit(0)\ns += r'''\n\n# --- _G4_FORMAT_GUARD (appended; column-0 in file) --------------------------------\n_g4fg_orig_mfe = match_format_exactly\ndef match_format_exactly(prompts, completions, tmvp_config, **kargs):\n  rs = \"\" if getattr(tmvp_config, \"reasoning_start_token_in_prompt\", False) else tmvp_config.reasoning_start_token\n  rend = tmvp_config.reasoning_end_token\n  ss = tmvp_config.solution_start_token\n  se = tmvp_config.solution_end_token\n  scores = []\n  for c in completions:\n    ok = False\n    i = c.find(rs) if rs else 0\n    if i >= 0:\n      j = c.find(rend, i + len(rs))\n      if j >= 0:\n        k = c.find(ss, j + len(rend))\n        if k >= 0 and c.find(se, k + len(ss) + 1) >= 0:\n          ok = True\n    scores.append(float(tmvp_config.reward_exact_format_match) if ok else 0.0)\n  return scores\nprint(\"G4-FORMAT-GUARD: match_format_exactly -> find-chain (no regex)\", flush=True)\n'''\nopen(P, \"w\").write(s)\nprint(\"G4-FORMAT-GUARD PATCH: APPLIED\", flush=True)"
  patch_gc_sync.py: "\"\"\"_GC_SYNC: gate tunix's per-step gc.collect() calls behind env TUNIX_GC_COLLECT (default off).\ntunix e4fc1dbf added gc.collect() after rollout.update_params (weight sync) and after the\nactor-logps pass in rl_cluster.py -- unconditional, every step. On our colocated (no CPU\noffload) setup this is a pure host stall: measured +1.2 s/step in perf/train/weight_sync_time\n(run 42 vs run 40). Gating (not deleting) keeps the upstream behaviour one env var away.\nFail-open, idempotent.\"\"\"\ndef _patch():\n    try:\n        import tunix.rl.rl_cluster as RC\n        fp = RC.__file__; src = open(fp).read()\n        if \"_GC_SYNC\" in src:\n            print(\"GC-SYNC: already applied\", flush=True); return\n        n = src.count(\"gc.collect()\")\n        if n == 0:\n            print(\"GC-SYNC: no gc.collect() found (skipped)\", flush=True); return\n        src = src.replace(\"gc.collect()\", \"(gc.collect() if __import__('os').environ.get('TUNIX_GC_COLLECT','0')=='1' else None)  # _GC_SYNC\")\n        compile(src, fp, \"exec\"); open(fp, \"w\").write(src)\n        print(\"GC-SYNC: gated %d gc.collect() call(s) in rl_cluster.py (TUNIX_GC_COLLECT=1 restores)\" % n, flush=True)\n    except Exception as e:\n        print(\"GC-SYNC: failed %r\" % (e,), flush=True)\n_patch()"
  patch_lendist.py: "\"\"\"Record per-step ISL / OSL / truncation distributions from the GRPO rollout.\n\nWHY. Tunix logs only completions/{mean,max,min}_length -- three scalars. We have never\nseen the length DISTRIBUTION, and `max_length` is 8192 (the OSL cap) in every single\nstep, so we know something is truncated but not whether it is 1 sequence or 40%. That\nnumber gates the tuning plan: holding the OSL cap fixed is only safe if truncation is\nrare.\n\nWHAT IT COSTS. Nothing measurable. Every array read here is ALREADY host-side numpy at\nthis point in the function:\n    rollout_output.tokens                 list[np.ndarray], UNPADDED  -> OSL = len()\n    rollout_output.left_padded_prompt_tokens  np.ndarray              -> ISL\n    pad_value / eos_value                 plain ints (rollout.pad_id()/eos_id())\n    rollout_config.max_tokens_to_generate  the cap\nNo device->host sync is introduced, so step timing is unaffected. ~30 KB/step.\n\nUsing rollout_output.tokens directly (rather than inferring from completion_mask) makes\nOSL exact: len() cannot be fooled by a pad token appearing mid-sequence.\n\nFAIL-OPEN. This patches a file on the live training path. Any anchor mismatch prints\nFAILED and exits 0 without modifying anything -- it must never crash a run. The injected\ncode is itself wrapped in try/except so a logging bug cannot take down training.\n\nPrints exactly one of:\n    LENDIST PATCH: APPLIED\n    LENDIST PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tunix\"\nGL = os.path.join(ROOT, \"rl/grpo/grpo_learner.py\")\n\n\ndef fail(msg):\n    print(f\"LENDIST PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nif not os.path.exists(GL):\n    fail(f\"{GL} not found\")\nsrc = open(GL, encoding=\"utf-8\").read()\n\nif \"_LENDIST_DUMP\" in src:\n    print(\"LENDIST PATCH: already patched\")\n    sys.exit(0)\n\nANCHOR = \"    # Log completion lengths.\\n    agg_completion_mask = completion_mask.sum(axis=-1)\\n\"\nif src.count(ANCHOR) != 1:\n    fail(f\"anchor found {src.count(ANCHOR)} times, expected 1\")\n\n# Verify the names we rely on are actually in scope in this function.\nfor name in (\"rollout_output\", \"rollout_config\", \"pad_value\", \"eos_value\"):\n    if name not in src:\n        fail(f\"expected local '{name}' not present in grpo_learner.py\")\n\nINJECT = '''    # --- _LENDIST_DUMP: per-step ISL/OSL/truncation distributions -------------\n    # All inputs are already host-side numpy here; no device sync is added.\n    try:\n      import json as _json, os as _os, numpy as _np\n      _cap = int(getattr(rollout_config, \"max_tokens_to_generate\", 0) or 0)\n      _osl, _trunc, _eos_end = [], 0, 0; _ft = []\n      for _t in rollout_output.tokens:\n        _n = int(len(_t))\n        _osl.append(_n)\n        _ft.append(int(_t[0]) if _n else -1)\n        if _cap and _n >= _cap:\n          # Distinguish \"ran into the wall\" from \"happened to finish exactly there\".\n          if _n > 0 and int(_t[-1]) == int(eos_value):\n            _eos_end += 1\n          else:\n            _trunc += 1\n      _p = _np.asarray(rollout_output.left_padded_prompt_tokens)\n      _isl = (_p != pad_value).sum(axis=-1).astype(int).tolist()\n      _rec = {\n          \"step\": int(self.rl_cluster.global_steps),\n          \"mode\": str(mode),\n          \"cap\": _cap,\n          \"n\": len(_osl),\n          \"osl\": _osl,\n          \"isl\": _isl,\n          \"truncated_at_cap\": _trunc,\n          \"eos_exactly_at_cap\": _eos_end,\n          \"first_tok\": _ft,\n      }\n      _run = _os.environ.get(\"JOB_IDENTIFIER\", \"unknown-run\")\n      _art = _os.environ.get(\"ARTIFACT_DIR\", \"\")\n      _line = _json.dumps(_rec)\n      print(\"LENDIST step=%d n=%d cap=%d truncated=%d (%.2f%%) eos_at_cap=%d \"\n            \"osl_mean=%.1f isl_mean=%.1f first_think=%d/%d\"\n            % (_rec[\"step\"], _rec[\"n\"], _cap, _trunc,\n               100.0 * _trunc / max(1, len(_osl)), _eos_end,\n               sum(_osl) / max(1, len(_osl)), sum(_isl) / max(1, len(_isl)),\n               sum(1 for _x in _ft if _x == 151667), len(_ft)),\n            flush=True)\n      if _art.startswith(\"gs://\"):\n        from google.cloud import storage as _st\n        _b, _, _pre = _art[5:].partition(\"/\")\n        _key = \"%s/%s/lendist/step_%06d.json\" % (_pre.rstrip(\"/\"), _run, _rec[\"step\"])\n        _st.Client().bucket(_b).blob(_key.lstrip(\"/\")).upload_from_string(\n            _line, content_type=\"application/json\")\n    except Exception as _e:  # never take down training for a logging bug\n      print(\"LENDIST ERROR: %r\" % (_e,), flush=True)\n    # --- end _LENDIST_DUMP ----------------------------------------------------\n\n'''\n\nsrc = src.replace(ANCHOR, INJECT + ANCHOR, 1)\n\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(GL, \"w\", encoding=\"utf-8\").write(src)\n\nv = open(GL, encoding=\"utf-8\").read()\nproblems = []\nif \"_LENDIST_DUMP\" not in v:\n    problems.append(\"marker missing\")\nif \"truncated_at_cap\" not in v:\n    problems.append(\"truncation logic missing\")\nif v.count(\"agg_completion_mask = completion_mask.sum(axis=-1)\") != 1:\n    problems.append(\"original metric line disturbed\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    problems.append(f\"reparse failed: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"LENDIST PATCH: APPLIED\")"
  patch_log_stats.py: "\"\"\"Enable vLLM engine stats logging (KV-cache usage gauge) -- run 15b.\n\nCORRECTED from run 15, where the patch flipped the setdefault in\n_build_engine_args -- dead code on our path: with server_mode=False tunix\nconstructs the OFFLINE engine, `LLM(**self.args)`, and vLLM's LLM.__init__\ndefaults disable_log_stats=True when the key is absent (llm.py:224 at pin\n0ba2aa35a). Run 15 therefore produced zero stats lines (banner APPLIED,\neffect nil).\n\nFix: setdefault the key into `self.args` at its single construction point,\n_vllm_config(). Covers BOTH paths -- LLM(**args) sees the key (vLLM's\n\"not in kwargs\" guard skips), and _build_engine_args copies self.args so\nits own setdefault becomes a no-op.\n\nDeliverable: \"GPU KV cache usage: X%\" lines in pathways-head logs during\nrollout, to size the TP=4 experiment. Reading caveats: CD lookahead\nallocation books up to 128 steps of blocks per window up front, so the\ngauge reads structurally high; throughput numbers are meaningless under\nfused CD windows. Startup-line context from run 15 (identical config):\npool = 34,325,568 tokens at hbm_utilization=0.3; max concurrency 2062.83x\nfor 16,640-token requests, i.e. worst case barely fits at TP8.\n\nPrints exactly one of:\n    LOG-STATS PATCH: APPLIED\n    LOG-STATS PATCH: already patched\n    LOG-STATS PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nP = \"/usr/local/lib/python3.12/site-packages/tunix/generate/vllm_sampler.py\"\n\n\ndef fail(msg):\n    print(f\"LOG-STATS PATCH: FAILED {msg}\")\n    sys.exit(0)  # non-fatal: let the run start so the failure is visible in logs\n\n\nif not os.path.exists(P):\n    fail(f\"{P} not found\")\nsrc = open(P, encoding=\"utf-8\").read()\n\nOLD = \"    args = config._processed_engine_kwargs.copy()\"\nNEW = (\n    \"    args = config._processed_engine_kwargs.copy()\\n\"\n    '    args.setdefault(\"disable_log_stats\", False)  # run-15b: stats ON (offline LLM path)'\n)\n\nif 'args.setdefault(\"disable_log_stats\", False)' in src:\n    print(\"LOG-STATS PATCH: already patched\")\n    sys.exit(0)\nif src.count(OLD) != 1:\n    fail(f\"anchor found {src.count(OLD)} times, expected 1\")\n\nsrc = src.replace(OLD, NEW, 1)\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\nopen(P, \"w\", encoding=\"utf-8\").write(src)\nprint(\"LOG-STATS PATCH: APPLIED\")"
  patch_phasetime.py: "\"\"\"Phasetime v2 -- split the `other` residual INTO its components.\n\nV1 (runs 10/10b) plus TensorBoard arithmetic already proved the ~30 s `other`\nresidual is exactly `generate_and_compute_advantage - vllm_rollout`, i.e. the\nreward + advantage + data-marshaling stage between the vLLM generate call and\nthe train loop (verified to +-0.5 s on three matched steps). V2 answers the\nnext question: WHICH of those dominates. It keeps all four v1 timers and adds:\n\n    engine_generate    RLCluster.generate wall -- the vLLM call INCLUDING\n                       tunix-side detokenization; against TensorBoard's\n                       rollout_time this locates where detokenize lands\n    compute_rewards    RLLearner._compute_rewards wall -- the Python reward\n                       functions (match_format_*, check_numbers) over 2048\n                       completions\n\nDerived offline, no extra timers needed:\n    marshal+advantage  = generate_and_advantage - engine_generate\n                         - compute_rewards\n    (contains the 2048 x 8192 pad-and-stack ~67 MB numpy build, jnp\n    conversions, advantage estimator, device_put)\n\nSame mechanics as v1: append-and-monkeypatch on the class objects, six\nperf_counter pairs per global step, no device sync, JSON per step to\n<ARTIFACT_DIR>/<run>/phasetime/step_NNNNNN.json plus a PHASETIME stdout line.\n\nCIRCULAR-IMPORT NOTE. rl_learner imports rl_cluster at module load, so the\nblock appended to rl_cluster.py must import rl_learner LAZILY inside the\nwrapper body, never at module level.\n\nFAIL-OPEN. Any missing class/method prints FAILED and exits 0 without\nwriting. Prints exactly one of:\n    PHASETIME2 PATCH: APPLIED\n    PHASETIME2 PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tunix\"\nRL = os.path.join(ROOT, \"rl/rl_learner.py\")\nGL = os.path.join(ROOT, \"rl/grpo/grpo_learner.py\")\nRC = os.path.join(ROOT, \"rl/rl_cluster.py\")\n\n\ndef fail(msg):\n    print(f\"PHASETIME2 PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nfor p in (RL, GL, RC):\n    if not os.path.exists(p):\n        fail(f\"{p} not found\")\n\nrl_src = open(RL, encoding=\"utf-8\").read()\ngl_src = open(GL, encoding=\"utf-8\").read()\nrc_src = open(RC, encoding=\"utf-8\").read()\n\nif any(\"_PHASETIME\" in s for s in (rl_src, gl_src, rc_src)):\n    print(\"PHASETIME2 PATCH: already patched\")\n    sys.exit(0)\n\nfor needle, where in ((\"class RLLearner\", \"rl_learner.py\"),\n                      (\"def _run_global_step\", \"rl_learner.py\"),\n                      (\"def _prepare_data\", \"rl_learner.py\"),\n                      (\"def _run_all_micro_batch_steps\", \"rl_learner.py\"),\n                      (\"def _compute_rewards\", \"rl_learner.py\")):\n    if needle not in rl_src:\n        fail(f\"'{needle}' not present in {where}\")\nfor needle in (\"class GRPOLearner\", \"def _generate_and_compute_advantage\"):\n    if needle not in gl_src:\n        fail(f\"'{needle}' not present in grpo_learner.py\")\nfor needle in (\"RLCluster\", \"def generate\"):  # _PT_ANCHOR: tunix>=408ca1d9 renamed class RLEngine, keeps alias RLCluster = RLEngine\n    if needle not in rc_src:\n        fail(f\"'{needle}' not present in rl_cluster.py\")\n\nRL_APPEND = '''\n\n# --- _PHASETIME v2: break out the `other` residual --------------------------------\n# Appended by patch_phasetime2.py. Six perf_counter pairs per global step; no\n# device sync. Wrappers are installed on the class objects only.\ntry:\n  import time as _pt_time\n  import json as _pt_json\n  import os as _pt_os\n\n  _PHASETIME = {}\n\n  def _pt_add(_name, _dt):\n    _PHASETIME[_name] = _PHASETIME.get(_name, 0.0) + float(_dt)\n\n  def _pt_wrap(_cls, _meth, _label):\n    _orig = getattr(_cls, _meth)\n\n    def _w(self, *a, **k):\n      _t0 = _pt_time.perf_counter()\n      try:\n        return _orig(self, *a, **k)\n      finally:\n        _pt_add(_label, _pt_time.perf_counter() - _t0)\n\n    _w.__name__ = getattr(_orig, \"__name__\", _meth)\n    setattr(_cls, _meth, _w)\n\n  def _pt_flush(self):\n    try:\n      _step = -1\n      try:\n        _step = int(self.rl_cluster.global_steps)\n      except Exception:\n        pass\n      _rec = dict(_PHASETIME)\n      _rec[\"step\"] = _step\n      print(\"PHASETIME step=%d \" % _step\n            + \" \".join(\"%s=%.2f\" % (_k, _v) for _k, _v in sorted(_rec.items())\n                       if _k != \"step\"), flush=True)\n      _run = _pt_os.environ.get(\"JOB_IDENTIFIER\", \"unknown-run\")\n      _art = _pt_os.environ.get(\"ARTIFACT_DIR\", \"\")\n      if _art.startswith(\"gs://\"):\n        from google.cloud import storage as _st\n        _b, _, _pre = _art[5:].partition(\"/\")\n        _key = \"%s/%s/phasetime/step_%06d.json\" % (_pre.rstrip(\"/\"), _run, _step)\n        _st.Client().bucket(_b).blob(_key.lstrip(\"/\")).upload_from_string(\n            _pt_json.dumps(_rec), content_type=\"application/json\")\n    except Exception as _e:\n      print(\"PHASETIME ERROR: %r\" % (_e,), flush=True)\n    finally:\n      _PHASETIME.clear()\n\n  _pt_wrap(RLLearner, \"_prepare_data\", \"prepare_data\")\n  _pt_wrap(RLLearner, \"_run_all_micro_batch_steps\", \"micro_batch_steps\")\n  _pt_wrap(RLLearner, \"_compute_rewards\", \"compute_rewards\")\n\n  _pt_orig_gs = RLLearner._run_global_step\n\n  def _pt_global_step(self, *a, **k):\n    _t0 = _pt_time.perf_counter()\n    try:\n      return _pt_orig_gs(self, *a, **k)\n    finally:\n      _pt_add(\"run_global_step\", _pt_time.perf_counter() - _t0)\n      _pt_flush(self)\n\n  RLLearner._run_global_step = _pt_global_step\nexcept Exception as _e:\n  print(\"PHASETIME ERROR (install): %r\" % (_e,), flush=True)\n# --- end _PHASETIME ---------------------------------------------------------------\n'''\n\nGL_APPEND = '''\n\n# --- _PHASETIME v2: time the GRPO payload inside prepare_data ---------------------\ntry:\n  import time as _pt2_time\n  from tunix.rl import rl_learner as _pt2_rl\n\n  _pt2_orig = GRPOLearner._generate_and_compute_advantage\n\n  def _pt2_w(self, *a, **k):\n    _t0 = _pt2_time.perf_counter()\n    try:\n      return _pt2_orig(self, *a, **k)\n    finally:\n      try:\n        _pt2_rl._pt_add(\"generate_and_advantage\", _pt2_time.perf_counter() - _t0)\n      except Exception:\n        pass\n\n  GRPOLearner._generate_and_compute_advantage = _pt2_w\nexcept Exception as _e:\n  print(\"PHASETIME ERROR (grpo install): %r\" % (_e,), flush=True)\n# --- end _PHASETIME ---------------------------------------------------------------\n'''\n\nRC_APPEND = '''\n\n# --- _PHASETIME v2: time the engine generate call (vLLM + detokenize) -------------\n# NOTE: rl_learner imports THIS module at load time, so rl_learner must be\n# imported lazily inside the wrapper to avoid a circular import.\ntry:\n  import time as _pt3_time\n\n  _pt3_orig = RLCluster.generate\n\n  def _pt3_w(self, *a, **k):\n    _t0 = _pt3_time.perf_counter()\n    try:\n      return _pt3_orig(self, *a, **k)\n    finally:\n      try:\n        from tunix.rl import rl_learner as _pt3_rl\n        _pt3_rl._pt_add(\"engine_generate\", _pt3_time.perf_counter() - _t0)\n      except Exception:\n        pass\n\n  _pt3_w.__name__ = \"generate\"\n  RLCluster.generate = _pt3_w\nexcept Exception as _e:\n  print(\"PHASETIME ERROR (cluster install): %r\" % (_e,), flush=True)\n# --- end _PHASETIME ---------------------------------------------------------------\n'''\n\nnew_rl = rl_src + RL_APPEND\nnew_gl = gl_src + GL_APPEND\nnew_rc = rc_src + RC_APPEND\nfor name, s in ((\"rl_learner.py\", new_rl), (\"grpo_learner.py\", new_gl),\n                (\"rl_cluster.py\", new_rc)):\n    try:\n        ast.parse(s)\n    except SyntaxError as e:\n        fail(f\"patched {name} does not parse: {e}\")\n\nopen(RL, \"w\", encoding=\"utf-8\").write(new_rl)\nopen(GL, \"w\", encoding=\"utf-8\").write(new_gl)\nopen(RC, \"w\", encoding=\"utf-8\").write(new_rc)\n\nproblems = []\nv_rl = open(RL, encoding=\"utf-8\").read()\nv_gl = open(GL, encoding=\"utf-8\").read()\nv_rc = open(RC, encoding=\"utf-8\").read()\nif \"_pt_flush\" not in v_rl or 'compute_rewards\"' not in v_rl:\n    problems.append(\"rl_learner wrappers missing\")\nif \"_pt2_w\" not in v_gl:\n    problems.append(\"grpo_learner wrapper missing\")\nif \"_pt3_w\" not in v_rc:\n    problems.append(\"rl_cluster wrapper missing\")\nif v_rl.count(\"def _run_global_step\") != 1:\n    problems.append(\"rl_learner._run_global_step disturbed\")\nfor name, s in ((\"rl_learner.py\", v_rl), (\"grpo_learner.py\", v_gl),\n                (\"rl_cluster.py\", v_rc)):\n    try:\n        ast.parse(s)\n    except SyntaxError as e:\n        problems.append(f\"reparse {name}: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"PHASETIME2 PATCH: APPLIED\")"
  patch_reward_parallel.py: "\"\"\"Parallelize the GRPO reward functions across processes.\n\nWHY. Phasetime v2 (run 11) measured the ~30 s `other` residual as almost\nentirely `compute_rewards` (29.77 s at step 1; marshal+advantage is 0.3 s).\nThe reward functions (match_format_*, check_numbers) are pure-Python\nregex/parsing over 2048 independent (prompt, completion) pairs, run serially\non one core while 28-44 head-node cores idle. Expected: ~30 s -> 2-4 s,\ni.e. step ~157 s -> ~132 s.\n\nHOW. Append-and-monkeypatch on tunix/rl/reward_manager.py:\n`SequenceRewardManager._compute_rewards` is replaced by a version that keeps\nthe original signature-inspection logic but calls each reward_fn on CHUNKS of\nthe batch in a fork-based process pool, concatenating results in order.\nCorrectness properties:\n  - per-pair independence: chunking is exact for sequence-level rewards\n  - kwargs that are per-example sequences (len == num_prompts, e.g. ground\n    truth answer columns) are chunked in lockstep; scalars pass through\n  - results are concatenated in chunk order -> byte-identical to serial\n  - ANY error in the parallel path (pickling, fn signature, worker crash)\n    logs one warning and falls back to the ORIGINAL serial implementation\nVALIDITY GATE for the run carrying this patch: rewards/train/mean must equal\nthe unpatched run step-for-step (deterministic seeds make rewards exactly\nreproducible).\n\nTunables via env:\n  TUNIX_REWARD_WORKERS   pool size (default min(32, cpu_count))\n  TUNIX_REWARD_PARALLEL  set to \"0\" to disable (keeps serial path)\n\nFAIL-OPEN. Any missing anchor prints FAILED and exits 0.\nPrints exactly one of:\n    REWARD-PAR PATCH: APPLIED\n    REWARD-PAR PATCH: FAILED <reason>\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nROOT = \"/usr/local/lib/python3.12/site-packages/tunix\"\nRM = os.path.join(ROOT, \"rl/reward_manager.py\")\n\n\ndef fail(msg):\n    print(f\"REWARD-PAR PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\nif not os.path.exists(RM):\n    fail(f\"{RM} not found\")\nsrc = open(RM, encoding=\"utf-8\").read()\n\nif \"_REWARD_PAR\" in src:\n    print(\"REWARD-PAR PATCH: already patched\")\n    sys.exit(0)\n\nfor needle in (\"class SequenceRewardManager\", \"def _compute_rewards\",\n               \"def _prepare_log_metrics\"):\n    if needle not in src:\n        fail(f\"'{needle}' not present in reward_manager.py\")\n\nAPPEND = '''\n\n# --- _REWARD_PAR: process-pool reward computation ---------------------------------\n# Appended by patch_reward_parallel.py (see its docstring). The serial\n# implementation above is kept intact as the fallback.\ntry:\n  import os as _rp_os\n  import numpy as _rp_np\n  import multiprocessing as _rp_mp\n  from dataclasses import asdict as _rp_asdict\n  import inspect as _rp_inspect\n  import logging as _rp_logging\n\n  _rp_serial_compute = SequenceRewardManager._compute_rewards\n  _rp_pool = [None]\n  _rp_warned = [False]\n  # Reward fns that must run serially in the parent (learned at runtime):\n  # a fn that spawns its own subprocesses fails inside Pool's daemonic\n  # workers (\"daemonic processes are not allowed to have children\") -- true\n  # for check_numbers, whose math_verify grading dispatches to its own\n  # persistent spawn pool. In the parent that internal pool works normally,\n  # and its width is a MaxText config knob (math_verify_num_procs).\n  _rp_serial_fns = set()\n\n  def _rp_get_pool():\n    if _rp_pool[0] is None:\n      # The tunix trainer runs as a DAEMONIC child of the launcher process,\n      # and multiprocessing forbids daemons from having children (run 12\n      # failed here with \"daemonic processes are not allowed to have\n      # children\"). The flag is inherited launcher plumbing, not a property\n      # this code relies on: clear it so the pool can fork. The only\n      # daemon-flag semantics lost are auto-termination of OUR workers if\n      # the trainer dies mid-step; the pod teardown reaps them anyway.\n      try:\n        _cur = _rp_mp.current_process()\n        if _cur._config.get(\"daemon\"):\n          _cur._config[\"daemon\"] = False\n      except Exception:\n        pass\n      n = int(_rp_os.environ.get(\"TUNIX_REWARD_WORKERS\",\n                                 min(32, _rp_os.cpu_count() or 8)))\n      _rp_pool[0] = _rp_mp.get_context(\"fork\").Pool(processes=n)\n    return _rp_pool[0]\n\n  def _rp_parallel_compute(self, prompts, completions, **kwargs):\n    if _rp_os.environ.get(\"TUNIX_REWARD_PARALLEL\", \"1\") == \"0\":\n      return _rp_serial_compute(self, prompts, completions, **kwargs)\n    try:\n      algo_config_params = _rp_asdict(self.algo_config)\n      base_kwargs = kwargs.copy()\n      num_prompts = len(prompts)\n      num_reward_fns = len(self.reward_fns)\n      rewards = _rp_np.zeros((num_prompts, num_reward_fns))\n\n      pool = _rp_get_pool()\n      n_chunks = max(1, min(pool._processes * 2, num_prompts))\n      bounds = [(num_prompts * c) // n_chunks for c in range(n_chunks + 1)]\n\n      for i, reward_fn in enumerate(self.reward_fns):\n        signature = _rp_inspect.signature(reward_fn)\n        reward_fn_config_params = {}\n        for name, _ in signature.parameters.items():\n          if name in [\"self\", \"prompts\", \"completions\", \"kwargs\"]:\n            continue\n          if name in algo_config_params and name not in base_kwargs:\n            reward_fn_config_params[name] = algo_config_params[name]\n        call_kwargs = base_kwargs.copy()\n        call_kwargs.update(reward_fn_config_params)\n\n        fn_name = getattr(reward_fn, \"__name__\", str(reward_fn))\n        if fn_name in _rp_serial_fns:\n          # This fn previously failed in a worker (e.g. it spawns its own\n          # subprocesses, which Pool's daemonic workers forbid -- true for\n          # check_numbers' math_verify pool). Run it serially in the parent,\n          # where its internal parallelism works as usual.\n          full_kwargs = dict(call_kwargs)\n          full_kwargs[\"prompts\"] = list(prompts)\n          full_kwargs[\"completions\"] = list(completions)\n          flat = list(reward_fn(**full_kwargs))\n        else:\n          try:\n            jobs = []\n            for c in range(n_chunks):\n              lo, hi = bounds[c], bounds[c + 1]\n              if lo == hi:\n                continue\n              ck = {}\n              for k, v in call_kwargs.items():\n                if isinstance(v, (list, tuple)) and len(v) == num_prompts:\n                  ck[k] = list(v[lo:hi])\n                elif isinstance(v, _rp_np.ndarray) and len(v) == num_prompts:\n                  ck[k] = v[lo:hi]\n                else:\n                  ck[k] = v\n              ck[\"prompts\"] = list(prompts[lo:hi])\n              ck[\"completions\"] = list(completions[lo:hi])\n              jobs.append(pool.apply_async(reward_fn, kwds=ck))\n            parts = [j.get(timeout=180) for j in jobs]\n            flat = [x for part in parts for x in list(part)]\n          except Exception as _fe:\n            _rp_serial_fns.add(fn_name)\n            _rp_logging.warning(\n                \"REWARD-PAR: fn %s failed in workers (%r); running it \"\n                \"serially in the parent from now on.\", fn_name, _fe)\n            full_kwargs = dict(call_kwargs)\n            full_kwargs[\"prompts\"] = list(prompts)\n            full_kwargs[\"completions\"] = list(completions)\n            flat = list(reward_fn(**full_kwargs))\n        if len(flat) != num_prompts:\n          raise RuntimeError(\n              \"parallel reward length mismatch for %s: %d vs %d\"\n              % (fn_name, len(flat), num_prompts))\n        rewards[:, i] = _rp_np.array(flat)\n\n      log_metrics = self._prepare_log_metrics(prompts, completions, rewards)\n      return {\n          \"rewards\": _rp_np.nansum(rewards, axis=1),\n          \"log_metrics\": log_metrics,\n      }\n    except Exception as _e:\n      if not _rp_warned[0]:\n        _rp_warned[0] = True\n        _rp_logging.warning(\n            \"REWARD-PAR: parallel path failed (%r); falling back to the \"\n            \"serial implementation for the rest of the run.\", _e)\n      _rp_os.environ[\"TUNIX_REWARD_PARALLEL\"] = \"0\"\n      return _rp_serial_compute(self, prompts, completions, **kwargs)\n\n  SequenceRewardManager._compute_rewards = _rp_parallel_compute\nexcept Exception as _e:\n  print(\"REWARD-PAR ERROR (install): %r\" % (_e,), flush=True)\n# --- end _REWARD_PAR --------------------------------------------------------------\n'''\n\nnew = src + APPEND\ntry:\n    ast.parse(new)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(RM, \"w\", encoding=\"utf-8\").write(new)\n\nv = open(RM, encoding=\"utf-8\").read()\nproblems = []\nif \"_rp_parallel_compute\" not in v:\n    problems.append(\"wrapper missing\")\nif v.count(\"def _compute_rewards\") != 1:\n    problems.append(\"serial _compute_rewards definition disturbed\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    problems.append(f\"reparse failed: {e}\")\nif problems:\n    fail(\"; \".join(problems))\nprint(\"REWARD-PAR PATCH: APPLIED\")"
  boxed_math_reward.py: "#!/usr/bin/env python3\n\"\"\"Meta `boxed_math` reward + overlong penalty, ported from REPRODUCTION.md v1.0 (2026-09-18).\n\nScoring is a three-way EXCLUSIVE branch (a correct answer scores 1.0, not 1.1):\n    pred = last \\\\boxed{...} (rfind of the literal \"\\\\boxed{\", then forward brace matching; unbalanced -> None)\n    if pred is None or pred == \"\":      reward = 0.0      # no parseable box (truncation lands here)\n    elif normalize(pred) == gold_norm:  reward = 1.0      # score\n    else:                               reward = 0.1      # format_score\n    normalize(v) = v.strip().rstrip(\".\").replace(\",\", \"\").replace(\"$\", \"\").strip()   -- deliberately minimal:\n        no decimal/integer equivalence (18.0 vs 18 -> 0.1), no \\\\text{} unwrapping, no LaTeX parsing.\n    gold: REPRODUCTION.md says the gold is NOT normalized, but its own fixture scores \\\\boxed{1080} vs gold \"1,080\"\n    as 1.0, which is only possible if the gold's thousands separator is also removed. We follow the FIXTURES\n    (gold gets the same minimal normalize) and have asked Meta to resolve the contradiction.  [PENDING]\nOverlong penalty (TRAINING ONLY -- Meta evaluates with the raw reward):\n    penalty = min(0, -(completion_len - (2048 - 512)) / 512 * 1.0)      # added to the reward; can go below -1 in fixtures\nverl interface: compute_score(data_source, solution_str, ground_truth, extra_info=None) -> dict\n    score          training reward (raw + penalty) for sources listed in REWARD_PENALTY_SOURCES; raw reward otherwise (eval)\n    reward_raw     boxed_math reward without penalty (== Meta eval/mean_reward semantics)\n    acc            1 if reward_raw == 1.0 (Meta eval/accuracy semantics), fmt: 1 if a box was parsed\n    format_credit, length_penalty, overlong, qid\nKnobs (env): REWARD_FORMAT_SCORE 0.1, REWARD_OVERLONG_BUFFER 512 (0 = off), REWARD_OVERLONG_PENALTY 1.0,\n             REWARD_MAX_RESP_LEN 2048, REWARD_PENALTY_SOURCES \"gsm8k_boxed_train\" (comma list).\nSelf-test: `python3 boxed_math_reward.py [--fixtures reference/reward_fixtures.json]` runs Meta's 15 reward + 6\noverlong fixtures (embedded copy by default); non-zero exit on any mismatch.\n\"\"\"\nimport json\nimport os\nimport sys\n\n_FORMAT_SCORE = float(os.environ.get(\"REWARD_FORMAT_SCORE\", \"0.1\"))\n_SCORE = 1.0\n_OVERLONG_BUFFER = int(os.environ.get(\"REWARD_OVERLONG_BUFFER\", \"512\"))\n_OVERLONG_PENALTY = float(os.environ.get(\"REWARD_OVERLONG_PENALTY\", \"1.0\"))\n_MAX_RESP_LEN = int(os.environ.get(\"REWARD_MAX_RESP_LEN\", \"2048\"))\n_PENALTY_SOURCES = {s.strip() for s in os.environ.get(\"REWARD_PENALTY_SOURCES\", \"gsm8k_boxed_train\").split(\",\") if s.strip()}\n\n\ndef extract_boxed(text: str):\n  \"\"\"Content of the LAST \\\\boxed{...}; None if absent or if the braces never balance (truncated).\"\"\"\n  idx = text.rfind(\"\\\\boxed{\")\n  if idx < 0:\n    return None\n  i = idx + len(\"\\\\boxed\")            # position of '{'\n  depth = 0\n  for j in range(i, len(text)):\n    if text[j] == \"{\":\n      depth += 1\n    elif text[j] == \"}\":\n      depth -= 1\n      if depth == 0:\n        return text[i + 1:j]\n  return None\n\n\ndef normalize(v: str) -> str:\n  return v.strip().rstrip(\".\").replace(\",\", \"\").replace(\"$\", \"\").strip()\n\n\ndef boxed_math(response: str, gold: str):\n  \"\"\"Returns (reward, acc, fmt, format_credit).\"\"\"\n  pred = extract_boxed(response)\n  if pred is None or pred == \"\":\n    return 0.0, 0.0, 0.0, 0.0\n  if normalize(pred) == normalize(str(gold)):      # gold normalized per the fixtures (see docstring, PENDING)\n    return _SCORE, 1.0, 1.0, 0.0\n  return _FORMAT_SCORE, 0.0, 1.0, _FORMAT_SCORE\n\n\ndef overlong_penalty(completion_len: int) -> float:\n  if _OVERLONG_BUFFER == 0:\n    return 0.0\n  return min(0.0, -(float(completion_len) - (_MAX_RESP_LEN - _OVERLONG_BUFFER)) / _OVERLONG_BUFFER * _OVERLONG_PENALTY)\n\n\ndef compute_score(data_source, solution_str, ground_truth, extra_info=None, **kwargs):\n  reward, acc, fmt, credit = boxed_math(solution_str, ground_truth)\n  pen = 0.0\n  if data_source in _PENALTY_SOURCES and _OVERLONG_BUFFER > 0:\n    n = extra_info.get(\"response_len\") if isinstance(extra_info, dict) else None\n    if n is None:\n      raise RuntimeError(\"overlong penalty enabled but extra_info has no 'response_len' (apply patch_verl_reward_response_len.py)\")\n    pen = overlong_penalty(int(n))\n  qid = float(extra_info.get(\"index\", -1)) if isinstance(extra_info, dict) else -1.0\n  return {\"score\": reward + pen, \"reward_raw\": reward, \"acc\": acc, \"fmt\": fmt, \"format_credit\": credit,\n          \"length_penalty\": pen, \"overlong\": 1.0 if pen < 0 else 0.0, \"qid\": qid}\n\n\n# ---- Meta's fixtures (reference/reward_fixtures.json, copied verbatim; --fixtures overrides with the file)\nMETA_FIXTURES = {\n    \"reward_fixtures\": [\n        {\"case\": \"exact match\", \"response\": \"The answer is \\\\boxed{18}\", \"gold\": \"18\", \"reward\": 1.0},\n        {\"case\": \"gold has thousands separator\", \"response\": \"So \\\\boxed{1080}\", \"gold\": \"1,080\", \"reward\": 1.0},\n        {\"case\": \"prediction has separator\", \"response\": \"So \\\\boxed{1,080}\", \"gold\": \"1080\", \"reward\": 1.0},\n        {\"case\": \"dollar sign in prediction\", \"response\": \"\\\\boxed{$42}\", \"gold\": \"42\", \"reward\": 1.0},\n        {\"case\": \"trailing period\", \"response\": \"\\\\boxed{18.}\", \"gold\": \"18\", \"reward\": 1.0},\n        {\"case\": \"surrounding whitespace\", \"response\": \"\\\\boxed{  18  }\", \"gold\": \"18\", \"reward\": 1.0},\n        {\"case\": \"nested braces\", \"response\": \"\\\\boxed{\\\\frac{1}{2}}\", \"gold\": \"\\\\frac{1}{2}\", \"reward\": 1.0},\n        {\"case\": \"multiple boxed -> LAST wins\", \"response\": \"first \\\\boxed{7} then \\\\boxed{18}\", \"gold\": \"18\", \"reward\": 1.0},\n        {\"case\": \"multiple boxed, last is wrong\", \"response\": \"first \\\\boxed{18} then \\\\boxed{7}\", \"gold\": \"18\", \"reward\": 0.1},\n        {\"case\": \"well-formed but wrong value\", \"response\": \"\\\\boxed{17}\", \"gold\": \"18\", \"reward\": 0.1},\n        {\"case\": \"no boxed at all\", \"response\": \"The answer is 18.\", \"gold\": \"18\", \"reward\": 0.0},\n        {\"case\": \"TRUNCATED: unclosed brace\", \"response\": \"... so the answer is \\\\boxed{18\", \"gold\": \"18\", \"reward\": 0.0},\n        {\"case\": \"TRUNCATED: unclosed nested\", \"response\": \"\\\\boxed{\\\\frac{1}{2\", \"gold\": \"\\\\frac{1}{2}\", \"reward\": 0.0},\n        {\"case\": \"empty boxed\", \"response\": \"\\\\boxed{}\", \"gold\": \"18\", \"reward\": 0.0},\n        {\"case\": \"decimal vs integer gold\", \"response\": \"\\\\boxed{18.0}\", \"gold\": \"18\", \"reward\": 0.1},\n    ],\n    \"overlong_fixtures\": [\n        {\"completion_tokens\": 100, \"penalty\": 0.0}, {\"completion_tokens\": 1536, \"penalty\": 0.0},\n        {\"completion_tokens\": 1537, \"penalty\": -0.001953}, {\"completion_tokens\": 1792, \"penalty\": -0.5},\n        {\"completion_tokens\": 2048, \"penalty\": -1.0}, {\"completion_tokens\": 2560, \"penalty\": -2.0},\n    ],\n}\n\n\ndef run_fixtures(fx):\n  fails = []\n  for c in fx[\"reward_fixtures\"]:\n    r, *_ = boxed_math(c[\"response\"], c[\"gold\"])\n    ok = abs(r - c[\"reward\"]) < 1e-9\n    print(f\"{'OK ' if ok else 'FAIL'} {c['case']:<36} -> {r} (expected {c['reward']})\")\n    fails += [] if ok else [c[\"case\"]]\n  for c in fx[\"overlong_fixtures\"]:\n    p = overlong_penalty(c[\"completion_tokens\"])\n    ok = abs(p - c[\"penalty\"]) < 1e-5\n    print(f\"{'OK ' if ok else 'FAIL'} overlong {c['completion_tokens']:>5} tokens -> {p:+.6f} (expected {c['penalty']:+})\")\n    fails += [] if ok else [f\"overlong {c['completion_tokens']}\"]\n  # eval vs train semantics\n  tr = compute_score(\"gsm8k_boxed_train\", \"\\\\boxed{18}\", \"18\", extra_info={\"index\": 0, \"response_len\": 2048})\n  ev = compute_score(\"gsm8k_boxed_test512\", \"\\\\boxed{18}\", \"18\", extra_info={\"index\": 0, \"response_len\": 2048})\n  ok = tr[\"score\"] == 0.0 and tr[\"reward_raw\"] == 1.0 and ev[\"score\"] == 1.0 and ev[\"length_penalty\"] == 0.0 and ev[\"acc\"] == 1.0\n  print(f\"{'OK ' if ok else 'FAIL'} penalty applies to train source only: train score {tr['score']} (raw 1.0, pen -1.0); eval score {ev['score']} (no penalty)\")\n  fails += [] if ok else [\"penalty scope\"]\n  return fails\n\n\nif __name__ == \"__main__\":\n  fx = META_FIXTURES\n  if len(sys.argv) > 2 and sys.argv[1] == \"--fixtures\":\n    fx = json.load(open(sys.argv[2]))\n    print(f\"using fixtures from {sys.argv[2]}\")\n  fails = run_fixtures(fx)\n  print(\"knobs:\", dict(format_score=_FORMAT_SCORE, buffer=_OVERLONG_BUFFER, penalty=_OVERLONG_PENALTY, cap=_MAX_RESP_LEN, penalty_sources=sorted(_PENALTY_SOURCES)))\n  print(\"RESULT:\", \"PASS\" if not fails else f\"FAIL {fails}\")\n  raise SystemExit(0 if not fails else 1)"
  boxed_math_reward_v2.py: "#!/usr/bin/env python3\n\"\"\"GSM8K boxed scorer v2 (`boxed_v2`): Meta `boxed_math` (v1) + ONE explicit, model-agnostic rule for decorated numbers.\n\nv1 is boxed_math_reward.py in this directory. It is not modified; it is loaded from its file and its sha256 is\nchecked at import, so the v1 parts below are byte-for-byte the frozen Meta port the Qwen GSM8K 8K runs trained with.\n\nWhat changes vs v1: only the \"is the boxed answer correct\" test. Extraction, the three reward levels, the format\nscore, the overlong penalty and its scope are v1's code and read the same environment knobs (REWARD_FORMAT_SCORE,\nREWARD_OVERLONG_BUFFER, REWARD_OVERLONG_PENALTY, REWARD_MAX_RESP_LEN, REWARD_PENALTY_SOURCES).\n\n    pred = v1.extract_boxed(response)       LAST \\\\boxed{...}; braces never balance (truncated) -> None\n    pred is None or pred == \"\"              -> 0.0                          (v1)\n    v1 correct                              -> 1.0                          (v1; v2 never removes credit)\n    v1 parseable-wrong but number_equal     -> 1.0                          (the only v2 change)\n    otherwise                               -> REWARD_FORMAT_SCORE (0.1)    (v1)\n\n    v1 correct:   v1.normalize(pred) == v1.normalize(gold)   (strip, trailing '.', every ',' and '$' removed)\n    number_equal: number(pred) and number(gold) both exist and have the same exact value\n\nnumber(s) is a whitelist. Each step runs at most once, in this order. If what is left after step 5 is not a plain\ndecimal literal, the answer is \"not a number\" and only v1 can credit it. Contents longer than 200 characters are\nnever numbers.\n  0. spacing  `{,}` -> ','; `\\\\,` between a digit and exactly three more digits -> ',' (both LaTeX thousands\n              separators; step 5 still checks the grouping); the LaTeX spacing commands `\\\\,` `\\\\;` `\\\\:` `\\\\!` `\\\\ `\n              `\\\\quad` `\\\\qquad` and `~` -> one space; strip; trailing '.' removed\n  1. wrapper  if the WHOLE answer is a single \\\\text / \\\\textrm / \\\\textit / \\\\textbf / \\\\mathrm / \\\\mathbf / \\\\mbox\n              group, use its content (e.g. \\\\text{18})\n  2. unit     drop ONE trailing unit phrase, written as a group from the step-1 macro family or as bare words, with\n              an optional ^2 / ^3 after it. A unit phrase is 1-4 words of ASCII letters. Inside a word only / . ' -\n              may appear (Mb/hr, o'clock, sq.). No digits or other symbols are allowed, and no word may be in\n              BLOCKED_WORDS: connectives, approximations, bounds, operations and multipliers, i.e. words that could\n              change the value (\"and\", \"about\", \"than\", \"squared\", \"thousand\", \"k\"). A group that is not a unit\n              phrase is NOT dropped, e.g. \"\\\\text{ and } 20\" or \"\\\\text{ (approx 18)}\".\n              Unit words are not checked against the question: \"18 hours\" for gold 18 minutes is accepted.\n  3. suffix   drop ONE trailing \\\\% / % / ^\\\\circ / ^{\\\\circ} / U+00B0 (degree sign)\n  4. prefix   an optional sign (+ or -), then ONE currency symbol: \\\\$ / $ / U+20AC (euro) / U+00A3 (pound). A sign\n              written right after the symbol is also read.\n  5. literal  the rest must be digits, optionally grouped in thousands (1,234,567, groups of exactly three), with\n              an optional fractional part (.5). Fractions, expressions, exponents, scientific notation, times,\n              ranges, lists and words are not numbers.\n  value       exact decimal value (decimal.Decimal). 28.00 == 28 and 18.0 == 18; no tolerance, so 18.5 != 18.\n\nIntentional divergence from Meta's fixtures (PR #14 option B): \"decimal vs integer gold\", \\\\boxed{18.0} vs 18, is 1.0\nhere (Meta / v1: 0.1). Every other Meta fixture scores as in v1.\nInherited from v1, because a v1-correct answer stays correct: v1 deletes every ',' and '$' anywhere, so\n\\\\boxed{1,00} vs 100 is correct under both versions even though step 5 alone would reject that grouping.\n\ncompute_score(...) returns v1's fields with v2 values (score, reward_raw, acc, fmt, format_credit, length_penalty,\noverlong, qid) plus diagnostics. acc_v1 is the v1 (Meta) accuracy of the same response. v2_only = acc - acc_v1,\ni.e. credited only by the number rule. scorer_version = 2.0. All values are floats because verl averages every\nkey.\n\nSelf-test: `python3 boxed_math_reward_v2.py` runs Meta's fixtures (with the divergence above), the overlong\nfixtures, the penalty scope and RULE_CASES; non-zero exit on any mismatch. Unit tests: test_boxed_math_reward_v2.py.\n\"\"\"\nimport decimal\nimport hashlib\nimport importlib.util\nimport json\nimport os\nimport re\nimport sys\n\nSCORER_VERSION = 2.0\nV1_SHA256 = \"a743cf71e2094b0ebee67506460028b5a27bb9b1d86928f6c19b152561c7015b\"   # boxed_math_reward.py (frozen)\nV1_PATH = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"boxed_math_reward.py\")\n\n\ndef _load_v1():\n  with open(V1_PATH, \"rb\") as f:\n    sha = hashlib.sha256(f.read()).hexdigest()\n  if sha != V1_SHA256:\n    raise RuntimeError(f\"{V1_PATH}: sha256 {sha} != frozen v1 {V1_SHA256}\")\n  spec = importlib.util.spec_from_file_location(\"boxed_math_reward_v1\", V1_PATH)\n  mod = importlib.util.module_from_spec(spec)\n  spec.loader.exec_module(mod)\n  return mod\n\n\nv1 = _load_v1()\n\nTEXT_MACROS = (\"\\\\text\", \"\\\\textrm\", \"\\\\textit\", \"\\\\textbf\", \"\\\\mathrm\", \"\\\\mathbf\", \"\\\\mbox\")\nBLOCKED_WORDS = frozenset(\"\"\"\n    and or nor not no plus minus\n    approximately approx about around nearly almost roughly circa estimated\n    than least most\n    half twice thrice squared cubed\n    hundred hundreds thousand thousands million millions billion billions trillion trillions dozen dozens\n    k bn mn mil mln\n\"\"\".split())                                           # compared lower-cased\nBLOCKED_WORDS_CASED = frozenset({\"M\", \"B\", \"MM\"})      # million / billion abbreviations (lower-case mm = millimetres)\nSUFFIXES = ((\"\\\\%\", \"percent\"), (\"%\", \"percent\"), (\"^{\\\\circ}\", \"degree\"), (\"^\\\\circ\", \"degree\"), (\"\\u00b0\", \"degree\"))\nCURRENCIES = (\"\\\\$\", \"$\", \"\\u20ac\", \"\\u00a3\")\nMAX_NUMBER_CHARS = 200   # longer boxed contents are never numbers (also bounds the regex work per answer)\n\n_THIN_GROUP = re.compile(r\"(?<=\\d)\\\\,(?=\\d{3}(?!\\d))\")\n_SPACING = re.compile(r\"\\\\(?:qquad|quad|[,;:! ])|~\")\n_WORD = r\"[A-Za-z]+(?:[/.'\\-][A-Za-z]+)*\\.?\"\n_UNIT_PHRASE = re.compile(rf\"{_WORD}(?: {_WORD}){{0,3}}\")\n_BARE_UNIT = re.compile(rf\"(?P<head>.*?)(?:(?<=[0-9%\\u00b0}}])|\\s+)(?P<unit>{_WORD}(?:\\s+{_WORD}){{0,3}})\", re.S)\n_UNIT_EXP = re.compile(r\"\\^(?:[23]|\\{[23]\\})$\")\n_LITERAL = re.compile(r\"(?:\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.\\d+)?\")\n\n\ndef _matching_close(s, open_idx):\n  depth = 0\n  for j in range(open_idx, len(s)):\n    if s[j] == \"{\":\n      depth += 1\n    elif s[j] == \"}\":\n      depth -= 1\n      if depth == 0:\n        return j\n  return -1\n\n\ndef _matching_open(s, close_idx):\n  depth = 0\n  for j in range(close_idx, -1, -1):\n    if s[j] == \"}\":\n      depth += 1\n    elif s[j] == \"{\":\n      depth -= 1\n      if depth == 0:\n        return j\n  return -1\n\n\ndef is_unit_phrase(phrase):\n  phrase = \" \".join(phrase.split())\n  if not _UNIT_PHRASE.fullmatch(phrase):\n    return False\n  words = [w.rstrip(\".\") for w in phrase.split(\" \")]\n  return not any(w.lower() in BLOCKED_WORDS or w in BLOCKED_WORDS_CASED for w in words)\n\n\ndef _unwrap(s):\n  for mac in TEXT_MACROS:\n    if s.startswith(mac + \"{\") and _matching_close(s, len(mac)) == len(s) - 1:\n      return s[len(mac) + 1:-1]\n  return s\n\n\ndef _strip_unit(s):\n  \"\"\"Step 2: drop ONE trailing unit phrase. Returns (rest, dropped).\"\"\"\n  m = _UNIT_EXP.search(s)\n  body = s[:m.start()].rstrip() if m else s      # ^2 / ^3 is dropped only together with a unit\n  if body.endswith(\"}\"):\n    k = _matching_open(body, len(body) - 1)\n    for mac in TEXT_MACROS:\n      if k >= len(mac) and body[k - len(mac):k] == mac:\n        if is_unit_phrase(body[k + 1:-1]):\n          return body[:k - len(mac)].rstrip(), True\n        break\n    return s, False\n  mb = _BARE_UNIT.fullmatch(body)\n  if mb and is_unit_phrase(mb.group(\"unit\")):\n    return mb.group(\"head\").rstrip(), True\n  return s, False\n\n\ndef parse_number(s):\n  \"\"\"(exact value as decimal.Decimal or None, names of the whitelist steps used). See the module docstring.\"\"\"\n  used = []\n  s = str(s)\n  if len(s) > MAX_NUMBER_CHARS:\n    return None, used\n  s = _SPACING.sub(\" \", _THIN_GROUP.sub(\",\", s.replace(\"{,}\", \",\")))\n  s = s.strip().rstrip(\".\").strip()\n  t = _unwrap(s)\n  if t != s:\n    used.append(\"wrapper\")\n    s = t.strip().rstrip(\".\").strip()\n  s, dropped = _strip_unit(s)\n  if dropped:\n    used.append(\"unit\")\n  for suf, name in SUFFIXES:\n    if s.endswith(suf):\n      s = s[:-len(suf)].rstrip()\n      used.append(name)\n      break\n  sign = \"\"\n  if s[:1] in (\"+\", \"-\"):\n    sign, s = s[0], s[1:].lstrip()\n  for cur in CURRENCIES:\n    if s.startswith(cur):\n      s = s[len(cur):].lstrip()\n      used.append(\"currency\")\n      if not sign and s[:1] in (\"+\", \"-\"):\n        sign, s = s[0], s[1:].lstrip()\n      break\n  if not _LITERAL.fullmatch(s):\n    return None, used\n  if \",\" in s:\n    used.append(\"grouping\")\n  return decimal.Decimal(sign + s.replace(\",\", \"\")), used\n\n\ndef number(s):\n  return parse_number(s)[0]\n\n\ndef number_equal(pred, gold):\n  a, b = number(pred), number(gold)\n  return a is not None and b is not None and a == b\n\n\ndef boxed_math_v2(response, gold):\n  \"\"\"(reward, acc, fmt, format_credit, acc_v1) for one response; v1's boxed_math plus the number rule.\"\"\"\n  reward, acc_v1, fmt, credit = v1.boxed_math(response, gold)\n  if fmt == 1.0 and acc_v1 == 0.0 and number_equal(v1.extract_boxed(response), str(gold)):\n    return v1._SCORE, 1.0, 1.0, 0.0, acc_v1\n  return reward, acc_v1, fmt, credit, acc_v1\n\n\ndef compute_score(data_source, solution_str, ground_truth, extra_info=None, **kwargs):\n  out = v1.compute_score(data_source, solution_str, ground_truth, extra_info=extra_info, **kwargs)\n  acc_v1 = out[\"acc\"]\n  if out[\"fmt\"] == 1.0 and acc_v1 == 0.0 and number_equal(v1.extract_boxed(solution_str), str(ground_truth)):\n    out.update(score=v1._SCORE + out[\"length_penalty\"], reward_raw=v1._SCORE, acc=1.0, format_credit=0.0)\n  out.update(acc_v1=acc_v1, v2_only=out[\"acc\"] - acc_v1, scorer_version=SCORER_VERSION)\n  return out\n\n\n# Meta fixture cases whose v2 reward intentionally differs from Meta's expected value: case -> v2 reward.\nINTENTIONAL_DIVERGENCES = {\"decimal vs integer gold\": 1.0}\n\n# The rule by example: (boxed content, gold, expected v2 reward, expected v1 reward). Each content is scored as\n# \"... \\\\boxed{<content>}\". Shared by the self-test below and test_boxed_math_reward_v2.py.\nRULE_CASES = [\n    # --- credited by the v2 number rule (v1 gives the format score only)\n    (\"\\\\$18\", \"18\", 1.0, 0.1),                              # currency \\$ (v1 drops '$' but keeps the backslash)\n    (\"\\\\$26.00\", \"26\", 1.0, 0.1),                           # currency + exact value 26.00 == 26\n    (\"\\\\$70,000\", \"70000\", 1.0, 0.1),                       # currency + thousands grouping\n    (\"\\\\$1,450,000\", \"1,450,000\", 1.0, 0.1),                # gold with grouping\n    (\"-\\\\$5\", \"-5\", 1.0, 0.1),                              # sign before currency\n    (\"\\\\$-5\", \"-5\", 1.0, 0.1),                              # sign after currency\n    (\"\\u20ac77\", \"77\", 1.0, 0.1),                           # euro\n    (\"\\u00a377\", \"77\", 1.0, 0.1),                           # pound\n    (\"28.00\", \"28\", 1.0, 0.1),                              # exact value\n    (\"18.0\", \"18\", 1.0, 0.1),                               # exact value (Meta fixture says 0.1: divergence)\n    (\"60\\\\%\", \"60\", 1.0, 0.1),                              # percent\n    (\"60 \\\\%\", \"60\", 1.0, 0.1),\n    (\"49^\\\\circ\", \"49\", 1.0, 0.1),                          # degree\n    (\"49^{\\\\circ}\", \"49\", 1.0, 0.1),\n    (\"49\\u00b0\", \"49\", 1.0, 0.1),\n    (\"-10 \\\\text{ degrees Fahrenheit}\", \"-10\", 1.0, 0.1),   # unit, two words\n    (\"49^\\\\circ\\\\text{C}\", \"49\", 1.0, 0.1),                 # unit then degree\n    (\"540 \\\\text{ meters}\", \"540\", 1.0, 0.1),               # unit\n    (\"180,000 \\\\text{ meters}\", \"180000\", 1.0, 0.1),        # grouping + unit\n    (\"55 \\\\text{ meters per second}\", \"55\", 1.0, 0.1),      # unit, three words\n    (\"72 \\\\text{ Mb/hr}\", \"72\", 1.0, 0.1),                  # '/' inside a unit word\n    (\"72 \\\\text{ in}^3\", \"72\", 1.0, 0.1),                   # unit with exponent\n    (\"18 \\\\mathrm{kg}\", \"18\", 1.0, 0.1),\n    (\"18\\\\,\\\\text{kg}\", \"18\", 1.0, 0.1),                    # LaTeX thin space\n    (\"18~\\\\text{kg}\", \"18\", 1.0, 0.1),\n    (\"18 kg\", \"18\", 1.0, 0.1),                              # bare unit word\n    (\"18kg\", \"18\", 1.0, 0.1),\n    (\"18 more apples\", \"18\", 1.0, 0.1),                     # \"more\" alone is allowed (\"than\" is blocked)\n    (\"12 \\\\text{ quarters}\", \"12\", 1.0, 0.1),\n    (\"\\\\$18 \\\\text{ per hour}\", \"18\", 1.0, 0.1),            # unit + currency\n    (\"60\\\\% \\\\text{ off}\", \"60\", 1.0, 0.1),                 # unit + percent\n    (\"18 \\\\text{ hours}.\", \"18\", 1.0, 0.1),                 # trailing period\n    (\"\\\\text{18}\", \"18\", 1.0, 0.1),                         # wrapper\n    (\"\\\\textbf{\\\\$18}\", \"18\", 1.0, 0.1),                    # wrapper + currency\n    (\"\\\\text{18 hours}\", \"18\", 1.0, 0.1),                   # wrapper + bare unit\n    (\"1{,}000\", \"1000\", 1.0, 0.1),                          # LaTeX grouping\n    (\"1\\\\,000\", \"1000\", 1.0, 0.1),                          # thin-space grouping\n    # --- correct under v1 already (unchanged)\n    (\"18\", \"18\", 1.0, 1.0),\n    (\"1,080\", \"1080\", 1.0, 1.0),\n    (\"$42\", \"42\", 1.0, 1.0),\n    (\"\\\\frac{1}{2}\", \"\\\\frac{1}{2}\", 1.0, 1.0),             # v1 string match; v2's number rule never runs\n    (\"1,00\", \"100\", 1.0, 1.0),                              # inherited v1 comma deletion (step 5 alone rejects)\n    # --- format score under both: v2 must not turn these into correct answers\n    (\"\\\\$17\", \"18\", 0.1, 0.1),                              # wrong value\n    (\"18.5\", \"18\", 0.1, 0.1),                               # no tolerance\n    (\"\\\\$18.50\", \"18\", 0.1, 0.1),\n    (\"-\\\\$10,000\", \"10000\", 0.1, 0.1),                      # the sign counts\n    (\"\\\\$1,00\", \"100\", 0.1, 0.1),                           # invalid grouping (v1 keeps the backslash)\n    (\"\\\\$10,0000\", \"100000\", 0.1, 0.1),\n    (\"18 \\\\text{ and } 20\", \"18\", 0.1, 0.1),                # two numbers\n    (\"18 \\\\text{ and } 20\", \"20\", 0.1, 0.1),\n    (\"86 \\\\text{ glasses and } 42 \\\\text{ plates}\", \"42\", 0.1, 0.1),\n    (\"5 \\\\text{ (approx 18)}\", \"5\", 0.1, 0.1),              # not a unit phrase (digits, parentheses)\n    (\"5 \\\\text{ (approx 18)}\", \"18\", 0.1, 0.1),\n    (\"7 \\\\frac{1}{12} \\\\text{ hours (or approximately 7.08 hours)}\", \"7\", 0.1, 0.1),\n    (\"18 \\\\text{ hours and } 30 \\\\text{ minutes}\", \"18\", 0.1, 0.1),\n    (\"18 \\\\text{ or more}\", \"18\", 0.1, 0.1),                # blocked words\n    (\"18 \\\\text{ more than Bob}\", \"18\", 0.1, 0.1),\n    (\"18 \\\\text{ approximately}\", \"18\", 0.1, 0.1),\n    (\"18 \\\\text{ thousand}\", \"18\", 0.1, 0.1),\n    (\"18 \\\\text{ dozen}\", \"18\", 0.1, 0.1),\n    (\"18 \\\\text{ squared}\", \"18\", 0.1, 0.1),\n    (\"18k\", \"18\", 0.1, 0.1),\n    (\"18 M\", \"18\", 0.1, 0.1),\n    (\"18^2\", \"18\", 0.1, 0.1),                               # an exponent without a unit is not decoration\n    (\"\\\\frac{36}{2}\", \"18\", 0.1, 0.1),                      # fractions are not evaluated\n    (\"\\\\dfrac{88}{3}\", \"22\", 0.1, 0.1),\n    (\"6\\\\frac{2}{3}\", \"6\", 0.1, 0.1),\n    (\"1.8e1\", \"18\", 0.1, 0.1),\n    (\"2:00 \\\\text{ PM}\", \"2\", 0.1, 0.1),                    # times are not numbers\n    (\"x = 18\", \"18\", 0.1, 0.1),                             # no leading text\n    (\"\\\\text{about } 18\", \"18\", 0.1, 0.1),\n    (\"\\\\text{Blue car: \\\\$100, Red car: \\\\$60}\", \"160\", 0.1, 0.1),\n    (\"67\\\"\", \"67\", 0.1, 0.1),                               # symbol not on the whitelist\n    (\"18 \\\\text{ hours} \\\\text{ per day}\", \"18\", 0.1, 0.1),  # only ONE unit group is dropped\n    (\"\\\\$\\\\text{18}\", \"18\", 0.1, 0.1),\n    (\"...\", \"18\", 0.1, 0.1),\n]\n\n\ndef run_selftest(fx=None):\n  fx = fx or v1.META_FIXTURES\n  fails = []\n  for c in fx[\"reward_fixtures\"]:\n    want = INTENTIONAL_DIVERGENCES.get(c[\"case\"], c[\"reward\"])\n    r = boxed_math_v2(c[\"response\"], c[\"gold\"])[0]\n    ok = abs(r - want) < 1e-9\n    note = f\" (Meta {c['reward']}: intentional v2 divergence)\" if c[\"case\"] in INTENTIONAL_DIVERGENCES else \"\"\n    print(f\"{'OK ' if ok else 'FAIL'} {c['case']:<36} -> {r} (expected {want}){note}\")\n    fails += [] if ok else [c[\"case\"]]\n  for c in fx[\"overlong_fixtures\"]:\n    p = v1.overlong_penalty(c[\"completion_tokens\"])\n    ok = abs(p - c[\"penalty\"]) < 1e-5\n    print(f\"{'OK ' if ok else 'FAIL'} overlong {c['completion_tokens']:>5} tokens -> {p:+.6f} \"\n          f\"(expected {c['penalty']:+})\")\n    fails += [] if ok else [f\"overlong {c['completion_tokens']}\"]\n  tr = compute_score(\"gsm8k_boxed_train\", \"\\\\boxed{\\\\$18}\", \"18\", extra_info={\"index\": 0, \"response_len\": 2048})\n  ev = compute_score(\"gsm8k_boxed_test512\", \"\\\\boxed{\\\\$18}\", \"18\", extra_info={\"index\": 0, \"response_len\": 2048})\n  pen_on = \"gsm8k_boxed_train\" in v1._PENALTY_SOURCES and v1._OVERLONG_BUFFER > 0 and v1._MAX_RESP_LEN == 2048\n  want_tr = 0.0 if pen_on else 1.0\n  ok = (tr[\"score\"] == want_tr and tr[\"reward_raw\"] == 1.0 and tr[\"acc\"] == 1.0 and tr[\"acc_v1\"] == 0.0\n        and tr[\"v2_only\"] == 1.0 and ev[\"score\"] == 1.0 and ev[\"length_penalty\"] == 0.0\n        and tr[\"scorer_version\"] == SCORER_VERSION)\n  print(f\"{'OK ' if ok else 'FAIL'} v2 fields + penalty scope: train score {tr['score']} \"\n        f\"(raw 1.0, acc_v1 0, v2_only 1); eval score {ev['score']} (no penalty)\")\n  fails += [] if ok else [\"fields/penalty scope\"]\n  n_ok = 0\n  for content, gold, want2, want1 in RULE_CASES:\n    resp = f\"so the answer is \\\\boxed{{{content}}}\"\n    r2, r1 = boxed_math_v2(resp, gold)[0], v1.boxed_math(resp, gold)[0]\n    ok = abs(r2 - want2) < 1e-9 and abs(r1 - want1) < 1e-9\n    n_ok += ok\n    if not ok:\n      print(f\"FAIL rule case {content!r} vs {gold!r}: v2 {r2} (want {want2}), v1 {r1} (want {want1})\")\n      fails.append(f\"rule {content!r}/{gold!r}\")\n  print(f\"{'OK ' if n_ok == len(RULE_CASES) else 'FAIL'} rule cases {n_ok}/{len(RULE_CASES)}\")\n  return fails\n\n\nif __name__ == \"__main__\":\n  fx = None\n  if len(sys.argv) > 2 and sys.argv[1] == \"--fixtures\":\n    fx = json.load(open(sys.argv[2]))\n    print(f\"using fixtures from {sys.argv[2]}\")\n  fails = run_selftest(fx)\n  print(\"scorer:\", dict(version=SCORER_VERSION, v1_sha256=V1_SHA256, format_score=v1._FORMAT_SCORE,\n                        buffer=v1._OVERLONG_BUFFER, cap=v1._MAX_RESP_LEN, penalty_sources=sorted(v1._PENALTY_SOURCES)))\n  print(\"RESULT:\", \"PASS\" if not fails else f\"FAIL {fails}\")\n  raise SystemExit(0 if not fails else 1)\n"
  reward_parity_boxed.py: "\"\"\"Reward adapter: expose the frozen GPU scorer-v2 (boxed_math_reward_v2.compute_score)\nthrough the tunix/MaxText reward_fn interface for the gemma4-E2B GSM8K accuracy-parity run.\n\nCONTRACT (TPU_INSTRUCTIONS.md sec 3): scorer-v2 is the SINGLE reward for both training and\nevaluation. Exclusive levels: correct boxed answer = 1.0, parseable-but-wrong box = 0.1,\nno/unparseable box = 0.0. It is NOT accuracy + 0.1*format. acc (1/0) is the separate\nevaluation-accuracy signal, exposed as `compute_acc` for the eval metric so the parity curve\nmeasures the same quantity as the GPU reference (92.42% = fraction with acc==1), not mean score.\n\nThe scorer files (boxed_math_reward_v2.py + its hash-checked boxed_math_reward.py dependency)\nare mounted alongside this file at /workload/patches and imported by name. Hashes are verified\nagainst TPU_INSTRUCTIONS.md sec 2 at preflight: v2=933abb..., v1=a743cf....\n\ntunix calls reward_fn(prompts, completions, **kwargs) on CHUNKS of the batch and concatenates\nin order (see the straggler's reward-parallel patch); per-example independence makes chunking\nexact. The ground-truth column arrives as a per-example kwarg; we accept the common names.\n\"\"\"\n\nimport json\nimport os\nimport sys\n\n# The scorer modules are mounted next to this file; make that dir importable in every worker.\n_HERE = os.path.dirname(os.path.abspath(__file__))\nif _HERE not in sys.path:\n    sys.path.insert(0, _HERE)\n\nimport boxed_math_reward_v2 as _v2  # noqa: E402  (mounted scorer, hash-verified)\n\n_DATA_SOURCE = \"gsm8k_boxed_test\"  # value is informational to the scorer; kept stable\n\n\ndef _ground_truths(n, answer, kwargs):\n    \"\"\"Resolve the per-example ground-truth list from whatever column name the data\n    processor emitted. Must be length n (one per completion). Raises on mismatch rather\n    than silently scoring against the wrong gold.\"\"\"\n    gts = answer\n    if gts is None:\n        for key in (\"ground_truth\", \"gts\", \"answers\", \"target\", \"gt\"):\n            if key in kwargs and kwargs[key] is not None:\n                gts = kwargs[key]\n                break\n    if gts is None:\n        raise ValueError(\"reward_parity_boxed: no ground-truth kwarg found \"\n                         f\"(saw keys: {sorted(kwargs)})\")\n    # tunix batches dataset columns into numpy arrays (training path); eval passes a scalar/list.\n    # An ndarray is NOT a list -> the old code replicated the WHOLE array as every completion's\n    # gold -> every boxed answer scored 0.1 \"wrong\" and nothing ever scored 1.0 (found 2026-10-27\n    # via the RLMETRIC stdout mirror: rewards/max == 0.1 for all steps).\n    if hasattr(gts, \"tolist\") and not isinstance(gts, (str, bytes)):\n        gts = gts.tolist()\n    if not isinstance(gts, (list, tuple)):\n        gts = [gts] * n\n    if len(gts) != n:\n        raise ValueError(f\"reward_parity_boxed: gt length {len(gts)} != completions {n}\")\n    return gts\n\n\ndef _gold_str(gt):\n    \"\"\"The data processor emits each gold as a JSON list string, e.g. '[\"18\"]' (the harness\n    convention evaluate_rl.py json.loads). Parse it back to the bare gold the scorer expects;\n    accept a plain string or number too, for robustness.\"\"\"\n    if isinstance(gt, (int, float)):\n        return str(gt)\n    if isinstance(gt, (bytes, bytearray)):\n        gt = gt.decode(\"utf-8\", \"replace\")\n    s = str(gt)\n    try:\n        parsed = json.loads(s)\n        if isinstance(parsed, (list, tuple)) and parsed:\n            return str(parsed[0])\n        if isinstance(parsed, (str, int, float)):\n            return str(parsed)\n    except Exception:\n        pass\n    return s\n\n\ndef _score_one(completion, gt, want):\n    \"\"\"Return the requested field ('score' training reward, or 'acc' eval accuracy) for one\n    (completion, gold) pair. Fail-closed to 0.0 so a scorer exception can never inflate the\n    parity number.\"\"\"\n    try:\n        out = _v2.compute_score(\n            data_source=_DATA_SOURCE,\n            solution_str=completion,\n            ground_truth=_gold_str(gt),\n            extra_info=None,\n        )\n        return float(out[want])\n    except Exception as e:  # pragma: no cover - defensive\n        print(f\"reward_parity_boxed: scorer error ({e!r}); scoring 0.0\", flush=True)\n        return 0.0\n\n\n_DEBUGGED = [0]\n\n\ndef compute_score(prompts, completions, answer=None, **kwargs):\n    \"\"\"TRAINING reward: scorer-v2 score in {1.0, 0.1, 0.0}. One float per completion.\"\"\"\n    gts = _ground_truths(len(completions), answer, kwargs)\n    out = [_score_one(c, gts[i], \"score\") for i, c in enumerate(completions)]\n    if _DEBUGGED[0] < 3:  # one-time visibility of what the training scorer actually sees\n        _DEBUGGED[0] += 1\n        n1 = sum(1 for v in out if v >= 1.0); n01 = sum(1 for v in out if 0.0 < v < 1.0)\n        print(\"REWARD-DEBUG n=%d answer_type=%s gold0=%r gold_str0=%r n_correct=%d n_boxed_wrong=%d n_zero=%d tail0=%r\"\n              % (len(out), type(answer).__name__, (gts[0] if gts else None), _gold_str(gts[0]) if gts else None,\n                 n1, n01, len(out) - n1 - n01, str(completions[0])[-80:]), flush=True)\n    return out\n\n\ndef compute_acc(prompts, completions, answer=None, **kwargs):\n    \"\"\"EVALUATION accuracy: scorer-v2 acc in {1.0, 0.0} (correct boxed answer). The quantity\n    the GPU reference curve reports (step-250 mean 92.42%).\"\"\"\n    gts = _ground_truths(len(completions), answer, kwargs)\n    return [_score_one(c, gts[i], \"acc\") for i, c in enumerate(completions)]\n"
  gemma_data_parity.py: "\"\"\"Custom process_data for the gemma4-E2B GSM8K accuracy-parity run (dataset_processor_path hook).\n\nRenders the GSM8K-boxed prompt for the TPU checkpoint and passes the numeric ground truth\nthrough to the scorer-v2 reward adapter (reward_parity_boxed.py).\n\nMARKER DEVIATION (documented, forced by the checkpoint):\n  The GPU reference renders the *native gemma-4* chat template (<|turn> markers, stop id 106).\n  The TPU checkpoint (gemma4-e2b-raw2) outputs garbage under those ids (105/106 effectively\n  untrained in this conversion), so  -  exactly as the straggler harness did and the teammate's\n  39/39 smoke verified  -  we render gemma-3-STYLE TEXTUAL markers (<start_of_turn>/<end_of_turn>,\n  ordinary BPE pieces, not special tokens) and let generation stop at <eos> (id 1) or the cap.\n  This is a recipe deviation from the GPU prompt/stop protocol; its accuracy impact is settled\n  EMPIRICALLY by the step-0 eval (must land near the GPU step-0 mean 80.31% before any training).\n\nPROMPT (GSM8K-boxed contract, TPU_INSTRUCTIONS.md sec 2):\n  system = \"You are a helpful assistant. Please reason step by step, and put your final answer\n            within \\\\boxed{}.\"  (carried from the data's messages[0], not hard-coded)\n  user   = the GSM8K question (messages[1])\n  Rendered as a single user turn (system + question), since the gemma-3-style manual render has\n  no separate system role  -  the same structure the straggler used, with the boxed system text.\n\nGROUND TRUTH: the `answer` column (e.g. \"18\") is emitted verbatim as `answer` so the scorer-v2\nadapter scores against the exact gold. No OMI2 process_answer / json list (that was for\ncheck_numbers); scorer-v2 takes the raw gold string.\n\"\"\"\n\nimport json\n\n# Fallback only; the system text is normally taken from the data's system message.\n_BOXED_SYSTEM = (\"You are a helpful assistant. Please reason step by step, and put your final \"\n                 \"answer within \\\\boxed{}.\")\n_PRINTED = [False]\n\n\ndef _s(v):\n    return v.decode(\"utf-8\") if isinstance(v, bytes) else str(v)\n\n\ndef _extract(x):\n    \"\"\"Return (system_text, question_text, gold) from either the jsonl schema\n    (messages=[system,user], answer) or the verl parquet schema\n    (prompt=[{role,content}...] or question, reward_model.ground_truth / answer).\"\"\"\n    system_text, question_text, gold = None, None, None\n\n    # messages / prompt as a chat list\n    chat = x.get(\"messages\") if isinstance(x, dict) and \"messages\" in x else None\n    if chat is None and isinstance(x, dict) and isinstance(x.get(\"prompt\"), list):\n        chat = x[\"prompt\"]\n    if chat is not None:\n        for m in chat:\n            role = _s(m.get(\"role\", \"\"))\n            content = _s(m.get(\"content\", \"\"))\n            if role == \"system\":\n                system_text = content\n            elif role in (\"user\", \"human\"):\n                question_text = content\n\n    # flat question fields\n    if question_text is None:\n        for key in (\"problem\", \"question\", \"prompt\"):\n            if key in x and isinstance(x[key], (str, bytes)):\n                question_text = _s(x[key])\n                break\n\n    # ground truth\n    rm = x.get(\"reward_model\") if isinstance(x, dict) else None\n    if isinstance(rm, dict) and rm.get(\"ground_truth\") is not None:\n        gold = _s(rm[\"ground_truth\"])\n    if gold is None:\n        for key in (\"answer\", \"expected_answer\", \"ground_truth\", \"solution\"):\n            if key in x and x[key] is not None:\n                gold = _s(x[key])\n                break\n\n    # GSM8K (openai/gsm8k) answers are \"<worked solution>\\n#### <number>\"; the frozen gold is\n    # the final numeric after the last '####'. gsm8k_boxed parquets already store the bare\n    # number, which has no '####' and passes through unchanged.\n    if gold is not None and \"####\" in gold:\n        gold = gold.split(\"####\")[-1].strip()\n\n    if system_text is None:\n        system_text = _BOXED_SYSTEM\n    if question_text is None:\n        raise ValueError(f\"gemma_data_parity: no question found (keys: {sorted(x)})\")\n    if gold is None:\n        raise ValueError(f\"gemma_data_parity: no ground truth found (keys: {sorted(x)})\")\n    return system_text, question_text, gold\n\n\ndef process_data(dataset_name, model_tokenizer, template_config, tmvp_config, x):\n    system_text, question, gold = _extract(x)\n    # gemma-3-style textual markers (required by this checkpoint); single user turn.\n    prompt = (f\"<start_of_turn>user\\n{system_text}\\n\\n{question}<end_of_turn>\\n\"\n              f\"<start_of_turn>model\\n\")\n    # The harness (evaluate_rl.py) does json.loads(answer) and expects a LIST of acceptable\n    # answers (it dedups + math_verifies against it); the training reward_fn receives the same\n    # value. So emit a JSON list with the single gold. The reward adapter parses it back.\n    answer_field = json.dumps([gold])\n    if not _PRINTED[0]:\n        print(\"PARITY-PROMPT %r\" % prompt[:320], flush=True)\n        print(\"PARITY-GOLD   %r\" % answer_field, flush=True)\n        _PRINTED[0] = True\n    return {\"prompts\": prompt, \"question\": question, \"answer\": answer_field}\n"
  gemma_data_parity_native.py: "\"\"\"Native-template variant of the parity data processor: render the prompt with the tokenizer's\nown gemma-4 chat template (apply_chat_template -> the canonical <|turn> markers), instead of the\nmanual gemma-3-style <start_of_turn> markers. Used to probe whether gemma4-e2b-raw is the right\ninstruct model that simply needs the native markers (gemma4-e2b-raw scored ~0-2% under the\ngemma-3-style render). Matches the GPU contract: system + user, apply_chat_template once,\nadd_generation_prompt=True. Gold/#### extraction reused from gemma_data_parity.\n\"\"\"\n\nimport json\nimport os\nimport sys\n\n# MaxText's load_custom_callable execs this file without /workload/patches on sys.path, so the\n# sibling import below fails unless we add this file's dir first (same fix as the reward adapter).\n_HERE = os.path.dirname(os.path.abspath(__file__))\nif _HERE not in sys.path:\n    sys.path.insert(0, _HERE)\n\nimport gemma_data_parity as _base  # noqa: E402 (sibling module mounted in the same dir)\n\n_PRINTED = [False]\n\n\ndef process_data(dataset_name, model_tokenizer, template_config, tmvp_config, x):\n    system_text, question, gold = _base._extract(x)\n    try:\n        prompt = model_tokenizer.apply_chat_template(\n            [{\"role\": \"system\", \"content\": system_text},\n             {\"role\": \"user\", \"content\": question}],\n            tokenize=False, add_generation_prompt=True)\n    except Exception:\n        # Some gemma chat templates reject a system role; merge it into the user turn.\n        prompt = model_tokenizer.apply_chat_template(\n            [{\"role\": \"user\", \"content\": f\"{system_text}\\n\\n{question}\"}],\n            tokenize=False, add_generation_prompt=True)\n    # tunix's tokenize() adds BOS; strip a template-prepended BOS to avoid a double BOS.\n    for bos in (\"<bos>\", \"<|bos|>\", \"<|begin_of_text|>\"):\n        if prompt.startswith(bos):\n            prompt = prompt[len(bos):]\n            break\n    answer_field = json.dumps([gold])\n    if not _PRINTED[0]:\n        print(\"PARITY-PROMPT %r\" % prompt[:320], flush=True)\n        print(\"PARITY-GOLD   %r\" % answer_field, flush=True)\n        _PRINTED[0] = True\n    return {\"prompts\": prompt, \"question\": question, \"answer\": answer_field}\n"
  patch_sampler_is.py: "\"\"\"SAMPLER-IS (TIS parity), variant for image 2026-09-22-head (jax 0.11.0, vllm 0.28.1rc1) -- anchor A re-based; for tunix 0.1.8: enable token-level truncated importance sampling\non the STANDARD (offline-rollout) GrpoLearner by config, matching the frozen GPU recipe:\n\n    loss = -A * w * log\u03C0_\u03B8   (global token-mean; REINFORCE, no PPO-clip effect, no KL)\n    w    = min(exp(clamp(log\u03C0_actor.detach() - log\u03C0_sampler, -20, 20)), 3)   # detached, masked\n\ntunix 0.1.8's standard grpo_learner ALREADY computes sampler_is_weights with exactly this\nformula (rl/grpo/grpo_learner.py: log_ratio = trainer - rollout, clip +/-20, min(exp, threshold),\nstop_gradient, masked) and applies them in grpo_loss_fn -- gated on algo_config.sampler_is==\"token\".\nIt also needs the sampler's rollout logprobs (RolloutConfig.return_logprobs=True). The GPU-parity\ncontainer is tunix 0.1.8 (image @sha256:f7c957d0...), NOT 0.1.7. So NO tunix code patch is needed:\nMaxText's train_rl just has to (a) pass sampler_is / sampler_is_threshold into GrpoConfig and\n(b) enable return_logprobs on the offline RolloutConfig. This patch does exactly that.\n\nWith num_iterations=1 and sampler_is==\"token\", old_per_token_logps is set to the actor recompute\nso the PPO ratio is ~1 (clip inert); the sampler correction rides entirely on w -> -A*w*log\u03C0_\u03B8.\n\nFAIL-LOUD (exit!=0 so `set -e` kills the pod rather than training without TIS), idempotent,\nast-verified. Prints: TIS-PARITY PATCH: APPLIED | already patched | FAILED <reason>.\nRuntime self-check: grpo logs sampler_is/weight_min < 1.0 when TIS is active (==1.0 => inert).\n\"\"\"\n\nimport ast\nimport os\nimport sys\n\nTHRESHOLD = \"3.0\"  # GPU recipe caps w at 3 (upper only); tunix default is 2.0\n\n\ndef fail(msg):\n    print(f\"TIS-PARITY PATCH: FAILED {msg}\", flush=True)\n    sys.exit(1)\n\n\ndef find_train_rl():\n    try:\n        import maxtext\n    except Exception as e:\n        fail(f\"cannot import maxtext: {e}\")\n    root = os.path.dirname(maxtext.__file__)\n    p = os.path.join(root, \"trainers/post_train/rl/train_rl.py\")\n    if not os.path.exists(p):\n        fail(f\"train_rl.py not found at {p}\")\n    return p\n\n\nTR = find_train_rl()\nsrc = open(TR, encoding=\"utf-8\").read()\n\nif \"_TIS_PARITY\" in src:\n    print(\"TIS-PARITY PATCH: already patched\", flush=True)\n    sys.exit(0)\n\n# ---- A) forward sampler_is / sampler_is_threshold into the STANDARD GrpoConfig ----\n# image 2026-09-22-head: the GrpoConfig block gained `**_kwargs_supported_by(GrpoConfig, reward_num_workers=...)`\nA_ANCHOR = \"\"\"        loss_agg_mode=trainer_config.rl.loss_agg_mode,\n        **_kwargs_supported_by(\n            GrpoConfig,\n            reward_num_workers=trainer_config.reward_num_workers,\"\"\"\nA_REPLACE = \"\"\"        loss_agg_mode=trainer_config.rl.loss_agg_mode,\n        sampler_is=\"token\",  # _TIS_PARITY: token-level truncated IS (GPU frozen recipe)\n        sampler_is_threshold=%s,  # _TIS_PARITY: GPU caps w at 3 (upper only)\n        **_kwargs_supported_by(\n            GrpoConfig,\n            reward_num_workers=trainer_config.reward_num_workers,\"\"\" % THRESHOLD\n\n# ---- B) enable sampler logprobs on the offline RolloutConfig ----\nB_ANCHOR = (\n    '          **({\"return_logprobs\": True} if trainer_config.rl.use_agentic_rollout else {}),'\n)\nB_REPLACE = (\n    \"          return_logprobs=True,  # _TIS_PARITY: sampler per-token logprobs for token TIS\"\n)\n\n# ---- C) EVAL COVERAGE: score the FULL GPU eval set, not 10/11 batches. The eval dataset is\n# batched with drop_remainder=True; 1319 (prime) GSM8K test Qs @ bs=128 -> floor=10 batches=1280,\n# silently dropping the last 39 and making the accuracy denominator differ from the GPU's 1319.\n# The eval generate path is request-based vLLM (one request per prompt, no fixed-count/DP-divisibility\n# requirement -- verified), so a ragged final batch is safe. Flip ONLY the eval batch (keyed on\n# eval_batch_size_for_eval; the TRAIN batch keyed on trainer_config.batch_size is untouched).\nC_ANCHOR = \"    test_dataset = test_dataset.to_iter_dataset().batch(eval_batch_size_for_eval, drop_remainder=True)\"\nC_REPLACE = \"    test_dataset = test_dataset.to_iter_dataset().batch(eval_batch_size_for_eval, drop_remainder=False)  # _TIS_PARITY: full 1319 coverage vs GPU\"\n\n# ---- F) decouple ROLLOUT dtype from trainer weight_dtype. train_rl sets the vLLM rollout\n# \"dtype\" = trainer_config.weight_dtype.value; with weight_dtype=float32 (fp32 master) that makes\n# the rollout fp32 -> its KV cache is fp32 while attention k/v are bf16 -> RPA kernel ValueError\n# (kv_cache.dtype float32 != k/v bfloat16). Force the rollout to bf16 regardless of the trainer\n# master dtype (GPU recipe: fp32 master+Adam, BF16 compute AND bf16 rollout). ----\nF_ANCHOR = '\"dtype\": trainer_config.weight_dtype.value,'  # image 2026-09-22-head: 6-space indent inside rollout_vllm_kwargs\nF_REPLACE = '\"dtype\": \"bfloat16\",  # _TIS_PARITY: rollout bf16 (decoupled from fp32 trainer master)'\n\n# ---- H) tensorboard metrics to LOCAL disk. tensorboardX's GCSRecordWriter flushes the event file\n# from two threads (EventFileWriter background thread + main-thread flush) each with a GCS\n# ifGenerationMatch precondition; under the heavy eval(+checkpoint) traffic at step 40 they raced\n# into `412 PreconditionFailed` in the MAIN thread (rl_learner._prepare_data) and killed g4pt1.\n# The tensorboard RL metrics are not used for parity (stdout is), so write them locally. ----\nH_ANCHOR = (\n    \"  metrics_logging_options = metrics_logger.MetricsLoggerOptions(\\n\"\n    \"      log_dir=trainer_config.tensorboard_dir, flush_every_n_steps=trainer_config.log_period\\n\"\n    \"  )\"\n)\nH_REPLACE = (\n    \"  metrics_logging_options = metrics_logger.MetricsLoggerOptions(\\n\"\n    \"      log_dir=(os.makedirs(\\\"/tmp/tb_local\\\", exist_ok=True) or \\\"/tmp/tb_local\\\"),  # _TIS_PARITY: local TB (GCS 412 race)\\n\"\n    \"      flush_every_n_steps=trainer_config.log_period,\\n\"\n    \"  )\\n\"\n    \"  try:  # _TIS_PARITY: mirror every logged RL metric (loss/entropy/pg_clipfrac/kl/lr/...) to stdout\\n\"\n    \"    _tp_ML = metrics_logger.MetricsLogger\\n\"\n    \"    if not getattr(_tp_ML, '_tp_stdout', False):\\n\"\n    \"      _tp_ML._tp_orig_log = _tp_ML.log\\n\"\n    \"      def _tp_fmt(x):\\n\"\n    \"        try:\\n\"\n    \"          return '%.6g' % float(x)\\n\"\n    \"        except Exception:\\n\"\n    \"          return repr(x)[:80]\\n\"\n    \"      def _tp_log(self, *a, **k):\\n\"\n    \"        try:\\n\"\n    \"          print('RLMETRIC ' + ' '.join([_tp_fmt(x) for x in a] + ['%s=%s' % (kk, _tp_fmt(vv)) for kk, vv in k.items()]), flush=True)\\n\"\n    \"        except Exception:\\n\"\n    \"          pass\\n\"\n    \"        return _tp_ML._tp_orig_log(self, *a, **k)\\n\"\n    \"      _tp_ML.log = _tp_log\\n\"\n    \"      _tp_ML._tp_stdout = True\\n\"\n    \"  except Exception as _tp_e:\\n\"\n    \"    print('RLMETRIC-WRAP skipped: %r' % (_tp_e,), flush=True)\"\n)\n\n# ---- K) STOP AT THE RECIPE'S 250 UPDATES. MaxText derives train_steps = num_batches*num_iterations*\n# train_fraction*num_epoch (types.py) = 1250 with num_epoch=5, so the loop only ends on data exhaustion\n# (58*5 = 290 batches); steps 251-290 run at LR 0 (cosine schedule ends at 250). Cap max_steps at\n# num_batches so training stops at 250 and the post-training eval scores the step-250 weights. ----\nK_ANCHOR = \"          max_steps=trainer_config.train_steps,\\n\"\nK_REPLACE = \"          max_steps=min(trainer_config.train_steps, trainer_config.num_batches),  # _TIS_PARITY: stop at num_batches\\n\"\n\nfor anchor, label in ((A_ANCHOR, \"GrpoConfig\"), (B_ANCHOR, \"return_logprobs\"),\n                      (C_ANCHOR, \"eval_coverage\"), (F_ANCHOR, \"rollout_dtype\"),\n                      (H_ANCHOR, \"tb_local\"), (K_ANCHOR, \"max_steps_cap\")):\n    n = src.count(anchor)\n    if n != 1:\n        fail(f\"{label}: anchor count {n} != 1 in {TR}\")\nif \"\\nimport os\\n\" not in src and not src.startswith(\"import os\\n\"):\n    fail(\"train_rl.py has no `import os` (needed by tb_local edit)\")\n\nnew = (\n    src.replace(A_ANCHOR, A_REPLACE, 1)\n    .replace(B_ANCHOR, B_REPLACE, 1)\n    .replace(C_ANCHOR, C_REPLACE, 1)\n    .replace(F_ANCHOR, F_REPLACE, 1)\n    .replace(H_ANCHOR, H_REPLACE, 1)\n    .replace(K_ANCHOR, K_REPLACE, 1)\n)\ntry:\n    ast.parse(new)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\n\nopen(TR, \"w\", encoding=\"utf-8\").write(new)\nv = open(TR, encoding=\"utf-8\").read()\nif (\n    'sampler_is=\"token\"' not in v\n    or \"return_logprobs=True,  # _TIS_PARITY\" not in v\n    or \"drop_remainder=False)  # _TIS_PARITY\" not in v\n):\n    fail(\"verification markers missing after write\")\ntry:\n    ast.parse(v)\nexcept SyntaxError as e:\n    fail(f\"reparse failed: {e}\")\n\n# ---- D) stdout-print TIS weights in the standard learner (tensorboard RL metrics log as NaN;\n#         prove TIS is biting via stdout: weight_min<1 => active, line absent => inert) ----\ntry:\n    import tunix as _tnx\n    _GL = os.path.join(os.path.dirname(_tnx.__file__), \"rl/grpo/grpo_learner.py\")\nexcept Exception as e:\n    fail(f\"cannot locate tunix grpo_learner: {e}\")\ngsrc = open(_GL, encoding=\"utf-8\").read()\nif \"_TIS_STDOUT\" in gsrc:\n    print(\"TIS-PARITY PATCH: grpo_learner stdout already patched\", flush=True)\nelse:\n    # E) unconditional debug print right before the sampler_is block, to pinpoint which\n    #    guard fails (sampler_is value / rollout logprobs / trainer logprobs).\n    E_ANCHOR = (\n        '    if (\\n'\n        '        self.algo_config.sampler_is == \"token\"\\n'\n        '        and rollout_per_token_logps is not None\\n'\n        '        and trainer_per_token_logps is not None\\n'\n        '    ):'\n    )\n    E_REPLACE = (\n        '    print(\"TIS-DEBUG sampler_is=%r use_rollout_logps=%r roll_lp_set=%s train_lp_set=%s \"\\n'\n        '          \"ro_logprobs_set=%s\"\\n'\n        '          % (self.algo_config.sampler_is, self.algo_config.use_rollout_logps,\\n'\n        '             rollout_per_token_logps is not None, trainer_per_token_logps is not None,\\n'\n        '             (getattr(rollout_output, \"logprobs\", None) is not None)), flush=True)  # _TIS_STDOUT\\n'\n        + E_ANCHOR\n    )\n    _ne = gsrc.count(E_ANCHOR)\n    if _ne != 1:\n        fail(f\"grpo_learner TIS-DEBUG anchor count {_ne} != 1 in {_GL}\")\n    gsrc = gsrc.replace(E_ANCHOR, E_REPLACE, 1)\n\n    D_ANCHOR = (\n        '      self.rl_engine.buffer_metrics(\\n'\n        '          {\\n'\n        '              \"sampler_is/weight_mean\": (is_mean, np.mean),'\n    )\n    D_REPLACE = (\n        '      _tis_wmin = float(jnp.min(jnp.where(asst_mask_f > 0, sampler_is_weights, 1.0)))  # _TIS_STDOUT\\n'\n        '      _tis_w = jnp.exp(log_ratio) * asst_mask_f  # unclipped token weights (GPU ESS / k3 definitions)\\n'\n        '      _tis_ess = float(_tis_w.sum() ** 2 / jnp.maximum((_tis_w ** 2).sum() * mask_sum, 1e-12))\\n'\n        '      _tis_d = -log_ratio  # log(pi_sampler) - log(pi_trainer)\\n'\n        '      _tis_k3 = float(((jnp.exp(_tis_d) - _tis_d - 1.0) * asst_mask_f).sum() / mask_sum)\\n'\n        '      _tis_lrm = float((log_ratio * asst_mask_f).sum() / mask_sum)\\n'\n        '      _tis_lra = float((jnp.abs(log_ratio) * asst_mask_f).sum() / mask_sum)\\n'\n        '      print(\"TIS-ACTIVE weight_mean=%.5f weight_min=%.5f weight_max=%.5f frac_clipped=%.6f \"\\n'\n        '            \"k3_kl=%.4e ess=%.6f logratio_mean=%.4e logratio_absmean=%.4e ntok=%d\"\\n'\n        '            % (is_mean, _tis_wmin, is_max, frac_clipped, _tis_k3, _tis_ess, _tis_lrm, _tis_lra, int(mask_sum)), flush=True)\\n'\n        '      self.rl_engine.buffer_metrics(\\n'\n        '          {\\n'\n        '              \"sampler_is/weight_mean\": (is_mean, np.mean),'\n    )\n    n = gsrc.count(D_ANCHOR)\n    if n != 1:\n        fail(f\"grpo_learner stdout anchor count {n} != 1 in {_GL}\")\n    gsrc = gsrc.replace(D_ANCHOR, D_REPLACE, 1)\n    try:\n        ast.parse(gsrc)\n    except SyntaxError as e:\n        fail(f\"grpo_learner stdout patch does not parse: {e}\")\n    open(_GL, \"w\", encoding=\"utf-8\").write(gsrc)\n\n# ---- G) EVAL METRIC PARITY: print scorer-v2 `acc` for the eval set. MaxText's eval `accuracy`\n# (corr/total) comes from its OWN check_correctness (own extraction + math_verify), NOT scorer-v2;\n# `mean_reward` is the mean v2 score (1.0/0.1/0.0 exclusive) so acc_v2 is only bounded by it\n# ((mean-0.1)/0.9 <= acc <= mean). The GPU curve reports v2 acc (step0 80.31, step20 91.03,\n# step250 92.42). Accumulate reward_parity_boxed.compute_acc per (prompt,response) inside\n# evaluate() and log one `EVAL-V2ACC total=.. v2_acc=..%` line before the summary line. ----\nEV = os.path.join(os.path.dirname(TR), \"evaluate_rl.py\")\nif not os.path.exists(EV):\n    fail(f\"evaluate_rl.py not found at {EV}\")\nesrc = open(EV, encoding=\"utf-8\").read()\nif \"_TIS_PARITY\" in esrc:\n    print(\"TIS-PARITY PATCH: evaluate_rl already patched\", flush=True)\nelse:\n    G1_ANCHOR = (\n        \"  reward_sum = 0.0\\n\"\n        \"  reward_count = 0  # number of (prompt, sampled response) pairs scored\\n\"\n    )\n    G1_REPLACE = G1_ANCHOR + \"  _v2_acc_sum, _v2_acc_n, _v2_rows = 0.0, 0, []  # _TIS_PARITY: scorer-v2 acc + per-question rows\\n\"\n    G2_ANCHOR = (\n        \"        row_sum, row_count = _compute_row_reward(reward_fns, prompt, question, responses, answer, total)\\n\"\n        \"        reward_sum += row_sum\\n\"\n        \"        reward_count += row_count\\n\"\n    )\n    # Per-question record: what the GPU side's per-question eval dump carries (gold, extracted\n    # boxed answer, v2 score/acc/fmt, length) so TPU-vs-GPU can be diffed question by question.\n    G2_REPLACE = G2_ANCHOR + r'''        try:  # _TIS_PARITY: scorer-v2 acc + per-question record (GPU reference curve's metric)\n          import sys as _tp_sys, hashlib as _tp_hl\n          if \"/workload/patches\" not in _tp_sys.path:\n            _tp_sys.path.insert(0, \"/workload/patches\")\n          import reward_parity_boxed as _tp_rpb\n          _tp_gold = _tp_rpb._gold_str(answer)\n          for _tp_r in responses:\n            _tp_o = _tp_rpb._v2.compute_score(data_source=_tp_rpb._DATA_SOURCE, solution_str=_tp_r, ground_truth=_tp_gold, extra_info=None)\n            _v2_acc_sum += float(_tp_o[\"acc\"])\n            _v2_acc_n += 1\n            _v2_rows.append({\"i\": total, \"qhash\": _tp_hl.sha1(str(question).strip().encode()).hexdigest()[:12],\n                             \"gold\": _tp_gold, \"boxed\": _tp_rpb._v2.v1.extract_boxed(_tp_r),\n                             \"score\": float(_tp_o[\"score\"]), \"acc\": float(_tp_o[\"acc\"]), \"fmt\": float(_tp_o.get(\"fmt\", 0.0)),\n                             \"n_chars\": len(_tp_r), \"tail\": _tp_r[-80:]})\n        except Exception as _tp_e:  # pylint: disable=broad-exception-caught\n          max_logging.log(f\"[eval-v2acc] failed on row {total}: {_tp_e!r}\")\n'''\n    G3_ANCHOR = \"  # Prepare return values\\n\"\n    # Per-eval breakdown line + JSONL dump at <base_output_directory>/<run_name>/evals/eval_K.jsonl\n    # (K = eval call index: 0 = step-0, then every eval_interval). Fail-open: never breaks the eval.\n    G3_REPLACE = r'''  try:  # _TIS_PARITY: per-eval breakdown + per-question JSONL dump (for GPU comparison)\n    import json as _tp_json\n    from etils import epath as _tp_epath\n    _tp_n = max(_v2_acc_n, 1)\n    _tp_acc = sum(r[\"acc\"] for r in _v2_rows)\n    _tp_bw = sum(1 for r in _v2_rows if r[\"acc\"] == 0.0 and r[\"boxed\"] not in (None, \"\"))\n    _tp_nb = sum(1 for r in _v2_rows if r[\"boxed\"] in (None, \"\"))\n    _tp_mc = sum(r[\"n_chars\"] for r in _v2_rows) / _tp_n\n    _tp_k = getattr(evaluate, \"_tp_k\", 0)\n    evaluate._tp_k = _tp_k + 1\n    try:  # actual RL update step (restart-safe: a resumed process restarts the k counter)\n      _tp_step = int(rl_cluster.actor_trainer.train_steps)\n    except Exception:  # pylint: disable=broad-exception-caught\n      _tp_step = 20 * _tp_k\n    _tp_dir = f\"{str(getattr(tmvp_config, 'base_output_directory', '/tmp')).rstrip('/')}/{getattr(tmvp_config, 'run_name', 'run')}/evals\"\n    _tp_path = f\"{_tp_dir}/eval_{_tp_step:03d}.jsonl\"\n    _tp_epath.Path(_tp_dir).mkdir(parents=True, exist_ok=True)\n    _tp_epath.Path(_tp_path).write_text(\"\\n\".join(_tp_json.dumps(r) for r in _v2_rows) + \"\\n\")\n    max_logging.log(f\"EVAL-BREAKDOWN step={_tp_step} k={_tp_k} total={_v2_acc_n} acc={_tp_acc / _tp_n * 100:.2f}% boxed_wrong={_tp_bw / _tp_n * 100:.2f}% nobox={_tp_nb / _tp_n * 100:.2f}% mean_chars={_tp_mc:.0f} dump={_tp_path}\")\n  except Exception as _tp_e:  # pylint: disable=broad-exception-caught\n    max_logging.log(f\"[eval-dump] failed: {_tp_e!r}\")\n  max_logging.log(  # _TIS_PARITY\n      f\"EVAL-V2ACC total={_v2_acc_n} v2_acc={(_v2_acc_sum / _v2_acc_n * 100 if _v2_acc_n else 0.0):.4f}% \"\n      f\"mean_reward={(reward_sum / reward_count if (use_reward and reward_count > 0) else 0.0):.4f}\"\n  )\n''' + G3_ANCHOR\n    for anchor, label in ((G1_ANCHOR, \"v2acc_init\"), (G2_ANCHOR, \"v2acc_accum\"), (G3_ANCHOR, \"v2acc_print\")):\n        n = esrc.count(anchor)\n        if n != 1:\n            fail(f\"evaluate_rl {label}: anchor count {n} != 1 in {EV}\")\n    enew = esrc.replace(G1_ANCHOR, G1_REPLACE, 1).replace(G2_ANCHOR, G2_REPLACE, 1).replace(G3_ANCHOR, G3_REPLACE, 1)\n    try:\n        ast.parse(enew)\n    except SyntaxError as e:\n        fail(f\"patched evaluate_rl does not parse: {e}\")\n    open(EV, \"w\", encoding=\"utf-8\").write(enew)\n    if \"EVAL-V2ACC\" not in open(EV, encoding=\"utf-8\").read():\n        fail(\"evaluate_rl verification marker missing after write\")\n\n# ---- I) RESUMABLE CHECKPOINTS. Every restart after a mid-run save died in tunix\n# checkpoint_manager.maybe_restore: orbax v1 NoEntryError \"incompatible handler\" whose ROOT cause is\n# `ValueError: Unsupported dtype: key<fry>` -- nnx.state(model) includes the model's RNG stream\n# (typed jax.random keys) and the Pathways persistence array handler cannot describe that dtype on\n# load. Save and restore `model_params` WITHOUT RngState and allow a partial load (checkpoints already\n# written with keys still restore). Verified in the pinned image on CPU (orbax 0.12.1 / flax 0.12.8). ----\ntry:\n    _CM = os.path.join(os.path.dirname(_tnx.__file__), \"sft/checkpoint_manager.py\")\nexcept Exception as e:  # pylint: disable=broad-exception-caught\n    fail(f\"cannot locate tunix checkpoint_manager: {e}\")\ncsrc = open(_CM, encoding=\"utf-8\").read()\nif \"_TIS_PARITY\" in csrc:\n    print(\"TIS-PARITY PATCH: checkpoint_manager already patched\", flush=True)\nelse:\n    I1_ANCHOR = \"      params = nnx.state(model)\\n\"\n    I1_REPLACE = \"      params = nnx.state(model, nnx.Not(nnx.RngState))  # _TIS_PARITY: PRNG keys (key<fry>) are not loadable under Pathways\\n\"\n    I2_ANCHOR = (\n        \"      model_params_state = nnx.state(model)\\n\"\n        \"      load_ctx = self._context\\n\"\n    )\n    I2_REPLACE = (\n        \"      model_params_state = nnx.state(model, nnx.Not(nnx.RngState))  # _TIS_PARITY: see save()\\n\"\n        \"      load_ctx = ocp.Context(self._context)\\n\"\n        \"      load_ctx.pytree.loading.partial_load = True  # _TIS_PARITY: checkpoint may still carry the RNG entries\\n\"\n    )\n    for anchor, label in ((I1_ANCHOR, \"ckpt_save\"), (I2_ANCHOR, \"ckpt_restore\")):\n        n = csrc.count(anchor)\n        if n != 1:\n            fail(f\"checkpoint_manager {label}: anchor count {n} != 1 in {_CM}\")\n    cnew = csrc.replace(I1_ANCHOR, I1_REPLACE, 1).replace(I2_ANCHOR, I2_REPLACE, 1)\n    try:\n        ast.parse(cnew)\n    except SyntaxError as e:\n        fail(f\"patched checkpoint_manager does not parse: {e}\")\n    open(_CM, \"w\", encoding=\"utf-8\").write(cnew)\n\n# ---- J) RESUME SYNC. tunix syncs actor -> rollout weights only AFTER each update, so a process that\n# RESTORED a checkpoint generates its first batch (and runs its startup eval) with the rollout engine's\n# initial weights: seed-42 resume at step 160 showed TIS logratio_absmean 0.23 (normal 0.007), ESS 0.43,\n# and a startup eval equal to step 0. Push the restored actor weights to the rollout engine right after\n# the global step is restored, before any generation. ----\ntry:\n    _RL = os.path.join(os.path.dirname(_tnx.__file__), \"rl/rl_learner.py\")\nexcept Exception as e:  # pylint: disable=broad-exception-caught\n    fail(f\"cannot locate tunix rl_learner: {e}\")\nlsrc = open(_RL, encoding=\"utf-8\").read()\nif \"_TIS_PARITY\" in lsrc:\n    print(\"TIS-PARITY PATCH: rl_learner already patched\", flush=True)\nelse:\n    J_ANCHOR = (\n        \"    self.should_sync_weights = not (\\n\"\n        \"        rl_utils.is_sharing_weights(\\n\"\n        \"            self.rl_engine.actor_trainer.model,\\n\"\n        \"            self.rl_engine.rollout.model(),\\n\"\n        \"        )\\n\"\n        \"    )\\n\"\n    )\n    J_REPLACE = J_ANCHOR + (\n        \"    if self.rl_engine.global_steps > 0 and self.should_sync_weights:  # _TIS_PARITY: resumed run\\n\"\n        \"      print(\\\"RESUME-SYNC pushing restored actor weights (global_steps=%d) to the rollout engine before the first generation\\\"\\n\"\n        \"            % self.rl_engine.global_steps, flush=True)\\n\"\n        \"      self.rl_engine.sync_weights()\\n\"\n    )\n    n = lsrc.count(J_ANCHOR)\n    if n != 1:\n        fail(f\"rl_learner resume-sync anchor count {n} != 1 in {_RL}\")\n    lnew = lsrc.replace(J_ANCHOR, J_REPLACE, 1)\n    try:\n        ast.parse(lnew)\n    except SyntaxError as e:\n        fail(f\"patched rl_learner does not parse: {e}\")\n    open(_RL, \"w\", encoding=\"utf-8\").write(lnew)\n\nprint(\n    \"TIS-PARITY PATCH: APPLIED (train_rl: sampler_is=token thr=%s, return_logprobs=True, \"\n    \"eval full-coverage drop_remainder=False, rollout bf16, RLMETRIC stdout mirror; grpo_learner TIS-ACTIVE(+k3/ess) stdout; \"\n    \"evaluate_rl EVAL-V2ACC step-named dumps; checkpoint_manager RNG-free resumable ckpt; rl_learner resume-sync; max_steps=num_batches)\" % THRESHOLD,\n    flush=True,\n)\n"
  patch_newimg_fix.py: "\"\"\"KV-ALIAS-DEDUPE: fix gemma4-E2B/E4B gibberish rollouts on the 2026-09-22 image.\n\nRoot cause (maxtext/integration/vllm/hybrid_cache_utils.py, new image):\n`resolve_layer_kv_cache_indices` expands tpu-inference's `layer_name_to_kvcache_index`\ninto one entry PER LAYER, so KV-shared layers (gemma4-e2b: layers 15..34 -> donors 13/14)\nalias their donor's physical cache. MaxText's gemma4_small decoder indexes `kv_caches` by\ncompact SLOT (one per physical cache; nnx_decoders._apply_gemma4_small_layers /\ngemma4_small.kv_cache_slot_map) and writes updates only at slots 0..14. The adapter's\n`scatter_layer_kv_caches` then copies the untouched alias entries 15..34 -- the stale\npre-forward donor caches -- back over the donors' updates (\"highest-numbered layer wins\"),\nso layers 13 and 14 never persist any K/V and the 20 layers that share them attend over\nzeros. The old adapter passed the physical list straight through (no alias expansion).\n\nFix: present each physical cache exactly once, in first-use layer order (== MaxText slot\norder). Models without KV sharing have no aliases, so this is a no-op for them.\n\nFail-loud (exit 1 on anchor miss), idempotent, compile-checked.\n\"\"\"\nimport glob\nimport os\nimport sys\n\nMARK = \"_KV_ALIAS_DEDUPE\"\nCANDIDATES = [\n    \"/deps/src/maxtext/integration/vllm/hybrid_cache_utils.py\",\n    \"/app/src/maxtext/integration/vllm/hybrid_cache_utils.py\",\n    \"/usr/local/lib/python3.12/site-packages/maxtext/integration/vllm/hybrid_cache_utils.py\",\n]\n\nOLD = \"\"\"  physical_indices = [by_layer[lyr] for lyr in range(num_layers)]\n  out_of_range = [idx for idx in physical_indices if not 0 <= idx < num_kv_caches]\n\"\"\"\nNEW = \"\"\"  physical_indices = [by_layer[lyr] for lyr in range(num_layers)]\n  # _KV_ALIAS_DEDUPE: several layers may alias one physical cache (KV-shared\n  # layers redirect to their donor's slot, e.g. gemma4-e2b layers 15..34 ->\n  # 13/14). MaxText decoders index ``kv_caches`` by *slot*, one entry per\n  # physical cache in first-use layer order (gemma4_small.kv_cache_slot_map),\n  # so hand them each physical cache exactly once. Expanding the aliases\n  # instead made scatter_layer_kv_caches write the stale pre-forward donor\n  # cache back over the donor's update, so KV-shared layers never saw any\n  # K/V and decoding degenerated into repeated tokens.\n  physical_indices = list(dict.fromkeys(physical_indices))\n  out_of_range = [idx for idx in physical_indices if not 0 <= idx < num_kv_caches]\n\"\"\"\n\n\ndef main() -> int:\n  paths = [p for p in CANDIDATES if os.path.exists(p)]\n  override = os.environ.get(\"KV_ALIAS_DEDUPE_TARGET\")\n  if override:\n    paths = [override]\n  if not paths:\n    print(\"KV-ALIAS-DEDUPE: FAILED hybrid_cache_utils.py not found\", flush=True)\n    return 1\n  rc = 0\n  for fp in paths:\n    src = open(fp).read()\n    if MARK in src:\n      print(f\"KV-ALIAS-DEDUPE: already patched {fp}\", flush=True)\n      continue\n    n = src.count(OLD)\n    if n != 1:\n      print(f\"KV-ALIAS-DEDUPE: FAILED anchor count={n} in {fp}\", flush=True)\n      rc = 1\n      continue\n    new_src = src.replace(OLD, NEW)\n    compile(new_src, fp, \"exec\")\n    with open(fp, \"w\") as f:\n      f.write(new_src)\n    print(f\"KV-ALIAS-DEDUPE: APPLIED {fp}\", flush=True)\n  return rc\n\n\nif __name__ == \"__main__\":\n  sys.exit(main())\n"
  patch_runner_eos.py: "\"\"\"GEMMA4 line, stop fix part 2: the continuous-decode DEVICE loop stops rows via runner.eos_token_id\n(runner_utils.get_eos_token_id(model_config)) \u2014 the tunix/vLLM host-side stop_token_ids are irrelevant inside a CD window.\ng4-001d proved it: with stop ids [1,50,106] in sampling_params, step 0 was still 99.46% capped, byte-identical to 001c.\nUnion EXTRA_STOP_TOKEN_IDS into runner.eos_token_id (the CD masking and host extract already accept int-or-list).\nPrints RUNNER-EOS PATCH: APPLIED|FAILED and RUNNER-EOS ids=[...] at init.\"\"\"\nimport sys\nP = \"/usr/local/lib/python3.12/site-packages/tpu_inference/runner/tpu_runner.py\"\ns = open(P).read()\nif \"_RUNNER_EOS\" in s: print(\"RUNNER-EOS PATCH: already applied\", flush=True); sys.exit(0)\na = \"        self.eos_token_id = runner_utils.get_eos_token_id(self.model_config)\\n\"\nif s.count(a) != 1: print(\"RUNNER-EOS PATCH: FAILED anchor %d\" % s.count(a), flush=True); sys.exit(0)\nb = (\"        self.eos_token_id = runner_utils.get_eos_token_id(self.model_config)\\n\"\n     \"        # _RUNNER_EOS: union env EXTRA_STOP_TOKEN_IDS (chat-turn enders, e.g. gemma 106/50) into the CD stop set\\n\"\n     \"        import os as _re_os, json as _re_json\\n\"\n     \"        import numpy as _re_np\\n\"\n     \"        try:\\n\"\n     \"            _re_extra = [int(x) for x in _re_json.loads(_re_os.environ.get('EXTRA_STOP_TOKEN_IDS', '[]'))]\\n\"\n     \"        except Exception:\\n\"\n     \"            _re_extra = []\\n\"\n     \"        if _re_extra:\\n\"\n     \"            _re_base = self.eos_token_id\\n\"\n     \"            if _re_base is None:\\n\"\n     \"                _re_ids = _re_extra\\n\"\n     \"            elif isinstance(_re_base, (int, _re_np.integer)):\\n\"\n     \"                _re_ids = [int(_re_base)] + _re_extra\\n\"\n     \"            else:\\n\"\n     \"                _re_ids = [int(x) for x in _re_np.atleast_1d(_re_base).tolist()] + _re_extra\\n\"\n     \"            self.eos_token_id = tuple(sorted(set(_re_ids)))\\n\"\n     \"            print('RUNNER-EOS ids=%s' % (self.eos_token_id,), flush=True)\\n\")\ns = s.replace(a, b)\ncompile(s, P, \"exec\"); open(P, \"w\").write(s); print(\"RUNNER-EOS PATCH: APPLIED\", flush=True)"
  patch_verify_timeout.py: "\"\"\"Enable per-item math_verify timeouts to cap the reward-phase long tail.\n\nWHY. math_verify_pool.py grades each completion with parse(...,\nparsing_timeout=None) and verify(..., timeout_seconds=None) -- per-item\ntimeouts DISABLED. A single pathological expression (large nested fraction,\nunsimplifiable radical, malformed LaTeX) runs sympy unbounded until the GLOBAL\nbatch timeout (math_verify_timeout=120). One straggler holds up the parallel\npool, so the reward phase spikes (measured g4r11: 191/126/252s on 3 of 20\nsteps, vs ~10s median) -- the dominant contributor to the step-time MEAN\n(162 vs median 125).\n\nWHAT. Set the per-item parse/verify timeouts to VERIFY_ITEM_TIMEOUT seconds\n(default 5) instead of None. A pathological item then costs <=5s (marked\nwrong, like any grader failure) instead of running to the global cap. Bounds\nthe reward tail without changing grading of well-formed answers. math_verify\nuses signal-based timeouts, valid here because each item runs in its own pool\nWORKER PROCESS (main thread of that process). VERIFY_ITEM_TIMEOUT=0 keeps the\noriginal None (disabled) behavior.\n\nFAIL-OPEN. Prints exactly one of:\n    VERIFY-TIMEOUT PATCH: APPLIED\n    VERIFY-TIMEOUT PATCH: FAILED <reason>\n\"\"\"\nimport ast\nimport os\nimport sys\n\n\ndef fail(msg):\n    print(f\"VERIFY-TIMEOUT PATCH: FAILED {msg}\")\n    sys.exit(0)\n\n\ntry:\n    import importlib.util as _u\n    spec = _u.find_spec(\"maxtext\")\n    if spec is None or not spec.submodule_search_locations:\n        fail(\"cannot locate maxtext package\")\n    root = list(spec.submodule_search_locations)[0]\nexcept Exception as e:  # noqa: BLE001\n    fail(f\"maxtext import probe failed: {e}\")\n\nMP = os.path.join(root, \"trainers\", \"post_train\", \"rl\", \"math_verify_pool.py\")\nif not os.path.exists(MP):\n    fail(f\"{MP} not found\")\nsrc = open(MP, encoding=\"utf-8\").read()\nif \"_VT_ITEM\" in src:\n    print(\"VERIFY-TIMEOUT PATCH: already patched\")\n    sys.exit(0)\n\nn_parse = src.count(\"parsing_timeout=None\")\nn_verify = src.count(\"timeout_seconds=None\")\nif n_parse < 1 or n_verify < 1:\n    fail(f\"anchors missing (parsing_timeout=None x{n_parse}, timeout_seconds=None x{n_verify})\")\n\nsrc = src.replace(\"parsing_timeout=None\", \"parsing_timeout=_VT_ITEM\")\nsrc = src.replace(\"timeout_seconds=None\", \"timeout_seconds=_VT_ITEM\")\n\n# module-level: _VT_ITEM = int(env) or None if 0\ninject = (\n    \"import os as _vt_os\\n\"\n    \"_vt_v = _vt_os.environ.get('VERIFY_ITEM_TIMEOUT', '5')\\n\"\n    \"try:\\n\"\n    \"  _VT_ITEM = int(_vt_v) if int(_vt_v) > 0 else None\\n\"\n    \"except Exception:\\n\"\n    \"  _VT_ITEM = 5\\n\"\n)\n# place after the module docstring / first import block\nlines = src.split(\"\\n\")\nins_at = 0\nfor i, ln in enumerate(lines):\n    if ln.startswith(\"import \") or ln.startswith(\"from \"):\n        ins_at = i\n        break\nlines.insert(ins_at, inject)\nsrc = \"\\n\".join(lines)\n\ntry:\n    ast.parse(src)\nexcept SyntaxError as e:\n    fail(f\"patched source does not parse: {e}\")\nopen(MP, \"w\", encoding=\"utf-8\").write(src)\nv = open(MP, encoding=\"utf-8\").read()\nif \"_VT_ITEM\" not in v or \"timeout_seconds=None\" in v or \"parsing_timeout=None\" in v:\n    fail(\"re-verify failed\")\nprint(f\"VERIFY-TIMEOUT PATCH: APPLIED (VERIFY_ITEM_TIMEOUT={os.environ.get('VERIFY_ITEM_TIMEOUT','5(default)')})\")\n"
  patch_vllm_sampler.py: "\"\"\"Hotfix to disable prompt_logprobs in tunix vLLM Sampler and bypass vLLM V1 scheduler AssertionError.\"\"\"\n\nimport os\n\n# --- Patch 4: pathwaysutils profiling.py ---\nprint(\"Applying hotfix to pathwaysutils/profiling.py...\")\npaths4 = [\n    \"/usr/local/lib/python3.12/site-packages/pathwaysutils/profiling.py\",\n    \"/app/pathways-utils/pathwaysutils/profiling.py\",\n]\nfor p4 in paths4:\n  if os.path.exists(p4):\n    print(f\"Checking pathwaysutils file: {p4}\")\n    with open(p4, \"r\", encoding=\"utf-8\") as f:\n      c4 = f.read()\n\n    target4 = \"      _, result_future = _profile_state.executable.call()\"\n    replacement4 = (\n        \"      import jax\\n\"\n        \"      import jax.numpy as jnp\\n\"\n        \"      out_avals = ()\\n\"\n        \"      out_shardings = ()\\n\"\n        \"      _, result_future = _profile_state.executable.call(\\n\"\n        \"          out_avals=out_avals, out_shardings=out_shardings\\n\"\n        \"      )\"\n    )\n\n    modified4 = False\n    if target4 in c4:\n      c4 = c4.replace(target4, replacement4)\n      modified4 = True\n\n    target4_int = \"      elif isinstance(v, int):\\n\" '        advanced_config[k] = {\"intValue\": v}'\n    replacement4_int = \"      elif isinstance(v, int):\\n\" '        advanced_config[k] = {\"int64Value\": v}'\n    if target4_int in c4:\n      c4 = c4.replace(target4_int, replacement4_int)\n      modified4 = True\n\n    # traceSessionName is enabled now, bypassing replacement:\n    print(\"Retaining traceSessionName configuration in pathwaysutils.\")\n\n    target4_start = (\n        \"def start_trace(\\n\"\n        \"    log_dir: os.PathLike[str] | str,\\n\"\n        \"    *,\\n\"\n        \"    create_perfetto_link: bool = False,\\n\"\n        \"    create_perfetto_trace: bool = False,\\n\"\n        \"    profiler_options: jax.profiler.ProfileOptions | None = None,\\n\"\n        \"    max_num_hosts: int = 1,\\n\"\n        \") -> None:\"\n    )\n    replacement4_start = (\n        \"def start_trace(\\n\"\n        \"    log_dir: os.PathLike[str] | str,\\n\"\n        \"    *,\\n\"\n        \"    create_perfetto_link: bool = False,\\n\"\n        \"    create_perfetto_trace: bool = False,\\n\"\n        \"    profiler_options: jax.profiler.ProfileOptions | None = None,\\n\"\n        \"    max_num_hosts: int | None = None,\\n\"\n        \") -> None:\\n\"\n        \"  if max_num_hosts is None:\\n\"\n        \"    max_num_hosts = 16\"\n    )\n    if target4_start in c4:\n      c4 = c4.replace(target4_start, replacement4_start)\n      modified4 = True\n\n    target4_monkey = (\n        \"  def start_trace_patch(\\n\"\n        \"      log_dir,\\n\"\n        \"      create_perfetto_link: bool = False,\\n\"\n        \"      create_perfetto_trace: bool = False,\\n\"\n        \"      profiler_options: jax.profiler.ProfileOptions | None = None,\\n\"\n        \"      max_num_hosts: int = 1,\\n\"\n        \"  ) -> None:\"\n    )\n    replacement4_monkey = (\n        \"  def start_trace_patch(\\n\"\n        \"      log_dir,\\n\"\n        \"      create_perfetto_link: bool = False,\\n\"\n        \"      create_perfetto_trace: bool = False,\\n\"\n        \"      profiler_options: jax.profiler.ProfileOptions | None = None,\\n\"\n        \"      max_num_hosts: int | None = None,\\n\"\n        \"  ) -> None:\"\n    )\n    if target4_monkey in c4:\n      c4 = c4.replace(target4_monkey, replacement4_monkey)\n      modified4 = True\n\n    if modified4:\n      with open(p4, \"w\", encoding=\"utf-8\") as f:\n        f.write(c4)\n      print(f\"Hotfix successfully applied to {p4}.\")\n    else:\n      print(f\"Warning: target strings not found or already patched in {p4}.\")\n  else:\n    print(f\"Warning: {p4} not found.\")\n\n# --- Patch 5: tpu_inference tpu_runner.py ---\nprint(\"Applying hotfix to tpu_inference/runner/tpu_runner.py...\")\np5 = \"/usr/local/lib/python3.12/site-packages/tpu_inference/runner/tpu_runner.py\"\nif os.path.exists(p5):\n  with open(p5, \"r\", encoding=\"utf-8\") as f:\n    c5 = f.read()\n\n  # Simpler replacement to limit the size of req_id_kwargs to avoid nanobind limit\n  target5 = \", **req_id_kwargs):\"\n  replacement5 = \", **dict(list(req_id_kwargs.items())[:100])):\"\n\n  if target5 in c5:\n    c5 = c5.replace(target5, replacement5)\n    with open(p5, \"w\", encoding=\"utf-8\") as f:\n      f.write(c5)\n    print(\"Hotfix successfully applied to tpu_inference/runner/tpu_runner.py (limited req_id_kwargs).\")\n  else:\n    if \"dict(list(req_id_kwargs.items())\" in c5:\n      print(\"Hotfix already applied to tpu_inference/runner/tpu_runner.py.\")\n    else:\n      print(\"Warning: target string not found in tpu_runner.py.\")\nelse:\n  print(\"Warning: tpu_runner.py path not found.\")"
