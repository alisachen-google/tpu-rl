data:
  patch_cd_masking.py: |-
    """Continuous-batching decode window v2: no EOS early-exit AND inert masked slots.
    
    SUPERSEDES patch_cd_masking.py (contains both edits; do not apply v1).
    
    WHY v2 EXISTS. Runs 10-10f established, with per-request runtime evidence:
    - the deep window works mechanically (full depth, EOS recorded/extracted,
      every EOS-ending request retires; zombies=0, empty=0, inv=0);
    - yet sequences stop terminating in proportion to window depth
      (capped-at-8192: 24.0% stock / 35.7% depth-32 / 54.0-54.5% depth-128,
      3 replications each at step 0 with byte-identical prompts);
    - the failing population is per-sequence random, not rank- or
      movement-clustered, and zero vLLM preemptions occurred.
    
    The one remaining device-side channel that scales with masked iterations:
    after a sequence samples EOS, `_update_loop_state` re-feeds it
    `padding_token_id` at a FROZEN position. Every subsequent iteration the model
    recomputes that slot and WRITES PAD-DERIVED K/V AT THE FROZEN POSITION --
    overwriting the KV of the sequence's last real token, once per masked
    iteration. Stock never executes a single masked step (interval=1 exits the
    window first), so this write path is unexercised in production.
    
    THE FIX (edit 2): re-feed the slot's CURRENT input token instead of PAD.
    Same token, same frozen position, same context => the recomputed K/V is
    IDENTICAL to what is already stored: the write becomes idempotent and the
    masked slot provably inert. One line in `_run_one_step`:
    
        next_input_ids = jnp.where(new_active_mask, next_input_ids, ct)
    
    (active rows keep next_tokens; masked rows repeat their last input forever).
    `step_record_tokens` still records PAD for masked rows, so host extraction is
    unchanged. DP-padding rows already re-feed their initial token 0 at a frozen
    position -- also idempotent.
    
    Edit 1 (unchanged from v1): cond_fn exits on window exhausted OR all done,
    instead of breaking the fused loop on any EOS:
    
        return jnp.logical_and(i < max_decode_steps, jnp.any(active_mask))
    
    If truncation at depth 128 returns to ~24% with this patch, the PAD-KV
    overwrite was the poison and the full rollout win (~45 s/step measured in
    run 10c: ~1.3 s per 128-iteration window) unlocks. If it stays ~54%, the
    fault is inside the attention kernel's handling of mixed frozen/advancing
    metadata, and this escalates upstream with the full evidence chain.
    
    FAIL-OPEN. Any anchor mismatch prints FAILED and exits 0.
    Prints exactly one of:
        CD-MASK2 PATCH: APPLIED
        CD-MASK2 PATCH: FAILED <reason>
    """
    
    import ast
    import os
    import sys
    
    ROOT = "/usr/local/lib/python3.12/site-packages/tpu_inference"
    DL = os.path.join(ROOT, "runner/decode_loop.py")
    
    
    def fail(msg):
        print(f"CD-MASK2 PATCH: FAILED {msg}")
        sys.exit(0)
    
    
    if not os.path.exists(DL):
        fail(f"{DL} not found")
    src = open(DL, encoding="utf-8").read()
    
    if "_CD_MASK2" in src:
        print("CD-MASK2 PATCH: already patched")
        sys.exit(0)
    if "_CD_MASK_NO_EARLY_EXIT" in src:
        fail("v1 masking already applied; image should be fresh per pod")
    
    # ---- Edit 1: cond_fn (structural: def -> next def at same indent) ----------
    lines = src.splitlines(keepends=True)
    start = None
    for i, ln in enumerate(lines):
        if ln.strip().startswith("def cond_fn(carry):"):
            if start is not None:
                fail("multiple cond_fn definitions")
            start = i
    if start is None:
        fail("cond_fn not found")
    indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
    end = None
    for j in range(start + 1, len(lines)):
        s = lines[j]
        if s.strip() and not s.startswith(indent + " ") and s.startswith(indent) \
                and s.lstrip().startswith("def "):
            end = j
            break
    if end is None:
        fail("could not find the def following cond_fn")
    
    NEW_COND = (
        f"{indent}def cond_fn(carry):\n"
        f"{indent}    # _CD_MASK2 -- continuous-batching semantics: run the window to\n"
        f"{indent}    # its static depth (or until every sequence is done) instead of\n"
        f"{indent}    # breaking the fused loop on any EOS.\n"
        f"{indent}    _cd = _unpack(carry)\n"
        f"{indent}    _cd_i = _cd[0]\n"
        f"{indent}    _cd_active = _cd[2]\n"
        f"{indent}    # _CD_NOGLOBAL: no jnp.any(active) here -- it is a cross-DP\n"
        f"{indent}    # all-reduce every iteration; at window 512 x 128 devices the\n"
        f"{indent}    # chained collectives crash pathways workers at the sync boundary\n"
        f"{indent}    # (g4r21, 17 synchronized crashes; the reference recipe runs count-only).\n"
        f"{indent}    return _cd_i < max_decode_steps\n"
        f"\n")
    src = "".join(lines[:start]) + NEW_COND + "".join(lines[end:])
    
    # ---- Edit 2: idempotent masked-slot re-feed in _run_one_step ---------------
    ANCHOR = """        lp_ids_step = None
            lp_val_step = None
            lp_ranks_step = None
            if has_logprobs:"""
    if src.count(ANCHOR) != 1:
        fail(f"_run_one_step anchor count={src.count(ANCHOR)}")
    INSERT = """        # _CD_MASK2 -- inert masked slots. v1 re-fed padding_token_id at a
            # frozen position, so each masked iteration OVERWROTE the slot's last
            # real KV with PAD-derived KV. Re-feeding the slot's current input
            # token instead makes the recomputed K/V identical to what is stored:
            # the write is idempotent and the masked slot provably inert.
            next_input_ids = jnp.where(new_active_mask, next_input_ids, ct)
    
    """
    src = src.replace(ANCHOR, INSERT + ANCHOR)
    
    try:
        ast.parse(src)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")
    
    open(DL, "w", encoding="utf-8").write(src)
    
    v = open(DL, encoding="utf-8").read()
    problems = []
    if v.count("_CD_MASK2") < 2:
        problems.append("markers missing")
    if "should_check_eos" in v.split("def body_fn")[0].split("def cond_fn")[1]:
        problems.append("old cond_fn body still present")
    if "jnp.where(new_active_mask, next_input_ids, ct)" not in v:
        problems.append("re-feed line missing")
    try:
        ast.parse(v)
    except SyntaxError as e:
        problems.append(f"reparse failed: {e}")
    if problems:
        fail("; ".join(problems))
    print("CD-MASK2 PATCH: APPLIED")
    
  patch_cd_noeos.py: |-
    """Drop the per-iteration cross-DP EOS reduction in the CD loop (qwen3 item 4).
    
    WHY. Every decode iteration computes any_hit_eos = jnp.any(active & is_eos)
    over the dp-sharded batch -- a global scalar all-reduce per step -- and
    carries it in the while_loop state. With CONTINUE_DECODE_EOS_CHECK_INTERVAL=0
    (our benchmark setting) cond_fn is already `i < max_decode_steps` and NEVER
    reads the flag, but XLA does not dead-code loop-carried state: the g4r7b
    xplane still shows u32[] all-reduces + s32 permute chatter inside the window
    (~half the 14.9 ms device window is these small collectives).
    
    WHAT. When CD_NO_EOS_REDUCE=1 (checked at trace time), any_hit_eos becomes a
    static False -- the reduction and its carried state vanish from the compiled
    loop. active_mask updates (per-row, local) are untouched, so cd_masking /
    cd_report semantics are identical. Guard note: with the flag off the early
    exit could not trigger anyway at interval=0; do NOT set CD_NO_EOS_REDUCE=1
    together with a nonzero eos-check interval (the env default keeps stock
    behavior).
    
    FAIL-OPEN. Prints exactly one of:
        CD-NOEOS PATCH: APPLIED
        CD-NOEOS PATCH: FAILED <reason>
    """
    import ast
    import os
    import sys
    
    DL = "/usr/local/lib/python3.12/site-packages/tpu_inference/runner/decode_loop.py"
    
    
    def fail(msg):
        print(f"CD-NOEOS PATCH: FAILED {msg}")
        sys.exit(0)
    
    
    if not os.path.exists(DL):
        fail(f"{DL} not found")
    src = open(DL, encoding="utf-8").read()
    if "CD_NO_EOS_REDUCE" in src:
        print("CD-NOEOS PATCH: already patched")
        sys.exit(0)
    
    ANCHOR = "    any_hit_eos = jnp.any(jnp.logical_and(active_mask, is_eos))\n"
    if src.count(ANCHOR) != 1:
        fail(f"any_hit_eos anchor count {src.count(ANCHOR)}")
    REP = ("    if os.environ.get(\"CD_NO_EOS_REDUCE\", \"0\") == \"1\":\n"
           "        any_hit_eos = jnp.array(False)\n"
           "    else:\n"
           "        any_hit_eos = jnp.any(jnp.logical_and(active_mask, is_eos))\n")
    src = src.replace(ANCHOR, REP, 1)
    if "import os" not in src:
        src = src.replace("import ", "import os\nimport ", 1)
    
    try:
        ast.parse(src)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")
    open(DL, "w", encoding="utf-8").write(src)
    if "CD_NO_EOS_REDUCE" not in open(DL, encoding="utf-8").read():
        fail("re-verify failed")
    print("CD-NOEOS PATCH: APPLIED (CD_NO_EOS_REDUCE="
          f"{os.environ.get('CD_NO_EOS_REDUCE', '0(default)')})")
    
  patch_cd_proper.py: |-
    """Apply the PROPER continue-decode fix (PR #3374) to the installed tpu_inference.
    
    Mirrors https://github.com/vllm-project/tpu-inference/pull/3374 exactly:
    
      (a) models/common/model_loader.py -- build an options-free twin of run_model and
          expose it as `step_fn_no_options` on the model object, mirroring the torchax
          path in models/vllm/vllm_model_wrapper.py.
      (b) runner/decode_loop.py -- build the fused-decode loop jit lazily from
          get_step_fn_compiler_options() instead of a hardcoded 3-entry literal, so the
          fused program keeps all 5 options (incl. the SparseCore offload thresholds).
    
    Every edit asserts its anchor and re-verifies after writing. Prints exactly one of:
        CD-PROPER PATCH: APPLIED
        CD-PROPER PATCH: FAILED <reason>
    A FAILED line means the run proves nothing -- check it before reading any result.
    """
    
    import ast
    import os
    import sys
    
    SITE = os.environ.get("PATCH_ROOT", "/usr/local/lib/python3.12/site-packages")
    ROOT = os.path.join(SITE, "tpu_inference")
    ML = os.path.join(ROOT, "models/common/model_loader.py")
    DL = os.path.join(ROOT, "runner/decode_loop.py")
    
    
    def fail(msg):
        print(f"CD-PROPER PATCH: FAILED {msg}")
        sys.exit(0)  # non-fatal: let the run start so the failure is visible in logs
    
    
    def sub(text, old, new, what):
        if text.count(old) != 1:
            fail(f"[{what}] anchor found {text.count(old)} times, expected 1")
        return text.replace(old, new)
    
    
    # ---------------------------------------------------------------- (a) model_loader
    if not os.path.exists(ML):
        fail(f"{ML} not found")
    ml = open(ML, encoding="utf-8").read()
    
    if "step_fn_no_options" in ml and "run_model_no_options" in ml:
        print("CD-PROPER PATCH: model_loader already patched")
    else:
        if "\nimport functools\n" not in ml:
            ml = sub(ml, "from typing import Any, Optional\n",
                     "import functools\nfrom typing import Any, Optional\n",
                     "ml-import")
    
        ml = sub(
            ml,
            """    @jax.jit(
            out_shardings=(
                kv_cache_sharding,
                hidden_states_sharding,
                hidden_states_sharding,  # aux hidden states
                None,  # expert ids
            ),
            donate_argnums=1,  # 0 is state_leaves, 1 is kv_cache
            static_argnums=(
                6, 9, 10
            ),  # 6 is layer_name_to_kvcache_index, 9 is is_first_rank, 10 is is_last_rank
            compiler_options=get_step_fn_compiler_options(),
        )
        def run_model(state_leaves, *args):
            state = jax.tree_util.tree_unflatten(_state_treedef, state_leaves)
            model = nnx.merge(graphdef, state)
            return model(*args)
    """,
            """    def run_model_impl(state_leaves, *args):
            state = jax.tree_util.tree_unflatten(_state_treedef, state_leaves)
            model = nnx.merge(graphdef, state)
            return model(*args)
    
        run_model_jit = functools.partial(
            jax.jit,
            out_shardings=(
                kv_cache_sharding,
                hidden_states_sharding,
                hidden_states_sharding,  # aux hidden states
                None,  # expert ids
            ),
            donate_argnums=1,  # 0 is state_leaves, 1 is kv_cache
            static_argnums=(
                6, 9, 10
            ),  # 6 is layer_name_to_kvcache_index, 9 is is_first_rank, 10 is is_last_rank
        )
    
        run_model_no_options = run_model_jit(run_model_impl)
    
        run_model = run_model_jit(
            run_model_impl,
            compiler_options=get_step_fn_compiler_options(),
        )
    """,
            "ml-run_model")
    
        ml = sub(
            ml,
            """    def wrapped_model_fn(*args, **kwargs):
            if not model_supports_spec_step:
                kwargs.pop("spec_step_idx", None)
            kwargs.pop("shared_attention_metadata", None)
            return jitted_model_fn(*args, **kwargs)
    """,
            """    def wrapped_model_fn(*args, **kwargs):
            if not model_supports_spec_step:
                kwargs.pop("spec_step_idx", None)
            kwargs.pop("shared_attention_metadata", None)
            return jitted_model_fn(*args, **kwargs)
    
        jitted_model_fn_no_options = (run_draft_model
                                      if is_draft_model else run_model_no_options)
    
        def wrapped_model_fn_no_options(*args, **kwargs):
            if not model_supports_spec_step:
                kwargs.pop("spec_step_idx", None)
            kwargs.pop("shared_attention_metadata", None)
            return jitted_model_fn_no_options(*args, **kwargs)
    """,
            "ml-wrapper")
    
        ml = sub(
            ml,
            """    return ModelInterface(
            model_fn=wrapped_model_fn,""",
            """    jit_model.step_fn_no_options = wrapped_model_fn_no_options
    
        return ModelInterface(
            model_fn=wrapped_model_fn,""",
            "ml-attach")
    
        try:
            ast.parse(ml)
        except SyntaxError as e:
            fail(f"[model_loader] patched source does not parse: {e}")
        open(ML, "w", encoding="utf-8").write(ml)
    
    # ---------------------------------------------------------------- (b) decode_loop
    if not os.path.exists(DL):
        fail(f"{DL} not found")
    dl = open(DL, encoding="utf-8").read()
    
    if "_get_decode_core" in dl:
        print("CD-PROPER PATCH: decode_loop already patched")
    else:
        dl = sub(
            dl,
            """from tpu_inference.layers.common.attention_metadata import (
        AttentionMetadata, SharedAttentionMetadata)""",
            """from tpu_inference.layers.common.attention_metadata import (
        AttentionMetadata, SharedAttentionMetadata)
    from tpu_inference.models.common.compiler_options import \\
        get_step_fn_compiler_options""",
            "dl-import")
    
        STATIC = """    static_argnames=(
            "model_fn",
            "compute_logits_fn",
            "sample_fn",
            "mesh",
            "static_max_decode_steps",
            "eos_token_id",
            "padding_token_id",
            "dp_size",
            "pad_len",
            "has_experts",
            "expert_shape",
            "expert_dtype",
            "layer_name_to_kvcache_index",
            "is_first_rank",
            "is_last_rank",
            "max_logprobs",
            "logprobs_mode",
            "continue_decode_eos_check_interval",
        ),
        donate_argnames=("kv_caches", ),"""
    
        old_dec = ("@functools.partial(\n    jax.jit,\n" + STATIC + """
        # Hoisted here from the model's step_fun: JAX forbids compiler_options on
        # a nested jit, so they must live on this top-level loop jit instead.
        compiler_options={
            "xla_tpu_all_gather_collective_matmul_mode": "post_spmd_conservative",
            "xla_tpu_reduce_scatter_collective_matmul_mode":
            "post_spmd_conservative",
            "xla_tpu_use_minor_sharding_for_major_trivial_input": "true"
        },
    )
    def _decode_core(
    """)
        dl = sub(dl, old_dec, "def _decode_core_impl(\n", "dl-decorator")
    
        factory = ("@functools.lru_cache(maxsize=1)\ndef _get_decode_core():\n"
                   "    return functools.partial(\n        jax.jit,\n"
                   + STATIC.replace("    static_argnames", "        static_argnames")
                   .replace('        "model_fn"', '            "model_fn"')
                   + "\n        compiler_options=get_step_fn_compiler_options(),\n"
                   "    )(_decode_core_impl)\n\n\n")
        # rebuild the static block with consistent 8-space indent instead of string surgery
        inner = "\n".join(("    " + ln) if ln.strip() else ln
                          for ln in STATIC.split("\n"))
        factory = ("@functools.lru_cache(maxsize=1)\n"
                   "def _get_decode_core():\n"
                   "    # Built lazily (the \"auto\" SparseCore threshold needs live devices) and\n"
                   "    # cached so the jit is constructed once, not per decode step.\n"
                   "    return functools.partial(\n"
                   "        jax.jit,\n"
                   + inner + "\n"
                   "        compiler_options=get_step_fn_compiler_options(),\n"
                   "    )(_decode_core_impl)\n\n\n")
        dl = sub(dl, "def continue_decode(\n", factory + "def continue_decode(\n",
                 "dl-factory")
    
        dl = sub(dl, "lp_ranks_buffer) = _decode_core(",
                 "lp_ranks_buffer) = _get_decode_core()(", "dl-callsite")
    
        try:
            ast.parse(dl)
        except SyntaxError as e:
            fail(f"[decode_loop] patched source does not parse: {e}")
        open(DL, "w", encoding="utf-8").write(dl)
    
    # ---------------------------------------------------------------- verify
    ml2 = open(ML, encoding="utf-8").read()
    dl2 = open(DL, encoding="utf-8").read()
    problems = []
    if "jit_model.step_fn_no_options = wrapped_model_fn_no_options" not in ml2:
        problems.append("step_fn_no_options not attached")
    if "run_model_no_options = run_model_jit(run_model_impl)" not in ml2:
        problems.append("options-free twin missing")
    if "_get_decode_core()(" not in dl2:
        problems.append("decode_loop call site not rewired")
    if "compiler_options=get_step_fn_compiler_options()," not in dl2:
        problems.append("decode_loop still not sourcing options from the function")
    if '"xla_tpu_use_minor_sharding_for_major_trivial_input": "true"' in dl2:
        problems.append("decode_loop hardcoded literal still present")
    
    if problems:
        fail("; ".join(problems))
    print("CD-PROPER PATCH: APPLIED")
  patch_cd_report.py: |-
    """Report each sequence's real newest token, not the window's last row.
    
    THE BUG THIS FIXES (diagnosed from run 10, which was VOID because of it).
    
    tpu_runner.py tells the host what each sequence's newest token is by reading ONE row
    of the fused window's token buffer -- the window's last:
    
        last_step_idx = clip(final_state.step_counter - 1, 0, static_max_decode_steps - 1)
        next_tokens_in_tpu = generated_tokens[last_step_idx, arange(batch)]
    
    That is only correct because the window STOPS IMMEDIATELY after any sequence emits EOS.
    `any_hit_eos` is therefore not a performance heuristic -- it is load-bearing for
    correctness, and the single-row protocol is why the break has to be global rather than
    per-sequence.
    
    Once the window keeps running (patch_cd_masking.py), a sequence that finishes mid-window
    is masked for the remaining iterations and `step_record_tokens` writes padding:
    
        rows:  [t0 t1 t2 t3 t4 EOS PAD PAD ... PAD]
                                ^              ^
                           correct        what the host reads
    
    So the host sees a padding token, concludes the sequence is still generating, never
    retires it, and RE-SEEDS the next window from a padding token. The model happily
    continues from that seed, producing fluent text that never terminates. Measured on
    run 10: OSL 3750 -> 5700, truncation 25% -> 58%, reward 0.146 -> 0.053.
    
    Termination becomes a lottery -- a sequence only ends if its EOS happens to land on the
    window's final row.
    
    THE FIX. Take each sequence's LAST NON-PADDING row instead of the window's last row.
    The buffer contents are untouched; only the derivation of "newest token" changes.
    
        real   = (generated_tokens != pad_token_id) & (row < step_counter)
        last   = max over rows of (row where real else 0)
        tokens = generated_tokens[last, arange(batch)]
    
    THIS ALSO EXPLAINS A RESULT WE FILED WRONGLY. `CONTINUE_DECODE_EOS_CHECK_INTERVAL=8`
    was measured 3x SLOWER (02-cdint8: ~2157 s vs 719.2 s) and recorded in FINDINGS as
    "holding the loop prevents the scheduler retiring finished sequences, so useful work per
    iteration collapses". That is the SAME BUG in milder form: at interval 8, a sequence
    emitting EOS at iteration 2 is masked through iteration 7, so row 7 is padding and the
    host misses the EOS exactly as above. The lever was never inherently bad -- it hit this
    reporting bug. Fixing the report should revive it AND max_decode_steps together.
    
    ORDERING. Independent of patch_cd_masking.py (different file), but pointless without it.
    
    FAIL-OPEN. Any anchor mismatch prints FAILED and exits 0.
    Prints exactly one of:
        CD-REPORT PATCH: APPLIED
        CD-REPORT PATCH: FAILED <reason>
    """
    
    import ast
    import os
    import re
    import sys
    
    ROOT = "/usr/local/lib/python3.12/site-packages/tpu_inference"
    TR = os.path.join(ROOT, "runner/tpu_runner.py")
    
    
    def fail(msg):
        print(f"CD-REPORT PATCH: FAILED {msg}")
        sys.exit(0)
    
    
    if not os.path.exists(TR):
        fail(f"{TR} not found")
    src = open(TR, encoding="utf-8").read()
    
    if "_CD_REPORT_LAST_REAL_TOKEN" in src:
        print("CD-REPORT PATCH: already patched")
        sys.exit(0)
    
    for name in ("self.pad_token_id", "self.static_max_decode_steps",
                 "def _execute_continue_decode"):
        if name not in src:
            fail(f"expected '{name}' not present in tpu_runner.py")
    
    # Whitespace-tolerant: match the two statements as one block.
    PAT = re.compile(
        r"^([ \t]*)last_step_idx\s*=\s*jnp\.clip\(\s*final_state\.step_counter\s*-\s*1,.*?\)\s*\n"
        r"[ \t]*next_tokens_in_tpu\s*=\s*generated_tokens\[\s*\n?"
        r"[ \t]*last_step_idx,\s*\n?"
        r"[ \t]*jnp\.arange\(generated_tokens\.shape\[1\]\)\]\s*\n",
        re.M | re.S)
    m = PAT.search(src)
    if not m:
        fail("could not match the last_step_idx / next_tokens_in_tpu block")
    if len(PAT.findall(src)) != 1:
        fail(f"block matched {len(PAT.findall(src))} times, expected 1")
    ind = m.group(1)
    
    NEW = (
        f"{ind}# _CD_REPORT_LAST_REAL_TOKEN -- see patch_cd_report.py.\n"
        f"{ind}# Reading ONE row (the window's last) is only correct when the window\n"
        f"{ind}# stops right after an EOS. With a continuous-batching window a finished\n"
        f"{ind}# sequence has PADDING in that row, so the host misses its EOS, never\n"
        f"{ind}# retires it, and re-seeds it from a padding token. Take each sequence's\n"
        f"{ind}# last NON-PADDING row instead. Buffer contents are untouched.\n"
        f"{ind}_cd_nsteps = jnp.clip(final_state.step_counter, 1,\n"
        f"{ind}                      self.static_max_decode_steps)\n"
        f"{ind}_cd_rows = jnp.arange(generated_tokens.shape[0])[:, None]\n"
        f"{ind}_cd_real = jnp.logical_and(\n"
        f"{ind}    generated_tokens != self.pad_token_id,\n"
        f"{ind}    _cd_rows < _cd_nsteps)\n"
        f"{ind}_cd_last = jnp.max(jnp.where(_cd_real, _cd_rows, 0), axis=0)\n"
        f"{ind}next_tokens_in_tpu = generated_tokens[\n"
        f"{ind}    _cd_last,\n"
        f"{ind}    jnp.arange(generated_tokens.shape[1])]\n")
    
    src = src[:m.start()] + NEW + src[m.end():]
    
    try:
        ast.parse(src)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")
    
    open(TR, "w", encoding="utf-8").write(src)
    
    v = open(TR, encoding="utf-8").read()
    problems = []
    if "_CD_REPORT_LAST_REAL_TOKEN" not in v:
        problems.append("marker missing")
    if "last_step_idx" in v:
        problems.append("old last_step_idx still referenced")
    if v.count("next_tokens_in_tpu = generated_tokens[") != 1:
        problems.append("next_tokens_in_tpu assignment count wrong")
    if "_cd_last" not in v:
        problems.append("new gather missing")
    try:
        ast.parse(v)
    except SyntaxError as e:
        problems.append(f"reparse failed: {e}")
    if problems:
        fail("; ".join(problems))
    print("CD-REPORT PATCH: APPLIED")
    
