    print("PHASETIME2 PATCH: APPLIED")
  patch_profiler_fix.py: |-
    """_PROFILER_FIX: disable the tunix trainer profiler when its step window is
    invalid. In the RL setup the PeftTrainer is built with initial_step==max_step
    (=num_batches*grad_accum, e.g. 160), so first_profile_step = initial_step +
    skip_first_n_steps (161) > last_profile_step (160) -> ValueError crash at
    tunix/sft/profiler.py __init__. This trainer profiler yields no HBM/roofline
    for us (we use the PERF-V2 phased profiler for the rollout); disable it cleanly
    instead of crashing. Fail-open, idempotent."""
    def _patch():
        try:
            import tunix.sft.profiler as P
            fp = P.__file__
            src = open(fp).read()
            if "_PROFILER_FIX" in src:
                print("PROFILER-FIX: already applied", flush=True); return
            anchor = ('    if self._first_profile_step >= self._last_profile_step:\n'
                      '      raise ValueError(\n'
                      '          f"First profile step {self._first_profile_step} cannot be greater"\n'
                      '          f" than the last profile step {self._last_profile_step}."\n'
                      '      )\n')
            repl = ('    if self._first_profile_step >= self._last_profile_step:\n'
                    '      # _PROFILER_FIX invalid window -> disable trainer profiler, do not crash\n'
                    '      self._first_profile_step = 1000000000\n'
                    '      self._last_profile_step = 1000000001\n')
            n = src.count(anchor)
            if n == 1:
                src = src.replace(anchor, repl, 1)
                compile(src, fp, "exec"); open(fp, "w").write(src)
                print("PROFILER-FIX: disabled invalid-window trainer profiler", flush=True)
            else:
                print("PROFILER-FIX: anchor count %d (skipped)" % n, flush=True)
        except Exception as e:
            print("PROFILER-FIX: failed %r" % (e,), flush=True)
    _patch()
    
  patch_reward_dump.py: |-
    """Per-item reward diagnostics dump (REWARD-DUMP lines).
    
    Appends wrappers in utils_rl so each step prints, for the first REWARD_DUMP_N items,
    one line pairing everything a reward audit needs:
        REWARD-DUMP step-local i=K fmt=<match_format_exactly score> score=<check_numbers score>
            guess=<extracted answer> gold=<target answers> n_chars=<len> tail=<last 40 chars>
    Gated by env REWARD_DUMP_N (default 0 = silent; DL_RWDUMP knob). Applied AFTER
    patch_g4_format_guard so it wraps the final bindings.
    FAIL-OPEN. Prints REWARD-DUMP PATCH: APPLIED | FAILED <reason>."""
    import sys
    P = "/deps/src/maxtext/trainers/post_train/rl/utils_rl.py"
    s = open(P).read()
    if "_REWARD_DUMP" in s:
        print("REWARD-DUMP PATCH: already applied", flush=True); sys.exit(0)
    for name in ("def check_numbers(", "def match_format_exactly("):
        if name not in s:
            print("REWARD-DUMP PATCH: FAILED anchor %s" % name, flush=True); sys.exit(0)
    s += r'''
    # --- _REWARD_DUMP ----------------------------------------------------------------
    import os as _rd_os
    _RD_N = int(_rd_os.environ.get("REWARD_DUMP_N", "0"))
    _RD_FMT = {"scores": None}
    _rd_orig_mfe = match_format_exactly
    def match_format_exactly(prompts, completions, tmvp_config, **kargs):  # noqa: F811
        r = _rd_orig_mfe(prompts, completions, tmvp_config, **kargs)
        try:
            _RD_FMT["scores"] = list(r)
        except Exception:
            _RD_FMT["scores"] = None
        return r
    _rd_orig_cn = check_numbers
    def check_numbers(prompts, completions, answer, tmvp_config, **kargs):  # noqa: F811
        r = _rd_orig_cn(prompts, completions, answer, tmvp_config, **kargs)
        if _RD_N > 0:
            try:
                fmt = _RD_FMT["scores"] or []
                for i in range(min(_RD_N, len(completions))):
                    c = completions[i]
                    try:
                        guess = extract_answer(c, tmvp_config)
                    except Exception as _e:
                        guess = "<extract-error:%r>" % (_e,)
                    # compute fmt inline (pool workers hide the wrapped fn's scores)
                    try:
                        _rs = "" if getattr(tmvp_config, "reasoning_start_token_in_prompt", False) else tmvp_config.reasoning_start_token
                        _ok = False
                        _i0 = c.find(_rs) if _rs else 0
                        if _i0 >= 0:
                            _j = c.find(tmvp_config.reasoning_end_token, _i0 + len(_rs))
                            if _j >= 0:
                                _k = c.find(tmvp_config.solution_start_token, _j)
                                if _k >= 0 and c.find(tmvp_config.solution_end_token, _k + 1) >= 0:
                                    _ok = True
                        _fmt_v = round(float(tmvp_config.reward_exact_format_match), 4) if _ok else 0.0
                    except Exception:
                        _fmt_v = "?"
                    print("REWARD-DUMP i=%d fmt=%s score=%s guess=%r gold=%r n_chars=%d tail=%r" % (
                        i, _fmt_v,
                        round(float(list(r)[i]), 4), str(guess)[:60], str(answer[i])[:60],
                        len(c), c[-40:]), flush=True)
            except Exception as _e:
                print("REWARD-DUMP ERROR: %r" % (_e,), flush=True)
        return r
    '''
    compile(s, P, "exec"); open(P, "w").write(s)
    print("REWARD-DUMP PATCH: APPLIED (REWARD_DUMP_N=%s)" % __import__('os').environ.get("REWARD_DUMP_N", "0(default)"), flush=True)
    
  patch_reward_parallel.py: |-
    """Parallelize the GRPO reward functions across processes.
    
    WHY. Phasetime v2 (run 11) measured the ~30 s `other` residual as almost
    entirely `compute_rewards` (29.77 s at step 1; marshal+advantage is 0.3 s).
    The reward functions (match_format_*, check_numbers) are pure-Python
    regex/parsing over 2048 independent (prompt, completion) pairs, run serially
    on one core while 28-44 head-node cores idle. Expected: ~30 s -> 2-4 s,
    i.e. step ~157 s -> ~132 s.
    
    HOW. Append-and-monkeypatch on tunix/rl/reward_manager.py:
    `SequenceRewardManager._compute_rewards` is replaced by a version that keeps
    the original signature-inspection logic but calls each reward_fn on CHUNKS of
    the batch in a fork-based process pool, concatenating results in order.
    Correctness properties:
      - per-pair independence: chunking is exact for sequence-level rewards
      - kwargs that are per-example sequences (len == num_prompts, e.g. ground
        truth answer columns) are chunked in lockstep; scalars pass through
      - results are concatenated in chunk order -> byte-identical to serial
      - ANY error in the parallel path (pickling, fn signature, worker crash)
        logs one warning and falls back to the ORIGINAL serial implementation
    VALIDITY GATE for the run carrying this patch: rewards/train/mean must equal
    the unpatched run step-for-step (deterministic seeds make rewards exactly
    reproducible).
    
    Tunables via env:
      TUNIX_REWARD_WORKERS   pool size (default min(32, cpu_count))
      TUNIX_REWARD_PARALLEL  set to "0" to disable (keeps serial path)
    
    FAIL-OPEN. Any missing anchor prints FAILED and exits 0.
    Prints exactly one of:
        REWARD-PAR PATCH: APPLIED
        REWARD-PAR PATCH: FAILED <reason>
    """
    
    import ast
    import os
    import sys
    
    ROOT = "/usr/local/lib/python3.12/site-packages/tunix"
    RM = os.path.join(ROOT, "rl/reward_manager.py")
    
    
    def fail(msg):
        print(f"REWARD-PAR PATCH: FAILED {msg}")
        sys.exit(0)
    
    
    if not os.path.exists(RM):
        fail(f"{RM} not found")
    src = open(RM, encoding="utf-8").read()
    
    if "_REWARD_PAR" in src:
        print("REWARD-PAR PATCH: already patched")
        sys.exit(0)
    
    for needle in ("class SequenceRewardManager", "def _compute_rewards",
                   "def _prepare_log_metrics"):
        if needle not in src:
            fail(f"'{needle}' not present in reward_manager.py")
    
    APPEND = '''
    
    # --- _REWARD_PAR: process-pool reward computation ---------------------------------
    # Appended by patch_reward_parallel.py (see its docstring). The serial
    # implementation above is kept intact as the fallback.
    try:
      import os as _rp_os
      import numpy as _rp_np
      import multiprocessing as _rp_mp
      from dataclasses import asdict as _rp_asdict
      import inspect as _rp_inspect
      import logging as _rp_logging
    
      _rp_serial_compute = SequenceRewardManager._compute_rewards
      _rp_pool = [None]
      _rp_warned = [False]
      # Reward fns that must run serially in the parent (learned at runtime):
      # a fn that spawns its own subprocesses fails inside Pool's daemonic
      # workers ("daemonic processes are not allowed to have children") -- true
      # for check_numbers, whose math_verify grading dispatches to its own
      # persistent spawn pool. In the parent that internal pool works normally,
      # and its width is a MaxText config knob (math_verify_num_procs).
      _rp_serial_fns = set()
    
      def _rp_get_pool():
        if _rp_pool[0] is None:
          # The tunix trainer runs as a DAEMONIC child of the launcher process,
          # and multiprocessing forbids daemons from having children (run 12
          # failed here with "daemonic processes are not allowed to have
          # children"). The flag is inherited launcher plumbing, not a property
          # this code relies on: clear it so the pool can fork. The only
          # daemon-flag semantics lost are auto-termination of OUR workers if
          # the trainer dies mid-step; the pod teardown reaps them anyway.
          try:
            _cur = _rp_mp.current_process()
            if _cur._config.get("daemon"):
              _cur._config["daemon"] = False
          except Exception:
            pass
          n = int(_rp_os.environ.get("TUNIX_REWARD_WORKERS",
                                     min(32, _rp_os.cpu_count() or 8)))
          _rp_pool[0] = _rp_mp.get_context("fork").Pool(processes=n)
        return _rp_pool[0]
    
      def _rp_parallel_compute(self, prompts, completions, **kwargs):
        if _rp_os.environ.get("TUNIX_REWARD_PARALLEL", "1") == "0":
          return _rp_serial_compute(self, prompts, completions, **kwargs)
        try:
          algo_config_params = _rp_asdict(self.algo_config)
          base_kwargs = kwargs.copy()
          num_prompts = len(prompts)
          num_reward_fns = len(self.reward_fns)
          rewards = _rp_np.zeros((num_prompts, num_reward_fns))
    
          pool = _rp_get_pool()
          n_chunks = max(1, min(pool._processes * 2, num_prompts))
          bounds = [(num_prompts * c) // n_chunks for c in range(n_chunks + 1)]
    
          for i, reward_fn in enumerate(self.reward_fns):
            signature = _rp_inspect.signature(reward_fn)
            reward_fn_config_params = {}
            for name, _ in signature.parameters.items():
              if name in ["self", "prompts", "completions", "kwargs"]:
                continue
              if name in algo_config_params and name not in base_kwargs:
                reward_fn_config_params[name] = algo_config_params[name]
            call_kwargs = base_kwargs.copy()
            call_kwargs.update(reward_fn_config_params)
    
            fn_name = getattr(reward_fn, "__name__", str(reward_fn))
            if fn_name in _rp_serial_fns:
              # This fn previously failed in a worker (e.g. it spawns its own
              # subprocesses, which Pool's daemonic workers forbid -- true for
              # check_numbers' math_verify pool). Run it serially in the parent,
              # where its internal parallelism works as usual.
              full_kwargs = dict(call_kwargs)
              full_kwargs["prompts"] = list(prompts)
              full_kwargs["completions"] = list(completions)
              flat = list(reward_fn(**full_kwargs))
            else:
              try:
                jobs = []
                for c in range(n_chunks):
                  lo, hi = bounds[c], bounds[c + 1]
                  if lo == hi:
                    continue
                  ck = {}
                  for k, v in call_kwargs.items():
                    if isinstance(v, (list, tuple)) and len(v) == num_prompts:
                      ck[k] = list(v[lo:hi])
                    elif isinstance(v, _rp_np.ndarray) and len(v) == num_prompts:
                      ck[k] = v[lo:hi]
                    else:
                      ck[k] = v
                  ck["prompts"] = list(prompts[lo:hi])
                  ck["completions"] = list(completions[lo:hi])
                  jobs.append(pool.apply_async(reward_fn, kwds=ck))
                parts = [j.get(timeout=180) for j in jobs]
                flat = [x for part in parts for x in list(part)]
              except Exception as _fe:
                _rp_serial_fns.add(fn_name)
                _rp_logging.warning(
                    "REWARD-PAR: fn %s failed in workers (%r); running it "
                    "serially in the parent from now on.", fn_name, _fe)
                full_kwargs = dict(call_kwargs)
                full_kwargs["prompts"] = list(prompts)
                full_kwargs["completions"] = list(completions)
                flat = list(reward_fn(**full_kwargs))
            if len(flat) != num_prompts:
              raise RuntimeError(
                  "parallel reward length mismatch for %s: %d vs %d"
                  % (fn_name, len(flat), num_prompts))
            rewards[:, i] = _rp_np.array(flat)
    
          log_metrics = self._prepare_log_metrics(prompts, completions, rewards)
          return {
              "rewards": _rp_np.nansum(rewards, axis=1),
              "log_metrics": log_metrics,
          }
        except Exception as _e:
          if not _rp_warned[0]:
            _rp_warned[0] = True
            _rp_logging.warning(
                "REWARD-PAR: parallel path failed (%r); falling back to the "
                "serial implementation for the rest of the run.", _e)
          _rp_os.environ["TUNIX_REWARD_PARALLEL"] = "0"
          return _rp_serial_compute(self, prompts, completions, **kwargs)
    
      SequenceRewardManager._compute_rewards = _rp_parallel_compute
    except Exception as _e:
      print("REWARD-PAR ERROR (install): %r" % (_e,), flush=True)
    # --- end _REWARD_PAR --------------------------------------------------------------
    '''
    
    new = src + APPEND
    try:
        ast.parse(new)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")
    
    open(RM, "w", encoding="utf-8").write(new)
    
    v = open(RM, encoding="utf-8").read()
    problems = []
    if "_rp_parallel_compute" not in v:
        problems.append("wrapper missing")
    if v.count("def _compute_rewards") != 1:
        problems.append("serial _compute_rewards definition disturbed")
    try:
        ast.parse(v)
    except SyntaxError as e:
        problems.append(f"reparse failed: {e}")
    if problems:
        fail("; ".join(problems))
    print("REWARD-PAR PATCH: APPLIED")
    
  patch_rpa_blocks.py: |-
    """Forward RPA_V3_*_BLOCK_SIZES on the MaxText serving path.
    
    THE BUG. PR #3102 added the RPA v3 block-size env override, but wired it into
    ONLY ONE of the two entry points to the kernel:
    
      layers/jax/attention/attention.py       _rpa_block_size_kwargs() -> d_block_sizes  [WIRED]
      layers/common/attention_interface.py    sharded_ragged_paged_attention(...)        [NOT WIRED]
    
    MaxText's forward_serve_vllm imports sharded_ragged_paged_attention from
    attention_interface, so OUR path is the unwired one. d_block_sizes therefore
    arrives at the kernel as None and kernel.py `_prepare_block_sizes` falls back to
    get_default_block_sizes(), which for tpu7 DECODE sets BOTH bkv_sz and bkv_csz to
    min(min_bkv_sz_to_peak, max_kv).
    
    MEASURED, not assumed: the decode_only trace from the reference run-profile contains
    exactly one kernel configuration --
        RPAd-p_64-bq_1_1-bkv_16384_16384      138.4 ms = 74.7% of leaf decode time
    -- i.e. the untouched default, despite RPA_V3_DECODE_BLOCK_SIZES=1,16384,1,4096
    being present in the process environment. The compute block is 16384, not 4096.
    
    THE FIX. Mirror attention.py:268 at the attention_interface call site: forward the
    three env-derived tuples as kwargs when they are non-empty. Guarded by `not
    use_hd64` because the hd64 kernel has a different signature (it derives its own
    sizes via get_tuned_block_sizes) -- same guard the surrounding code already uses
    for update_kv_cache / use_causal_mask.
    
    HOW TO VERIFY IT WORKED. Re-read the decode_only xplane and look at the kernel
    name: it must become bkv_16384_4096. If it still says bkv_16384_16384 the patch
    did not take effect and any timing comparison is void.
    
    Prints exactly one of:
        RPA-BLOCKS PATCH: APPLIED
        RPA-BLOCKS PATCH: FAILED <reason>
    """
    
    import ast
    import os
    import sys
    
    ROOT = "/usr/local/lib/python3.12/site-packages/tpu_inference"
    AI = os.path.join(ROOT, "layers/common/attention_interface.py")
    
    
    def fail(msg):
        print(f"RPA-BLOCKS PATCH: FAILED {msg}")
        sys.exit(0)  # non-fatal: let the run start so the failure is visible in logs
    
    
    if not os.path.exists(AI):
        fail(f"{AI} not found")
    src = open(AI, encoding="utf-8").read()
    
    if "_RPA_V3_BLOCK_SIZES_FORWARDED" in src:
        print("RPA-BLOCKS PATCH: already patched")
        sys.exit(0)
    
    # `envs` must already be imported in this module (it reads USE_BATCHED_RPA_KERNEL).
    if "envs.USE_BATCHED_RPA_KERNEL" not in src:
