  patch_sharded_sampling.py: |-
    """Vocab-sharded sampling + logprobs for the fused decode window.
    
    WHY. sampling.py force-replicates the logits over the vocab dim every decode
    iteration ("Unshard the logits explicitly...", with an upstream TODO asking
    for exactly this change): a (batch, 151936) f32 all-gather (~78 MB per DP
    rank per iteration), followed by topk_mask/topp_mask -- 32-33 full vocab-axis
    reduction sweeps each (the ~800us/call while-loops in every profile) -- and a
    full-vocab categorical, all computed redundantly on every TP device. The
    logprobs path (gather_logprobs) repeats full-vocab log_softmax + top-N + a
    rank reduction on the same replicated array.
    
    WHAT. Rebinds `sample` and `compute_and_gather_logprobs` with vocab-sharded
    implementations under jax.shard_map:
      - per TP shard: one lax.top_k over vocab/8, all-gather only the top-64
        candidate (value, index) pairs (~0.4 MB vs ~78 MB);
      - exact top-k cutoff, top-p cutoff, and categorical on the merged
        candidates. EXACTNESS: temperature scaling is monotone (order preserved);
        the union of per-shard top-64 contains the global top-k for k <= 64; the
        cutoff mask keeps values >= cutoff exactly like topk_mask (ties
        included); masked/non-candidate entries underflow to exactly zero
        probability in f32 softmax, so top-p mass sums and the categorical
        distribution equal the full-vocab computation. Verified on CPU with an
        8-device mesh: kept sets identical on adversarial ties, greedy exact,
        draw distribution within statistical noise, logprob top-N ids exact,
        values within 1e-6, ranks exact (scratchpad/shard_proto.py).
      - logprobs: log_softmax via pmax/psum, top-N from the same candidates
        (log_softmax is monotone in logits), token logprob + rank via psum.
    
    WHAT CHANGES NUMERICALLY. The categorical RNG stream differs (noise drawn
    over candidates, not the full vocab), so sampled tokens are not bitwise equal
    to the old path -- distribution-equal only. Logprob VALUES shift ~1e-6 from
    reduction order. Validity gates for the run: LENDIST truncation band and
    reward band, not bitwise reward equality.
    
    GUARDS.
      - lax.cond falls back to the ORIGINAL implementation for the whole batch
        if any row has top_k <= 0 or top_k > 64 (e.g. eval "liberal" top_k=2000)
        or top_p <= 0; both branches are compiled, only the taken one runs.
      - compute_and_gather_logprobs falls back statically if max_logprobs > 48.
      - env SHARDED_SAMPLING=0 disables the rebinding entirely at patch time...
        is checked at RUNTIME by the wrappers, so the kill-switch works from the
        manifest without re-patching.
      - `sample`'s ret_logits in the sharded path is the RAW (still-sharded)
        logits: valid for logprobs_mode="raw" (our config). A processed_logprobs
        deployment must disable this patch.
    
    FAIL-OPEN. Any missing anchor prints FAILED and exits 0.
    Prints exactly one of:
        SHARDED-SAMPLING PATCH: APPLIED
        SHARDED-SAMPLING PATCH: FAILED <reason>
    """
    
    import ast
    import os
    import sys
    
    SITE = os.environ.get("PATCH_ROOT", "/usr/local/lib/python3.12/site-packages")
    ROOT = os.path.join(SITE, "tpu_inference")
    SP = os.path.join(ROOT, "layers/jax/sample/sampling.py")
    
    
    def fail(msg):
        print(f"SHARDED-SAMPLING PATCH: FAILED {msg}")
        sys.exit(0)
    
    
    if not os.path.exists(SP):
        fail(f"{SP} not found")
    src = open(SP, encoding="utf-8").read()
    
    if "_SHARDED_SAMPLING" in src:
        print("SHARDED-SAMPLING PATCH: already patched")
        sys.exit(0)
    
    for needle in ("def sample(", "def compute_and_gather_logprobs(",
                   "def gather_logprobs(", "def _apply_sampling_transforms(",
                   "ShardingAxisName"):
        if needle not in src:
            fail(f"anchor '{needle}' not present in sampling.py")
    
    APPEND = '''
    
    # --- _SHARDED_SAMPLING -------------------------------------------------------
    # Appended by patch_sharded_sampling.py (see its docstring). Rebinds `sample`
    # and `compute_and_gather_logprobs` below; originals are kept as fallbacks.
    try:
      import os as _ss_os
      from jax import lax as _ss_lax
      try:
        from jax import shard_map as _ss_shard_map          # jax >= 0.8
      except ImportError:
        from jax.experimental.shard_map import shard_map as _ss_shard_map
    
      _SS_CAND = 64
      _SS_NEG = -1e12
    
      _ss_orig_sample = sample
      _ss_orig_cgl = compute_and_gather_logprobs
    
      def _ss_axes(mesh):
        """(batch_axes, vocab_axis) restricted to axes present in the mesh."""
        def present(name):
          if name is None:
            return ()
          if isinstance(name, (tuple, list)):
            return tuple(a for a in name if a in mesh.axis_names)
          return (name,) if name in mesh.axis_names else ()
        batch = present(ShardingAxisName.ATTN_DATA)
        vocab = present(ShardingAxisName.MODEL)
        return batch, (vocab[0] if vocab else None)
    
      def _ss_merged_candidates(x_blk, vocab_axis):
        v_shard = x_blk.shape[-1]
        midx = _ss_lax.axis_index(vocab_axis)
        vals, idx = _ss_lax.top_k(x_blk, _SS_CAND)
        gidx = idx + midx * v_shard
        av = _ss_lax.all_gather(vals, vocab_axis)
        ai = _ss_lax.all_gather(gidx, vocab_axis)
        n = av.shape[0]
        av = jnp.transpose(av, (1, 0, 2)).reshape(-1, n * _SS_CAND)
        ai = jnp.transpose(ai, (1, 0, 2)).reshape(-1, n * _SS_CAND)
        return av, ai
    
      def _ss_greedy(cv, ci):
        m = jnp.max(cv, axis=-1, keepdims=True)
        big = jnp.iinfo(jnp.int32).max
        return jnp.min(jnp.where(cv >= m, ci, big), axis=-1)
    
      def _ss_kth(cv, k):
        sv = -jnp.sort(-cv, axis=-1)
        kk = jnp.clip(k, 1, cv.shape[-1]) - 1
        return jnp.take_along_axis(sv, kk[:, None], axis=-1)
    
      def _ss_topp_cutoff(probs, p):
        sp = -jnp.sort(-probs, axis=-1)
        cum = jnp.cumsum(sp, axis=-1)
        jstar = jnp.argmax(cum >= p[:, None], axis=-1)
        return jnp.take_along_axis(sp, jstar[:, None], axis=-1)
    
      def _ss_sample_block(vocab_axis, batch_axes, rng, x, temperature, top_k,
                           top_p, do_argmax_only):
        # x: (b_local, v_shard) f32
        didx = 0
        for i, a in enumerate(batch_axes):
          didx = didx * _ss_lax.axis_size(a) + _ss_lax.axis_index(a)
        xt = x / temperature[:, None]
        cv, ci = _ss_merged_candidates(xt, vocab_axis)
        greedy = _ss_greedy(cv, ci)
        if do_argmax_only:
          return _ss_lax.pmax(greedy, vocab_axis)
        kth = _ss_kth(cv, top_k)
        mk = jnp.where((top_k > 0)[:, None] & ~(cv >= kth), _SS_NEG, cv)
        probs = jax.nn.softmax(mk, axis=-1)
        pcut = _ss_topp_cutoff(probs, top_p)
        mp = jnp.where((top_p < 1.0)[:, None] & ~(probs >= pcut), _SS_NEG, mk)
        r = jax.random.fold_in(rng, didx)
        choice = jax.random.categorical(r, mp)
        sampled = jnp.take_along_axis(ci, choice[:, None], axis=-1)[:, 0]
        out = jnp.where(temperature < _SAMPLING_EPS, greedy, sampled)
        # Values are identical on every vocab shard (built from all-gathered
        # candidates); the pmax is an identity that makes that replication
        # provable to shard_map's output check on every jax version.
        return _ss_lax.pmax(out, vocab_axis)
    
      def _ss_sample(rng, mesh, logits, meta):
        batch_axes, vocab_axis = _ss_axes(mesh)
        bspec = P(batch_axes if batch_axes else None)
        lspec = P(batch_axes if batch_axes else None, vocab_axis)
        logits = jax.lax.with_sharding_constraint(logits,
                                                  NamedSharding(mesh, lspec))
    
        def blk(rng, x, t, k, p):
          return _ss_sample_block(vocab_axis, batch_axes, rng, x, t, k, p,
                                  do_argmax_only=not meta.do_sampling)
    
        tokens = _ss_shard_map(blk, mesh=mesh,
                               in_specs=(P(), lspec, bspec, bspec, bspec),
                               out_specs=bspec)(
                                   rng, logits, meta.temperature.astype(
                                       jnp.float32), meta.top_k, meta.top_p)
        tokens = jax.lax.with_sharding_constraint(tokens, NamedSharding(mesh, P()))
        return tokens, logits
    
      def sample(rng, mesh, logits, tpu_sampling_metadata):
        if _ss_os.environ.get("SHARDED_SAMPLING", "1") == "0":
          return _ss_orig_sample(rng, mesh, logits, tpu_sampling_metadata)
        meta = tpu_sampling_metadata
        if meta._cache_collision_dummy is not None:
          logits = logits + 0 * jnp.sum(meta._cache_collision_dummy)
        _, vocab_axis = _ss_axes(mesh)
        if vocab_axis is None:
          return _ss_orig_sample(rng, mesh, logits, meta)
        logits = logits.astype(jnp.float32)
        if not meta.do_sampling:
          return _ss_sample(rng, mesh, logits, meta)
        # _SS_PADFIX (SS_PADFIX=1): at tp>1 padded rows carry top_k=0, which fails
        # the whole-batch guard and silently forces the full-vocab fallback for the
        # ENTIRE batch (the reference author qwen3 item 3, -9.5s). The sharded sampler already
        # masks top_k<=0 rows correctly internally (their outputs are discarded
        # padding anyway), so it is safe to let the guard IGNORE those rows and keep
        # the vocab-sharded fast path for the real rows. Default off preserves the
        # original fallback for genuine liberal-top_k (e.g. eval top_k=2000).
        if _ss_os.environ.get("SS_PADFIX", "0") == "1":
          _ss_valid = jnp.where(meta.top_k > 0,
                                (meta.top_k <= _SS_CAND) & (meta.top_p > 0.0),
                                True)
          safe = jnp.all(_ss_valid)
        else:
          safe = jnp.all((meta.top_k > 0) & (meta.top_k <= _SS_CAND)
                         & (meta.top_p > 0.0))
        return _ss_cond_sample(safe, rng, mesh, logits, meta)
    
      def _ss_cond_sample(safe, rng, mesh, logits, meta):
        # mesh/meta are closed over rather than passed as lax.cond operands
        # (Mesh is not a valid JAX type). Both branches constrain ret_logits to
        # the SHARDED spec so cond-output unification cannot reintroduce the
        # vocab all-gather on the hot path (the fallback branch has already paid
        # its own gather internally; re-constraining its output is cheap).
        batch_axes, vocab_axis = _ss_axes(mesh)
        lspec = P(batch_axes if batch_axes else None, vocab_axis)
    
        def tru(op):
          r, lg = op
          return _ss_sample(r, mesh, lg, meta)
    
        def fls(op):
          r, lg = op
          toks, ret = _ss_orig_sample(r, mesh, lg, meta)
          ret = jax.lax.with_sharding_constraint(ret, NamedSharding(mesh, lspec))
          return toks, ret
    
        return jax.lax.cond(safe, tru, fls, (rng, logits))
    
      def compute_and_gather_logprobs(logits, next_tokens, max_logprobs):
        if (_ss_os.environ.get("SHARDED_SAMPLING", "1") == "0"
            or max_logprobs > 48):
          return _ss_orig_cgl(logits, next_tokens, max_logprobs)
        # Mesh is implicit here (no arg); derive from the array sharding if
        # available, else fall back.
        sh = getattr(logits, "sharding", None)
        mesh = getattr(sh, "mesh", None)
        if mesh is None or getattr(mesh, "empty", False):
          return _ss_orig_cgl(logits, next_tokens, max_logprobs)
        batch_axes, vocab_axis = _ss_axes(mesh)
        if vocab_axis is None:
          return _ss_orig_cgl(logits, next_tokens, max_logprobs)
        bspec = P(batch_axes if batch_axes else None)
        lspec = P(batch_axes if batch_axes else None, vocab_axis)
        logits = jax.lax.with_sharding_constraint(
            logits, NamedSharding(mesh, lspec))
    
        def blk(x, toks):
          v_shard = x.shape[-1]
          midx = _ss_lax.axis_index(vocab_axis)
          gmax = _ss_lax.pmax(jnp.max(x, axis=-1), vocab_axis)
          se = _ss_lax.psum(jnp.sum(jnp.exp(x - gmax[:, None]), axis=-1),
                            vocab_axis)
          lse = gmax + jnp.log(se)
          rv, ri = _ss_merged_candidates(x, vocab_axis)
          nv, ni = _ss_lax.top_k(rv, max_logprobs)
          top_ids = jnp.take_along_axis(ri, ni, axis=-1)
          top_lps = nv - lse[:, None]
          owner = (toks >= midx * v_shard) & (toks < (midx + 1) * v_shard)
          col = jnp.clip(toks - midx * v_shard, 0, v_shard - 1)
          lval = jnp.take_along_axis(x, col[:, None], axis=-1)[:, 0]
          tok_logit = _ss_lax.psum(jnp.where(owner, lval, 0.0), vocab_axis)
          tok_lp = tok_logit - lse
          rank = _ss_lax.psum(jnp.sum(x >= tok_logit[:, None], axis=-1),
                              vocab_axis)
          idx = jnp.concatenate((toks[:, None], top_ids), axis=1).astype(jnp.int32)
          lps = jnp.concatenate((tok_lp[:, None], top_lps), axis=1)
          # identity pmax: values already replicated across vocab shards; makes
          # the replication provable to shard_map's output check.
          return (_ss_lax.pmax(idx, vocab_axis), _ss_lax.pmax(lps, vocab_axis),
                  _ss_lax.pmax(rank, vocab_axis))
    
        idx, lps, rank = _ss_shard_map(
            blk, mesh=mesh,
            in_specs=(lspec, bspec),
            out_specs=(P(batch_axes if batch_axes else None, None),
                       P(batch_axes if batch_axes else None, None), bspec),
            )(logits.astype(jnp.float32), next_tokens)
        return LogprobsTensors(idx, lps, rank)
    except Exception as _e:
      print("SHARDED-SAMPLING ERROR (install): %r" % (_e,), flush=True)
    # --- end _SHARDED_SAMPLING ---------------------------------------------------
    '''
    
    new = src + APPEND
    try:
        ast.parse(new)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")
    
    open(SP, "w", encoding="utf-8").write(new)
    
    v = open(SP, encoding="utf-8").read()
    problems = []
    if "_ss_sample_block" not in v or "_ss_orig_cgl" not in v:
        problems.append("appended block incomplete")
    if v.count("def sample(") != 2:
        problems.append("expected original + rebound sample definitions")
    try:
        ast.parse(v)
    except SyntaxError as e:
        problems.append(f"reparse failed: {e}")
    if problems:
        fail("; ".join(problems))
    print("SHARDED-SAMPLING PATCH: APPLIED")
  patch_sync_keepkv.py: |-
    """Keep the KV cache across weight sync (qwen3 item 6).
    
    WHY. VllmSampler.update_params tears the KV pool down before every weight
    reshard (collective_rpc("delete_kv_cache")) and rebuilds it after
    (reinitialize_kv_cache) -- ~2 s/step on the reference recipe's SYNC-T timers. At sync time
    the pool is empty (all sequences finished) and the resharded weights are
    far smaller than free HBM, so the teardown buys nothing.
    
    WHAT. Gate all delete_kv_cache / reinitialize_kv_cache collective_rpc calls
    behind SYNC_KEEPKV (default "1" = skip them; set SYNC_KEEPKV=0 to restore
    stock behavior). reset_prefix_cache is kept.
    
    FAIL-OPEN. Prints exactly one of:
        SYNC-KEEPKV PATCH: APPLIED
        SYNC-KEEPKV PATCH: FAILED <reason>
    """
    import ast
    import os
    import re
    import sys
    
    VS = "/usr/local/lib/python3.12/site-packages/tunix/generate/vllm_sampler.py"
    
    
    def fail(msg):
        print(f"SYNC-KEEPKV PATCH: FAILED {msg}")
        sys.exit(0)
    
    
    if not os.path.exists(VS):
        fail(f"{VS} not found")
    src = open(VS, encoding="utf-8").read()
    if "SYNC_KEEPKV" in src:
        print("SYNC-KEEPKV PATCH: already patched")
        sys.exit(0)
    
    PAT = re.compile(
        r"^([ \t]*)(self\.(?:llm|_driver\.llm_engine)\.collective_rpc\("
        r"\"(?:delete_kv_cache|reinitialize_kv_cache)\"\)[^\n]*)$",
        re.M)
    matches = PAT.findall(src)
    if len(matches) != 4:
        fail(f"expected 4 kv-cache rpc lines, found {len(matches)}")
    
    def _gate(m):
        ind, call = m.group(1), m.group(2)
        return (f"{ind}if os.environ.get(\"SYNC_KEEPKV\", \"1\") != \"1\":\n"
                f"{ind}  {call}")
    
    src = PAT.sub(_gate, src)
    if "import os" not in src:
        src = src.replace("import ", "import os\nimport ", 1)
    
    try:
        ast.parse(src)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")
    open(VS, "w", encoding="utf-8").write(src)
    if open(VS, encoding="utf-8").read().count("SYNC_KEEPKV") != 4:
        fail("re-verify failed")
    print("SYNC-KEEPKV PATCH: APPLIED (SYNC_KEEPKV="
          f"{os.environ.get('SYNC_KEEPKV', '1(default)')})")
    
  patch_verify_timeout.py: |-
    """Enable per-item math_verify timeouts to cap the reward-phase long tail.
    
    WHY. math_verify_pool.py grades each completion with parse(...,
    parsing_timeout=None) and verify(..., timeout_seconds=None) -- per-item
    timeouts DISABLED. A single pathological expression (large nested fraction,
    unsimplifiable radical, malformed LaTeX) runs sympy unbounded until the GLOBAL
    batch timeout (math_verify_timeout=120). One straggler holds up the parallel
    pool, so the reward phase spikes (measured g4r11: 191/126/252s on 3 of 20
    steps, vs ~10s median) -- the dominant contributor to the step-time MEAN
    (162 vs median 125).
    
    WHAT. Set the per-item parse/verify timeouts to VERIFY_ITEM_TIMEOUT seconds
    (default 5) instead of None. A pathological item then costs <=5s (marked
    wrong, like any grader failure) instead of running to the global cap. Bounds
    the reward tail without changing grading of well-formed answers. math_verify
    uses signal-based timeouts, valid here because each item runs in its own pool
    WORKER PROCESS (main thread of that process). VERIFY_ITEM_TIMEOUT=0 keeps the
    original None (disabled) behavior.
    
    FAIL-OPEN. Prints exactly one of:
        VERIFY-TIMEOUT PATCH: APPLIED
        VERIFY-TIMEOUT PATCH: FAILED <reason>
    """
    import ast
    import os
    import sys
    
    
    def fail(msg):
        print(f"VERIFY-TIMEOUT PATCH: FAILED {msg}")
        sys.exit(0)
    
    
    try:
        import importlib.util as _u
        spec = _u.find_spec("maxtext")
        if spec is None or not spec.submodule_search_locations:
            fail("cannot locate maxtext package")
        root = list(spec.submodule_search_locations)[0]
    except Exception as e:  # noqa: BLE001
        fail(f"maxtext import probe failed: {e}")
    
    MP = os.path.join(root, "trainers", "post_train", "rl", "math_verify_pool.py")
    if not os.path.exists(MP):
        fail(f"{MP} not found")
    src = open(MP, encoding="utf-8").read()
    if "_VT_ITEM" in src:
        print("VERIFY-TIMEOUT PATCH: already patched")
        sys.exit(0)
    
    n_parse = src.count("parsing_timeout=None")
    n_verify = src.count("timeout_seconds=None")
    if n_parse < 1 or n_verify < 1:
        fail(f"anchors missing (parsing_timeout=None x{n_parse}, timeout_seconds=None x{n_verify})")
    
    src = src.replace("parsing_timeout=None", "parsing_timeout=_VT_ITEM")
    src = src.replace("timeout_seconds=None", "timeout_seconds=_VT_ITEM")
    
    # module-level: _VT_ITEM = int(env) or None if 0
    inject = (
        "import os as _vt_os\n"
        "_vt_v = _vt_os.environ.get('VERIFY_ITEM_TIMEOUT', '5')\n"
        "try:\n"
        "  _VT_ITEM = int(_vt_v) if int(_vt_v) > 0 else None\n"
        "except Exception:\n"
        "  _VT_ITEM = 5\n"
    )
    # place after the module docstring / first import block
    lines = src.split("\n")
    ins_at = 0
    for i, ln in enumerate(lines):
        if ln.startswith("import ") or ln.startswith("from "):
            ins_at = i
            break
    lines.insert(ins_at, inject)
    src = "\n".join(lines)
    
    try:
        ast.parse(src)
    except SyntaxError as e:
        fail(f"patched source does not parse: {e}")
    open(MP, "w", encoding="utf-8").write(src)
    v = open(MP, encoding="utf-8").read()
    if "_VT_ITEM" not in v or "timeout_seconds=None" in v or "parsing_timeout=None" in v:
        fail("re-verify failed")
    print(f"VERIFY-TIMEOUT PATCH: APPLIED (VERIFY_ITEM_TIMEOUT={os.environ.get('VERIFY_ITEM_TIMEOUT','5(default)')})")
    
  patch_vllm_sampler.py: |-
    """Hotfix for pathwaysutils profiling + tpu_runner req_id_kwargs nanobind limit.
    
    Adapted for image head-612fcd2e-gemma4c-perf. Two of the four original
    sub-fixes are already merged upstream in this image and are DETECTED, not
    re-applied:
      - profiling.py executable.call(out_avals=..., out_shardings=...): the image
        passes them conditionally (xprofTraceOptions branch) -- already fixed.
      - profiling.py advanced_config int -> {"int64Value": v}: already present.
    Still applied here:
      - profiling.py start_trace / start_trace_patch: max_num_hosts default 1 ->
        None, resolved to 16 inside start_trace.
      - tpu_runner.py: cap **req_id_kwargs at 100 entries (nanobind kwargs limit).
    
    Fail-open: prints exactly one of
        VLLM-SAMPLER PATCH: APPLIED
        VLLM-SAMPLER PATCH: already patched
        VLLM-SAMPLER PATCH: FAILED <reason>
    """
    
    import os
    import sys
    
    SITE = os.environ.get("PATCH_ROOT", "/usr/local/lib/python3.12/site-packages")
    PROF = os.path.join(SITE, "pathwaysutils/profiling.py")
    TR = os.path.join(SITE, "tpu_inference/runner/tpu_runner.py")
    
    
    def fail(msg):
        print(f"VLLM-SAMPLER PATCH: FAILED {msg}")
        sys.exit(0)  # non-fatal: let the run start so the failure is visible
    
    
    problems = []
    applied_any = False
    already_all = True
    
    # --- pathwaysutils/profiling.py ---------------------------------------------
    if not os.path.exists(PROF):
        fail(f"{PROF} not found")
    with open(PROF, "r", encoding="utf-8") as f:
        c4 = f.read()
    modified4 = False
    
    # (1) executable.call out_avals/out_shardings -- merged upstream in this image
    # (conditional xprofTraceOptions branch). Detect either form.
    target4 = "      _, result_future = _profile_state.executable.call()"
    if target4 in c4:
        c4 = c4.replace(target4, (
            "      import jax\n"
            "      import jax.numpy as jnp\n"
            "      out_avals = ()\n"
            "      out_shardings = ()\n"
            "      _, result_future = _profile_state.executable.call(\n"
            "          out_avals=out_avals, out_shardings=out_shardings\n"
            "      )"
        ))
        modified4 = True
    elif "out_avals=out_avals, out_shardings=out_shardings" not in c4:
        problems.append("profiling.py: executable.call anchor missing and "
                        "out_avals fix not present")
    
    # (2) int -> int64Value -- merged upstream in this image.
    target4_int = ("      elif isinstance(v, int):\n"
                   '        advanced_config[k] = {"intValue": v}')
    if target4_int in c4:
        c4 = c4.replace(target4_int,
                        "      elif isinstance(v, int):\n"
                        '        advanced_config[k] = {"int64Value": v}')
        modified4 = True
    elif '{"int64Value": v}' not in c4:
        problems.append("profiling.py: intValue anchor missing and int64Value "
                        "fix not present")
    
    # traceSessionName is enabled now; no replacement needed (as in original).
    
    # (3) start_trace: max_num_hosts default 1 -> None (resolved to 16).
    target4_start = (
        "def start_trace(\n"
        "    log_dir: os.PathLike[str] | str,\n"
        "    *,\n"
        "    create_perfetto_link: bool = False,\n"
        "    create_perfetto_trace: bool = False,\n"
        "    profiler_options: jax.profiler.ProfileOptions | None = None,\n"
        "    max_num_hosts: int = 1,\n"
        ") -> None:"
    )
    replacement4_start = (
        "def start_trace(\n"
        "    log_dir: os.PathLike[str] | str,\n"
        "    *,\n"
        "    create_perfetto_link: bool = False,\n"
        "    create_perfetto_trace: bool = False,\n"
        "    profiler_options: jax.profiler.ProfileOptions | None = None,\n"
        "    max_num_hosts: int | None = None,\n"
        ") -> None:\n"
        "  if max_num_hosts is None:\n"
        "    max_num_hosts = 16"
    )
    if target4_start in c4:
        c4 = c4.replace(target4_start, replacement4_start)
        modified4 = True
        already_all = False
    elif "  if max_num_hosts is None:\n    max_num_hosts = 16" not in c4:
        problems.append("profiling.py: start_trace signature anchor missing and "
                        "max_num_hosts fix not present")
    
    # (4) start_trace_patch: same default change on the monkeypatch wrapper.
    target4_monkey = (
        "  def start_trace_patch(\n"
        "      log_dir,\n"
        "      create_perfetto_link: bool = False,\n"
        "      create_perfetto_trace: bool = False,\n"
        "      profiler_options: jax.profiler.ProfileOptions | None = None,\n"
        "      max_num_hosts: int = 1,\n"
        "  ) -> None:"
    )
    replacement4_monkey = (
        "  def start_trace_patch(\n"
        "      log_dir,\n"
        "      create_perfetto_link: bool = False,\n"
        "      create_perfetto_trace: bool = False,\n"
        "      profiler_options: jax.profiler.ProfileOptions | None = None,\n"
        "      max_num_hosts: int | None = None,\n"
        "  ) -> None:"
    )
    if target4_monkey in c4:
        c4 = c4.replace(target4_monkey, replacement4_monkey)
        modified4 = True
        already_all = False
    elif ("  def start_trace_patch(\n"
          "      log_dir,\n"
          "      create_perfetto_link: bool = False,\n"
          "      create_perfetto_trace: bool = False,\n"
          "      profiler_options: jax.profiler.ProfileOptions | None = None,\n"
          "      max_num_hosts: int | None = None,\n") not in c4:
        problems.append("profiling.py: start_trace_patch anchor missing and "
                        "None-default fix not present")
    
    if problems:
        fail("; ".join(problems))
    
    if modified4:
        with open(PROF, "w", encoding="utf-8") as f:
            f.write(c4)
        applied_any = True
    
    # --- tpu_inference/runner/tpu_runner.py --------------------------------------
    if not os.path.exists(TR):
        fail(f"{TR} not found")
    with open(TR, "r", encoding="utf-8") as f:
        c5 = f.read()
    
    target5 = ", **req_id_kwargs):"
    replacement5 = ", **dict(list(req_id_kwargs.items())[:100])):"
    if target5 in c5:
        c5 = c5.replace(target5, replacement5)
        with open(TR, "w", encoding="utf-8") as f:
            f.write(c5)
        applied_any = True
        already_all = False
    elif "dict(list(req_id_kwargs.items())" not in c5:
        fail("tpu_runner.py: req_id_kwargs anchor missing and cap not present")
    
    # --- verify ------------------------------------------------------------------
    import ast
    
    for path in (PROF, TR):
        try:
            ast.parse(open(path, encoding="utf-8").read())
        except SyntaxError as e:
            fail(f"patched {path} does not parse: {e}")
    
    v_prof = open(PROF, encoding="utf-8").read()
    v_tr = open(TR, encoding="utf-8").read()
    if "  if max_num_hosts is None:\n    max_num_hosts = 16" not in v_prof:
        fail("verify: start_trace max_num_hosts fix missing after write")
    if "dict(list(req_id_kwargs.items())[:100])" not in v_tr:
        fail("verify: tpu_runner req_id_kwargs cap missing after write")
    
    if applied_any or not already_all:
        print("VLLM-SAMPLER PATCH: APPLIED")
    else:
        print("VLLM-SAMPLER PATCH: already patched")
    
---
# Source: pathways-tpu-jobset-workload/templates/workload-launcher-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: "g4r19-launcher"
  namespace: ubench-regression-tests
data:
  launch-workload.sh: |-
    #!/bin/bash
    # Exit immediately if a command exits with a non-zero status.
    set -e
    
    # --- Graceful Shutdown Logic ---
    _sigterm() {
      echo "EXTERNAL-KILL: SIGTERM received at $(date -u +%H:%M:%S) with no application error -- cause is outside the job (preemption / autoscaler / node loss). Check cluster events."
      kill -SIGTERM "$PID" 2>/dev/null
    }
    trap _sigterm SIGTERM
    
    MAXTEXT_CONFIG_PATH="maxtext/configs/post_train/rl.yml"
    # Ironwood bring-up fixes (from smoke ladder):
    
    # --- the reference run stack: runtime patches (self-verifying, fail-open) ---
    for P in patch_vllm_sampler patch_cd_proper patch_lendist patch_rpa_blocks patch_cd_masking patch_cd_report patch_phasetime patch_reward_parallel patch_sharded_sampling patch_profiler_fix patch_gc_sync patch_packing_knob patch_packer_fast patch_log_stats patch_perf_v2 patch_dump_completions patch_firsttok patch_host_extract patch_fast_detok patch_sync_keepkv patch_cd_noeos patch_flash_sa patch_jit_unroll patch_verify_timeout patch_g4_format_guard patch_reward_dump; do
      for F in /workload/patches/$P /workload/patches/$P.py; do
        if [ -f "$F" ]; then python3 "$F"; break; fi
      done
    done
    
    export JAX_PLATFORMS="proxy,cpu"
    export CONTINUE_DECODE_EOS_CHECK_INTERVAL=0
    if [ -n "${DL_BUCKET_GAP:-}" ]; then export VLLM_TPU_BUCKET_PADDING_GAP="$DL_BUCKET_GAP"; fi
    export SYNC_KEEPKV="${DL_KEEPKV:-0}"
    export CD_NO_EOS_REDUCE="${DL_NOEOS:-0}"
    export JIT_UNROLL="${DL_JITU:-0}"
    export SS_PADFIX="${DL_PADFIX:-0}"
    export VERIFY_ITEM_TIMEOUT="${DL_VTMO:-5}"
    export REWARD_DUMP_N="${DL_RWDUMP:-0}"
    CHATTMPL="chat_template_path=maxtext/examples/chat_templates/gemma-3-27b-chat_template.json"
    DSPROC_ARG=""
    if [ -n "${DL_MPDP:-}" ]; then export TPU_MULTIPROCESS_DP="$DL_MPDP"; fi
    if [ -n "${DL_BRPA:-}" ]; then export USE_BATCHED_RPA_KERNEL="$DL_BRPA"; fi
    if [ -n "${DL_SAQ:-}" ]; then export SA_BLOCK_Q="$DL_SAQ"; fi
    if [ -n "${DL_SAKV:-}" ]; then export SA_BLOCK_KV="$DL_SAKV"; fi
    if [ -n "${DL_RPA:-}" ]; then export RPA_V3_DECODE_BLOCK_SIZES="$DL_RPA"; fi
    if [ -n "${DL_EOS_INT:-}" ]; then export CONTINUE_DECODE_EOS_CHECK_INTERVAL="$DL_EOS_INT"; fi
    export PHASED_PROFILING_DIR="${ARTIFACT_DIR}/${JOB_IDENTIFIER}/phased_profile"
    export JAX_COMPILATION_CACHE_DIR="gs://ubench-logs/alisachen-tpu7x/compilation_cache/gemma4-e2b-dl"            # newer tpu_inference stages on cpu backend
    export VLLM_ENABLE_V1_MULTIPROCESSING=0     # required under Pathways
    XLA_FLAGS=""
    
    # Fallback check to support different image structures
    if [ ! -f "${MAXTEXT_CONFIG_PATH}" ] && [ -f "src/${MAXTEXT_CONFIG_PATH}" ]; then
      echo "MAXTEXT_CONFIG_PATH not found at ${MAXTEXT_CONFIG_PATH}, falling back to src/${MAXTEXT_CONFIG_PATH}"
      MAXTEXT_CONFIG_PATH="src/${MAXTEXT_CONFIG_PATH}"
    fi
    
    # --- TPU Worker Hostnames & ID ---
    if [ ! -z "${NNODES}" ] && [ ! -z "${JOBSET_NAME}" ] && [ ! -z "${SUBDOMAIN}" ]; then
      HOSTS=""
      for i in $(seq 0 $((NNODES - 1))); do
        # JobSet pod naming: ${JOBSET_NAME}-workload-0-${i}.${SUBDOMAIN}
        HOSTS="${HOSTS}${JOBSET_NAME}-workload-0-${i}.${SUBDOMAIN},"
      done
      export TPU_WORKER_HOSTNAMES=${HOSTS%,}
      echo "Computed TPU_WORKER_HOSTNAMES: ${TPU_WORKER_HOSTNAMES}"
    fi
    
    # --- Log for Debugging ---
    echo "MaxText config overrides from command line:"
    echo "  DL invariants run; args as in command below. base_output_directory=${ARTIFACT_DIR}"
    
    # --- RL Sampler Patches & Env Setup ---
    if [ "maxtext.trainers.post_train.rl.train_rl" = "maxtext.trainers.post_train.rl.train_rl" ]; then
      export HF_HUB_ENABLE_HF_TRANSFER=0
      export HF_HUB_DISABLE_XET=1
      export PYTHONPATH=/app/src:$PYTHONPATH
      export NUM_PRECOMPILE_WORKERS=1
      export NEW_MODEL_DESIGN=1
      export JAX_BACKEND_TARGET="${JAX_BACKEND_TARGET:-grpc://127.0.0.1:29000}"
    fi
    
    export MAX_SEQ_TOKEN_PER_TPU="${DL_PACK:-0}"
    # RLConfig multimodal-default shim (use_mrope) -- new images validate these attrs
    for TYPES in /deps/src/maxtext/src/maxtext/configs/types.py /deps/src/maxtext/configs/types.py; do
      if [ -f "$TYPES" ] && ! grep -q "Auto-patch RLConfig with Multimodal defaults" "$TYPES"; then
        cat << 'MROPE_EOF' >> "$TYPES"
    
    # --- Auto-patch RLConfig with Multimodal defaults ---
    if 'RLConfig' in globals():
      if not hasattr(RLConfig, 'use_mrope'):
        RLConfig.use_mrope = False
      if not hasattr(RLConfig, 'mrope_section'):
        RLConfig.mrope_section = [24, 20, 20]
      if not hasattr(RLConfig, 'position_id_per_seconds'):
        RLConfig.position_id_per_seconds = 25
    MROPE_EOF
        echo "MROPE-SHIM: applied to $TYPES"
      fi
    done
    
    # --- Main Execution ---
    # The python process is run in the background (&)
    (
      # Set up the environment
      export ENABLE_PATHWAYS_PERSISTENCE='1'
      export JAX_PLATFORMS="${JAX_PLATFORMS:-tpu,cpu}"
      export ENABLE_PJRT_COMPATIBILITY='true'
      if [ ! -z "${XLA_FLAGS}" ]; then
        export LIBTPU_INIT_ARGS="${XLA_FLAGS}"
      fi
    
      # Execute the training script, passing the config file AND the command-line overrides
      python3 -m maxtext.trainers.post_train.rl.train_rl "${MAXTEXT_CONFIG_PATH}" model_name='gemma4-e2b' data_template_path=maxtext/examples/chat_templates/openmathinstruct2_rl.json $CHATTMPL $DSPROC_ARG tokenizer_path='google/gemma-4-E2B-it' dataset_name='nvidia/OpenMathInstruct-2' hf_train_files='hf://datasets/nvidia/OpenMathInstruct-2/data/train_1M-*.parquet' train_split='train_1M' rl.num_generations=8 rl.grpo_beta=0.0 rl.epsilon_high=0.28 rl.grpo_epsilon=0.2 enable_checkpointing=${DL_CKPT:-True} checkpoint_storage_use_ocdbt=False checkpoint_storage_use_zarr3=False checkpoint_period=100 async_scheduling=${DL_ASYNC:-False} chips_per_vm=${DL_CPV:-4} trainer_devices_fraction=${DL_TFRAC:-0.5} sampler_devices_fraction=${DL_SFRAC:-0.5} num_batches=${DL_STEPS:-20} remat_policy=${DL_REMAT:-custom} attention=${DL_ATTN:-dot_product} num_test_batches=0 gradient_clipping_threshold=1.0 decode_sampling_temperature=0.8 decode_sampling_top_k=50 decode_sampling_nucleus_p=0.95 ${DL_KVBUF:+kv_cache_buffer=$DL_KVBUF} max_target_length=8192 max_prefill_predict_length=4096 learning_rate=1e-6 batch_size=256 train_micro_batch_size=${DL_TMBS:-1} rollout_micro_batch_size=256 rollout_data_parallelism=${DL_DP:--1} rollout_tensor_parallelism=${DL_TP:-8} enable_dp_attention=False hbm_utilization_vllm=${DL_HBM:-0.6} max_num_seqs=256 max_num_batched_tokens=8448 math_verify_num_procs=${DL_MVPROCS:-32} scan_layers=False vllm_hf_overrides='{architectures: ["MaxTextForCausalLM"]}' vllm_additional_config='{"maxtext_config": {"model_name": "gemma4-e2b", "model_call_mode": "inference", "log_config": false, "weight_dtype": "bfloat16", "allow_split_physical_axes": true}, "enable_continue_decode": true, "max_decode_steps": '${DL_CD:-64}'}' allow_split_physical_axes=True enable_tunix_perf_metrics=True load_parameters_path='gs://ubench-logs/alisachen-tpu7x/ckpt/gemma4-e2b-raw/0/items' skip_jax_distributed_system=True log_period=1 base_output_directory=${ARTIFACT_DIR} run_name=${JOB_IDENTIFIER}
    ) & PID=$!
    
    # Wait for the python process to finish
    EXIT_CODE=0
    wait $PID || EXIT_CODE=$?   # tolerate failure so the debug-hold below can run (set -e)
    
    echo "MaxText Job Ended at: $(date) with exit code $EXIT_CODE"
    if [ "$EXIT_CODE" -ne 0 ]; then
      echo "DEBUG-HOLD: failure detected, keeping pod alive 20 min for log capture"
      sleep 1200
    fi
    exit $EXIT_CODE
---
# Source: pathways-tpu-jobset-workload/templates/pathways-jobset.yaml
# yamllint disable







apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: "g4r19"
  namespace: ubench-regression-tests
  labels:
    kueue.x-k8s.io/queue-name: "multislice-queue"
spec:
  coordinator:
    replicatedJob: pathways-head
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  failurePolicy:
    # restartStrategy: Recreate not supported by this cluster's JobSet CRD
    # (older controller than the v6e cluster); leoch convention:
    maxRestarts: 50
  startupPolicy:
    startupPolicyOrder: InOrder
  successPolicy:
    operator: All
    targetReplicatedJobs:
    - pathways-head
  replicatedJobs:
# ----------------------------------------------------
# 1. Pathways-Head Replicated Job
# ----------------------------------------------------
  - name: pathways-head
    replicas: 1
    template:
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            annotations:
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
            labels:
              kueue.x-k8s.io/podset: pathways-head
            annotations:
              kubectl.kubernetes.io/default-container: jax-tpu
              gke-gcsfuse/volumes: "true"
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            nodeSelector:
              cloud.google.com/gke-nodepool: "cpu-np"
            tolerations:
            - key: cloud.google.com/gke-nodepool
              operator: Exists
              effect: NoSchedule
            containers:
            - name: jax-tpu
              image: "gcr.io/supercomputer-testing/maxtext-rl-ironwood:2026-08-24-packing"
              command:
              - bash
              - -c
              - |
                echo Pathways Helm Start: $(date);
                _sigterm() (kill -SIGTERM $! 2>/dev/null;);
                trap _sigterm SIGTERM;

                echo "Executing payload from /workload/launcher/launch-workload.sh..."
                ( bash /workload/launcher/launch-workload.sh ) & PID=$!;

                while kill -0 $PID 2>/dev/null;
                    do sleep 5;
                done;
                wait $PID;
                EXIT_CODE=$?;

                echo Pathways Helm End: $(date);
                echo EXIT_CODE=$EXIT_CODE;
                exit $EXIT_CODE
              env:
              - name: JAX_PLATFORMS
                value: proxy
              - name: PATHWAYS_HEAD
                value: "g4r19-pathways-head-0-0.g4r19"
              - name: JAX_BACKEND_TARGET
                value: grpc://g4r19-pathways-head-0-0.g4r19:29100
              - name: JOB_IDENTIFIER
                value: "g4r19"
              - name: ARTIFACT_DIR
                value: "gs://ubench-logs/alisachen-tpu7x/runs"
              - name: MAXTEXT_CONFIG_PATH
                value: "/workload/configs/qwen3-0.6b.yaml"
              - name: JAX_COMPILATION_CACHE_DIR
                value: "gs://ubench-logs/alisachen-tpu7x/compilation_cache/qwen3-0.6b/jax"
              - name: SKIP_JAX_PRECOMPILE
                value: "1"
              - name: DL_TP
                value: "1"
              - name: DL_TMBS
                value: "4"
              - name: DL_PACK
                value: "8192"
              - name: DL_STEPS
                value: "8"
              - name: DL_BUCKET_GAP
                value: "32768"
              - name: DL_CKPT
                value: "False"
              - name: DL_KEEPKV
                value: "1"
              - name: DL_MVPROCS
                value: "64"
              - name: DL_NOEOS
                value: "1"
              - name: DL_PADFIX
                value: "1"
              - name: DL_VTMO
                value: "5"
              - name: DL_TFRAC
                value: "1.0"
              - name: DL_SFRAC
                value: "1.0"
              - name: DL_HBM
                value: "0.25"
              - name: DL_JITU
                value: "1"
              - name: DL_ATTN
                value: "flash"
              - name: DL_SAQ
                value: "1024"
              - name: DL_SAKV
                value: "2048"
              - name: DL_CPV
                value: "8"
              - name: DL_KVBUF
                value: "4352"
              - name: DL_RWDUMP
                value: "4"
              resources:
                requests:
                  cpu: "10"
                  memory: 40G
                limits:
                  cpu: "44"
                  memory: 170G
              securityContext:
                privileged: true

              volumeMounts:
              - name: workload-launcher
                mountPath: /workload/launcher
              - name: workload-patches
                mountPath: /workload/patches
              - name: shared-tmp
                mountPath: /tmp
            initContainers:
            # Native Sidecar Pattern: restartPolicy Always prevents pod hangs
            - name: pathways-rm
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: HOST_ADDRESS
                value: "g4r19-pathways-head-0-0.g4r19"
              args:
              - --server_port=29101
              - --node_type=resource_manager
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-4x4x4/b8fc4d7c-5ca0-4cec-9cdc-76b2302775b9
              - --instance_count=1
              - --instance_type=tpu7x:4x4x4
              resources:
                requests:
                  cpu: "2"
                  memory: 8G
                limits:
                  cpu: "8"
                  # Fix #24: the RM hosts the train-step compile; gemma4's
                  # unscanned 262k-vocab HLO peaked >15.5G and the 16G limit
                  # OOMKilled it at end-of-compile (g4r1 + g4r1b attempt 1).
                  memory: 48G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            - name: pathways-proxy
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/proxy_server:20260730-jax_0.10.2"
              restartPolicy: Always
              env:
              - name: PATHWAYS_HEAD
                value: "g4r19-pathways-head-0-0.g4r19"
              args:
              - --server_port=29100
              - --resource_manager_address=g4r19-pathways-head-0-0.g4r19:29101
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-4x4x4/b8fc4d7c-5ca0-4cec-9cdc-76b2302775b9
              - "--xla_tpu_dvfs_p_state=7"
              - "--xla_tpu_scoped_vmem_limit_kib=122880"
              - "--xla_tpu_num_sparse_cores_for_gather_offloading=1"
              - "--xla_tpu_bf16_emission_mode=NATIVE_EMISSION"
              - "--xla_tpu_enable_sparse_core_reduce_scatter_v2=true"
              - "--xla_tpu_enable_sparse_core_collective_offload_all_gather=true"
              - "--xla_tpu_enable_sparse_core_collective_offload_2d_all_gather=true"
              - "--xla_tpu_use_tc_device_shape_on_sc=True"
              - "--xla_sc_disable_megacore_partitioning=True"
              - "--xla_tpu_enable_async_collective_fusion_fuse_all_gather=false"
              - "--xla_enable_async_all_gather=true"
              - "--xla_tpu_prefer_async_allgather_to_allreduce=true"
              - "--xla_tpu_enable_sparse_core_collective_offload_all_reduce=true"
              - "--xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=true"
              - "--xla_tpu_enable_sparse_core_collective_offload_3d_all_gather=true"
              - "--xla_tpu_use_single_sparse_core_for_all_gather_offload=true"
              - "--xla_tpu_enable_concurrent_sparse_core_offloading=true"
              - "--xla_tpu_enable_offloading_gather_to_sparsecore=true"
              - "--xla_tpu_sparse_core_all_gather_latency_multiplier=1"
              - "--xla_tpu_sparse_core_reduce_scatter_latency_multiplier=3"
              - "--xla_tpu_enable_sparse_core_collective_aggregator=true"
              - "--xla_tpu_enable_latency_hiding_layer_scheduler=true"
              - "--xla_tpu_scheduler_percent_shared_memory_limit=150"
              - "--xla_tpu_enable_layer_scheduler_for_dependent_collectives=true"
              - "--xla_tpu_enable_sparse_core_collective_offload_nd_reduce_scatter=true"
              - "--xla_tpu_pcie_bandwidth_multiplier=0.03"
              - "--xla_tpu_enable_sparse_core_offload_queuing_in_lhs=true"
              - "--xla_tpu_enable_multi_compute_overlap_in_layer_scheduler=false"
              - "--xla_tpu_enable_3d_reduce_scatter_decomposer=false"
              resources:
                requests:
                  cpu: "6"
                  memory: 24G
                limits:
                  cpu: "16"
                  memory: 64G
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            volumes:
            - name: shared-tmp
              emptyDir: {}   # was hostPath /tmp — leaked pathways state across pods on reused nodes
            - name: workload-launcher
              configMap:
                name: "g4r19-launcher"
            - name: workload-patches
              configMap:
                name: "g4r19-patches"

# ----------------------------------------------------
# 2. Worker Replicated Job
# ----------------------------------------------------
  - name: worker
    replicas: 1
    template:
      spec:
        parallelism: 16
        completions: 16
        backoffLimit: 32
        completionMode: Indexed
        template:
          metadata:
            annotations:
              alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
            labels:
              kueue.x-k8s.io/podset: worker
          spec:
            restartPolicy: OnFailure
            priorityClassName: "medium"
            hostNetwork: true
            hostIPC: true
            dnsPolicy: ClusterFirstWithHostNet
            tolerations:
            - key: google.com/tpu
              operator: Exists
            nodeSelector:
              cloud.google.com/gke-tpu-topology: "4x4x4"
              cloud.google.com/gke-tpu-accelerator: tpu7x
            containers:
            - name: pathways-worker
              image: "us-docker.pkg.dev/cloud-tpu-v2-images/pathways/server:20260730-jax_0.10.2"
              env:
              - name: PATHWAYS_HEAD
                value: "g4r19-pathways-head-0-0.g4r19"
              - name: MEGASCALE_SLICE_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              - name: MEGASCALE_NUM_SLICES
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-replicas']
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              - name: MEGASCALE_COORDINATOR_ADDRESS
                value: "g4r19-pathways-head-0-0.g4r19"
              args:
              - --server_port=29005
              - --resource_manager_address=g4r19-pathways-head-0-0.g4r19:29101
              - --gcs_scratch_location=gs://ubench-logs/alisachen-tpu7x/pathways-4x4x4/b8fc4d7c-5ca0-4cec-9cdc-76b2302775b9
              - --enable_metrics_collection=true
              - --xla_tpu_use_enhanced_launch_barrier=true
              ports:
              - containerPort: 29005
                protocol: TCP
              - containerPort: 29006
                protocol: TCP
              - containerPort: 8471
                protocol: TCP
              - containerPort: 8080
                protocol: TCP
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  google.com/tpu: "4"
              volumeMounts:
              - name: shared-tmp
                mountPath: /tmp
            initContainers:
            volumes:
            - name: shared-tmp
              emptyDir: {}   # was hostPath /tmp — leaked pathways state across pods on reused nodes
