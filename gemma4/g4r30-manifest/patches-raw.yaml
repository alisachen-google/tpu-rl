    """BLOCK-SIZE runtime patch: pin the vLLM KV block (page) size via env VLLM_BLOCK_SIZE.

    WHY (runs 22/23, 2026-08-21): tpu_inference auto-picks the KV page size from the
    engine shape (get_page_size/get_min_page_size in platforms/tpu_platform.py).
    16b/21/22b ran with block 128; run 22 (max_model_len 12544) got 32 and run 23
    (TP4xDP32) got 64 -- and exactly those two runs shifted generation (step-0
    truncation 29%/28% vs 23%, longer completions, rewards unchanged). Pinning the
    block size removes that confound so engine-shape experiments stay contract-valid.

    WHAT: in tunix/generate/vllm_sampler.py::VllmSampler._vllm_config, add
    `args["block_size"] = int(os.environ["VLLM_BLOCK_SIZE"])` when the env is set
    (vLLM then marks cache_config.user_specified_block_size and tpu_inference skips
    its heuristic). Fail-open with banner.
    """
    import os, sys
    def fail(m):
        print(f"BLOCK-SIZE PATCH: FAILED {m}", flush=True); sys.exit(0)
    try:
        import tunix
        ROOT = os.path.dirname(tunix.__file__)
    except Exception as e:
        fail(f"cannot import tunix: {e}")
    P = os.path.join(ROOT, "generate/vllm_sampler.py")
    src = open(P).read()
    if "_BLOCK_SIZE_PIN" in src:
        print("BLOCK-SIZE PATCH: already applied", flush=True); sys.exit(0)
    OLD = '    args["gpu_memory_utilization"] = config.hbm_utilization\n'
    if src.count(OLD) != 1:
        fail(f"anchor count {src.count(OLD)} != 1")
    NEW = OLD + ('    # _BLOCK_SIZE_PIN: pin the KV page size so engine-shape changes do not\n'
                 '    # silently change it (and with it the generation contract).\n'
                 '    import os as _bs_os\n'
                 '    if _bs_os.environ.get("VLLM_BLOCK_SIZE"):\n'
                 '      args["block_size"] = int(_bs_os.environ["VLLM_BLOCK_SIZE"])\n'
                 '      print(f"BLOCK-SIZE: pinned vLLM block_size={args[\'block_size\']}", flush=True)\n')
    NEW += ('    if _bs_os.environ.get("VLLM_PREFIX_CACHING") == "0":\n'
            '      args["enable_prefix_caching"] = False\n'
            '      print("PREFIX-CACHE: disabled via VLLM_PREFIX_CACHING=0", flush=True)\n')
    src = src.replace(OLD, NEW, 1)
    try:
        compile(src, P, "exec")
    except SyntaxError as e:
        fail(f"does not compile: {e}")
    open(P, "w").write(src)
    print("BLOCK-SIZE PATCH: APPLIED", flush=True)
