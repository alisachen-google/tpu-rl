    step (~3 s, sequential). This wraps LLMEngine.step (after patch_async_detok) to extract the logprobs of each FINISHED
    request in the shared thread pool while decode continues, with a faster list-comprehension (same values: the
    selected token's logprob; a missing token raises exactly like the original). detokenize reads the precomputed list;
    ASYNC_LOGPROBS=verify8 (default) recomputes every 8th completion synchronously and compares. Banners:
    ASYNC-LOGPROBS PATCH: APPLIED|FAILED; ASYNC-LOGPROBS hits= misses= checked= mismatch= per 2048 lookups."""
    import sys
    E = "/usr/local/lib/python3.12/site-packages/vllm/v1/engine/llm_engine.py"
    T = "/usr/local/lib/python3.12/site-packages/tunix/generate/vllm_sampler.py"
    e = open(E).read(); t = open(T).read()
