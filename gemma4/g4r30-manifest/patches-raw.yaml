    """Apply the padding-bucket fix (PR candidate, evidence/padding-bucket-fix.diff) to the
    installed tpu_inference: get_token_paddings(include_max_token_size=True) so a full
    chunked-prefill step pads to max_num_batched_tokens itself, never to the next 2x bucket.
    Prints PADDING-BUCKET PATCH: APPLIED | FAILED <reason>."""
    import sys
    R = "/usr/local/lib/python3.12/site-packages/tpu_inference/runner/"
    def fail(m): print("PADDING-BUCKET PATCH: FAILED " + m, flush=True); sys.exit(0)
    U = R + "utils.py"; u = open(U).read()
    if "include_max_token_size" in u:
        print("PADDING-BUCKET PATCH: already applied", flush=True); sys.exit(0)
    a = "def get_token_paddings(min_token_size: int, max_token_size: int,\n                       padding_gap: int) -> list[int]:"
    b = "def get_token_paddings(min_token_size: int, max_token_size: int,\n                       padding_gap: int, include_max_token_size: bool = False) -> list[int]:"
    if u.count(a) != 1: fail("utils signature anchor")
    u = u.replace(a, b)
    c = '    logger.info(f"Prepared token paddings: {paddings}")\n    return paddings'
    d = ('    if include_max_token_size:\n'
         '        exact = -(-max_token_size // min_token_size) * min_token_size\n'
         '        if exact not in paddings:\n'
         '            paddings = sorted(paddings + [exact])\n' + c)
    if u.count(c) != 1: fail("utils tail anchor")
    u = u.replace(c, d)
    T = R + "tpu_runner.py"; r = open(T).read()
    e = "            padding_gap=envs.VLLM_TPU_BUCKET_PADDING_GAP)"
    if r.count(e) != 1: fail("runner call anchor")
    r = r.replace(e, "            padding_gap=envs.VLLM_TPU_BUCKET_PADDING_GAP,\n            include_max_token_size=True)")
    for p, s in ((U, u), (T, r)):
        compile(s, p, "exec"); open(p, "w").write(s)
    print("PADDING-BUCKET PATCH: APPLIED", flush=True)
  patch_perf_v2.py: |-
    """Wire tunix perf-metrics v2 (Perfetto timeline export) -- run 15.

    maxtext's train_rl populates only custom_export_fn (v1 -> the TensorBoard
    perf/* metrics we already use). The v2 path (tunix.perf.experimental)
    writes a Perfetto timeline of every phase span (rollout / weight_sync /
    train, tagged per step) viewable at ui.perfetto.dev. At the pinned tunix
    commit (683256db) rl_cluster consumes custom_export_fn_v2, the GRPO
