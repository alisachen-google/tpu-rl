    diff --git a/src/maxtext/configs/models/gemma4-e4b.yml b/src/maxtext/configs/models/gemma4-e4b.yml
    index b8da0d1..d2cf5bd 100644
    --- a/src/maxtext/configs/models/gemma4-e4b.yml
